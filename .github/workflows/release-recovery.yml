name: Release Recovery

# The primary release is tag-only. This trusted default-branch controller makes
# transient runner, registry, and notarization failures self-healing without
# making release.yml branch-dispatchable.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: kin-release-recovery
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile failed release
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.status == 'completed' &&
        (
          github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'startup_failure'
        ) &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact retry candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFERRED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?per_page=100")"

          active="$(jq '[.workflow_runs[] | select(
            .status == "requested" or .status == "queued" or .status == "in_progress" or
            .status == "waiting" or .status == "pending"
          )] | length' <<< "$runs")"
          if [ "$active" -ne 0 ]; then
            echo "::notice::${active} Release run(s) are active; recovery will reconcile later."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          candidate="$(jq -c \
            --arg repo "$REPO" \
            --arg preferred "${PREFERRED_RUN:-}" \
            '
              .workflow_runs as $runs |
              [
                $runs[] |
                select(
                  ($preferred == "" or (.id | tostring) == $preferred) and
                  .event == "push" and
                  .status == "completed" and
                  (
                    .conclusion == "failure" or
                    .conclusion == "timed_out" or
                    .conclusion == "startup_failure"
                  ) and
                  .path == ".github/workflows/release.yml" and
                  .repository.full_name == $repo and
                  .head_repository.full_name == $repo and
                  (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                ) |
                . as $failed |
                select(
                  any(
                    $runs[];
                    .head_branch == $failed.head_branch and
                    .head_sha == $failed.head_sha and
                    .event == "push" and
                    .status == "completed" and
                    .conclusion == "success" and
                    .path == ".github/workflows/release.yml"
                  ) | not
                )
              ] |
              sort_by(.created_at) |
              last // empty
            ' <<< "$runs")"
          if [ -z "$candidate" ]; then
            echo "::notice::no failed, timed-out, or startup-failed Release run needs recovery."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(jq -er '.id | tostring' <<< "$candidate")"
          tag="$(jq -er .head_branch <<< "$candidate")"
          sha="$(jq -er .head_sha <<< "$candidate")"
          attempt="$(jq -er .run_attempt <<< "$candidate")"
          url="$(jq -er .html_url <<< "$candidate")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$attempt" =~ ^[0-9]+$ ]]

          latest_tag="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          highest="$(printf '%s\n%s\n' "${latest_tag#v}" "${tag#v}" | sort -V | tail -1)"
          if [ "$highest" != "${tag#v}" ]; then
            echo "::notice::ignoring historical failed ${tag}; current stable is ${latest_tag}."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ref="$(gh api "repos/${REPO}/git/ref/tags/${tag}")"
          object_type="$(jq -r .object.type <<< "$ref")"
          peeled="$(jq -r .object.sha <<< "$ref")"
          for _ in 1 2 3 4; do
            [ "$object_type" = tag ] || break
            tag_object="$(gh api "repos/${REPO}/git/tags/${peeled}")"
            object_type="$(jq -r .object.type <<< "$tag_object")"
            peeled="$(jq -r .object.sha <<< "$tag_object")"
          done
          [ "$object_type" = commit ]
          [ "$peeled" = "$sha" ]

          ancestry="$(gh api "repos/${REPO}/compare/${sha}...main" --jq .status)"
          [ "$ancestry" = ahead ] || [ "$ancestry" = identical ]

          {
            echo "needed=true"
            echo "run_id=$run_id"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "attempt=$attempt"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          if [ "$attempt" -ge 3 ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      # An abandonment is a fact about the default branch, never about the tag
      # it retires: a tag's tree is frozen before the failure that abandons it,
      # so the record can only ever exist on main. Both triggers here resolve
      # GITHUB_SHA to the last commit on the default branch, and checkout with
      # no `ref:` input fetches exactly that commit, so the record is read from
      # one immutable main snapshot instead of from whatever main becomes while
      # the job runs. Nothing from the failed tag's own head is trusted.
      #
      # Reading the record is tolerated rather than propagated. A network hiccup
      # must not replace the real retry-or-alert decision with a controller
      # checkout failure. Recovery is not in the mint's reviewed veto set, but a
      # failed checkout would still hide the actionable release state behind an
      # advisory red. Leaving no verified HEAD instead reads as "not abandoned",
      # so recovery remains responsible exactly as it was before the record
      # existed.
      - name: Checkout the abandonment record from the default-branch commit
        if: steps.resolve.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Recovery is the alarm, so nothing weaker than the reviewed record may
      # quiet it. The question is the one the release rail already answers,
      # so this asks select-admissible-release-tag.py rather than reading the
      # record a second way. Two readers of one record is how an alarm gets
      # disarmed in the state that needs it most: a reader that accepts an
      # entry the selector refuses would stand recovery down for a record too
      # malformed to waive the mint, leaving the rail hard stuck while the
      # check-run that would say so went green. Every other outcome, including
      # an unreadable record or a checkout that is not the run's own
      # default-branch commit, leaves the tag unrecorded and the alert armed.
      - name: Reconcile against the tracked abandonment record
        id: record
        if: steps.resolve.outputs.needed == 'true'
        env:
          RECORD: scripts/abandoned-release-tags.json
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Nothing in this step may end in a non-zero status of its own. This
          # controller is outside the mint's reviewed veto set, but failing here
          # would still replace the actionable retry-or-alert verdict with an
          # ingestion error. Every status is therefore captured, and every
          # unhappy path degrades to "not abandoned", leaving recovery armed to
          # report the real release failure.
          head=""
          status=0
          head="$(git rev-parse HEAD)" || status=$?
          if [ "$status" -ne 0 ] || [ "$head" != "$GITHUB_SHA" ]; then
            echo "abandoned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the record checkout resolved '${head}' rather than this run's default-branch commit ${GITHUB_SHA}; no abandonment is honoured from an unverified tree."
            exit 0
          fi
          selector="scripts/select-admissible-release-tag.py"
          if [ ! -f "$RECORD" ] || [ ! -f "$selector" ]; then
            echo "abandoned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${RECORD} or ${selector} is absent from ${GITHUB_SHA}; recovery stays responsible for ${TAG}."
            exit 0
          fi
          # The candidate listing is the one pair this reconcile is about, in
          # the `<tag> <commit>` form the selector reads from git. The resolve
          # step has already peeled the tag and required this commit to be what
          # it names, so the selector is told the truth about the repository and
          # its tag-moved refusal keeps its meaning here. Mint intent is empty
          # because recovery creates no tag: naming this tag as intent would
          # make the selector refuse precisely the recorded tag it is being
          # asked about, and invert the answer.
          work="${RUNNER_TEMP:-/tmp}"
          candidate="$work/release-recovery-candidate-tag"
          admissible="$work/release-recovery-highest-admissible"
          printf '%s %s\n' "$TAG" "$SHA" > "$candidate"
          # Seeded, so a selector run that leaves no answer behind reads as "not
          # abandoned" rather than as a waiver.
          printf 'unresolved' > "$admissible"
          if ! python3 "$selector" \
            "$RECORD" \
            "$candidate" \
            "" \
            "$admissible"
          then
            echo "abandoned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${RECORD} does not pass the release lane's own record validation, so it waives nothing for the mint and quiets nothing here; recovery stays responsible for ${TAG}. The selector's refusal above names what is wrong with the record."
            exit 0
          fi
          # The selector answers by ranking, dropping a candidate its record
          # abandons at the commit under review, so an empty ranking of a
          # one-tag listing is that drop. It drops a candidate that is not a
          # vX.Y.Z release tag for its own reasons, which is why resolve proves
          # that shape before it declares a reconcile needed and the authority
          # suite pins that order: an empty ranking waives a tag only when the
          # tag was one the selector would rank at all.
          if [ ! -f "$admissible" ] || [ -s "$admissible" ]; then
            echo "abandoned=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} at ${SHA} carries no reviewed abandonment record; recovery stays responsible for it."
            exit 0
          fi
          echo "abandoned=true" >> "$GITHUB_OUTPUT"
          echo "::notice::${TAG} at ${SHA} is reconciled by abandonment: ${RECORD} retires it in favour of its recorded successor, so no retry is dispatched, no alert is filed, and this reconcile concludes success."

      # A retry budget spent on a failure that cannot vary is the most
      # expensive thing this controller can do: three identical ~45-minute
      # Release attempts confirm what the second one already established, and
      # every minute of it is release latency. Classification therefore has to
      # happen BEFORE the next rerun is requested, not only after the budget is
      # gone. The alert step below already reasoned about the signature, but it
      # ran only once retries were exhausted, so it could describe a
      # deterministic failure and never prevent one.
      #
      # This step never fails the job. An unreadable attempt must leave the
      # controller exactly as it was, still retrying, because a transient API
      # error is not evidence that the release failure is deterministic. So every
      # read is guarded and every unhappy path degrades to "unrecorded", which
      # the repeat test refuses to count.
      - name: Classify the failure signature across attempts
        id: classify
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.record.outputs.abandoned != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          ATTEMPTS: ${{ steps.resolve.outputs.attempt }}
        run: |
          set -euo pipefail
          # The signature is the whole set of failing job and step pairs for one
          # attempt, sorted, so a matrix failure whose legs queue in a different
          # order each time still compares equal.
          #
          # Failing STEPS are the primary evidence and the job's own conclusion
          # is deliberately not a filter on them. A job whose leg is cancelled
          # when a sibling fails can still carry its own failed step, and
          # reading the job conclusion first would drop exactly that step and
          # report a repeat as two different failures. That shape did not appear
          # in the runs this classifier was built from, so treating steps as
          # primary is hardening rather than the repair; it can only ever find
          # more evidence than a job-primary read, never less. The job-level
          # fallback exists only for a job that failed while recording no
          # failing step at all, such as a runner startup failure, which would
          # otherwise be unreadable.
          signatures="${RUNNER_TEMP:-/tmp}/release-recovery-signatures"
          : > "$signatures"
          unknown=0
          for attempt in $(seq 1 "$ATTEMPTS"); do
            signature=""
            # Pages are slurped and filtered in one pass. `--paginate` with an
            # inline query applies the query per page, which would emit one line
            # per page and break the one-line-per-attempt mapping below.
            if attempt_jobs="$(gh api --paginate --slurp \
              "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${attempt}/jobs?per_page=100" \
              2>/dev/null)"; then
              signature="$(jq -r '
                [ .[].jobs[] as $job
                  | $job.steps[]?
                  | select(.conclusion == "failure")
                  | "\($job.name) / \(.name)"
                ] | unique | join("; ")' <<< "$attempt_jobs" 2>/dev/null)" \
                || signature=""
              if [ -z "$signature" ]; then
                signature="$(jq -r '
                  [ .[].jobs[]
                    | select(.conclusion == "failure" or .conclusion == "timed_out")
                    | "\(.name) / <no failing step recorded>"
                  ] | unique | join("; ")' <<< "$attempt_jobs" 2>/dev/null)" \
                  || signature=""
              fi
            fi
            if [ -z "$signature" ]; then
              unknown=$((unknown + 1))
              # Deliberately constant rather than attempt-numbered, so two
              # unreadable attempts never compare equal to each other by
              # accident of text. The unknown count is what rejects them.
              signature="unrecorded"
            fi
            printf '%s\n' "$signature" >> "$signatures"
          done
          latest="$(tail -1 "$signatures")"
          previous="$(tail -2 "$signatures" | head -1)"
          # How many distinct signatures the whole run produced. This is
          # reported, never acted on: the stop decision is last-two equality,
          # because that is the earliest point at which a repeat is established.
          # The two only ever differ on a run that already spent its budget, and
          # they are kept apart so the alert can state which one it observed
          # instead of asserting the stronger claim on both.
          distinct="$(sort -u "$signatures" | wc -l | tr -d '[:space:]')"
          # Readability is judged on the two signatures the stop rule actually
          # compares, not on the whole run. A whole-run unknown count vetoed the
          # repeat stop for every later attempt as well, so one unreadable early
          # attempt spent the entire remaining budget on attempts whose
          # signatures were readable and identical. A job cancelled mid-outage
          # is the shape that reads as unreadable, because it records neither a
          # failing step nor a failing job conclusion. An
          # `unrecorded` latest can never establish a repeat on its own, and it
          # cannot equal a readable previous, so testing it is enough.
          repeated=false
          if [ "$ATTEMPTS" -ge 2 ] && [ "$latest" != unrecorded ] &&
             [ "$latest" = "$previous" ]; then
            repeated=true
          fi
          {
            echo "unknown=$unknown"
            echo "repeated=$repeated"
            echo "distinct=$distinct"
          } >> "$GITHUB_OUTPUT"
          echo "attempts=$ATTEMPTS unknown=$unknown repeated=$repeated distinct=$distinct"
          echo "latest failing steps: $latest"

      - name: Re-run failed jobs
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.resolve.outputs.retry == 'true' &&
          steps.classify.outputs.repeated != 'true' &&
          steps.record.outputs.abandoned != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs" \
            >/dev/null
          echo "Requested bounded automatic retry for Release run ${RUN_ID}."

      - name: Alert after automatic retries are exhausted
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          (
            steps.resolve.outputs.exhausted == 'true' ||
            steps.classify.outputs.repeated == 'true'
          ) &&
          steps.record.outputs.abandoned != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          RUN_URL: ${{ steps.resolve.outputs.url }}
          ATTEMPTS: ${{ steps.resolve.outputs.attempt }}
          EXHAUSTED: ${{ steps.resolve.outputs.exhausted }}
          UNKNOWN: ${{ steps.classify.outputs.unknown }}
          REPEATED: ${{ steps.classify.outputs.repeated }}
          DISTINCT: ${{ steps.classify.outputs.distinct }}
        run: |
          set -euo pipefail
          # Advice given before classification is wrong in the direction that
          # costs most. Rerunning is right for the transient failures this
          # controller exists for and useless for a confirmed source-bound one:
          # a lockfile pinning a dependency that cannot compile for a release
          # target needs a recut against fixed dependencies. The controller can
          # identify a repeated failure surface, but only logs and source
          # diagnosis can establish that root cause.
          #
          # The signature is the whole set of failing job and step pairs per
          # attempt, computed once by the classify step above and read here.
          # It is deliberately not called root-cause proof: step identity is
          # cheap and needs no log download, but a persistent registry or
          # notarization outage can repeat at the same step too. A repeated
          # signature changes the immediate recommendation and tells the
          # operator where to start; the logs still decide rerun versus recut.
          #
          # Classification has exactly one implementation, in the step that acts
          # on it. Recomputing it here would let the reason this controller
          # stopped retrying disagree with the reason it reports.
          signatures="${RUNNER_TEMP:-/tmp}/release-recovery-signatures"
          if [ ! -s "$signatures" ]; then
            # Unreachable while classify guards this step, and harmless if that
            # ever changes: an absent file is not evidence of anything.
            printf 'unrecorded\n' > "$signatures"
          fi
          failing_steps="$(tail -1 "$signatures")"
          # An established repeat is the stronger reading and is tested first. An
          # unreadable attempt elsewhere in the run does not weaken two readable
          # adjacent attempts that failed identically, and reporting that state
          # as indeterminate sent the operator to inspect the unrecorded attempt
          # while the actual repeated failure went unnamed.
          if [ "${REPEATED:-false}" = true ]; then
            verdict="repeated failure signature"
            # The stop rule is last-two equality, so a run that reached the end
            # of its budget is one whose earlier attempts differed: an identical
            # pair would have stopped it at two. Saying "every attempt" there
            # would contradict the per-attempt list printed below and send an
            # operator straight past the differing attempt, which is the
            # evidence that the cause is not purely deterministic. The stronger
            # sentence is therefore earned only by an all-attempts count of one,
            # and an absent or unreadable count takes the narrower claim.
            if [ "${DISTINCT:-0}" = 1 ]; then
              advice="Every observed attempt failed in the same job and step set, so another immediate rerun is unlikely to help. Step identity does not prove the root cause: inspect the logs, recut only after confirming a source-bound defect, and preserve this tag for a same-release rerun if the cause is external."
            else
              advice="The two most recent attempts failed in the same job and step set, so another immediate rerun is unlikely to help. Earlier attempts failed differently or could not be read, which is evidence in its own right that the cause is not purely deterministic, so read the whole per-attempt list below before choosing a remedy. Step identity does not prove the root cause: inspect the logs, recut only after confirming a source-bound defect, and preserve this tag for a same-release rerun if the cause is external."
            fi
          elif [ "${UNKNOWN:-1}" -ne 0 ]; then
            verdict="indeterminate"
            advice="At least one attempt could not be read or carried no concrete failed step, and no two adjacent readable attempts failed identically, so neither a deterministic nor a transient cause is established. Inspect the unrecorded attempts before choosing a same-release rerun or a source-fixed recut."
          else
            verdict="varying failure signatures"
            advice="The observed failing job and step sets differed, which is consistent with the transient shape this controller exists for. Diagnose and rerun the same release rather than cutting a newer version unless the logs identify a source-bound defect."
          fi
          # Say which of the two stop conditions actually ended the retries. A
          # repeat stop deliberately leaves retry budget unspent, so reporting
          # it as exhaustion would misdescribe both the state and the remedy.
          if [ "${REPEATED:-false}" = true ] && [ "${EXHAUSTED:-true}" != true ]; then
            opening="$(printf "The automatic release controller stopped retrying \`%s\` at \`%s\` after %s attempt(s): the failing-step signature repeated exactly, so the remaining retry budget would only have bought another identical failure." "$TAG" "$SHA" "$ATTEMPTS")"
          else
            opening="$(printf "The automatic release controller exhausted its retries for \`%s\` at \`%s\` after %s attempt(s)." "$TAG" "$SHA" "$ATTEMPTS")"
          fi

          # A mint that reported failure on a release it had already created
          # would otherwise send this controller to repair a healthy release,
          # so say what actually exists before advising anything.
          release_error="$(mktemp)"
          if release="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>"$release_error")"; then
            assets="$(jq '.assets | length' <<< "$release")"
            draft="$(jq -r '.draft' <<< "$release")"
            prerelease="$(jq -r '.prerelease' <<< "$release")"
            release_state="A GitHub Release for \`${TAG}\` already exists with ${assets} asset(s), draft=${draft}, prerelease=${prerelease}. Confirm it is genuinely incomplete before repairing it."
          elif grep -Eq '\(HTTP 404\)' "$release_error"; then
            release_state="No GitHub Release object exists for \`${TAG}\`."
          else
            release_reason="$(tr -d '\r' < "$release_error" | tail -n 1)"
            release_state="GitHub Release state for \`${TAG}\` could not be read (${release_reason:-unknown API error}). Do not infer that the Release is absent; inspect it before repairing anything."
          fi

          title="Release blocked after automatic retries: ${TAG}"
          existing="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -1)"
          if [ -z "$existing" ]; then
            body="$(mktemp)"
            {
              printf '%s\n\n' "$opening"
              printf 'Release run: %s (id %s)\n\n' "$RUN_URL" "$RUN_ID"
              printf 'Classification: **%s**. %s\n\n' "$verdict" "$advice"
              printf 'Failing step per attempt:\n\n'
              index=0
              while IFS= read -r line; do
                index=$((index + 1))
                printf -- '- attempt %s: %s\n' "$index" "$line"
              done < "$signatures"
              printf '\n%s\n\n' "$release_state"
              printf 'The tag and any immutable public artifacts remain in place.\n'
            } > "$body"
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body-file "$body" \
              >/dev/null
          fi
          if [ "${REPEATED:-false}" = true ] && [ "${EXHAUSTED:-true}" != true ]; then
            echo "::error::${TAG} stopped retrying after ${ATTEMPTS} attempt(s), ${verdict}, repeated failing steps: ${failing_steps}: ${RUN_URL}"
          else
            echo "::error::${TAG} exhausted its automatic retries after ${ATTEMPTS} attempt(s), ${verdict}, failing steps: ${failing_steps}: ${RUN_URL}"
          fi
          exit 1
