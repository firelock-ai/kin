name: Daemon Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon-smoke:
    name: Linux Daemon Smoke + MCP Headless
    runs-on: ubuntu-latest
    # BLOCKING gate. The experimental allow-failure was dropped after a real
    # end-to-end green run was observed on main (run 27318898667 / af14579:
    # "kin-daemon ready on :4219" + "semantic_locate present"). To keep the gate
    # deterministic rather than relying on empty-repo readiness behaviour, the
    # smoke step now seeds a tiny source fixture before `kin init` so the first
    # sync tick has content and /readiness legitimately flips out of 503
    # (readiness gates on initialization, not embedding coverage).
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify kin cargo registry config
        # Preserve the tracked config because it carries public Git [patch.kin]
        # pins for kin-* crates that are not all registry-published yet.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          grep -q '^kin-blobs = { git = ' .cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-
            ${{ runner.os }}-cargo-

      # Cargo.lock and .cargo/config.toml together pin kin-* deps to public
      # source until every crate is registry-published.
      - name: Build kin + kin-daemon
        run: cargo build --bin kin --bin kin-daemon --locked

      - name: Daemon smoke + MCP headless tools/list
        run: |
          set -euo pipefail

          REPO_ROOT="$(pwd)"
          KIN="$REPO_ROOT/target/debug/kin"
          KIN_DAEMON="$REPO_ROOT/target/debug/kin-daemon"
          PORT=4219
          WS="$(mktemp -d)"

          echo "::group::Seed a tiny source fixture (deterministic readiness)"
          # A few real source files so the daemon's first sync tick has content
          # to index and /readiness flips out of 503 deterministically — instead
          # of relying on empty-repo readiness behaviour. Graph + lexical
          # indexing need no embeddings, so this is offline/CPU-safe.
          mkdir -p "$WS/src"
          cat > "$WS/src/lib.rs" <<'RS'
          pub fn add(a: i64, b: i64) -> i64 {
              a + b
          }

          pub struct Counter {
              value: i64,
          }

          impl Counter {
              pub fn new() -> Self {
                  Counter { value: 0 }
              }

              pub fn increment(&mut self) {
                  self.value += 1;
              }
          }
          RS
          cat > "$WS/src/util.rs" <<'RS'
          pub fn greet(name: &str) -> String {
              format!("hello, {name}")
          }
          RS
          echo "::endgroup::"

          echo "::group::Initialize a Kin workspace"
          "$KIN" init "$WS"
          echo "::endgroup::"

          echo "::group::Start kin-daemon (headless) and wait for readiness"
          "$KIN_DAEMON" --repo "$WS" --port "$PORT" >"$REPO_ROOT/daemon.log" 2>&1 &
          DAEMON_PID=$!
          cleanup() { kill "$DAEMON_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          # The per-repo daemon exposes an unauthenticated /readiness probe on
          # its port (same endpoint the docker-compose healthcheck uses). Poll
          # it until it reports ready, or fail loudly with the daemon log.
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/readiness" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::kin-daemon did not become ready on :${PORT}"
            echo "---- daemon.log ----"
            cat "$REPO_ROOT/daemon.log" || true
            exit 1
          fi
          echo "kin-daemon ready on :${PORT}"
          echo "::endgroup::"

          echo "::group::MCP headless — drive the real stdio server, assert tool catalog"
          # `kin mcp start` is the agent-facing MCP stdio server. With
          # KIN_DAEMON_URL set it binds directly to the running daemon instead
          # of rediscovering it. The server accepts newline-delimited JSON-RPC;
          # tools/list returns Kin's static tool catalog. Assert a known
          # graph-backed tool is present. EOF on stdin shuts the server down
          # cleanly; `timeout` is a backstop only.
          export KIN_DAEMON_URL="http://127.0.0.1:${PORT}"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 "$KIN" mcp start >"$REPO_ROOT/mcp_out.txt" 2>"$REPO_ROOT/mcp_err.txt" || true

          if ! grep -q "semantic_locate" "$REPO_ROOT/mcp_out.txt"; then
            echo "::error::MCP tools/list did not return the expected Kin tool catalog"
            echo "---- mcp_out.txt ----"
            cat "$REPO_ROOT/mcp_out.txt" || true
            echo "---- mcp_err.txt ----"
            cat "$REPO_ROOT/mcp_err.txt" || true
            echo "---- daemon.log ----"
            cat "$REPO_ROOT/daemon.log" || true
            exit 1
          fi
          echo "MCP server returned the Kin tool catalog (semantic_locate present)"
          echo "::endgroup::"
