name: Daemon Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon-smoke:
    name: Linux Daemon Smoke + MCP Headless
    runs-on: ubuntu-latest
    # BLOCKING gate. The experimental allow-failure was dropped after a real
    # end-to-end green run was observed on main (run 27318898667 / af14579:
    # "kin-daemon ready on :4219" + "semantic_locate present"). To keep the gate
    # deterministic rather than relying on empty-repo readiness behaviour, the
    # smoke step now seeds a tiny source fixture before `kin init` so the first
    # sync tick has content and /readiness legitimately flips out of 503
    # (readiness gates on initialization, not embedding coverage).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16

      - name: Verify kin cargo registry config
        # Preserve the tracked config because it carries public Git [patch.kin]
        # pins for kin-* crates that are not all registry-published yet.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # Registry only, matching what this job used to cache: the smoke asserts on
      # freshly built binaries, so no target directory is carried across runs.
      # Restore on every event, save only from main, for the same reason as the
      # CI jobs: an entry written from a pull request ref is readable only by
      # later runs on that same ref, so it warmed one branch while spending the
      # shared repository cache budget that main's reusable entry needs.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cargo.lock and .cargo/config.toml together pin kin-* deps to public
      # source until every crate is registry-published.
      - name: Build kin + kin-daemon
        run: cargo build --bin kin --bin kin-daemon --locked

      - name: Daemon smoke + MCP headless tools/list
        run: |
          set -euo pipefail

          REPO_ROOT="$(pwd)"
          KIN="$REPO_ROOT/target/debug/kin"
          KIN_DAEMON="$REPO_ROOT/target/debug/kin-daemon"
          PORT=4219
          WS="$(mktemp -d)"

          echo "::group::Seed a tiny source fixture (deterministic readiness)"
          # A few real source files so the daemon's first sync tick has content
          # to index and /readiness flips out of 503 deterministically, rather
          # than relying on empty-repo readiness behaviour. Graph + lexical
          # indexing need no embeddings, so this is offline/CPU-safe.
          mkdir -p "$WS/src"
          cat > "$WS/src/lib.rs" <<'RS'
          pub fn add(a: i64, b: i64) -> i64 {
              a + b
          }

          pub struct Counter {
              value: i64,
          }

          impl Counter {
              pub fn new() -> Self {
                  Counter { value: 0 }
              }

              pub fn increment(&mut self) {
                  self.value += 1;
              }
          }
          RS
          cat > "$WS/src/util.rs" <<'RS'
          pub fn greet(name: &str) -> String {
              format!("hello, {name}")
          }
          RS
          # `kin init` fails closed on a populated directory that is not a Git
          # repository: Kin never derives authority from filesystem contents it
          # did not admit. Commit the fixture so initialization takes the exact
          # Git admission path. The runner carries no git identity, so pass one
          # per invocation, and clear any inherited git environment so the
          # fixture repository is the only thing these commands can address.
          (
            cd "$WS"
            unset GIT_DIR GIT_INDEX_FILE GIT_WORK_TREE GIT_COMMON_DIR \
              GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
            git init -q -b main
            git add -A
            git -c user.name='Kin CI' -c user.email='ci@kinlab.ai' \
              commit -q -m 'Seed daemon smoke fixture'
          )
          echo "::endgroup::"

          echo "::group::Initialize a Kin workspace"
          "$KIN" init "$WS"
          echo "::endgroup::"

          echo "::group::Start kin-daemon (headless) and wait for readiness"
          "$KIN_DAEMON" --repo "$WS" --port "$PORT" >"$REPO_ROOT/daemon.log" 2>&1 &
          DAEMON_PID=$!
          cleanup() { kill "$DAEMON_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          # The per-repo daemon exposes an unauthenticated /readiness probe on
          # its port (same endpoint the docker-compose healthcheck uses). Poll
          # it until it reports ready, or fail loudly with the daemon log.
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/readiness" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::kin-daemon did not become ready on :${PORT}"
            echo "---- daemon.log ----"
            cat "$REPO_ROOT/daemon.log" || true
            exit 1
          fi
          echo "kin-daemon ready on :${PORT}"
          echo "::endgroup::"

          echo "::group::MCP headless (real stdio server, tool catalog asserted)"
          # `kin mcp start` is the agent-facing MCP stdio server. With
          # KIN_DAEMON_URL set it binds directly to the running daemon instead
          # of rediscovering it. The server accepts newline-delimited JSON-RPC;
          # tools/list returns Kin's static tool catalog. Assert a known
          # graph-backed tool is present. EOF on stdin shuts the server down
          # cleanly; `timeout` is a backstop only.
          export KIN_DAEMON_URL="http://127.0.0.1:${PORT}"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 "$KIN" mcp start >"$REPO_ROOT/mcp_out.txt" 2>"$REPO_ROOT/mcp_err.txt" || true

          if ! grep -q "semantic_locate" "$REPO_ROOT/mcp_out.txt"; then
            echo "::error::MCP tools/list did not return the expected Kin tool catalog"
            echo "---- mcp_out.txt ----"
            cat "$REPO_ROOT/mcp_out.txt" || true
            echo "---- mcp_err.txt ----"
            cat "$REPO_ROOT/mcp_err.txt" || true
            echo "---- daemon.log ----"
            cat "$REPO_ROOT/daemon.log" || true
            exit 1
          fi
          echo "MCP server returned the Kin tool catalog (semantic_locate present)"
          echo "::endgroup::"
