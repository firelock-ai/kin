name: Release Cut

# Selects the release candidate and proves half of it, with nobody at a keyboard.
#
# release-tag.yml mints a tag for the newest reviewed main commit in the staged
# version's range carrying BOTH proof records, and release.yml refuses to
# promote a tag that has none. Nothing produced those records automatically: a
# captain picked the sha, pushed release/v<version>-candidate, dispatched
# rc-build.yml, ran bin/kin-release-preflight on the archives and drove
# bin/kin-stranger, then published both records by hand. On 2026-09-02 that
# procedure cost a day. A rerun of a flaky required job made the first candidate
# unmintable, because the mint reads a duplicated required context as ambiguous
# authority; the stranger ran the tool's default two arms while the gate
# required three; the account limit cut the driver mid-arm three times; and the
# shared Mac ran out of memory under the host leg.
#
# This workflow owns the mechanical half. It selects the candidate itself,
# arms the candidate branch, dispatches the archive build, and judges those
# archives on hosted runners, publishing preflight.json exactly as the local
# run does. What it does NOT do is run the stranger: see "The stranger is still
# local" below, which is a measured limit rather than a gap left open.
#
# Trigger authority, and why there is no workflow_dispatch. Every arm here
# resolves its workflow code from protected main, and the publish job reaches
# the release App's key. A workflow_dispatch takes a ref, so it would let a
# branch select the code that runs beside that credential. The typed
# repository_dispatch cannot: GitHub always runs it from the default branch and
# only when the workflow exists there. This mirrors release-tag.yml.
on:
  workflow_run:
    workflows: [CI, RC Build]
    types: [completed]
  repository_dispatch:
    types: [release_cut]
  schedule:
    # Offset from the mint (:11,:26,:41,:56) and the train (:07,:22,:37,:52) so
    # a cycle selects, arms and proves between two mint evaluations rather than
    # racing one. GitHub's cron stalled for most of 2026-09-02, so the schedule
    # is the fallback here and never the only path.
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

# Never two cuts at once, and never cancel one mid-flight: a cancelled preflight
# leaves an armed candidate with no record, which the next cycle then re-arms.
concurrency:
  group: kin-release-cut
  cancel-in-progress: false

jobs:
  select:
    name: Select the release candidate
    # The branch filters live in the selector's own trigger validation, which
    # reads GitHub-owned context rather than a payload, so this condition is
    # the cheap half: it keeps the job from starting on the CI and RC Build
    # completions that are obviously not occasions. `workflow_run` fires on
    # every completion of both workflows, which on a busy main is most of the
    # day.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (
            github.event.workflow_run.name == 'CI' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) ||
          (
            github.event.workflow_run.name == 'RC Build' &&
            github.event.workflow_run.event == 'workflow_dispatch' &&
            startsWith(github.event.workflow_run.head_branch, 'release/v')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      decision: ${{ steps.select.outputs.decision || 'stand-down' }}
      version: ${{ steps.select.outputs.version }}
      branch: ${{ steps.select.outputs.branch }}
      candidate: ${{ steps.select.outputs.candidate }}
      rc_run: ${{ steps.select.outputs.rc_run }}
      move: ${{ steps.select.outputs.move }}
      stranger_state: ${{ steps.select.outputs.stranger_state }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      # The literal trusted context value, as in kin-registry-wave-land.yml.
      # The binding step below proves github.sha is protected main's history
      # before the judgment reads it as policy.
      - name: Checkout the queued cut policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the cut trigger
        env:
          EVENT_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 scripts/select-release-candidate.py validate-trigger \
            --event-file "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --ref "$GITHUB_REF" \
            --workflow-sha "$GITHUB_SHA"

      - name: Bind the cut to protected main history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$GITHUB_SHA" \
            --branch main

      # The range is read from a freshly fetched protected main rather than
      # from the checkout this run started with, for the reason release-tag.yml
      # gives: a rerun of an older run carries that run's sha, which resolves
      # the version main carried then rather than the version it carries now.
      - name: Select the candidate
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git update-ref refs/remotes/origin/main FETCH_HEAD
          python3 scripts/select-release-candidate.py select \
            --repository "$GITHUB_REPOSITORY" \
            --workspace "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/release-cut-decision.json"

      # Uploaded on every path, including the ones that stood down and the ones
      # that refused, so what a cycle decided is readable from outside it
      # without a session reading a log.
      - name: Publish this cycle's decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-cut-decision
          path: ${{ runner.temp }}/release-cut-decision.json
          if-no-files-found: ignore
          retention-days: 7

  arm:
    name: Arm the release candidate
    needs: select
    if: needs.select.outputs.decision == 'arm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same main-only Environment that protects the release App key
    # everywhere else it is used. A job only resolves it by declaring it;
    # without the binding the job silently falls back to repository-scoped
    # copies of the same secret names, so a key rotation applied to the
    # environment never reaches this arm.
    environment: release-tag
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the queued cut policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-bind the arm to protected main history
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selection handed over no exact candidate sha"
            exit 1
          fi
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$GITHUB_SHA" \
            --branch main
          # The candidate itself has to be main's own history too. The selector
          # read it out of a first-parent log, and this proves the same thing
          # against the API immediately before the branch moves.
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$CANDIDATE" \
            --branch main

      - name: Mint repository-scoped candidate-branch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          # owner plus repositories narrows the installation token to this one
          # repository; owner alone would widen it to every repo the org-wide
          # install can reach.
          owner: firelock-ai
          repositories: kin
          permission-contents: write

      - name: Move the candidate branch to the selected sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.select.outputs.branch }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          MOVE: ${{ needs.select.outputs.move }}
        run: |
          set -euo pipefail
          case "$MOVE" in
            create|fast-forward|reset|none) ;;
            *) echo "::error::unsupported branch move '$MOVE'"; exit 1 ;;
          esac
          if [ "$MOVE" = none ]; then
            echo "::notice::${BRANCH} already points at ${CANDIDATE}"
          elif [ "$MOVE" = create ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" \
              -f sha="$CANDIDATE" >/dev/null
          else
            # A reset is deliberate and named by the selector: the newest green
            # sha can be OLDER than a candidate that has since died, and a
            # candidate branch is scratch that no ruleset protects, so moving it
            # backwards is correct rather than a rewrite of anything reviewed.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$CANDIDATE" \
              -F force=true >/dev/null
          fi
          got="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" -q '.object.sha')"
          if [ "$got" != "$CANDIDATE" ]; then
            echo "::error::${BRANCH} reads back at ${got}, not ${CANDIDATE}"
            exit 1
          fi
          echo "${BRANCH} -> ${CANDIDATE} (${MOVE})"

      # The dispatch goes out on the workflow token, not the App's. rc-build.yml
      # holds no credential by design and needs none to start, and keeping the
      # App token off this call keeps its blast radius to the branch write above.
      - name: Dispatch the candidate archive build
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.select.outputs.branch }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          before="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rc-build.yml/runs?branch=${BRANCH}&per_page=1" -q '.workflow_runs[0].id // 0')"
          gh workflow run rc-build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          # Read the run back rather than trusting the dispatch's exit code: the
          # API answers 204 before the run exists, so a dispatch that produced
          # nothing is silent otherwise and the next cycle would arm again.
          run_id=""
          attempt=0
          while [ "$attempt" -lt 10 ]; do
            attempt=$((attempt + 1))
            sleep 6
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rc-build.yml/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=5" \
              -q "[.workflow_runs[] | select(.head_sha == \"${CANDIDATE}\" and (.id | tonumber) > ${before})] | sort_by(.id) | last | .id // empty")"
            if [ -n "$run_id" ]; then
              echo "rc-build run ${run_id} appeared on attempt ${attempt}"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "::error::rc-build.yml was dispatched on ${BRANCH} but no run for ${CANDIDATE} appeared within a minute"
            exit 1
          fi
          {
            echo "## Release candidate armed"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| candidate | \`${CANDIDATE}\` |"
            echo "| branch | \`${BRANCH}\` |"
            echo "| rc-build | [${run_id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}) |"
            echo ""
            echo "The RC Build's completion is itself a trigger for this workflow, so the"
            echo "preflight follows without another occasion."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc-build run ${run_id} building ${CANDIDATE}"

  # The host leg of the proof, on runners that can execute each archive.
  #
  # The local tool judges every archive in one run because that Mac can run a
  # macOS archive natively and the Linux ones under emulation. Hosted, each
  # archive runs on the runner whose architecture matches it, which is strictly
  # better evidence: the emulated legs the local run marks out of scope (the
  # daemon starves its own enrichment under qemu) execute natively here.
  #
  # This job reads no secret and declares no environment. It downloads
  # artifacts, runs the proof and uploads a leg record; publishing is the next
  # job's job, and keeping the App token away from the runner that executes
  # candidate bytes is the whole reason the two are separate.
  preflight:
    name: Preflight ${{ matrix.artifact }}
    needs: [select, arm]
    # `always()` because `arm` is skipped on the proof path: the RC Build
    # completion that triggers this cycle arrives when the branch is already
    # armed, so requiring `arm` to have succeeded would skip the very job the
    # trigger exists to start.
    if: >-
      always() &&
      needs.select.outputs.decision == 'proof' &&
      needs.select.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row per archive rc-build.yml produces, each on the runner that
          # executes it natively. The rows are the same three artifacts
          # scripts/select-release-candidate.py requires of a usable rc-build,
          # and the merge refuses a record whose legs do not cover them.
          - os: macos-latest
            artifact: kin-macos-aarch64
          - os: ubuntu-24.04-arm
            artifact: kin-linux-aarch64
          - os: ubuntu-latest
            artifact: kin-linux-x86_64
    steps:
      - name: Checkout the queued proof tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the vendored proof tooling is the bytes its manifest names
        run: node --test scripts/release-proof/vendored.test.mjs

      - name: Download the candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN: ${{ needs.select.outputs.rc_run }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [[ ! "$RC_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::selection handed over no rc-build run id"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rc"
          gh run download "$RC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" --dir "$RUNNER_TEMP/rc/$ARTIFACT"
          archive="$RUNNER_TEMP/rc/$ARTIFACT/$ARTIFACT.tar.gz"
          test -f "$archive"
          test -f "$archive.sha256"
          # The sidecar is checked before anything runs the bytes; the preflight
          # checks it again, and both are cheap against an artifact store.
          want="$(cut -d' ' -f1 < "$archive.sha256")"
          have="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          if [ "$want" != "$have" ]; then
            echo "::error::${ARTIFACT}.tar.gz sidecar says ${want}, bytes are ${have}"
            exit 1
          fi
          echo "KIN_RC_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "$ARTIFACT sha256 $have"

      - name: Judge the archive with the release preflight
        env:
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          ARTIFACT: ${{ matrix.artifact }}
          # The publisher lives in the next job. A leg record published from
          # here would be one of three answers under one candidate sha, and the
          # evidence branch is append-only, so the first to land would win and
          # the mint would read a one-leg proof as the whole thing.
          KIN_PREFLIGHT_NO_PUBLISH: "1"
          # Hosted runners carry no Metal accelerator and no gpu lock table, and
          # the verdict records that the CPU path is what ran.
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selection handed over no exact candidate sha"
            exit 1
          fi
          # coreutils gives the preflight the GNU timeout its leg bound needs;
          # without one it warns and runs unbounded, which on a hosted runner
          # means a hung leg burns the whole job timeout with no verdict.
          if ! timeout --version >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then brew install coreutils; fi
          fi
          set +e
          scripts/release-proof/bin/kin-release-preflight \
            --archive "$KIN_RC_ARCHIVE" \
            --kin-repo "$GITHUB_WORKSPACE" \
            --kin-ref "$GITHUB_SHA" \
            --expect-commit "$CANDIDATE" \
            --cpu-embed \
            --no-linux \
            --lane release-proof \
            --run-root "$RUNNER_TEMP/kpf" \
            --leg-timeout 3600
          rc=$?
          set -e
          # 0 PASS, 1 a leg FAILED, 2 UNREADABLE, 65 refused before any leg ran.
          # Only PASS may produce a leg record: an UNREADABLE run is not a pass
          # and must not reach the merge as one.
          echo "preflight exit ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the preflight did not pass for ${ARTIFACT} (exit ${rc})"
            exit "$rc"
          fi
          record="$(ls -1 "$RUNNER_TEMP/kpf"/preflight.json 2>/dev/null || true)"
          if [ -z "$record" ]; then
            echo "::error::the preflight passed but wrote no preflight.json under $RUNNER_TEMP/kpf"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/leg"
          cp "$record" "$RUNNER_TEMP/leg/preflight.json"

      - name: Upload this leg's record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kin-release-preflight-${{ matrix.artifact }}
          path: ${{ runner.temp }}/leg/preflight.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the candidate's preflight record
    needs: [select, preflight]
    # `always()` for the same reason `preflight` carries it, one link further
    # down. `arm` is skipped on the proof path, and a skip propagates along the
    # dependency chain to every job that does not override it, so without this
    # the publisher was skipped even with both of its own needs green. It had
    # never been evaluated before 2026-09-03: no cycle had ever reached `proof`,
    # because the selector asked rc-builds for artifacts they do not upload. On
    # run 33699387471 all three preflight legs passed, filed their leg records,
    # and this job skipped at once with zero steps.
    #
    # This does not weaken the gate. The condition still demands that the
    # preflight matrix concluded success, so a failed or skipped leg publishes
    # nothing; `always()` only stops an unrelated upstream skip from deciding it.
    if: >-
      always() &&
      needs.select.outputs.decision == 'proof' &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-tag
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the queued proof tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-bind the publish to protected main history
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selection handed over no exact candidate sha"
            exit 1
          fi
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$GITHUB_SHA" \
            --branch main
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$CANDIDATE" \
            --branch main

      - name: Collect every leg record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: kin-release-preflight-*
          path: ${{ runner.temp }}/legs

      - name: Merge the leg records into the candidate's preflight record
        env:
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          legs=()
          while IFS= read -r record; do
            legs+=("$record")
          done < <(find "$RUNNER_TEMP/legs" -name preflight.json -type f | sort)
          if [ "${#legs[@]}" -eq 0 ]; then
            echo "::error::no leg records were downloaded, so there is nothing to publish"
            exit 1
          fi
          echo "merging ${#legs[@]} leg record(s)"
          node scripts/release-proof/merge-preflight-records.mjs \
            --candidate "$CANDIDATE" \
            --out "$RUNNER_TEMP/preflight.json" \
            "${legs[@]}"

      - name: Mint repository-scoped evidence token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: kin
          permission-contents: write

      # The publisher refuses to overwrite: a record is created without a blob
      # sha, which GitHub rejects when the path exists, so a re-publish of
      # identical bytes is a no-op success and a re-publish of different bytes
      # is a loud refusal. That is why the merge above has to be deterministic.
      # What the publisher's door actually sees, recorded before it decides.
      #
      # kin-evidence-publish proves its token against GET /repos before reading
      # or writing anything, and the push half of that check reads the
      # `permissions` block, which reports the AUTHENTICATED USER's permissions.
      # What a GitHub App installation token gets back there is not obvious, and
      # on 2026-09-03 it was guessed wrong twice while four cycles refused at
      # this step with a message that named the verdict and never the evidence.
      # One API read makes the refusal name its own evidence, so the next
      # operator reads the answer instead of inferring it.
      #
      # This prints repository metadata, never the token. It cannot fail the
      # job: a diagnostic that can break the thing it explains is worse than no
      # diagnostic, so every command here is guarded and the step ends true.
      - name: Record what the evidence token can do
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          body="$(gh api "repos/${GITHUB_REPOSITORY}" 2>&1)" || body=''
          if [ -z "$body" ]; then
            perms='UNREADABLE (the repo read itself failed)'
            shape='UNREADABLE'
          else
            perms="$(printf '%s' "$body" | jq -c 'if has("permissions") then .permissions else "ABSENT" end' 2>/dev/null)" || perms='UNPARSEABLE'
            shape="$(printf '%s' "$body" | jq -r 'if has("permissions") then (.permissions | type) else "key absent" end' 2>/dev/null)" || shape='UNPARSEABLE'
          fi
          # Whether this is an installation token at all, which decides whether
          # the field above is even meant to carry an answer. /installation/repositories
          # is the one endpoint that answers for an installation token and refuses
          # every other kind, so its status is the discriminator rather than a guess
          # from the shape of something else.
          inst="$(gh api /installation/repositories --jq '.total_count' 2>/dev/null)" || inst=''
          if [ -n "$inst" ]; then kind="installation token (sees ${inst} repo(s))"; else kind='not an installation token, or that endpoint refused it'; fi
          # contents:write is what the App holds; permissions.push is a repo-collaborator
          # concept and is not obliged to project into it. If these disagree, the door
          # is consulting the wrong field rather than the right field wrongly.
          {
            echo '### Evidence token scope'
            echo ''
            printf 'GET /repos/%s permissions: %s\n\n' "$GITHUB_REPOSITORY" "${perms:-EMPTY}"
            printf 'permissions field type: %s\n\n' "${shape:-EMPTY}"
            printf 'token kind: %s\n\n' "$kind"
            echo 'The publisher refuses on a block whose push is not true, and proceeds when'
            echo 'the block is absent, so the lines above say which branch it took and'
            echo 'whether that field could have carried the answer in the first place.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "evidence token permissions: ${perms:-EMPTY}"
          echo "evidence token permissions type: ${shape:-EMPTY}"
          echo "evidence token kind: $kind"
          exit 0

      - name: Publish preflight.json for the candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          scripts/release-proof/bin/kin-evidence-publish \
            --sha "$CANDIDATE" \
            --name preflight.json \
            --file "$RUNNER_TEMP/preflight.json" \
            --repo "$GITHUB_REPOSITORY"

      - name: Say what the stranger will run next
        env:
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          {
            echo "## Preflight recorded for \`${CANDIDATE}\`"
            echo ""
            echo "\`evidence/${CANDIDATE}/preflight.json\` is on the \`release-evidence\` branch."
            echo "The mint needs \`stranger.env\` beside it. The next cycle decides \`stranger\`"
            echo "and runs it, on the self-hosted runner when one is registered and otherwise"
            echo "printing the exact local command."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::preflight.json published for ${CANDIDATE}"

  # The stranger, on a runner the fleet owns.
  #
  # Why this cannot be a hosted runner, in numbers rather than in impressions.
  # bin/kin-stranger launches one background process per arm and waits on all of
  # them afterwards, and each container is created --cpus=5 --memory=12g from
  # DEF_CPUS and DEF_MEMORY. Three concurrent arms therefore demand 15 CPUs and
  # 36 GB, which no standard hosted tier holds, and the argument does not turn on
  # which tier applies because 36 GB beats the most generous one. Wall clock is
  # NOT the constraint and an earlier reading that said so was wrong: DEF_P1 is
  # 3600 and DEF_P2 is 7200, the arms run concurrently, so a run fits inside a
  # six-hour cap with room. Memory is what refuses.
  #
  # And the arm cannot be shrunk to fit. The tool's own reference says the caps
  # are deliberately below the capability tier that gates the fused pipeline,
  # because they are the hardware a laptop audience actually has, and that THE
  # CAP IS THE MEASUREMENT: it prints MEASUREMENT CONTAMINATED when the cgroup
  # ceiling at capture differs from the flag the container was created with. A
  # smaller arm is not a smaller proof, it is an unfilable one.
  #
  # The gate is a repository variable, not a live runner query. GitHub's
  # GITHUB_TOKEN cannot list runners: `administration` is not among the
  # permissions a workflow token can be granted, and the release App carries
  # contents, issues and pull-requests only. More importantly a job whose
  # `runs-on` labels match no online runner does not skip, it QUEUES until the
  # job timeout, which is the silent hang this repository refuses everywhere
  # else. So the switch is explicit and follows the same shape ci.yml already
  # uses for vars.KIN_HEAVY_RUNNER: a captain sets
  #   gh variable set KIN_STRANGER_RUNNER --repo firelock-ai/kin --body "kin-stranger"
  # when the runner is registered, and clears it when it goes away.
  #
  # It reads the API key and no other secret, and it publishes nothing: the
  # record it produces is filed by publish-stranger below, so the release App
  # never reaches the machine executing candidate bytes under a Claude driver.
  stranger:
    name: Run the stranger on the candidate archive
    needs: select
    if: needs.select.outputs.decision == 'stranger' && vars.KIN_STRANGER_RUNNER != ''
    runs-on: ${{ vars.KIN_STRANGER_RUNNER }}
    # The stranger never reddens this rail. Founder decision, 2026-09-04: "the
    # damn smoke should never block release it is a nice to have ONLY ... it
    # should be mainly run locally not in the CI." A driver that ran out of
    # limit, a runner that went offline, a container that could not start: none
    # of those is a fact about the candidate, and a red cut run for any of them
    # is a rail that looks broken while behaving exactly as designed. The
    # stranger's home is `bin/kin-stranger` against the archive or the published
    # npm bytes; this hosted job is the optional convenience.
    #
    # `continue-on-error` has TWO axes and only one of them is wanted here. It
    # keeps the run green, and it ALSO masks `needs.stranger.result` to
    # 'success' for every downstream job, including a stranger that failed. So
    # `publish-stranger` below keys on this job's own `recorded` output instead,
    # which is written only after a record exists on disk. Gating it on
    # `.result` under this flag would publish nothing over a failed arm and
    # report success for doing it.
    continue-on-error: true
    # Three concurrent arms plus image and container setup. The arms run
    # concurrently, so the wall clock is one phase 1 plus one phase 2, not three
    # of each.
    #
    # A local endpoint gets a longer ceiling because it has longer phase
    # budgets. bin/kin-stranger scales a local run's caps to 10800 s and 21600 s
    # from a measured turn rate 4.7 to 9.7 times an account turn, so nine hours
    # of arm can sit under a six-hour job and be cut by the job instead. Ten
    # hours is headroom over that, and neither number is an expectation.
    timeout-minutes: ${{ vars.KIN_STRANGER_LOCAL_MODEL != '' && 600 || 360 }}
    permissions:
      actions: read
      contents: read
    outputs:
      recorded: ${{ steps.run.outputs.recorded }}
    steps:
      - name: Refuse before spending an arm on a missing credential
        env:
          STRANGER_KEY: ${{ secrets.KIN_STRANGER_ANTHROPIC_API_KEY }}
          LOCAL_MODEL: ${{ vars.KIN_STRANGER_LOCAL_MODEL }}
          UMBRELLA: ${{ vars.KIN_STRANGER_UMBRELLA }}
        run: |
          set -euo pipefail
          # Both refusals are at the door on purpose. An absent key sends every
          # driver request out unauthenticated and the transcript records only a
          # server error, hours in; an absent umbrella fails at the first docker
          # exec with the same delay. Neither is worth discovering late.
          #
          # The key is required only on the ACCOUNT path. Naming
          # vars.KIN_STRANGER_LOCAL_MODEL points the driver at an Anthropic
          # Messages endpoint on the runner itself, and driver_env_argv then
          # UNSETS ANTHROPIC_API_KEY for the driver child, because Claude Code
          # prefers that key over ANTHROPIC_AUTH_TOKEN and a host carrying one
          # would hand a local server a real credential and read back a 401
          # nobody could place. Requiring a secret the run then throws away is
          # how a rail stays blocked on a founder step it does not need.
          if [ -n "${LOCAL_MODEL:-}" ]; then
            echo "local endpoint: this cut drives the arms with '${LOCAL_MODEL}' on the runner, not the account"
            echo "KIN_STRANGER_LOCAL_MODEL=${LOCAL_MODEL}" >> "$GITHUB_ENV"
          elif [ -z "${STRANGER_KEY:-}" ]; then
            echo "::error::no driver credential: the repository secret KIN_STRANGER_ANTHROPIC_API_KEY is not set and the variable KIN_STRANGER_LOCAL_MODEL names no local model. Set one of them, or clear KIN_STRANGER_RUNNER so the cut prints the local command instead."
            exit 1
          fi
          umbrella="${UMBRELLA:-$HOME/GitHub/kin-ecosystem}"
          if [ ! -x "$umbrella/bin/kin-stranger" ]; then
            echo "::error::no kin-stranger at ${umbrella}/bin/kin-stranger. This job runs on a runner the fleet owns because the harness lives in the private kin-ecosystem umbrella beside its missions, drivers and image; point vars.KIN_STRANGER_UMBRELLA at that checkout."
            exit 1
          fi
          echo "KIN_UMBRELLA=$umbrella" >> "$GITHUB_ENV"
          echo "stranger harness: ${umbrella}/bin/kin-stranger"

      - name: Download the candidate archive the preflight judged
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN: ${{ needs.select.outputs.rc_run }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$RC_RUN" =~ ^[1-9][0-9]*$ ]] || [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selection handed over no exact candidate and rc-build run"
            exit 1
          fi
          dir="${RUNNER_TEMP}/kin-rc-${CANDIDATE:0:12}"
          rm -rf "$dir"
          gh run download "$RC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name kin-linux-aarch64 --dir "$dir/kin-linux-aarch64"
          archive="$dir/kin-linux-aarch64/kin-linux-aarch64.tar.gz"
          test -f "$archive"
          # The sidecar travels in the same artifact and kin-stranger refuses an
          # archive without one, so a candidate that arrives unpaired is a defect
          # in the rc-build rather than something to work around here.
          test -f "$archive.sha256"
          want="$(cut -d' ' -f1 < "$archive.sha256")"
          have="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          if [ "$want" != "$have" ]; then
            echo "::error::kin-linux-aarch64.tar.gz sidecar says ${want}, bytes are ${have}"
            exit 1
          fi
          echo "KIN_STRANGER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "archive sha256 ${have}"

      - name: Drive the three arms
        id: run
        env:
          # The account path, with a key. driver_env_argv drops
          # ANTHROPIC_API_KEY on exactly one branch, `[ "$ep" = local ]`, and
          # the endpoint defaults to account, so an exported key rides through
          # untouched and Claude Code prefers it over ANTHROPIC_AUTH_TOKEN.
          # Exporting the secret is the whole integration; the harness needs no
          # change, which is why this job adds no --driver flag.
          #
          # On the local path the same variable is still exported and the same
          # function still unsets it for the driver child, so this line is safe
          # either way and there is exactly one place the key can reach.
          ANTHROPIC_API_KEY: ${{ secrets.KIN_STRANGER_ANTHROPIC_API_KEY }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          run_id="rc${VERSION//./}-${CANDIDATE:0:7}"
          cd "$KIN_UMBRELLA"
          # A run root that already exists is an interrupted run, not a fresh
          # one. `prepare` refuses a reused container without --force because a
          # reused container tests an upgrade path, a different question, so the
          # documented recovery is `resume`, which restarts only the phases that
          # did not finish. Forcing here would silently change what is measured.
          root="${KIN_STRANGER_ROOT:-/Users/Shared/kin-stranger}/${run_id}"
          if [ -d "$root" ]; then
            echo "::notice::${run_id} already has a run root; resuming rather than re-preparing"
            bin/kin-stranger resume --run "$run_id" --candidate-sha "$CANDIDATE"
          else
            # Every arm the mint's coverage gate requires. The tool defaults to
            # this set now, and it is named anyway: on 2026-09-02 two complete
            # two-arm runs were refused at the mint, and evidence is
            # append-only, so a record missing an arm cannot be replaced.
            bin/kin-stranger prepare --run "$run_id" --arms green,brown,vcs
            # One argv element per flag, built as an array, so an empty local
            # model contributes nothing rather than an empty string the tool
            # would read as a model named "".
            local_flags=()
            if [ -n "${KIN_STRANGER_LOCAL_MODEL:-}" ]; then
              local_flags=(--local-model "$KIN_STRANGER_LOCAL_MODEL")
            fi
            bin/kin-stranger run --run "$run_id" \
              --archive "$KIN_STRANGER_ARCHIVE" \
              --candidate-sha "$CANDIDATE" \
              "${local_flags[@]+"${local_flags[@]}"}"
          fi
          record="${root}/run.env"
          if [ ! -s "$record" ]; then
            echo "::error::the stranger finished but wrote no run.env under ${root}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/stranger"
          cp "$record" "$RUNNER_TEMP/stranger/stranger.env"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
          echo "stranger record at ${record}"

      # Whatever happened, the cut's own record says so. A job that is allowed
      # to fail quietly is a job nobody reads, and "pending" is the answer this
      # rail acts on everywhere else, so it is the word used here too.
      - name: Say what the stranger left behind
        if: always()
        env:
          RECORDED: ${{ steps.run.outputs.recorded }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          if [ "${RECORDED:-}" = true ]; then
            echo "### First contact measured for \`${CANDIDATE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The three arms completed and the record is on its way to the evidence branch." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::stranger completed for ${CANDIDATE}"
          else
            {
              echo "### First contact stays PENDING for \`${CANDIDATE}\`"
              echo ""
              echo "The hosted stranger did not leave a record this cycle, and that does not hold"
              echo "the release. The tag, the GitHub release and Latest all move on the machine"
              echo "preflight alone, and the release carries a notice saying nobody has measured"
              echo "what a first-time user meets."
              echo ""
              echo "To measure it, run the stranger locally against the archive or the published"
              echo "npm bytes, which is the ordinary path:"
              echo ""
              echo '```'
              echo "bin/kin-stranger run --npm <version>      # what a stranger who types the install line gets"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::stranger left no record for ${CANDIDATE}; first contact stays pending and nothing is held"
          fi

      - name: Upload the stranger record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kin-stranger-record
          path: ${{ runner.temp }}/stranger/stranger.env
          if-no-files-found: error
          retention-days: 7

  publish-stranger:
    name: Publish the candidate's stranger record
    needs: [select, stranger]
    # `outputs.recorded`, never `result`. The stranger job is
    # continue-on-error, which masks its result to 'success' even when it
    # failed, so a `.result` gate here would run this publisher over an arm
    # that produced no record.
    if: needs.select.outputs.decision == 'stranger' && needs.stranger.outputs.recorded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-tag
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the queued proof tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-bind the publish to protected main history
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selection handed over no exact candidate sha"
            exit 1
          fi
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$GITHUB_SHA" \
            --branch main
          python3 scripts/verify-protected-main-history.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy-sha "$CANDIDATE" \
            --branch main

      - name: Collect the stranger record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: kin-stranger-record
          path: ${{ runner.temp }}/stranger

      - name: Mint repository-scoped evidence token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: kin
          permission-contents: write

      # --require-archive is the link, checked at write time rather than
      # discovered by the gate at release time: the publisher refuses unless the
      # preflight already published for this candidate judged this exact
      # archive. It also turns a mistyped candidate into a named failure instead
      # of a record that sits unread until a release is held by it.
      - name: Publish stranger.env for the candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/stranger/stranger.env"
          archive="$(sed -n 's/^archive_sha256=//p' "$record" | head -1)"
          if [[ ! "$archive" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the stranger record names no archive_sha256, so nothing links it to the bytes the preflight judged"
            exit 1
          fi
          scripts/release-proof/bin/kin-evidence-publish \
            --sha "$CANDIDATE" \
            --name stranger.env \
            --file "$record" \
            --repo "$GITHUB_REPOSITORY" \
            --require-archive "$archive"
          {
            echo "## Both proof records are filed for \`${CANDIDATE}\`"
            echo ""
            echo "The mint already selects any sha in the range carrying \`preflight.json\`, and the"
            echo "release it cuts becomes GitHub Latest either way. With \`stranger.env\` filed too,"
            echo "that release also gets to claim first-contact coverage instead of carrying a"
            echo "pending notice saying nobody measured what a first-time user meets."
          } >> "$GITHUB_STEP_SUMMARY"

  # No runner, so say so loudly and hand over the exact command. This is the
  # path that keeps the release moving: the cut still selects, arms and
  # preflights, and only the last step waits on a person.
  stranger-standby:
    name: Report the stranger a runner cannot take
    needs: select
    if: needs.select.outputs.decision == 'stranger' && vars.KIN_STRANGER_RUNNER == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Print the command a captain has to run
        env:
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          VERSION: ${{ needs.select.outputs.version }}
          RC_RUN: ${{ needs.select.outputs.rc_run }}
        run: |
          set -euo pipefail
          run_id="rc${VERSION//./}-${CANDIDATE:0:7}"
          download="/tmp/kin-rc-${CANDIDATE:0:12}"
          {
            echo "## The stranger is waiting on a runner"
            echo ""
            echo "\`evidence/${CANDIDATE}/preflight.json\` is filed and \`stranger.env\` is the"
            echo "only missing half. No runner carries the \`KIN_STRANGER_RUNNER\` variable, so"
            echo "this cycle cannot run it. Three arms at 5 CPUs and 12g each need 15 CPUs and"
            echo "36 GB concurrently, which no hosted runner holds, and the caps are the"
            echo "measurement rather than a knob."
            echo ""
            echo "Run it here:"
            echo ""
            echo '```'
            echo "gh run download ${RC_RUN} --repo ${GITHUB_REPOSITORY} --dir ${download}"
            echo "bin/kin-stranger prepare --run ${run_id} --arms green,brown,vcs"
            echo "bin/kin-stranger run --run ${run_id} \\"
            echo "  --archive ${download}/kin-linux-aarch64/kin-linux-aarch64.tar.gz \\"
            echo "  --candidate-sha ${CANDIDATE}"
            echo '```'
            echo ""
            echo "Or register a runner and set the variable, which deletes this step:"
            echo ""
            echo '```'
            echo "gh variable set KIN_STRANGER_RUNNER --repo ${GITHUB_REPOSITORY} --body '<runner label>'"
            echo "gh secret set KIN_STRANGER_ANTHROPIC_API_KEY --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo ""
            echo "The secret is one of two ways to give the driver a credential, and the other"
            echo "needs no secret at all. Naming a model the runner already serves points the"
            echo "driver at an Anthropic Messages endpoint on that machine, and the harness then"
            echo "unsets \`ANTHROPIC_API_KEY\` for the driver child, so no key is involved:"
            echo ""
            echo '```'
            echo "gh variable set KIN_STRANGER_LOCAL_MODEL --repo ${GITHUB_REPOSITORY} --body '<model id the runner serves>'"
            echo '```'
            echo ""
            echo "A local-model stranger is a WEAKER stranger. Its findings stand on their own"
            echo "evidence; an empty finding list from it does not, and the record says which"
            echo "driver produced it so no reader has to guess."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::${CANDIDATE} has its preflight record and needs the stranger; no KIN_STRANGER_RUNNER is set, so the command is in this run's summary and a captain has to run it"

  # A refusal is a real outcome and has to be loud. The selector exits 1 and
  # names the contexts that disqualified the newest sha, which fails the select
  # job; this job exists so the refusal reaches the run's conclusion even when
  # the selector stood down for a reason worth reading.
  report:
    name: Report the cut's decision
    needs: select
    if: always() && needs.select.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Summarize
        env:
          DECISION: ${{ needs.select.outputs.decision }}
          REASON: ${{ needs.select.outputs.reason }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          RESULT: ${{ needs.select.result }}
        run: |
          set -euo pipefail
          {
            echo "## Release cut: ${DECISION:-unreadable}"
            echo ""
            echo "${REASON:-the selector produced no reason, which is itself the finding}"
            echo ""
            [ -n "$CANDIDATE" ] && echo "Candidate: \`${CANDIDATE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo "::error::the selection job concluded ${RESULT}; the cut did not decide"
            exit 1
          fi
          echo "release cut decision: ${DECISION} (${REASON})"
