name: Publish Release Follow-Ups

# This callback runs from reviewed default-branch workflow bytes only after the
# tag-only Release workflow has fully completed successfully. It has no cloud
# credential and cannot write Kin contents; its single capability is minting a
# short-lived GitHub App token scoped only to firelock-ai/homebrew-kin and
# firelock-ai/kin-infra. It requests both downstream publishers and proves the
# workflows completed before accepting either public outcome.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: kin-release-follow-ups-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      vars.RELEASE_FOLLOWUP_READY == 'true' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-followups
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      KIN_TAG: ${{ github.event.workflow_run.head_branch }}
      KIN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout reviewed callback policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current callback authority without blocking unrelated main progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Name the field and the observed value: a bare [ ] under `set -e`
          # reports a real refusal as a bare exit code.
          assert_field() {
            [ "$2" = "$3" ] || {
              echo "::error::$1: expected '$3', got '$2'"
              exit 1
            }
          }
          assert_field "triggering ref" "$GITHUB_REF" refs/heads/main
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          assert_field "checked-out head" "$(git rev-parse HEAD)" "$GITHUB_SHA"
          ancestry="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${current}" \
            --jq .status)"
          [ "$ancestry" = ahead ] || [ "$ancestry" = identical ] || {
            echo "::error::callback sha ${GITHUB_SHA} compares '$ancestry' to live main ${current}, expected ahead or identical"
            exit 1
          }

          authority_paths=(
            .github/workflows/publish-release-installers.yml
            scripts/verify-homebrew-formula.sh
            scripts/validate-homebrew-formula.py
            scripts/verify_installer_parity.py
          )
          for path in "${authority_paths[@]}"; do
            event_blob="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}" \
              --jq .sha)"
            current_blob="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${current}" \
              --jq .sha)"
            if [ "$event_blob" != "$current_blob" ]; then
              echo "::error::callback authority changed on main after this event: ${path}"
              exit 1
            fi
          done

      - name: Revalidate completed public release provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A bare [ ] under `set -e` exits 1 printing nothing, so a genuine
          # refusal reaches the log as an unexplained exit code. Assert through
          # a helper that names the field and the value actually observed.
          assert_field() {
            [ "$2" = "$3" ] || {
              echo "::error::$1: expected '$3', got '$2'"
              exit 1
            }
          }
          assert_matches() {
            [[ "$2" =~ $3 ]] || {
              echo "::error::$1: '$2' does not match $3"
              exit 1
            }
          }
          assert_matches "source run id" "$SOURCE_RUN_ID" '^[0-9]+$'
          assert_matches "release tag" "$KIN_TAG" '^v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_matches "release sha" "$KIN_SHA" '^[0-9a-f]{40}$'

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          assert_field "source run id" "$(jq -r '.id | tostring' <<< "$run")" "$SOURCE_RUN_ID"
          assert_field "source run status" "$(jq -r .status <<< "$run")" completed
          assert_field "source run conclusion" "$(jq -r .conclusion <<< "$run")" success
          assert_field "source run event" "$(jq -r .event <<< "$run")" push
          assert_field "source run workflow" "$(jq -r .path <<< "$run")" .github/workflows/release.yml
          assert_field "source run repository" "$(jq -r .repository.full_name <<< "$run")" "$GITHUB_REPOSITORY"
          assert_field "source run head repository" "$(jq -r .head_repository.full_name <<< "$run")" "$GITHUB_REPOSITORY"
          assert_field "source run head branch" "$(jq -r .head_branch <<< "$run")" "$KIN_TAG"
          assert_field "source run head sha" "$(jq -r .head_sha <<< "$run")" "$KIN_SHA"

          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${KIN_TAG}")"
          object_type="$(jq -r .object.type <<< "$ref")"
          peeled="$(jq -r .object.sha <<< "$ref")"
          for _ in 1 2 3 4; do
            [ "$object_type" = tag ] || break
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${peeled}")"
            object_type="$(jq -r .object.type <<< "$tag_object")"
            peeled="$(jq -r .object.sha <<< "$tag_object")"
          done
          assert_field "release tag object type" "$object_type" commit
          assert_field "release tag target sha" "$peeled" "$KIN_SHA"

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${KIN_TAG}")"
          assert_field "release draft flag" "$(jq -r .draft <<< "$release")" false
          assert_field "release prerelease flag" "$(jq -r .prerelease <<< "$release")" false
          [ -n "$(jq -r '.published_at // empty' <<< "$release")" ] || {
            echo "::error::release ${KIN_TAG} has no published_at timestamp"
            exit 1
          }
          release_id="$(jq -r '.id | tostring' <<< "$release")"
          latest_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id | tostring')"
          assert_field "release id versus GitHub Latest" "$release_id" "$latest_id"

          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${KIN_SHA}...main" --jq .status)"
          [ "$status" = ahead ] || [ "$status" = identical ] || {
            echo "::error::released sha ${KIN_SHA} compares '$status' to main, expected ahead or identical"
            exit 1
          }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Checkout exact released installer sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.KIN_SHA }}
          path: release-source
          sparse-checkout: scripts
          persist-credentials: false

      - name: Validate and hash exact installer sources
        id: installers
        run: |
          set -euo pipefail
          checked_out="$(git -C release-source rev-parse HEAD)"
          [ "$checked_out" = "$KIN_SHA" ] || {
            echo "::error::installer sources are at ${checked_out}, expected released sha ${KIN_SHA}"
            exit 1
          }
          sh -n release-source/scripts/install.sh
          # shellcheck disable=SC2016 # PowerShell variables must reach pwsh literally.
          pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; $t=$null; $e=$null; [System.Management.Automation.Language.Parser]::ParseFile("release-source/scripts/install.ps1",[ref]$t,[ref]$e)|Out-Null; if($e.Count){exit 1}'
          install_sha256="$(sha256sum release-source/scripts/install.sh | awk '{print $1}')"
          install_ps1_sha256="$(sha256sum release-source/scripts/install.ps1 | awk '{print $1}')"
          for pair in "install.sh:$install_sha256" "install.ps1:$install_ps1_sha256"; do
            [[ "${pair#*:}" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::${pair%%:*} digest '${pair#*:}' is not 64 lowercase hex characters"
              exit 1
            }
          done
          echo "install_sha256=$install_sha256" >> "$GITHUB_OUTPUT"
          echo "install_ps1_sha256=$install_ps1_sha256" >> "$GITHUB_OUTPUT"

      - name: Mint release-follow-up GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_APP_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: |
            homebrew-kin
            kin-infra
          permission-actions: read
          permission-contents: write

      - name: Request Homebrew formula update
        id: homebrew-dispatch
        env:
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg tag "$KIN_TAG" \
            --arg sha "$KIN_SHA" \
            --arg run_id "$SOURCE_RUN_ID" \
            '{event_type:"kin-release",client_payload:{schema_version:1,kin_tag:$tag,kin_sha:$sha,release_workflow_run_id:$run_id}}')"
          code="$(curl -sS -o /tmp/homebrew-dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/firelock-ai/homebrew-kin/dispatches \
            -d "$payload")"
          if [ "$code" != 204 ]; then
            echo "::error::Homebrew repository dispatch returned HTTP $code"
            cat /tmp/homebrew-dispatch-response
            exit 1
          fi
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"

      - name: Request protected atomic installer publication
        id: installer-dispatch
        env:
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ steps.provenance.outputs.release_id }}
          INSTALL_SHA256: ${{ steps.installers.outputs.install_sha256 }}
          INSTALL_PS1_SHA256: ${{ steps.installers.outputs.install_ps1_sha256 }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg tag "$KIN_TAG" \
            --arg sha "$KIN_SHA" \
            --arg release_id "$RELEASE_ID" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg install_sha256 "$INSTALL_SHA256" \
            --arg install_ps1_sha256 "$INSTALL_PS1_SHA256" \
            '{event_type:"publish-install",client_payload:{schema_version:1,kin_tag:$tag,kin_sha:$sha,release_id:$release_id,release_workflow_run_id:$run_id,install_sha256:$install_sha256,install_ps1_sha256:$install_ps1_sha256}}')"
          code="$(curl -sS -o /tmp/installer-dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/firelock-ai/kin-infra/dispatches \
            -d "$payload")"
          if [ "$code" != 204 ]; then
            echo "::error::installer repository dispatch returned HTTP $code"
            cat /tmp/installer-dispatch-response
            exit 1
          fi
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          {
            echo "Requested protected installer publication:"
            echo ""
            echo "- release: \`${KIN_TAG}\`"
            echo "- commit: \`${KIN_SHA}\`"
            echo "- completed Release run: \`${SOURCE_RUN_ID}\`"
            echo "- install.sh: \`${INSTALL_SHA256}\`"
            echo "- install.ps1: \`${INSTALL_PS1_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The third dispatch, beside the two above and under the same token, which
      # already carries kin-infra in its repositories list.
      #
      # Getting a promoted release's daemon into production took a person
      # resolving nine inputs by hand on 2026-08-30, three failed dispatches, and
      # a five-minute outage when a shortcut was tried instead. Every one of
      # those nine is knowable from the API, so this sends the trigger and the
      # receiver resolves them.
      #
      # The payload carries the TAG only, deliberately. kin-infra's
      # promote-release-images.yml refuses a schema_version it does not know,
      # requires the tag to equal exact GitHub Latest, and resolves the commit,
      # the release run, the GHCR digest and both main heads itself. That is the
      # rule publish-install.yml states for this repository pair: payload fields
      # are never trusted without independent API verification. Sending less is
      # what makes that enforceable.
      - name: Request promoted release image promotion
        id: image-promotion-dispatch
        env:
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg tag "$KIN_TAG" \
            '{event_type:"promote-release-images",client_payload:{schema_version:1,kin_tag:$tag}}')"
          code="$(curl -sS -o /tmp/image-promotion-dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/firelock-ai/kin-infra/dispatches \
            -d "$payload")"
          if [ "$code" != 204 ]; then
            echo "::error::image promotion repository dispatch returned HTTP $code"
            cat /tmp/image-promotion-dispatch-response
            exit 1
          fi
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          {
            echo "Requested release image promotion:"
            echo ""
            echo "- release: \`${KIN_TAG}\`"
            echo "- receiver resolves the tuple itself and refuses a tag that is not exact Latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove Homebrew workflow and public formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCHED_AT: ${{ steps.homebrew-dispatch.outputs.dispatched_at }}
          KIN_HOMEBREW_VERIFY_MAX_WAIT_SECONDS: 900
        run: |
          set -euo pipefail
          # Name the field and the observed value: a bare [ ] under `set -e`
          # reports a real downstream refusal as a bare exit code.
          assert_field() {
            [ "$2" = "$3" ] || {
              echo "::error::$1: expected '$3', got '$2'"
              exit 1
            }
          }
          expected_title="Update formula ${KIN_TAG} from Kin run ${SOURCE_RUN_ID}"
          downstream_id=""
          for _ in $(seq 1 36); do
            runs="$(gh api \
              'repos/firelock-ai/homebrew-kin/actions/workflows/update-formula.yml/runs?event=repository_dispatch&per_page=20')"
            downstream_id="$(jq -r \
              --arg title "$expected_title" --arg dispatched_at "$DISPATCHED_AT" \
              '[.workflow_runs[] | select(.display_title == $title and .created_at >= $dispatched_at)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")"
            if [ -n "$downstream_id" ]; then
              state="$(gh api "repos/firelock-ai/homebrew-kin/actions/runs/${downstream_id}")"
              status="$(jq -r .status <<< "$state")"
              if [ "$status" = completed ]; then
                assert_field "Homebrew run ${downstream_id} conclusion" \
                  "$(jq -r .conclusion <<< "$state")" success
                assert_field "Homebrew run ${downstream_id} event" \
                  "$(jq -r .event <<< "$state")" repository_dispatch
                assert_field "Homebrew run ${downstream_id} workflow" \
                  "$(jq -r .path <<< "$state")" .github/workflows/update-formula.yml
                assert_field "Homebrew run ${downstream_id} head branch" \
                  "$(jq -r .head_branch <<< "$state")" main
                assert_field "Homebrew run ${downstream_id} repository" \
                  "$(jq -r .repository.full_name <<< "$state")" firelock-ai/homebrew-kin
                break
              fi
            fi
            sleep 10
          done
          [ -n "$downstream_id" ] || {
            echo "::error::no downstream Homebrew workflow run started"
            exit 1
          }
          [ "${status:-}" = completed ] || {
            echo "::error::downstream Homebrew workflow did not complete within the proof window"
            exit 1
          }

          bash scripts/verify-homebrew-formula.sh "$KIN_TAG"
          {
            echo "Homebrew proof:"
            echo ""
            echo "- homebrew-kin run: \`${downstream_id}\`"
            echo "- public formula version, URLs, and all four checksums match the release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove installer activation and public byte parity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCHED_AT: ${{ steps.installer-dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          # Name the field and the observed value: a bare [ ] under `set -e`
          # reports a real downstream refusal as a bare exit code.
          assert_field() {
            [ "$2" = "$3" ] || {
              echo "::error::$1: expected '$3', got '$2'"
              exit 1
            }
          }
          expected_title="Publish installers ${KIN_TAG} from Kin run ${SOURCE_RUN_ID}"
          downstream_id=""
          for _ in $(seq 1 36); do
            runs="$(gh api \
              'repos/firelock-ai/kin-infra/actions/workflows/publish-install.yml/runs?event=repository_dispatch&per_page=20')"
            downstream_id="$(jq -r \
              --arg title "$expected_title" --arg dispatched_at "$DISPATCHED_AT" \
              '[.workflow_runs[] | select(.display_title == $title and .created_at >= $dispatched_at)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")"
            if [ -n "$downstream_id" ]; then
              state="$(gh api "repos/firelock-ai/kin-infra/actions/runs/${downstream_id}")"
              status="$(jq -r .status <<< "$state")"
              if [ "$status" = completed ]; then
                assert_field "installer run ${downstream_id} conclusion" \
                  "$(jq -r .conclusion <<< "$state")" success
                assert_field "installer run ${downstream_id} event" \
                  "$(jq -r .event <<< "$state")" repository_dispatch
                assert_field "installer run ${downstream_id} workflow" \
                  "$(jq -r .path <<< "$state")" .github/workflows/publish-install.yml
                assert_field "installer run ${downstream_id} head branch" \
                  "$(jq -r .head_branch <<< "$state")" main
                assert_field "installer run ${downstream_id} repository" \
                  "$(jq -r .repository.full_name <<< "$state")" firelock-ai/kin-infra
                break
              fi
            fi
            sleep 10
          done
          [ -n "$downstream_id" ] || {
            echo "::error::no downstream installer workflow run started; the workflow may still be disabled"
            exit 1
          }
          [ "${status:-}" = completed ] || {
            echo "::error::downstream installer workflow did not complete within the proof window"
            exit 1
          }

          python3 scripts/verify_installer_parity.py "$KIN_TAG" --expected-sha "$KIN_SHA"
          {
            echo ""
            echo "Downstream proof:"
            echo ""
            echo "- kin-infra run: \`${downstream_id}\`"
            echo "- public manifest and both installer hashes match the released source"
          } >> "$GITHUB_STEP_SUMMARY"
