# Product acceptance, on every pull request, against that request's own build.
#
# ci.yml tests the release machinery and the Rust workspace. The suites that ask
# whether the product still answers correctly (the magic repro and the brownfield
# repro) lived only in the kin-ecosystem umbrella and ran after a tag or on a
# release candidate, by a captain, on one Mac. bin/kin-release-preflight's own
# header records what that costs: v0.5.38 "was built, published, and then failed
# semantic_coverage.complete on every platform with nothing local having ever
# asked the question."
#
# Against a built binary the suites are minutes, not hours: measured locally on
# 2026-08-21 against a kin built from main, the magic suite took 107 s and the
# brownfield suite 351 s with a warm corpus cache. There is no reason for the
# question to wait for a tag. The scripts they run are owned by
# this repository (scripts/acceptance/), so the suite versions with the code it
# tests rather than drifting against it in another checkout.
#
# The build is the RELEASE profile, unlike daemon-smoke.yml's debug one, and the
# extra minutes are bought deliberately. Release is what ships, so it is what a
# product acceptance answer should be about, and the first run of this job
# turned up a walk that a debug build truncated and a release build did not
# (FIR-2593). An acceptance suite whose result depends on a profile nobody
# releases is answering a question nobody asked.
#
# `Product Acceptance` IS a required context on main. It is one of the eleven on
# ruleset 19746451, "Require status checks on main", read live from
# `GET /repos/firelock-ai/kin/rules/branches/main` on 2026-08-27. The header
# here used to say the opposite, that it "publishes no required context yet"
# and would become one after five green pull requests under FIR-2591. That step
# happened and the comment did not move.
#
# The correction matters beyond tidiness, because the required list is live
# GitHub configuration no test in this repository can read, which is why the
# release mint keeps a reviewed mirror of it. A comment claiming a context is
# advisory when a ruleset is blocking on it is the kind of thing somebody reads
# right before deciding a job is safe to skip.
#
# The job below is off the pull-request path as of FIR-2815, and that is a
# separate question from whether the context is required. It still reports on a
# pull request, as `skipped`, which satisfies the required context the same way
# the Windows installer leg has satisfied it since before this file existed. It
# runs for real in the merge queue and on every commit that reaches main, where
# the concurrency group below gives each commit its own run and cancels
# nothing, so acceptance is graded per commit rather than per window.

name: Acceptance

on:
  # main is here for one mechanical reason: `save-if` below writes the cargo
  # cache only from the default branch, and a workflow that never runs there
  # never writes one, so every pull request would pay a cold dependency build.
  # daemon-smoke.yml carries the same trigger for the same reason.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and a superseded push is cancelled. On main each
# commit gets its own group: `cancel-in-progress: false` does not mean "never
# cancel", GitHub keeps at most one PENDING run per group and deletes the older
# one, and the hosted merge queue lands PRs back to back, so two quick landings
# would otherwise leave the earlier commit with this check absent rather than
# failed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The suites never run inference and never touch a real store. Set here as
  # well as inside each suite, so a step added later inherits the same posture.
  KIN_DAEMON_AUTO_EMBED: "0"
  KIN_EMBED_BACKEND: cpu
  KIN_VFS_DISABLE: "1"

jobs:
  acceptance:
    name: Product Acceptance
    # Measured at 29.0 minutes on a pull request, the single largest required
    # context, against a ten-minute open-to-merge bar. It reports `skipped` here
    # and runs in full on the merge queue and on every main commit; the release
    # mint refuses a sha whose required checks are not green, so what this
    # proves still has to be true before a tag, only later than it used to be.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before the build, because this needs no binary and no corpus and a broken
      # grader should be named in seconds rather than after three minutes of
      # compiling. Every verdict the brownfield suite reports is decided by
      # verdict_surfaces, name_matches, sweep_verdict and Result.status, and each
      # self-test case is paired with its inverse, so a grader that cannot tell
      # its own cases apart fails here instead of reporting a clean product on a
      # broken one.
      - name: Falsify the brownfield verdict graders
        run: python3 scripts/acceptance/brownfield_repro.py --self-test

      # The gate decides this job, so it gets the same treatment. Every rule it
      # enforces is exercised against its inverse, including the ones that keep
      # its allowance list from becoming a way to stop enforcing.
      # Same treatment, same reason: this suite's graders decide whether a store
      # that hid a parse hole reads as healthy, and each of its cases is paired
      # with the input that must produce the opposite verdict.
      - name: Falsify the parse-hole verdict graders
        run: python3 scripts/acceptance/parse_hole_repro.py --self-test

      # FIR-1826. The suite's verdicts are decided by two graders: one that reads
      # the callers out of a `kin graph inspect`, and one that turns a caller set
      # into PASS or FAIL. Both are driven against the input that must produce
      # the opposite answer, including the pair that matters most, an inspect
      # that printed no edge line and an entity nothing calls. Those two collapse
      # into one empty set the moment the grader stops telling them apart, and a
      # failed probe then reads as a clean negative.
      - name: Falsify the same-owner call graders
        run: python3 scripts/acceptance/same_owner_call_repro.py --self-test

      - name: Falsify the acceptance gate
        run: python3 scripts/acceptance/gate.py --self-test

      # A green suite step is not a verdict, and this makes that a rule rather
      # than a reading: every suite-run step must say the verdict comes from the
      # gate step, keep its exit-code capture, and report a nonzero result as a
      # deferred warning rather than a failure. Exactly one step may carry the
      # verdict name. The scanner is driven against its own mutants first, so a
      # rule that cannot fail fails here.
      - name: Falsify and enforce the workflow step visibility rule
        run: |
          python3 scripts/acceptance/test_workflow_step_visibility.py --self-test
          python3 scripts/acceptance/test_workflow_step_visibility.py

      # FIR-2600. The budget must never render a list it cut as an empty one,
      # because an empty array is the shape a reader takes for "the walk found
      # none". Each grader is handed the exact defect that shipped and has to
      # fail on it; one of them passed a broken product during development
      # because its fixture never reached the code under test, which is what
      # this step exists to catch.
      - name: Falsify the response-budget elision graders
        run: python3 scripts/acceptance/response_budget_elisions.py --self-test

      # FIR-2614. Kin backs off before it swaps the host, and a back-off nobody
      # can see is the defect rather than the fix: every counter on every
      # surface keeps reporting the work it held back as pending. Each grader
      # here decides whether a refusal was disclosed, and each is paired with
      # the input that must produce the opposite verdict, including a healthy
      # page that must never read as a disclosure.
      - name: Falsify the memory-pressure refusal graders
        run: python3 scripts/acceptance/memory_pressure_refusal.py --self-test

      # FIR-2539. A memory ceiling that cannot fail is worse than no ceiling: it
      # reads green while a conversion goes back to holding a second copy of
      # history. The graders and the PARSER are both driven against their own
      # inverses, and the shipped ceiling is driven against the pre-fix figure
      # and the post-fix one, so a ceiling loosened until nothing can trip it
      # breaks here rather than passing.
      - name: Falsify the init-memory graders
        run: python3 scripts/acceptance/init_memory_repro.py --self-test

      # FIR-2467. A scratch KIN_HOME is meant to be a sealed world, and the
      # cross-repo registry used to sit outside it, so a fixture daemon pinned
      # sibling authority for every repository on the operator's machine. The
      # graders here decide whether a view is sealed, and every one of them is
      # paired with the input that must produce the opposite verdict: two of
      # these cases were added because a mutation that deleted a whole branch
      # of the grader left the self-test green.
      - name: Falsify the registry isolation graders
        run: python3 scripts/acceptance/registry_home_isolation.py --self-test

      # FIR-2627, FIR-2628, FIR-2629. The three surfaces a stranger meets before
      # the graph answers anything: the help text where the write-through
      # assumption forms, the install line a non-root user cannot run, and the
      # language-server install that died behind a proxy saying only that it
      # died. Each grader is handed the text shipped 0.5.49 actually produced
      # and has to fail on it.
      - name: Falsify the first-contact honesty graders
        run: python3 scripts/acceptance/first_contact_honesty.py --self-test

      # FIR-2664. A finished eject left its journal in the archived .kin, a
      # `cp -r` of that archive back to .kin carried it along, and every commit
      # after that answered HTTP 500 until the store was deleted. The graders
      # here decide whether a commit landed, whether a refusal names the file
      # and the remedy in words, and whether kin init refused over a hook; each
      # is handed the exact text 0.5.52 shipped and has to fail on it.
      - name: Falsify the eject-journal graders
        run: python3 scripts/acceptance/eject_journal_repro.py --self-test

      # FIR-2672. The one verdict certified an answer as the whole set while
      # its own completeness block recorded a requested edge class it could not
      # read, on every release since the verdict existed. The graders here are
      # handed the exact 0.5.52 envelope and have to fail on it, and the fixed
      # shape and the all-present shape must both pass, so a grader that refuses
      # everything fails here too.
      - name: Falsify the verdict-limits graders
        run: python3 scripts/acceptance/verdict_limits_repro.py --self-test

      # FIR-1926. Every other suite here exports KIN_DAEMON_AUTO_EMBED=0, so
      # nothing in the estate runs the path where the embedding backfill exists
      # and nothing can see what happens on the other side of it. Two defects
      # wear that ticket's name: a first query that is LATE, which is owed a
      # disclosure naming the phase and the elapsed seconds, and a first answer
      # that is THIN, because the LSP cold sweep is ordered behind the backfill
      # and until it publishes the cross-file edges are missing. The thin one
      # arrives promptly and successfully and is wrong, so a grader reading
      # elapsed time cannot see it and these read total_upstream instead. Each
      # grader is handed the input it must refuse.
      - name: Falsify the first-query readiness graders
        run: python3 scripts/acceptance/first_query_readiness_repro.py --self-test

      # FIR-2781. The v0.6.0 stranger walked Session.send with limit_per_step 4
      # and got a chain that stops two hops short of where verify goes: the cap
      # discarded eleven of fifteen callees, HTTPAdapter.send among them, and
      # ranked them by a same-file proximity term no question is an input to.
      # The class is not that a hop was dropped, a cap has to drop something. It
      # is that a chain missing its point reads exactly like a complete one,
      # because "treat this as a lower bound" is the label a complete walk
      # carries too. Each grader is handed the payload it must refuse, including
      # a walk that counts the clip and never says it, and a walk that writes the
      # spine key as zero rather than omitting it.
      - name: Falsify the trace spine-clipping graders
        run: python3 scripts/acceptance/trace_spine_clipping_repro.py --self-test

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Verify kin cargo registry config
        # Preserve the tracked config because it carries public Git [patch.kin]
        # pins for kin-* crates that are not all registry-published yet.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # A release build of this workspace is expensive enough that the
      # dependency target directory has to be carried, so this job takes its own
      # cache entry rather than sharing one. `shared-key` replaces the job-id
      # component of the key, which is what lets a pull request restore the entry
      # main wrote; without it every job id gets its own key and a pull request
      # would never see main's. The action strips the workspace's own crates
      # before saving, so what is restored is dependencies and never a stale kin
      # or kin-daemon binary, which is what the suites assert on.
      #
      # Restore on every event, save only from main, because an entry written
      # from a pull request ref is readable only by later runs on that same ref
      # and would spend the shared repository cache budget that main's reusable
      # entry needs.
      - name: Cache cargo registry and the release dependency build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: acceptance-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cargo.lock and .cargo/config.toml together pin kin-* deps to public
      # source until every crate is registry-published.
      - name: Build kin + kin-daemon (release)
        run: cargo build --release --locked --bin kin --bin kin-daemon

      # Without a language server on PATH the brownfield suite's enrichment
      # sweep never runs, and its recall checks then report UNREADABLE rather
      # than a verdict. The script warns and exits 0 on a registry failure, so a
      # bad npm morning does not fail this gate; when that happens the suite
      # says so per check instead of quietly passing.
      - name: Install language servers for the enrichment checks
        run: bash scripts/ci-install-language-servers.sh

      # `kin commit` refuses to invent an author, and a hosted runner carries no
      # git identity, so without this every magic-suite fixture that commits
      # through kin fails to build and its checks report UNREADABLE. Run
      # 32512404014 is what found it: seven of ten checks came back
      # "kin commit failed ... Set your Git identity". The suites pass an
      # identity to their own `git` invocations already; this is for the commits
      # kin itself authors.
      - name: Give the runner a git identity
        run: |
          set -euo pipefail
          git config --global user.name 'Kin CI'
          git config --global user.email 'ci@kinlab.ai'
          git config --global --get user.email

      # The magic suite's virtual-environment check builds a real venv, and
      # Debian and Ubuntu ship `python3 -m venv` in a separate package. Probe by
      # creating one rather than by importing the module, because the module
      # imports fine on an image whose ensurepip was split out and only the
      # creation fails. A missing venv would otherwise surface as UNREADABLE on
      # that one check, which is a red job blamed on the diff under review.
      - name: Ensure python3 can create a virtual environment
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          if ! python3 -m venv "$probe/env" >/dev/null 2>&1; then
            scripts/ci-apt-install.sh python3-venv
            python3 -m venv "$probe/env"
          fi
          rm -rf "$probe"
          echo "python3 -m venv works"

      # The two upstream trees the brownfield suite pins, cached as depth-1
      # fetches plus the express node_modules the language server needs to
      # resolve require() targets. The key is derived from the pinned commits in
      # the script itself, so moving a pin invalidates the entry rather than
      # measuring the old tree under the new name.
      - name: Resolve the pinned brownfield corpora
        id: corpora
        run: |
          set -euo pipefail
          key="$(python3 -c "
          import pathlib, re
          text = pathlib.Path('scripts/acceptance/brownfield_repro.py').read_text()
          commits = re.findall(r'\"commit\": \"([0-9a-f]{40})\"', text)
          if len(commits) != 2:
              raise SystemExit('expected two pinned corpus commits, found %d' % len(commits))
          print('-'.join(c[:12] for c in sorted(commits)))
          ")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "pinned corpora: $key"

      - name: Cache the brownfield corpora
        uses: actions/cache@v6
        with:
          path: ~/.cache/kin-brownfield-repro
          key: kin-brownfield-corpora-${{ runner.os }}-${{ steps.corpora.outputs.key }}

      # Each suite writes its whole output to a file and the file is printed
      # afterwards, rather than piping into tee. A pipeline's exit status is its
      # last stage's, and `tee` exits 0 on input it never read, so a piped run
      # can report success for a suite that failed.
      - name: Magic acceptance suite (verdict comes from the gate step)
        id: magic
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/magic_repro.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/magic.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/magic.log 2>&1 || rc=$?
          cat acceptance/magic.log
          {
            echo "### Magic acceptance suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/magic.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Magic acceptance suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      - name: Brownfield acceptance suite (verdict comes from the gate step)
        id: brownfield
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/brownfield_repro.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/brownfield.json \
            --corpus-cache ~/.cache/kin-brownfield-repro \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/brownfield.log 2>&1 || rc=$?
          cat acceptance/brownfield.log
          {
            echo "### Brownfield acceptance suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/brownfield.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Brownfield acceptance suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      - name: Response budget elision suite (verdict comes from the gate step)
        id: response_budget
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/response_budget_elisions.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/response_budget.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/response_budget.log 2>&1 || rc=$?
          cat acceptance/response_budget.log
          {
            echo "### Response budget elision suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/response_budget.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Response budget elision suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      - name: Trace spine clipping suite (verdict comes from the gate step)
        id: trace_spine
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/trace_spine_clipping_repro.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/trace_spine.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/trace_spine.log 2>&1 || rc=$?
          cat acceptance/trace_spine.log
          {
            echo "### Trace spine clipping suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/trace_spine.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Trace spine clipping suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      - name: Parse-hole acceptance suite (verdict comes from the gate step)
        id: parsehole
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/parse_hole_repro.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/parsehole.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/parsehole.log 2>&1 || rc=$?
          cat acceptance/parsehole.log
          {
            echo "### Parse-hole acceptance suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/parsehole.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Parse-hole acceptance suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      # The end-to-end arm of FIR-1826. The unit arm drives the linker directly
      # in crates/kin-index; this asks the built binary what calls what, in two
      # languages that must bind and one that must not. The negative is what
      # makes the positives mean anything: the rule is a per-language judgement,
      # so a build that bound every language would satisfy both positives.
      - name: Same-owner call suite (verdict comes from the gate step)
        id: sameowner
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/same_owner_call_repro.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/sameowner.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/sameowner.log 2>&1 || rc=$?
          cat acceptance/sameowner.log
          {
            echo "### Same-owner call suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/sameowner.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Same-owner call suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      - name: Memory-pressure refusal suite (verdict comes from the gate step)
        id: memorypressure
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/memory_pressure_refusal.py \
            --kin target/release/kin \
            --daemon target/release/kin-daemon \
            --json acceptance/memory_pressure.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/memory_pressure.log 2>&1 || rc=$?
          cat acceptance/memory_pressure.log
          {
            echo "### Memory-pressure refusal suite (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/memory_pressure.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Memory-pressure refusal suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      # FIR-2653. The two footprint checks need a memory cap to grade against
      # and a runner has none: `/sys/fs/cgroup/memory.max` reads `max` here, so
      # check 10's cgroup arm has nothing to hold a published figure under and
      # check 11's derived budget is gigabytes. A container gives both, and it
      # is the shape the defect was found in: a daemon and twenty-three children
      # published as holding 1.45 GiB inside a container the kernel charged 283
      # MiB, with the daemon then refusing background embedding against its own
      # derived budget. Verified against shipped 0.5.51 bytes in exactly this
      # setup before the fix landed, where both checks FAIL.
      #
      # The image is the runner's own release, so the binaries built above run
      # under the glibc they were linked against. The suite runs from /w, so the
      # report lands in the same acceptance/ directory the gate reads.
      - name: Memory-footprint suite inside a capped container (verdict comes from the gate step)
        id: memoryfootprint
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          docker run --rm --memory=2g --workdir /w \
            -v "$PWD:/w" \
            -e KIN_ACCEPTANCE_LABEL \
            ubuntu:24.04 /bin/bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git python3
              git config --global user.name "Kin CI"
              git config --global user.email "ci@kinlab.ai"
              exec python3 scripts/acceptance/memory_pressure_refusal.py \
                --kin target/release/kin \
                --daemon target/release/kin-daemon \
                --json acceptance/memory_footprint.json \
                --label "$KIN_ACCEPTANCE_LABEL" \
                --only 10 --only 11 --verbose
            ' >acceptance/memory_footprint.log 2>&1 || rc=$?
          cat acceptance/memory_footprint.log
          {
            echo "### Memory-footprint suite, capped container (exit $rc)"
            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/memory_footprint.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Memory-footprint suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      # FIR-2539. This suite drives the in-tree live-heap guard rather than a
      # binary: the figure that carries the class is what proof 1 adds to the
      # peak, and only the counting allocator can see it. Resident set was tried
      # and rejected, because inside a memory-limited container both a fixed and
      # an unfixed build report the ceiling rather than their demand.
      - name: Init-memory acceptance suite (verdict comes from the gate step)
        id: initmemory
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p acceptance
          rc=0
          python3 scripts/acceptance/init_memory_repro.py \
            --json acceptance/initmemory.json \
            --label "$KIN_ACCEPTANCE_LABEL" \
            --verbose >acceptance/initmemory.log 2>&1 || rc=$?
          cat acceptance/initmemory.log
          {
