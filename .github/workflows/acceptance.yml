          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Registry home isolation suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      # No store, no daemon and no corpus: this one packs the npm package, runs
      # the README's own leading install block against a global npm prefix it
      # makes unwritable, and points a real npm at a port nothing listens on so
      # the installer's own network error is what the classifier is graded
      # against.
      - name: First-contact honesty suite (verdict comes from the gate step)
        id: firstcontact
        if: always()
        env:
          KIN_ACCEPTANCE_LABEL: ${{ github.event_name }}-${{ github.sha }}
        run: |
          set -uo pipefail
