            echo ''
            echo '```'
            grep -E '^CHECK ' acceptance/verdict_limits.log || echo '(no CHECK line was printed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Verdict-limits acceptance suite returned nonzero::suite process exit $rc; verdict deferred to the Acceptance verdict step"
          fi

      # Always, including on a cancelled or timed-out run: the reports are how a
      # failure is diagnosed without re-running the job.
      - name: Upload the acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance/
          if-no-files-found: warn
          retention-days: 14

      # THE VERDICT LIVES HERE AND ONLY HERE. Every suite step above captures its
      # own exit code and ends green by design, so all suites run and allowance
      # semantics stay with the gate; a green suite step is not evidence of
      # anything, which is why each one's name says the verdict comes from this
      # step. scripts/acceptance/test_workflow_step_visibility.py enforces the
      # naming so a reader cannot mistake a run step for the answer.
      # The gate is its own step so every suite runs and every available report
      # uploads even when an earlier suite fails. It reads the reports rather
      # than the exit codes.
      # A suite's exit status is one lever with two settings, demand a clean
      # sweep or demand nothing, and neither is right while one check is blocked
      # on something outside the change under review. gate.py fails on any FAIL
      # with no allowance possible, fails on any UNREADABLE that is not named
      # here with a reason, and refuses an allowance that points at a check the
      # report does not carry.
      - name: Acceptance verdict, gated on the suite reports
        if: always()
        run: |
          python3 scripts/acceptance/gate.py \
            --report magic=acceptance/magic.json \
            --report brownfield=acceptance/brownfield.json \
            --report response_budget=acceptance/response_budget.json \
            --report trace_spine=acceptance/trace_spine.json \
            --report parsehole=acceptance/parsehole.json \
            --report sameowner=acceptance/sameowner.json \
            --report memory_pressure=acceptance/memory_pressure.json \
            --report memory_footprint=acceptance/memory_footprint.json \
            --report initmemory=acceptance/initmemory.json \
            --report registry_isolation=acceptance/registry_isolation.json \
            --report first_contact=acceptance/first_contact.json \
            --report eject_journal=acceptance/eject_journal.json \
            --report first_query=acceptance/first_query.json \
            --report verdict_limits=acceptance/verdict_limits.json \
            --allow-unreadable 'brownfield:4=FIR-2593: the express app.handle walk is truncated on ubuntu-latest, and its clipped_steps metadata confirms dropped callee and cross-file rows. This check therefore cannot distinguish an absent required edge from one the walk dropped. Any FAIL or other UNREADABLE still fails the gate, and the moment this check passes the allowance announces itself stale and can go.'
