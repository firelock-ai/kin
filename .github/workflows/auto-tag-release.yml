name: Auto-tag Release

# When a version bump lands on main, cut the matching vX.Y.Z tag automatically.
# The tag push is what starts release.yml (build + GitHub Release + npm publish),
# so a release no longer needs a hand-pushed tag — the bump PR is the whole
# action. The paths filter keeps this off the hot path for non-release pushes;
# it deliberately includes the npm manifest and CHANGELOG so a follow-up commit
# that brings those back in sync re-evaluates and can still cut the tag.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - packages/kin-mcp/package.json
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Tag release on version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # Push the tag with the bot PAT, not the default GITHUB_TOKEN: a tag
          # pushed by GITHUB_TOKEN does NOT start another workflow, so release.yml
          # would never fire. The PAT push does trigger it.
          token: ${{ secrets.KIN_CI_BOT_TOKEN || github.token }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Evaluate release intent
        id: intent
        run: node ./scripts/release-intent.mjs

      - name: Create and push tag
        if: steps.intent.outputs.should_tag == 'true'
        env:
          BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
          TAG: ${{ steps.intent.outputs.tag }}
          VERSION: ${{ steps.intent.outputs.version }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::KIN_CI_BOT_TOKEN is required so the pushed tag re-triggers release.yml."
            echo "::error::The default GITHUB_TOKEN will not start a workflow on a tag it pushes."
            echo "::error::Configure KIN_CI_BOT_TOKEN, or tag manually: git tag $TAG && git push origin $TAG"
            exit 1
          fi
          git config user.name "kin-ci-bot"
          git config user.email "ci@kinlab.ai"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          echo "Pushed $TAG — release.yml will build the binaries and publish the npm wrapper."
