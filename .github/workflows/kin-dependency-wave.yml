name: Kin Dependency Wave

on:
  repository_dispatch:
    types: [kin-registry-release]
  schedule:
    - cron: "17 * * * *"

jobs:
  dependency-wave:
    # This reusable workflow receives a write-capable PR token. Keep both the
    # workflow and its helper checkout pinned to reviewed bytes, and do not add
    # workflow_dispatch (which can select branch-controlled caller code).
    uses: firelock-ai/kin-actions/.github/workflows/cargo-dependency-wave.yml@d06908b534ad5a70bb0f39a1b2b8d6228acf70a4 # v0.1.9
    with:
      manifests: Cargo.toml
      test-command: cargo check -p kin-core -p kin-cli -p kin-daemon -p kin-mcp
      kin-actions-ref: d06908b534ad5a70bb0f39a1b2b8d6228acf70a4
    secrets:
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
