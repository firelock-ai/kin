name: Kin Dependency Wave

on:
  repository_dispatch:
    types: [kin-registry-release]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  dependency-wave:
    uses: firelock-ai/kin-actions/.github/workflows/cargo-dependency-wave.yml@v0.1.5
    with:
      manifests: Cargo.toml
      test-command: cargo check -p kin-core -p kin-cli -p kin-daemon -p kin-mcp
    secrets:
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
