# Copyright 2026 Firelock, LLC
#
# Public install proof: verifies the complete repository workflow on Unix and
# the explicit repository-free refusal contract on native Windows. Anonymous
# only — no checkout, no secrets, no registry auth — exactly what a first-time
# user downloads. Exercises the real `get.kinlab.dev` installer and public
# GitHub-release artifacts with checksum and provenance verification.
name: Install Proof

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact public release tag to install and verify.
        required: true
        type: string
      expected_vfs_commit:
        description: Reviewed kin-vfs commit pinned by the calling release workflow.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional exact release tag; blank verifies the latest public release.
        required: false
        type: string
  release:
    types: [published]
  schedule:
    # Weekly — catch a broken release / installer / endpoint before users do.
    - cron: "0 12 * * 1"

permissions:
  contents: read
  attestations: read

jobs:
  install-proof:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup-shell: bash
          - os: ubuntu-24.04-arm
            setup-shell: bash
          - os: macos-latest
            setup-shell: zsh
          - os: macos-15-intel
            setup-shell: zsh
          - os: windows-latest
            setup-shell: powershell
    steps:
      - name: Public install (Unix)
        if: runner.os != 'Windows'
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          set -eu
          if [ -n "$RELEASE_EVENT_TAG" ]; then
            export KIN_VERSION="${RELEASE_EVENT_TAG#v}"
          fi
          # CI/non-interactive install. NOTE the env var binds to `sh`, not
          # `curl` — `KIN_NO_SETUP=1 curl … | sh` would set it only for curl and
          # the piped script would never see it (it would then try the
          # interactive setup against a non-controlling /dev/tty).
          curl -fsSL https://get.kinlab.dev/install | KIN_NO_SETUP=1 sh
          # install.sh installs to ~/.kin/bin and verifies the per-artifact sha256.
          echo "$HOME/.kin/bin" >> "$GITHUB_PATH"

      - name: Public install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_EVENT_TAG) {
            $env:KIN_VERSION = $env:RELEASE_EVENT_TAG.TrimStart("v")
          }
          $env:KIN_NO_SETUP = "1"
          irm https://get.kinlab.dev/install.ps1 | iex
          "$HOME\.kin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify binaries installed + runnable
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
          REVIEWED_VFS_COMMIT: ${{ inputs.expected_vfs_commit || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kin_version_line="$(kin --version)"
          daemon_version_line="$(kin-daemon --version)"
          printf '%s\n' "$kin_version_line" | tee kin-version.txt
          printf '%s\n' "$daemon_version_line" | tee kin-daemon-version.txt

          expected_tag="$RELEASE_EVENT_TAG"
          if [ -z "$expected_tag" ]; then
            latest_url="$(curl -fsSLI \
              --retry 5 --retry-all-errors --retry-delay 2 \
              -o /dev/null -w '%{url_effective}' \
              https://github.com/firelock-ai/kin/releases/latest)"
            expected_tag="${latest_url##*/}"
            printf '%s\n' "$latest_url" > latest-release-url.txt
          fi
          case "$expected_tag" in
            v[0-9]*) ;;
            *) echo "could not resolve a version tag from '$expected_tag'" >&2; exit 1 ;;
          esac

          tag_refs="$(git ls-remote --tags https://github.com/firelock-ai/kin.git \
            "refs/tags/$expected_tag" "refs/tags/$expected_tag^{}")"
          expected_commit="$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
          if [ -z "$expected_commit" ]; then
            expected_commit="$(printf '%s\n' "$tag_refs" | awk 'NR == 1 {print $1}')"
          fi
          if ! printf '%s\n' "$expected_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve the 40-hex commit for $expected_tag" >&2
            exit 1
          fi

          installed_version="$(printf '%s\n' "$kin_version_line" | awk '{print $2}')"
          installed_daemon_version="$(printf '%s\n' "$daemon_version_line" | awk '{print $2}')"
          expected_version="${expected_tag#v}"
          if [ "$installed_version" != "$expected_version" ]; then
            echo "installed kin $installed_version, expected latest release $expected_version" >&2
            exit 1
          fi
          if [ "$installed_daemon_version" != "$expected_version" ]; then
            echo "installed kin-daemon $installed_daemon_version, expected latest release $expected_version" >&2
            exit 1
          fi
          printf '%s\n' "$expected_version" > expected-version.txt
          printf '%s\n' "$expected_commit" > expected-commit.txt

          # Independently bind the installed binaries' embedded dependency
          # provenance to the Cargo.lock at the public release tag. The
          # binaries report their build-time hash; this fetch computes the
          # expected value from public source rather than trusting that report.
          EXPECTED_COMMIT="$expected_commit" node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");

          (async () => {
            const url = `https://raw.githubusercontent.com/firelock-ai/kin/${process.env.EXPECTED_COMMIT}/Cargo.lock`;
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`failed to fetch release Cargo.lock: ${response.status} ${response.statusText}`);
            }
            const lock = Buffer.from(await response.arrayBuffer());
            const digest = crypto.createHash("sha256").update(lock).digest("hex");
            fs.writeFileSync("expected-lock-sha.txt", `${digest}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) release_asset="kin-linux-x86_64.tar.gz" ;;
            Linux/ARM64) release_asset="kin-linux-aarch64.tar.gz" ;;
            macOS/X64) release_asset="kin-macos-x86_64.tar.gz" ;;
            macOS/ARM64) release_asset="kin-macos-aarch64.tar.gz" ;;
            Windows/X64) release_asset="kin-windows-x86_64.zip" ;;
            *) echo "unsupported install-proof runner $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/firelock-ai/kin/releases/download/$expected_tag/$release_asset" \
            -o "attested-$release_asset"

          # The install itself is anonymous. This separate cryptographic lookup
          # uses the job's read-only GitHub token to query the public attestation
          # API, and pins the signer workflow, source tag, and source commit.
          verified=false
          for attempt in $(seq 1 18); do
            if gh attestation verify "attested-$release_asset" \
              --repo firelock-ai/kin \
              --signer-workflow firelock-ai/kin/.github/workflows/release.yml \
              --signer-digest "$expected_commit" \
              --source-ref "refs/tags/$expected_tag" \
              --source-digest "$expected_commit" \
              --deny-self-hosted-runners \
              --format json > attestation-verification.json; then
              verified=true
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "release attestation did not become verifiable" >&2
              exit 1
            fi
            sleep 10
          done
          test "$verified" = true

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/firelock-ai/kin/releases/download/$expected_tag/release-provenance.json" \
            -o release-provenance.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/firelock-ai/kin/releases/download/$expected_tag/release-provenance.json.sha256" \
            -o release-provenance.json.sha256

          expected_vfs_commit="$REVIEWED_VFS_COMMIT"
          if [ -z "$expected_vfs_commit" ]; then
            expected_vfs_commit="$(node -e \
              'process.stdout.write(JSON.parse(require("fs").readFileSync("release-provenance.json", "utf8")).kin_vfs?.commit || "")')"
          fi
          if ! printf '%s\n' "$expected_vfs_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve the reviewed kin-vfs commit for $expected_tag" >&2
            exit 1
          fi

          RELEASE_ASSET="$release_asset" EXPECTED_TAG="$expected_tag" \
          EXPECTED_COMMIT="$expected_commit" \
          EXPECTED_VFS_COMMIT="$expected_vfs_commit" node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");

          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const sha256 = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const sidecar = fs.readFileSync("release-provenance.json.sha256", "utf8").trim();
          const sidecarMatch = sidecar.match(/^([0-9a-f]{64})\s+\*?release-provenance\.json$/);
          fail(sidecarMatch, "release provenance checksum sidecar is malformed");
          fail(sidecarMatch[1] === sha256("release-provenance.json"),
            "release provenance checksum does not match its public sidecar");

          const manifest = JSON.parse(fs.readFileSync("release-provenance.json", "utf8"));
          fail(manifest.schema_version === 2, "release provenance schema is unsupported");
          fail(manifest.release_tag === process.env.EXPECTED_TAG,
            "release provenance tag does not match the installed release");
          fail(manifest.kin?.commit === process.env.EXPECTED_COMMIT,
            "release provenance Kin commit does not match the installed release tag");
          fail(manifest.kin_vfs?.commit === process.env.EXPECTED_VFS_COMMIT,
            "release provenance does not bind the reviewed kin-vfs commit");
          fail(manifest.kin_vfs?.dirty === false,
            "release provenance does not certify a clean kin-vfs checkout");
          const platform = manifest.artifacts?.find(
            (artifact) => artifact.archive?.name === process.env.RELEASE_ASSET
          );
          fail(platform, `release provenance omits ${process.env.RELEASE_ASSET}`);
          fail(platform.release_tag === process.env.EXPECTED_TAG,
            "platform provenance tag does not match the installed release");
          fail(platform.kin?.commit === process.env.EXPECTED_COMMIT,
            "platform provenance Kin commit does not match the installed release");
          fail(platform.kin_vfs?.commit === process.env.EXPECTED_VFS_COMMIT,
            "platform provenance does not bind the reviewed kin-vfs commit");
          fail(platform.archive?.sha256 === sha256(`attested-${process.env.RELEASE_ASSET}`),
            "attested archive bytes do not match aggregate release provenance");
          NODE

          aggregate_verified=false
          for attempt in $(seq 1 18); do
            if gh attestation verify release-provenance.json \
              --repo firelock-ai/kin \
              --signer-workflow firelock-ai/kin/.github/workflows/release.yml \
              --signer-digest "$expected_commit" \
              --source-ref "refs/tags/$expected_tag" \
              --source-digest "$expected_commit" \
              --deny-self-hosted-runners \
              --format json > release-provenance-attestation.json; then
              aggregate_verified=true
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "aggregate release provenance attestation did not become verifiable" >&2
              exit 1
            fi
            sleep 10
          done
          test "$aggregate_verified" = true

          content_root=""
          shim_name=""
          if [ "$RUNNER_OS" != "Windows" ]; then
            extract_root="$RUNNER_TEMP/attested-release"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "attested-$release_asset" -C "$extract_root"
            artifact_name="${release_asset%.tar.gz}"
            content_root="$extract_root/$artifact_name"
            test -d "$content_root"
            case "$RUNNER_OS" in
              Linux) shim_name="libkin_vfs_shim.so" ;;
              macOS) shim_name="libkin_vfs_shim.dylib" ;;
              *) echo "unsupported Unix runner $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi

          RUN_COMPONENT_COMPARE="$([ "$RUNNER_OS" != "Windows" ] && printf true || printf false)" \
          RELEASE_ASSET="$release_asset" EXPECTED_TAG="$expected_tag" \
          EXPECTED_COMMIT="$expected_commit" CONTENT_ROOT="$content_root" \
          EXPECTED_VFS_COMMIT="$expected_vfs_commit" \
          INSTALLED_VFS="$HOME/.kin/bin/kin-vfs" \
          INSTALLED_SHIM="$HOME/.kin/lib/$shim_name" \
          SHIM_NAME="$shim_name" node <<'NODE'
          if (process.env.RUN_COMPONENT_COMPARE !== "true") process.exit(0);
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const sha256Bytes = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const manifest = JSON.parse(fs.readFileSync("release-provenance.json", "utf8"));
          const platform = manifest.artifacts.find(
            (artifact) => artifact.archive?.name === process.env.RELEASE_ASSET
          );
          const records = new Map(platform.archive_contents.map((entry) => [entry.name, entry]));
          const components = [
            { name: "kin-vfs", installed: process.env.INSTALLED_VFS },
            { name: process.env.SHIM_NAME, installed: process.env.INSTALLED_SHIM },
          ].map((component) => {
            const archived = path.join(process.env.CONTENT_ROOT, component.name);
            const installedBytes = fs.readFileSync(component.installed);
            const archivedBytes = fs.readFileSync(archived);
            fail(installedBytes.equals(archivedBytes),
              `installed ${component.name} differs from the attested public archive`);
            const digest = sha256Bytes(installedBytes);
            fail(records.get(component.name)?.sha256 === digest,
              `installed ${component.name} hash differs from aggregate release provenance`);
            return {
              name: component.name,
              installed_path: component.installed,
              sha256: digest,
            };
          });
          fs.writeFileSync("installed-vfs-provenance.json", `${JSON.stringify({
            schema_version: 1,
            release_tag: process.env.EXPECTED_TAG,
            kin_commit: process.env.EXPECTED_COMMIT,
            kin_vfs_commit: process.env.EXPECTED_VFS_COMMIT,
            archive: process.env.RELEASE_ASSET,
            components,
          }, null, 2)}\n`);
          NODE

      # WINDOWS COVERAGE REDUCTION, stated here so that no later reader mistakes
      # this leg for the one it replaces.
      #
      # Until 2026-07-20 the Windows leg proved the same first-run surface the
      # Unix legs still prove: a repository admitted by `kin init`, a daemon
      # serving it, a graph query, an MCP tool call, and a validated capability
      # report. Run 29749887140, against the promoted v0.3.6 release, is the
      # last run in which all of that passed on windows-latest.
      #
      # It cannot pass now. `kin init` refuses every admission boundary on
      # Windows, because the graph store flushes a directory the way Unix does,
      # by reopening it and syncing, and Windows refuses that open. The refusal
      # is not an accident: scripts/assert-windows-init-contract.sh asserts it
      # by name on every pull request as the contract this product ships. A
      # release gate demanding success while a required check demands refusal
      # cannot go green on either answer, which is why this leg had no passing
      # outcome available to it at all.
      #
      # So the two steps below assert the contract the product ships, in the
      # contract's own words, and the three repository-dependent steps after
      # them became Unix-only. Windows still proves the installer, both
      # binaries' version, the CLI's own build provenance, every admission
      # refusal, and the whole repo-free setup surface. It no longer proves a
      # repository, a running daemon, a graph query, an MCP tool call, or the
      # daemon's build provenance, which reaches `kin status` from a running
      # daemon and so needs a repository. That is a real loss of release
      # coverage on one platform, taken deliberately and meant to be temporary.
      #
      # This step is also the tripwire that ends the reduction. When the Windows
      # transaction-layer port lands and admission succeeds again,
      # `require_refused` fails with "unexpectedly succeeded", and whoever reads
      # that failure should delete these two steps, drop the three
      # `runner.os != 'Windows'` guards below, and flip the contract script back
      # to asserting a successful admission.
      - name: Windows admission contract proof
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The shipped Windows admission contract, in the exact words
          # scripts/assert-windows-init-contract.sh pins on every pull request.
          # This runner is anonymous and has no checkout, so the strings are
          # retyped; scripts/test-release-workflow-authority.py requires them to
          # equal that script's own variables, so wording drifting in either
          # file fails a required check instead of quietly passing here.
          CONFIG_REFUSAL="cannot publish repository config"
          SOURCE_PROOF_STAGE="prove mutable Git workspace"
          DURABLE_FLUSH_GAP="for durable metadata flush"
          NON_EMPTY_REFUSAL="requires an empty directory"

          scratch="kin-windows-admission"
          mkdir -p "$scratch"

          # Every assertion reports and the step exits once at the end. One
          # Windows round is expensive, so stopping at the first failure would
          # cost a second round to learn what the second boundary did.
          failures=0
          fail() {
            failures=$((failures + 1))
            echo "::error::$1"
            echo "--- captured kin init output: $2 ---"
            cat "$2" || true
            echo "--- end $2 ---"
          }
          # `grep -c` exits 1 on zero matches, which `set -e` would otherwise
          # treat as a fatal error rather than as the answer.
          occurrences() {
            grep -Fc -- "$1" "$2" || true
          }
          require_text() {
            if [ "$(occurrences "$2" "$3")" -eq 0 ]; then
              fail "$1 did not report: $2" "$3"
            fi
          }
          refute_text() {
            if [ "$(occurrences "$2" "$3")" -ne 0 ]; then
              fail "$1 stopped at a gate this platform no longer has: $2" "$3"
            fi
          }
          # Deliberately not `find`: on a Windows runner that name also belongs
          # to System32\find.exe, whose arguments mean something else entirely,
          # and a PATH order resolving to it would report zero for every input
          # rather than fail. An unmatched glob stays literal here because
          # nullglob is off, and the `-e` test rejects it.
          count_matching() {
            local matches=0
            local entry
            for entry in "$1"/$2; do
              if [ -e "$entry" ]; then
                matches=$((matches + 1))
              fi
            done
            echo "$matches"
          }
          require_refused() {
            if (cd "$2" && kin init) > "$3" 2>&1; then
              fail "$1 unexpectedly succeeded" "$3"
            fi
            # A refusal publishes nothing. Both boundaries stage into a
            # `.kin.init-<uuid>` and only move it into place at the end, so a
            # `.kin` of any shape means a refusal published authority anyway,
            # and a surviving stage means it did not clean up after itself.
            if [ -e "$2/.kin" ]; then
              fail "$1 left a half-created repository at $2/.kin" "$3"
            fi
            # WINDOWS CLEANUP GAP, asserted rather than assumed.
            #
            # The stage is a sibling of the admitted directory, not a child of
            # it: crates/kin-core/src/git_init.rs derives it from the source's
            # parent and crates/kin-core/src/init.rs from the working
            # directory's, so a count taken inside the admitted directory can
            # never see one and would report zero on every input. Each boundary
            # therefore owns a private parent holding nothing but the directory
            # under test, which keeps a survivor attributable to the boundary
            # that left it.
            #
            # Counted where they actually appear, the two boundaries that reach
            # the graph store DO leave their unpublished stage and its `.owner`
            # marker behind, which is two entries each. This is post-refusal
            # residue measured before any reaper could run: each boundary owns a
            # freshly created parent and sees one `kin init`, and
            # recover_orphaned_repository_stages runs against that parent before
            # the stage exists, so it finds nothing to reap on any platform.
            # What moves the count is refusal-time cleanup, or the
            # transaction-layer port fixing cleanup_owned_staging_root on the
            # failing path, where removal is best-effort against the same open
            # handles that refuse the admission. Proving the off-unix reaper arm
            # instead needs a second init against a parent already holding
            # residue, which is a different fixture from this one. That is a
            # real defect and it was invisible for as long as the count looked
            # in the wrong place. It is asserted by exact count in both
            # directions, so whatever finally drives it to zero trips this and
            # has to come here and say so, exactly as a restored admission trips
            # `require_refused` above.
            local parent
            parent="$(dirname "$2")"
            local staged
            staged="$(count_matching "$parent" '.kin.init-*')"
            if [ "$staged" != "$4" ]; then
              fail "$1 left $staged stage entries in $parent, expected $4" "$3"
            fi
          }

          git_boundary="$scratch/exact-git/repo"
          git_log="$scratch/kin-init-exact-git.txt"
          mkdir -p "$git_boundary"
          (
            cd "$git_boundary"
            git init -q
            git config user.email ci@firelock.ai
            git config user.name ci
            printf 'fn probe() {}\n' > probe.rs
            git add probe.rs
            # Hooks and signing are neutralized for this one invocation and NOT
            # written into the fixture's config. A recorded `core.hooksPath` is
            # itself a local compatibility blocker that admission refuses on
            # before it reaches the boundary under test.
            git -c core.hooksPath= -c commit.gpgsign=false commit -qm probe
          )
          require_refused "Windows exact-Git admission" "$git_boundary" "$git_log" 2
          refute_text "Windows exact-Git admission" "$SOURCE_PROOF_STAGE" "$git_log"
          refute_text "Windows exact-Git admission" "$CONFIG_REFUSAL" "$git_log"
          require_text "Windows exact-Git admission" "$DURABLE_FLUSH_GAP" "$git_log"

          native_boundary="$scratch/native-unborn/repo"
          native_log="$scratch/kin-init-native-unborn.txt"
          mkdir -p "$native_boundary"
          require_refused "Windows native-unborn bootstrap" "$native_boundary" "$native_log" 2
          refute_text "Windows native-unborn bootstrap" "$CONFIG_REFUSAL" "$native_log"
          require_text "Windows native-unborn bootstrap" "$DURABLE_FLUSH_GAP" "$native_log"

          # A capability Windows now has must not become permission to derive
          # authority from whatever happens to be lying in the directory.
          populated_boundary="$scratch/native-populated/repo"
          populated_log="$scratch/kin-init-native-populated.txt"
          mkdir -p "$populated_boundary"
          printf 'untracked\n' > "$populated_boundary/stray.txt"
          require_refused "Windows non-empty native boundary" "$populated_boundary" "$populated_log" 0
          require_text "Windows non-empty native boundary" "$NON_EMPTY_REFUSAL" "$populated_log"

          if [ "$failures" -ne 0 ]; then
            echo "::error::the installed Windows release did not refuse admission as the shipped contract asserts ($failures check(s) failed)"
            exit 1
          fi
          echo "Installed Windows release refused every admission boundary at the cause it names, published no authority, and left exactly the unreaped stage residue this platform is known to leave."

      # What Windows still proves without a repository. This is the whole
      # remaining first-run surface on the platform: the CLI's own build
      # provenance bound to the release tag's public source, the platform
      # capability posture, and the setup writers for the shell hook, the
      # install ledger, and every agent-client MCP config a repo-free install
      # can write, which is four of the five. `kin bench-meta` reports the CLI
      # build alone, so the daemon's build provenance is not bound here. Codex
      # is excluded by the product rather than by this proof, because its entry
      # binds an exact repository, and that exclusion is asserted below.
      - name: Windows repo-free provenance and setup proof
        if: runner.os == 'Windows'
        shell: bash
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          kin bench-meta --json > kin-windows-bench-meta.json
          cat kin-windows-bench-meta.json
          kin registry authority --json > kin-windows-registry-authority.json
          cat kin-windows-registry-authority.json
          # Negative control. An unsupported capability must refuse to be
          # repaired rather than report a success it cannot deliver, so this
          # command failing is the assertion.
          if kin registry authority --fix > kin-windows-registry-fix.txt 2>&1; then
            cat kin-windows-registry-fix.txt >&2
            echo "installed Windows kin reported registry authority --fix succeeded on a platform that does not support it" >&2
            exit 1
          fi
          cat kin-windows-registry-fix.txt

          # Prove every supported agent-client config writer without requiring
          # the proprietary clients on a public runner. Detection is PATH-based;
          # which-rs follows PATHEXT on Windows, so these inert shims are real
          # .exe copies rather than shell scripts.
          fake_agent_bin="$RUNNER_TEMP/kin-proof-agent-bin"
          mkdir -p "$fake_agent_bin"
          for agent in claude cursor codex gemini windsurf; do
            cp "$(command -v kin)" "$fake_agent_bin/$agent.exe"
          done
          export PATH="$fake_agent_bin:$PATH"

          kin setup --no-interactive --intent agent --shell "$PROOF_SHELL" \
            2>&1 | tee kin-windows-setup.txt
          kin setup status --json | tee kin-windows-health.json
          kin doctor --json | tee kin-windows-doctor.json

          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");

          const expectedCommit = fs.readFileSync("expected-commit.txt", "utf8").trim();
          const expectedLock = fs.readFileSync("expected-lock-sha.txt", "utf8").trim();
          const meta = JSON.parse(fs.readFileSync("kin-windows-bench-meta.json", "utf8"));
          if (meta.kin_commit !== expectedCommit) {
            throw new Error(`installed Windows build SHA ${meta.kin_commit ?? "missing"} does not match release tag ${expectedCommit}`);
          }
          if (meta.kin_dirty !== false) {
            throw new Error("installed Windows release binary is dirty or did not report a clean build");
          }
          if (meta.kin_source_known !== true) {
            throw new Error("installed Windows release binary did not prove source_known=true");
          }
          if (meta.dependency_provenance !== expectedLock) {
            throw new Error(`installed Windows Cargo.lock provenance ${meta.dependency_provenance ?? "missing"} does not match release source ${expectedLock}`);
          }
          if (
            meta.embeddings?.vector_enabled !== false ||
            meta.embeddings?.embeddings_enabled !== false ||
            meta.embeddings?.metal_enabled !== false
          ) {
            throw new Error("installed Windows CLI does not prove the vector-free feature contract");
          }

          const authority = JSON.parse(fs.readFileSync("kin-windows-registry-authority.json", "utf8"));
          if (authority.checks?.length !== 1 || authority.checks[0]?.state !== "unsupported") {
            throw new Error(`Windows registry authority must report exactly one unsupported capability check: ${JSON.stringify(authority.checks ?? null)}`);
          }

          const nonHealthyChecks = (report) => (report.checks ?? [])
            .filter((check) => check.status !== "healthy")
            .map((check) => `${check.id}=${check.status}`)
            .join(", ") || "none";
          // The repo-free Windows posture, pinned by name. `repo_init` is
          // missing because there is no repository here, and `daemon_running`
          // is unsupported because the daemon is repo-scoped. Both are the
          // product's own documented no-repository answers, so both are
          // required rather than tolerated: a change that turns either into
          // something else has to come here and say so.
          const required = new Map([
            ["kin_binary", "healthy"],
            ["kin_daemon_binary", "healthy"],
            ["shell_path", "healthy"],
            ["setup_ledger", "healthy"],
            ["registry_authority", "unsupported"],
            ["vfs_projection", "unsupported"],
            ["semantic_query_readiness", "unsupported"],
            ["daemon_running", "unsupported"],
            ["repo_init", "missing"],
            ["mcp_client_claude", "healthy"],
            ["mcp_client_cursor", "healthy"],
            ["mcp_client_gemini", "healthy"],
            ["mcp_client_windsurf", "healthy"],
          ]);

          for (const reportPath of ["kin-windows-health.json", "kin-windows-doctor.json"]) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const checks = new Map(report.checks.map((check) => [check.id, check]));
            // Missing `repo_init` is the one degradation this repo-free posture
            // expects, and it flips the aggregate report.healthy to false on its
            // own. Accept that single named reason and keep every other
            // degradation fatal, so a real regression in any other check still
            // fails this leg.
            const onlyMissingRepositoryBlocks = report.checks.every(
              (check) =>
                check.id === "repo_init" ||
                check.status === "healthy" ||
                check.status === "unsupported"
            );
            if (!onlyMissingRepositoryBlocks) {
              throw new Error(
                `${reportPath}: overall healthy=${report.healthy}; non-healthy checks: ${nonHealthyChecks(report)}`
              );
            }
            for (const [id, expected] of required) {
              const actual = checks.get(id)?.status;
              if (actual !== expected) {
                throw new Error(`${reportPath}: ${id} is ${actual ?? "missing"}, expected ${expected}`);
              }
            }
            const hardFailures = report.checks.filter((check) =>
              check.id !== "repo_init" &&
              (check.status === "missing" || check.status === "misconfigured")
            );
            if (hardFailures.length > 0) {
              throw new Error(`${reportPath}: hard failures: ${hardFailures.map((c) => c.id).join(", ")}`);
            }
            // Codex is the one agent client Kin cannot configure without a
            // repository. Its entry binds `mcp start --repo <exact
            // repository>`, so setup refuses it by design here and never
            // writes the config, which drops the check from the report
            // entirely. Asserted as an absence rather than left unmentioned,
            // so a Codex writer that ever becomes repo-free trips this and
            // has to come here and say so.
            if (checks.has("mcp_client_codex")) {
              throw new Error(
                `${reportPath}: mcp_client_codex is present without a repository, so the repo-free Codex writer changed`
              );
            }
          }

          const home = os.homedir();
          const jsonConfigs = [
            path.join(home, ".claude.json"),
            path.join(home, ".cursor", "mcp.json"),
            path.join(home, ".gemini", "settings.json"),
            path.join(home, ".codeium", "windsurf", "mcp_config.json"),
          ];
          for (const configPath of jsonConfigs) {
            const entry = JSON.parse(fs.readFileSync(configPath, "utf8"))?.mcpServers?.kin;
            if (!entry || JSON.stringify(entry.args) !== JSON.stringify(["mcp", "start"]) || entry.env?.KIN_MCP_TOOL_PROFILE !== "agent-default") {
              throw new Error(`${configPath}: Kin MCP entry is missing or malformed`);
            }
          }
          NODE

      - name: First-run repository, daemon, and setup proof
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          case "$PROOF_SHELL" in
            bash)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/bash
              printf 'SHELL=%s\n' "$SHELL" >> "$GITHUB_ENV"
              ;;
            zsh)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/zsh
              printf 'SHELL=%s\n' "$SHELL" >> "$GITHUB_ENV"
              ;;
            powershell)
              # Windows has no Unix embedding follow-up and setup receives the
              # explicit PowerShell choice below.
              ;;
            *) echo "unsupported install-proof setup shell: $PROOF_SHELL" >&2; exit 1 ;;
          esac

          # A fresh repo so the daemon has something to initialize against —
          # proves the installed daemon actually starts and serves on this OS.
          mkdir -p kin-install-proof && cd kin-install-proof
          git init -q && git config user.email ci@firelock.ai && git config user.name ci
          printf 'def hello():\n    return 42\n' > probe.py
          git add -A && git commit -qm "probe"
          # kin init admits this worktree exactly and repeats that proof across
          # publication, so a report file must neither exist in it nor grow
          # while init runs. Capture outside the admitted tree and copy the log
          # back afterwards, on success and on failure alike, so a refusal still
          # reaches the uploaded proof reports.
          init_log="$RUNNER_TEMP/kin-init.txt"
          init_status=0
          kin init > "$init_log" 2>&1 || init_status=$?
          cat "$init_log"
          cp "$init_log" kin-init.txt
          if [ "$init_status" -ne 0 ]; then exit "$init_status"; fi
          # Do not pipe this command through tee. On Windows, the daemon child
          # inherits the pipe and keeps it open until idle shutdown, which makes
          # the shell wait for the daemon and then tests a process that just exited.
          kin status > kin-status.txt 2>&1
          cat kin-status.txt
          kin status --json > kin-status.json 2>&1
          cat kin-status.json
          kin bench-meta --json > kin-build-meta.json
          cat kin-build-meta.json
          daemon_port="$(tr -d '[:space:]' < .kin/daemon.port)"
          case "$daemon_port" in
            ''|*[!0-9]*)
              echo "installed daemon published an invalid port: $daemon_port" >&2
              exit 1
              ;;
          esac
          DAEMON_PORT="$daemon_port" node <<'NODE' > kin-daemon-health.json
          const http = require("http");
          const request = http.get(
            `http://127.0.0.1:${process.env.DAEMON_PORT}/health`,
            (response) => {
              const chunks = [];
              response.on("data", (chunk) => chunks.push(chunk));
              response.on("end", () => {
                const body = Buffer.concat(chunks);
                if (response.statusCode !== 200) {
                  console.error(`daemon health returned HTTP ${response.statusCode}: ${body}`);
                  process.exitCode = 1;
                  return;
                }
                process.stdout.write(body);
              });
            }
          );
          request.setTimeout(30000, () => {
            request.destroy(new Error("daemon health request exceeded 30 seconds"));
          });
          request.on("error", (error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
          cat kin-daemon-health.json
          # Prove every supported agent-client config writer without requiring
          # the proprietary clients on a public runner. Detection is PATH-based;
          # these inert shims make setup exercise the real merge paths while the
          # MCP process itself is exercised separately below.
          fake_agent_bin="$RUNNER_TEMP/kin-proof-agent-bin"
          mkdir -p "$fake_agent_bin"
          for agent in claude cursor codex gemini windsurf; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              # which-rs follows PATHEXT on Windows, so use a real .exe rather
              # than relying on shell-script executability through MSYS.
              cp "$(command -v kin)" "$fake_agent_bin/$agent.exe"
            else
              printf '#!/bin/sh\nexit 0\n' > "$fake_agent_bin/$agent"
              chmod +x "$fake_agent_bin/$agent"
            fi
          done
          export PATH="$fake_agent_bin:$PATH"

          kin setup --no-interactive --intent agent --shell "$PROOF_SHELL" \
            2>&1 | tee kin-setup.txt
          kin setup status --json | tee kin-health.json
          kin doctor --json | tee kin-doctor.json

      - name: Graph query and MCP tool-call proof
        if: runner.os != 'Windows'
        shell: bash
        working-directory: kin-install-proof
        run: |
          set -euo pipefail
          kin search hello --json | tee kin-search.json
          kin locate hello --json --explain --max-files 5 | tee kin-locate.json

          # Drive the installed MCP stdio server through initialize, tools/list,
          # and a real graph-backed semantic_search call. Node owns the timeout
          # so this behaves the same on Linux, macOS, and Windows.
          node <<'NODE'
          const fs = require("fs");
          const { spawn } = require("child_process");

          const requests = [
            { jsonrpc: "2.0", id: 1, method: "initialize", params: {} },
            { jsonrpc: "2.0", method: "notifications/initialized", params: {} },
            { jsonrpc: "2.0", id: 2, method: "tools/list", params: {} },
            {
              jsonrpc: "2.0",
              id: 3,
              method: "tools/call",
              params: {
                name: "semantic_search",
                arguments: { query: "hello", compact: true, limit: 5 },
              },
            },
          ];

          const child = spawn("kin", ["mcp", "start", "--repo", "."], {
            cwd: process.cwd(),
            env: process.env,
            stdio: ["pipe", "pipe", "pipe"],
          });
          let stdout = "";
          let stderr = "";
          let settled = false;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            fs.writeFileSync("kin-mcp-out.jsonl", stdout);
            fs.writeFileSync("kin-mcp-err.txt", stderr);
            if (error) {
              console.error(error);
              console.error(stderr);
              process.exit(1);
            }
          };
          const timer = setTimeout(() => {
            child.kill("SIGKILL");
            finish(new Error("installed MCP server did not exit within 60 seconds"));
          }, 60_000);
          child.stdout.on("data", (chunk) => { stdout += chunk; });
          child.stderr.on("data", (chunk) => { stderr += chunk; });
          child.on("error", finish);
          child.on("close", (code) => {
            if (code !== 0) {
              finish(new Error(`installed MCP server exited ${code}`));
              return;
            }
            try {
              const messages = stdout
                .split(/\r?\n/)
                .filter((line) => line.trim().startsWith("{"))
                .map((line) => JSON.parse(line));
              const byId = new Map(messages.filter((message) => message.id != null).map((message) => [message.id, message]));
              if (!byId.get(1)?.result) throw new Error("MCP initialize response missing");
              if (!JSON.stringify(byId.get(2)?.result ?? {}).includes("semantic_search")) {
                throw new Error("MCP tools/list omitted semantic_search");
              }
              const call = byId.get(3);
              if (!call?.result || call.error || call.result.isError === true) {
                throw new Error(`MCP semantic_search failed: ${JSON.stringify(call ?? null)}`);
              }
              if (!JSON.stringify(call.result).includes("hello") || !JSON.stringify(call.result).includes("probe.py")) {
                throw new Error("MCP semantic_search did not return the seeded hello entity");
              }
              finish();
            } catch (error) {
              finish(error);
            }
          });
          child.stdin.end(`${requests.map((request) => JSON.stringify(request)).join("\n")}\n`);
          NODE

      - name: Graph-backed VFS projection proof
        if: runner.os != 'Windows'
        shell: bash
        working-directory: kin-install-proof
        run: |
          set -euo pipefail
          # The shipped shim deliberately bypasses Kin-family control-plane
          # processes (basenames beginning with `kin-`). Keep this external
          # probe outside that namespace so the proof exercises interposition.
          probe_bin="$RUNNER_TEMP/vfs-open-probe"
          cc -O2 -Wall -Wextra -Werror -x c -o "$probe_bin" - <<'C'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <sys/stat.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              if (argc != 2) {
                  fputs("usage: vfs-open-probe <path>\n", stderr);
                  return 2;
              }

              struct stat stdout_stat;
              if (fstat(STDOUT_FILENO, &stdout_stat) != 0) {
                  perror("fstat(stdout)");
                  return 3;
              }

              int fd = open(argv[1], O_RDONLY);
              if (fd < 0) {
                  perror("open");
                  return 4;
              }

              char buffer[4096];
              for (;;) {
                  ssize_t count = read(fd, buffer, sizeof(buffer));
                  if (count == 0) {
                      break;
                  }
                  if (count < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      perror("read");
                      close(fd);
                      return 5;
                  }
                  for (ssize_t written = 0; written < count;) {
                      ssize_t step = write(STDOUT_FILENO, buffer + written, (size_t)(count - written));
                      if (step < 0 && errno == EINTR) {
                          continue;
                      }
                      if (step <= 0) {
                          perror("write");
                          close(fd);
                          return 6;
                      }
                      written += step;
                  }
              }

              if (close(fd) != 0) {
                  perror("close");
                  return 7;
              }
              return 0;
          }
          C

          vfs_pid=""
          cleanup_vfs() {
            cleanup_status=0
            chmod u+rw probe.py || cleanup_status=1
            if [ -n "$vfs_pid" ]; then
              kin-vfs stop --workspace . >> kin-vfs-daemon.log 2>&1 || cleanup_status=1
              stopped=false
              for _ in $(seq 1 150); do
                # A missing PID is the expected successful-stop state. Keep
                # that `ps` miss from tripping `set -euo pipefail`.
                process_state="$(ps -o stat= -p "$vfs_pid" 2>/dev/null || true)"
                process_state="$(printf '%s' "$process_state" | tr -d '[:space:]')"
                if [ -z "$process_state" ] || printf '%s\n' "$process_state" | grep -q 'Z'; then
                  stopped=true
                  break
                fi
                sleep 0.1
              done
              if [ "$stopped" != true ]; then
                cat kin-vfs-daemon.log >&2
                echo "installed kin-vfs daemon did not stop cleanly" >&2
                kill "$vfs_pid" 2>/dev/null || true
                sleep 1
                kill -9 "$vfs_pid" 2>/dev/null || true
                wait "$vfs_pid" 2>/dev/null || true
                cleanup_status=1
              else
                wait_status=0
                wait "$vfs_pid" || wait_status=$?
                case "$wait_status" in
                  0|143) ;;
                  *)
                    echo "installed kin-vfs daemon exited with unexpected status $wait_status" >&2
                    cleanup_status=1
                    ;;
                esac
              fi
              vfs_pid=""
            fi
            if [ -S .kin/vfs.sock ]; then
              echo "installed kin-vfs socket remained after shutdown" >&2
              cleanup_status=1
            fi
            test -r probe.py || cleanup_status=1
            return "$cleanup_status"
          }
          on_vfs_signal() {
            signal_status="$1"
            trap - EXIT INT TERM
            cleanup_vfs || true
            exit "$signal_status"
          }
          trap 'cleanup_vfs || true' EXIT
          trap 'on_vfs_signal 130' INT
          trap 'on_vfs_signal 143' TERM

          kin-vfs start --workspace . > kin-vfs-daemon.log 2>&1 &
          vfs_pid=$!
          socket_ready=false
          for _ in $(seq 1 150); do
            if [ -S .kin/vfs.sock ]; then
              socket_ready=true
              break
            fi
            if ! kill -0 "$vfs_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$socket_ready" != true ]; then
            cat kin-vfs-daemon.log >&2
            echo "installed kin-vfs daemon did not bind its socket" >&2
            exit 1
          fi

          # The direct read is the negative control. With raw disk unreadable,
          # only the installed shim and real Kin daemon can return probe.py.
          chmod 000 probe.py
          set +e
          "$probe_bin" "$PWD/probe.py" > vfs-negative.txt 2>&1
          negative_status=$?
          set -e
          if [ "$negative_status" -ne 4 ]; then
            cat vfs-negative.txt >&2
            echo "negative control failed before the expected raw-disk open denial (status $negative_status)" >&2
            exit 1
          fi
          if ! grep -Eq '^open: (Permission denied|Operation not permitted)$' vfs-negative.txt; then
            cat vfs-negative.txt >&2
            echo "negative control did not fail with the expected raw-disk permission error" >&2
            exit 1
          fi

          KIN_VFS_STRICT=1 kin-vfs exec --workspace . -- \
            "$probe_bin" "$PWD/probe.py" \
            > vfs-graph-read.txt 2> vfs-graph-read.stderr.txt
          printf 'def hello():\n    return 42\n' > vfs-expected.txt
          if ! cmp -s vfs-expected.txt vfs-graph-read.txt; then
            cmp -l vfs-expected.txt vfs-graph-read.txt >&2 || true
            echo "installed VFS did not return the exact graph-owned probe.py bytes" >&2
            exit 1
          fi

          # Prevent a cleanup failure from re-entering cleanup through EXIT;
          # keep the signal handlers until normal cleanup has completed.
          trap - EXIT
          cleanup_vfs
          trap - INT TERM

      - name: Unix embedding and semantic retrieval proof
        if: runner.os != 'Windows'
        shell: bash
        working-directory: kin-install-proof
        env:
          PROOF_SHELL: ${{ matrix.setup-shell }}
        run: |
          set -euo pipefail
          # Every Actions step receives a fresh process environment. Reassert
          # the shell under test here and remove ambient PowerShell markers
          # before setup health re-detects the installed hook.
          case "$PROOF_SHELL" in
            bash)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/bash
              ;;
            zsh)
              unset PSModulePath PSVersionTable
              export SHELL=/bin/zsh
              ;;
            *) echo "unsupported Unix install-proof shell: $PROOF_SHELL" >&2; exit 1 ;;
          esac
          kin embed --max-seconds 300 --json | tee kin-embed.json
          kin status --json | tee kin-embedded-status.json
          kin setup status --json | tee kin-embedded-health.json
          kin doctor --json | tee kin-embedded-doctor.json
          kin search hello --semantic --json | tee kin-semantic-search.json
          kin locate hello --json --explain --max-files 5 | tee kin-semantic-locate.json

      - name: Validate installed capability proof
        if: runner.os != 'Windows'
        shell: bash
        working-directory: kin-install-proof
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const runnerOs = process.env.RUNNER_OS;
          const expectedCommit = fs.readFileSync("../expected-commit.txt", "utf8").trim();
          const expectedLock = fs.readFileSync("../expected-lock-sha.txt", "utf8").trim();
          const status = JSON.parse(fs.readFileSync("kin-status.json", "utf8"));
          const cliMeta = JSON.parse(fs.readFileSync("kin-build-meta.json", "utf8"));
          const daemonHealth = JSON.parse(fs.readFileSync("kin-daemon-health.json", "utf8"));
          const fullSha = /^[0-9a-f]{40}$/;
          const lockSha = /^[0-9a-f]{64}$/;
          if (cliMeta.schema !== "kin.bench-meta.v2") {
            throw new Error(`kin-build-meta.json: unsupported schema ${cliMeta.schema ?? "missing"}`);
          }
          const builds = new Map([
            ["cli", {
              sha: cliMeta.kin_commit,
              dirty: cliMeta.kin_dirty,
              sourceKnown: cliMeta.kin_source_known,
              dependencyProvenance: cliMeta.dependency_provenance,
            }],
            ["daemon", {
              sha: daemonHealth.build?.sha,
              dirty: daemonHealth.build?.dirty,
              sourceKnown: daemonHealth.build?.source_known,
              dependencyProvenance: daemonHealth.build?.dependency_provenance,
            }],
          ]);
          for (const [side, build] of builds) {
            if (!fullSha.test(build.sha ?? "")) {
              throw new Error(`${side} build SHA is not a full 40-hex commit: ${build.sha ?? "missing"}`);
            }
            if (build.sha !== expectedCommit) {
              throw new Error(`${side} build SHA ${build.sha} does not match release tag ${expectedCommit}`);
            }
            if (build.dirty !== false) {
              throw new Error(`${side} release binary is dirty or did not report a clean build`);
            }
            if (build.sourceKnown !== true) {
              throw new Error(`${side} release binary did not prove source_known=true`);
            }
            if (!lockSha.test(build.dependencyProvenance ?? "")) {
              throw new Error(`${side} Cargo.lock provenance is missing or malformed`);
            }
            if (build.dependencyProvenance !== expectedLock) {
              throw new Error(`${side} Cargo.lock provenance ${build.dependencyProvenance} does not match release source ${expectedLock}`);
            }
          }
          if (builds.get("cli").dependencyProvenance !== builds.get("daemon").dependencyProvenance) {
            throw new Error("CLI and daemon were built from different Cargo.lock provenance");
          }

          if (status.schema !== "kin.status.v3") {
            throw new Error(`kin-status.json: unsupported schema ${status.schema ?? "missing"}`);
          }
          const validateEmbeddingCoverage = (coverage, label) => {
            if (!coverage || typeof coverage !== "object" || Array.isArray(coverage)) {
              throw new Error(`${label}: embedding_coverage is missing or malformed`);
            }
            if (coverage.state === "observed") {
              if (coverage.source !== "live_query_graph") {
                throw new Error(`${label}: observed coverage has source ${coverage.source ?? "missing"}`);
              }
              for (const field of ["indexed", "pending", "total"]) {
                if (!Number.isSafeInteger(coverage[field]) || coverage[field] < 0) {
                  throw new Error(`${label}: embedding_coverage.${field} is not a non-negative integer`);
                }
              }
              if (coverage.reason !== undefined || coverage.indexed > coverage.total || coverage.pending < coverage.total - coverage.indexed) {
                throw new Error(`${label}: observed embedding coverage violates kin.status.v3 invariants`);
              }
            } else if (coverage.state === "unobserved") {
              if (typeof coverage.reason !== "string" || coverage.reason.length === 0) {
                throw new Error(`${label}: unobserved embedding coverage carries no reason`);
              }
              for (const field of ["source", "indexed", "pending", "total"]) {
                if (coverage[field] !== undefined) {
                  throw new Error(`${label}: unobserved embedding coverage carries ${field}`);
                }
              }
            } else {
              throw new Error(`${label}: unknown embedding coverage state ${coverage.state ?? "missing"}`);
            }
          };
          validateEmbeddingCoverage(status.embedding_coverage, "kin-status.json");
          if (cliMeta.embeddings?.vector_enabled !== true || cliMeta.embeddings?.embeddings_enabled !== true) {
            throw new Error(`${runnerOs} bench metadata does not prove vector and embedding support`);
          }
          const reports = ["kin-health.json", "kin-doctor.json"].map((path) => [
            path,
            JSON.parse(fs.readFileSync(path, "utf8")),
          ]);
          const nonHealthyChecks = (report) => (report.checks ?? [])
            .filter((check) => check.status !== "healthy")
            .map((check) => `${check.id}=${check.status}`)
            .join(", ") || "none";
          const required = new Map([
            ["kin_binary", "healthy"],
            ["kin_daemon_binary", "healthy"],
            ["daemon_running", "healthy"],
            ["repo_init", "healthy"],
            ["shell_path", "healthy"],
            ["setup_ledger", "healthy"],
            ["registry_authority", "healthy"],
            ["vfs_projection", "healthy"],
            ["mcp_client_claude", "healthy"],
            ["mcp_client_cursor", "healthy"],
            ["mcp_client_codex", "healthy"],
            ["mcp_client_gemini", "healthy"],
            ["mcp_client_windsurf", "healthy"],
          ]);

          for (const [path, report] of reports) {
            const checks = new Map(report.checks.map((check) => [check.id, check]));
            // This capability capture runs before `kin embed`, so the daemon
            // graph still has embeddings pending. Under graph-authoritative
            // health that is semantic_query_readiness=stale, an intentional
            // authority gate that flips the aggregate report.healthy to false.
            // Accept that single transient pre-embed reason here — the
            // post-embed embedded-health capture below still requires
            // healthy=true with readiness=healthy — while keeping every other
            // unhealthy reason fatal: any missing/misconfigured check, or any
            // other check that is neither healthy nor unsupported, still fails.
            const onlyPendingEmbeddingsBlocks =
              checks.get("semantic_query_readiness")?.status === "stale" &&
              report.checks.every(
                (check) =>
                  check.id === "semantic_query_readiness" ||
                  check.status === "healthy" ||
                  check.status === "unsupported"
              );
            if (report.healthy !== true && !onlyPendingEmbeddingsBlocks) {
              throw new Error(
                `${path}: overall healthy=${report.healthy}; non-healthy checks: ${nonHealthyChecks(report)}`
              );
            }
            for (const [id, expected] of required) {
              const actual = checks.get(id)?.status;
              if (actual !== expected) {
                throw new Error(`${path}: ${id} is ${actual ?? "missing"}, expected ${expected}`);
              }
            }
            const semanticReadiness = checks.get("semantic_query_readiness")?.status;
            if (!["healthy", "stale"].includes(semanticReadiness)) {
              throw new Error(`${path}: semantic_query_readiness is ${semanticReadiness ?? "missing"}, expected healthy or stale`);
            }
            const hardFailures = report.checks.filter((check) =>
              check.status === "missing" || check.status === "misconfigured"
            );
            if (hardFailures.length > 0) {
              throw new Error(`${path}: hard failures: ${hardFailures.map((c) => c.id).join(", ")}`);
            }
          }

          const search = JSON.parse(fs.readFileSync("kin-search.json", "utf8"));
          if (!Array.isArray(search) || !search.some((record) => record.name === "hello" && record.file === "probe.py")) {
            throw new Error("lexical kin search did not return the seeded hello entity");
          }
          const locate = JSON.parse(fs.readFileSync("kin-locate.json", "utf8"));
          if (!locate.files?.some((entry) => entry.path === "probe.py")) {
            throw new Error("kin locate did not return the seeded probe.py graph artifact");
          }

          const home = os.homedir();
          const jsonConfigs = [
            path.join(home, ".claude.json"),
            path.join(home, ".cursor", "mcp.json"),
            path.join(home, ".gemini", "settings.json"),
            path.join(home, ".codeium", "windsurf", "mcp_config.json"),
          ];
          for (const configPath of jsonConfigs) {
            const entry = JSON.parse(fs.readFileSync(configPath, "utf8"))?.mcpServers?.kin;
            if (!entry || JSON.stringify(entry.args) !== JSON.stringify(["mcp", "start"]) || entry.env?.KIN_MCP_TOOL_PROFILE !== "agent-default") {
              throw new Error(`${configPath}: Kin MCP entry is missing or malformed`);
            }
          }
          const embed = JSON.parse(fs.readFileSync("kin-embed.json", "utf8"));
          if (embed.pending_entities !== 0 || embed.pending_artifacts !== 0 || embed.time_limited === true) {
            throw new Error(`bounded clean-install embedding did not reach full coverage: ${JSON.stringify(embed)}`);
          }
          const embeddedStatus = JSON.parse(fs.readFileSync("kin-embedded-status.json", "utf8"));
          if (embeddedStatus.schema !== "kin.status.v3") {
            throw new Error(`kin-embedded-status.json: unsupported schema ${embeddedStatus.schema ?? "missing"}`);
          }
          validateEmbeddingCoverage(embeddedStatus.embedding_coverage, "kin-embedded-status.json");
          const embeddedCoverage = embeddedStatus.embedding_coverage;
          if (
            embeddedCoverage.state !== "observed" ||
            embeddedCoverage.source !== "live_query_graph" ||
            embeddedCoverage.total === 0 ||
            embeddedCoverage.indexed !== embeddedCoverage.total ||
            embeddedCoverage.pending !== 0
          ) {
            throw new Error(`Unix status did not prove complete observed embedding coverage: ${JSON.stringify(embeddedCoverage)}`);
          }
          for (const reportPath of ["kin-embedded-health.json", "kin-embedded-doctor.json"]) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const readiness = report.checks?.find((check) => check.id === "semantic_query_readiness")?.status;
            if (report.healthy !== true || readiness !== "healthy") {
              throw new Error(
                `${reportPath}: overall healthy=${report.healthy}; ` +
                `semantic_query_readiness=${readiness ?? "missing"}; ` +
                `non-healthy checks: ${nonHealthyChecks(report)}`
              );
            }
          }
          const semanticSearch = JSON.parse(fs.readFileSync("kin-semantic-search.json", "utf8"));
          if (!Array.isArray(semanticSearch) || !semanticSearch.some((record) => record.name === "hello" && record.file === "probe.py")) {
            throw new Error("semantic kin search did not return the seeded hello entity");
          }
          const semanticLocate = JSON.parse(fs.readFileSync("kin-semantic-locate.json", "utf8"));
          if (semanticLocate.semantic_coverage?.supported !== true || semanticLocate.semantic_coverage?.complete !== true || !semanticLocate.files?.some((entry) => entry.path === "probe.py")) {
            throw new Error("semantic kin locate did not prove complete coverage and return probe.py");
          }
          NODE

      - name: Preserve proof reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-proof-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            kin-version.txt
            kin-daemon-version.txt
            expected-version.txt
            expected-commit.txt
            expected-lock-sha.txt
            attestation-verification.json
            release-provenance.json
            release-provenance.json.sha256
            release-provenance-attestation.json
            installed-vfs-provenance.json
            latest-release-url.txt
            kin-windows-bench-meta.json
            kin-windows-registry-authority.json
            kin-windows-registry-fix.txt
            kin-windows-setup.txt
            kin-windows-health.json
            kin-windows-doctor.json
            kin-windows-admission/*.txt
            kin-install-proof/*.txt
            kin-install-proof/*.json
            kin-install-proof/*.log
