name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      notarize_on_linux:
        description: >-
          Notarize the macOS binaries from a Linux runner via rcodesign instead
          of running xcrun notarytool on the macOS build runner. Leave unchecked
          to use the native macOS notarytool path (the proven default).
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve a single effective "notarize on Linux" flag for the whole run. The
  # macOS legs still build + codesign natively; only the Apple Notary submission
  # moves to a 1x Linux runner (macOS minutes bill 10x) when this is on.
  #
  # Source of truth, in order:
  #   1. the workflow_dispatch boolean input (for one-off validation runs)
  #   2. the repository variable NOTARIZE_ON_LINUX == 'true' (the persistent
  #      cutover switch — flip it once the Linux leg is proven green)
  # When neither is set, notarization stays on macOS notarytool (the fallback).
  config:
    name: Resolve release config
    runs-on: ubuntu-latest
    outputs:
      notarize_on_linux: ${{ steps.flags.outputs.notarize_on_linux }}
    steps:
      - name: Resolve notarize backend
        id: flags
        env:
          DISPATCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize_on_linux || '' }}
          REPO_VAR: ${{ vars.NOTARIZE_ON_LINUX }}
        run: |
          if [ "$DISPATCH_INPUT" = "true" ] || [ "$REPO_VAR" = "true" ]; then
            echo "notarize_on_linux=true" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: rcodesign on Linux"
          else
            echo "notarize_on_linux=false" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: xcrun notarytool on macOS (default)"
          fi

  build:
    name: Build (${{ matrix.artifact }})
    needs: config
    runs-on: ${{ matrix.os }}
    # Every advertised platform is release-blocking. A public release must not
    # be created without one of the archives consumed by the installers.
    # macOS signing/notarization secrets are surfaced as env so they can be used
    # in step `if:` guards. The `secrets` context is NOT available in `if:`
    # conditions, so guarding on `env.MACOS_CERTIFICATE != ''` is the supported
    # pattern. Tagged releases separately require every credential and fail
    # closed; branch workflow-dispatch runs may still exercise unsigned builds.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # When true, the macOS leg codesigns and uploads the signed-but-unnotarized
      # zip, and the separate notarize_linux job submits it to Apple Notary via
      # rcodesign. When false (default), the macOS leg notarizes inline with
      # xcrun notarytool — the proven fallback path.
      NOTARIZE_ON_LINUX: ${{ needs.config.outputs.notarize_on_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux core binaries (kin, kin-daemon) target musl and link static by
          # default, so a single artifact runs on any Linux distro: musl (Alpine)
          # and glibc (Ubuntu/Debian/RHEL) alike, with no OpenSSL or glibc version
          # coupling. The VFS leg builds against gnu (vfs_target) because an
          # LD_PRELOAD shim is intrinsically libc-specific (see the VFS steps).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            vfs_target: x86_64-unknown-linux-gnu
            artifact: kin-linux-x86_64
            shim_name: libkin_vfs_shim.so
            cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            vfs_target: aarch64-unknown-linux-gnu
            artifact: kin-linux-aarch64
            shim_name: libkin_vfs_shim.so
            cross: false
          # Use an Intel host so this archive is executed before packaging;
          # building x86_64 on an arm64 runner would leave it unproven.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: kin-macos-x86_64
            shim_name: libkin_vfs_shim.dylib
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kin-macos-aarch64
            shim_name: libkin_vfs_shim.dylib
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kin-windows-x86_64
            shim_name: kin_vfs_shim.dll
            skip_vector: true
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          # On the Linux legs the core (kin, kin-daemon) targets musl and the VFS
          # leg targets gnu (vfs_target), so both targets must be installed.
          targets: ${{ matrix.target }}${{ matrix.vfs_target && format(' {0}', matrix.vfs_target) || '' }}

      # musl-static C dependencies (ring, oniguruma, sqlite, tree-sitter) need a
      # musl-targeting C compiler; musl-tools provides musl-gcc. Only the Linux
      # musl legs require it.
      - name: Install musl C toolchain (Linux musl)
        if: ${{ contains(matrix.target, '-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Checkout kin-vfs
        uses: actions/checkout@v7
        with:
          repository: firelock-ai/kin-vfs
          path: kin-vfs
          # Release inputs must never move under an unchanged Kin tag.
          ref: 48c757dfda2ca6b115f32d86875c6adde587b861

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kin-vfs/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Assert clean release source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release checkout is not clean before compilation"
            exit 1
          fi

      - name: Build kin-cli + kin-daemon (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          FLAGS=""
          if [ "$SKIP_VECTOR" = "true" ]; then
            FLAGS="--no-default-features"
          fi
          # The daemon is the runtime: `kin init` works without it but
          # `kin status`/`kin search`/the MCP server all require kin-daemon on
          # PATH, so a clean public install must ship it alongside `kin`.
          cargo build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon $FLAGS
        env:
          TARGET: ${{ matrix.target }}
          SKIP_VECTOR: ${{ matrix.skip_vector }}

      - name: Build kin-cli + kin-daemon (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon
        env:
          TARGET: ${{ matrix.target }}

      - name: Build kin-vfs (native)
        if: ${{ !matrix.cross && !matrix.skip_vector }}
        working-directory: kin-vfs
        shell: bash
        run: |
          # The VFS shim is an LD_PRELOAD libc interceptor and is therefore
          # libc-specific: on Linux it builds against gnu (VFS_TARGET) so it can
          # preload into the host distro's glibc programs. macOS/Windows have no
          # vfs_target, so VFS_TARGET falls back to the core target there.
          cargo build --locked --release --target "$VFS_TARGET" -p kin-vfs-cli
          cargo build --locked --release --target "$VFS_TARGET" -p kin-vfs-shim
        env:
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}

      - name: Build kin-vfs (cross)
        if: ${{ matrix.cross }}
        working-directory: kin-vfs
        run: |
          cross build --locked --release --target "$TARGET" -p kin-vfs-cli
          cross build --locked --release --target "$TARGET" -p kin-vfs-shim
        env:
          TARGET: ${{ matrix.target }}

      - name: Verify native release build provenance
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SKIP_VECTOR: ${{ matrix.skip_vector }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH:$TARGET" in
            X64:x86_64-*|ARM64:aarch64-*) ;;
            *)
              echo "Skipping execution of cross-architecture artifact $TARGET on $RUNNER_ARCH; the matching macOS leg executes the same source and lock provenance."
              exit 0
              ;;
          esac

          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          kin_bin="target/$TARGET/release/kin$suffix"
          daemon_bin="target/$TARGET/release/kin-daemon$suffix"
          provenance_dir="$RUNNER_TEMP/kin-release-provenance-$TARGET"
          mkdir -p "$provenance_dir"
          "$kin_bin" --version | tee "$provenance_dir/kin-version.txt"
          "$daemon_bin" --version | tee "$provenance_dir/kin-daemon-version.txt"
          "$kin_bin" bench-meta --json > "$provenance_dir/kin-build-meta.json"
          expected_sha="$(git rev-parse HEAD)"

          EXPECTED_SHA="$expected_sha" SKIP_VECTOR="$SKIP_VECTOR" PROVENANCE_DIR="$provenance_dir" node <<'NODE'
          const fs = require("fs");
          const expected = process.env.EXPECTED_SHA;
          const dir = process.env.PROVENANCE_DIR;
          const lines = ["kin-version.txt", "kin-daemon-version.txt"].map((path) =>
            fs.readFileSync(`${dir}/${path}`, "utf8").trim()
          );
          const shas = lines.map((line) => {
            const match = line.match(/\(([0-9a-f]{40})(-dirty)?\s/);
            if (!match) throw new Error(`release version line lacks a full build SHA: ${line}`);
            if (match[2]) throw new Error(`release binary was built dirty: ${line}`);
            return match[1];
          });
          if (shas.some((sha) => sha !== expected) || shas[0] !== shas[1]) {
            throw new Error(`release binary SHAs ${shas.join(", ")} do not match checkout ${expected}`);
          }

          const meta = JSON.parse(fs.readFileSync(`${dir}/kin-build-meta.json`, "utf8"));
          if (process.env.GITHUB_REF_TYPE === "tag") {
            const expectedVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (meta.kin_version !== expectedVersion) {
              throw new Error(`kin package version ${meta.kin_version ?? "missing"} does not match release tag ${expectedVersion}`);
            }
          }
          if (meta.kin_commit !== expected || meta.kin_dirty !== false || meta.kin_source_known !== true) {
            throw new Error("kin bench-meta did not prove a clean, known release source");
          }
          if (!/^[0-9a-f]{64}$/.test(meta.dependency_provenance ?? "")) {
            throw new Error("kin bench-meta did not expose valid Cargo.lock provenance");
          }
          if (process.env.SKIP_VECTOR === "true") {
            for (const feature of ["vector", "embeddings", "metal"]) {
              if (meta.feature_flags.includes(feature)) {
                throw new Error(`vector-free release unexpectedly enabled ${feature}`);
              }
            }
          }
          NODE

      - name: Assert release build did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release build mutated the source checkout"
            exit 1
          fi

      # --- macOS code signing + notarization -------------------------------
      # Tag releases fail closed when signing/notarization credentials are not
      # configured. A branch workflow_dispatch may still exercise unsigned
      # build plumbing because the publish job is tag-only below.
      - name: Require macOS release signing credentials
        if: ${{ runner.os == 'macOS' && github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_DEVELOPER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a tagged macOS release"
              exit 1
            fi
          done
          if [ "$NOTARIZE_ON_LINUX" != "true" ]; then
            for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for native macOS notarization"
                exit 1
              fi
            done
          fi

      # Signing happens BEFORE packaging so the tarball + its published
      # sha256 cover the signed binaries.
      - name: Import code signing certificate (macOS)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Sign macOS binaries
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' }}
        run: |
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            test -f "$f"
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_DEVELOPER_ID" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
        env:
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}

      # Zip the signed Mach-O binaries for notarization. Apple Notary accepts a
      # zip of standalone executables/dylibs (the same input notarytool takes);
      # bare binaries cannot be stapled, so the ticket lives on Apple's servers
      # and is validated online by Gatekeeper on first run regardless of which
      # tool submits the zip. Built once here and reused by whichever backend
      # notarizes (macOS notarytool inline, or rcodesign on the Linux job).
      - name: Stage signed binaries for notarization (macOS)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && (env.NOTARIZE_ON_LINUX == 'true' || env.APPLE_ID != '') }}
        run: |
          NOTARIZE_ZIP="${ARTIFACT}-notarize.zip"
          FILES=()
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            [ -f "$f" ] && FILES+=("$f")
          done
          zip -j "$NOTARIZE_ZIP" "${FILES[@]}"
        env:
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}
          ARTIFACT: ${{ matrix.artifact }}

      # Fallback / default backend: notarize inline on the macOS runner. Runs
      # only when the Linux backend is NOT selected, so flipping NOTARIZE_ON_LINUX
      # cleanly swaps backends without ever double-submitting.
      - name: Notarize macOS binaries (notarytool)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' && env.NOTARIZE_ON_LINUX != 'true' }}
        run: |
          xcrun notarytool submit "${ARTIFACT}-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # NOTE: a bare CLI binary (and a .tar.gz) cannot be stapled — `xcrun
          # stapler` only supports .app bundles, .dmg, .pkg, and .xip. The
          # notarization ticket is stored on Apple's servers and validated
          # online by Gatekeeper on first run. If a .dmg/.pkg installer is added
          # later, run `xcrun stapler staple <installer>` here.
        env:
          ARTIFACT: ${{ matrix.artifact }}

      # Linux backend: hand the signed zip to the notarize_linux job, which
      # submits it to Apple Notary via rcodesign on a (10x cheaper) Linux runner.
      # The zip is short-lived job-internal plumbing, not a published artifact.
      - name: Upload signed binaries for Linux notarization
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.NOTARIZE_ON_LINUX == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-notarize-zip
          path: ${{ matrix.artifact }}-notarize.zip
          retention-days: 1
          if-no-files-found: error

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$ARTIFACT"
          cp "target/${TARGET}/release/kin" "$ARTIFACT/"
          # kin-daemon is mandatory (no `|| true`): a daemon-less
          # archive lets `kin init` succeed but then `kin status`/`kin search`
          # fail with no daemon on PATH, so a missing daemon must fail the build.
          cp "target/${TARGET}/release/kin-daemon" "$ARTIFACT/"
          # kin-vfs (cli + shim) is built under VFS_TARGET, which on Linux is the
          # gnu triple (the shim is libc-specific) and elsewhere equals TARGET.
          cp "kin-vfs/target/${VFS_TARGET}/release/kin-vfs" "$ARTIFACT/"
          cp "kin-vfs/target/${VFS_TARGET}/release/${SHIM_NAME}" "$ARTIFACT/"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          # All supported Unix surfaces are mandatory release contents.
          for required in kin kin-daemon kin-vfs "$SHIM_NAME"; do
            if ! tar tzf "${ARTIFACT}.tar.gz" | grep -q "/${required}$"; then
              echo "::error::$required missing from ${ARTIFACT}.tar.gz"
              exit 1
            fi
          done
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
        env:
          TARGET: ${{ matrix.target }}
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT
          Copy-Item "target/$env:TARGET/release/kin.exe" "$env:ARTIFACT/"
          # kin-daemon is mandatory: fail hard if it's missing rather
          # than ship a daemon-less archive that can `kin init` but nothing else.
          Copy-Item "target/$env:TARGET/release/kin-daemon.exe" "$env:ARTIFACT/" -ErrorAction Stop
          Copy-Item "kin-vfs/target/$env:TARGET/release/kin-vfs.exe" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          Copy-Item "kin-vfs/target/$env:TARGET/release/$env:SHIM_NAME" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:ARTIFACT/*" -DestinationPath "$env:ARTIFACT.zip"
          # Assert the produced zip actually contains kin-daemon.exe.
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD/$env:ARTIFACT.zip").Entries.Name
          if ($entries -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.zip — refusing to publish a daemon-less archive"
            exit 1
          }
          $ArchivePath = "$env:ARTIFACT.zip"
          $Hash = (Get-FileHash -Algorithm SHA256 $ArchivePath).Hash.ToLowerInvariant()
          "$Hash  $ArchivePath" | Set-Content -Encoding ascii "$ArchivePath.sha256"
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  # Notarize the macOS binaries from a Linux runner via rcodesign (the
  # apple-codesign Rust tool). Runs ONLY when NOTARIZE_ON_LINUX is selected; the
  # build job has already codesigned natively on macOS and uploaded the signed
  # zips. rcodesign calls the same Apple Notary API as notarytool and accepts the
  # same zip of standalone Mach-O binaries, so the resulting ticket (server-side,
  # keyed by code-signature hash) covers the identical binaries already packaged
  # into the published .tar.gz — the published artifacts are unchanged. This job
  # is a gate: if notarization fails, the release fails.
  notarize_linux:
    name: Notarize macOS binaries (Linux / rcodesign)
    needs: [config, build]
    if: ${{ needs.config.outputs.notarize_on_linux == 'true' }}
    runs-on: ubuntu-latest
    env:
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      # Pin rcodesign so a release never depends on a moving upstream binary.
      RCODESIGN_VERSION: "0.29.0"
      RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
    steps:
      - name: Require App Store Connect API credentials
        run: |
          set -euo pipefail
          for name in APPLE_API_ISSUER_ID APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required when Linux notarization is selected"
              exit 1
            fi
          done

      - name: Download signed notarization zips
        uses: actions/download-artifact@v8
        with:
          pattern: "*-notarize-zip"
          merge-multiple: true

      - name: Install rcodesign (pinned, checksum-verified)
        run: |
          asset="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${asset}.tar.gz"
          curl -fsSL -o rcodesign.tar.gz "$url"
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          install -m 0755 "${asset}/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Notarize signed binaries via rcodesign
        run: |
          # Reconstruct the App Store Connect API .p8 and fold it (with the
          # issuer + key id) into the single unified key JSON rcodesign expects.
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc-key"
          mkdir -p "$KEY_DIR"
          P8_PATH="$KEY_DIR/AuthKey.p8"
          KEY_JSON="$KEY_DIR/api-key.json"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$P8_PATH"
          rcodesign encode-app-store-connect-api-key \
            -o "$KEY_JSON" \
            "$APPLE_API_ISSUER_ID" \
            "$APPLE_API_KEY_ID" \
            "$P8_PATH"

          # One signed zip per macOS leg. --wait blocks on Apple Notary;
          # --max-wait-seconds 1800 mirrors the macOS notarytool 30m cap so a
          # stalled Apple queue fails fast (and a re-run picks up the result).
          # Bare binaries are not stapled (the ticket validates online), exactly
          # as the macOS notarytool path does.
          shopt -s nullglob
          zips=(*-notarize.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no signed notarization zips were downloaded — nothing to notarize"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            echo "Submitting $zip to Apple Notary via rcodesign"
            rcodesign notary-submit \
              --api-key-file "$KEY_JSON" \
              --wait \
              --max-wait-seconds 1800 \
              "$zip"
          done

          rm -f "$P8_PATH" "$KEY_JSON"

  publish:
    name: Publish Release
    needs: [build, notarize_linux]
    # notarize_linux is skipped on the default (macOS notarytool) path; publish
    # must still run then, but must NOT run if notarization actually failed or
    # was cancelled. `always() && !failure() && !cancelled()` lets a skipped
    # dependency through while still gating on a real Linux-notarize failure.
    if: ${{ always() && !failure() && !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node ./scripts/extract-release-notes.mjs \
            --version "$VERSION" \
            --input ./CHANGELOG.md \
            --output ./release-notes.md

      - name: Aggregate per-artifact checksums
        run: |
          # Forward-compat: combine the per-artifact "*.sha256" files into a
          # single checksums-sha256.txt. Installers verify against the
          # per-artifact files, so this is published as a convenience only.
          : > checksums-sha256.txt
          for f in *.tar.gz.sha256 *.zip.sha256; do
            [ -e "$f" ] || continue
            cat "$f" >> checksums-sha256.txt
          done

      - name: Verify complete release asset inventory
        run: |
          set -euo pipefail
          assets=(
            kin-linux-x86_64.tar.gz
            kin-linux-aarch64.tar.gz
            kin-macos-x86_64.tar.gz
            kin-macos-aarch64.tar.gz
            kin-windows-x86_64.zip
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum -c "$asset.sha256"
          done
          test -s checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release-notes.md
          generate_release_notes: true
          # Every tag starts non-latest so anonymous installation can exercise
          # the public assets without exposing an unproven stable release as
          # /releases/latest. Stable tags are promoted only after install_proof.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            kin-linux-x86_64.tar.gz
            kin-linux-x86_64.tar.gz.sha256
            kin-linux-aarch64.tar.gz
            kin-linux-aarch64.tar.gz.sha256
            kin-macos-x86_64.tar.gz
            kin-macos-x86_64.tar.gz.sha256
            kin-macos-aarch64.tar.gz
            kin-macos-aarch64.tar.gz.sha256
            kin-windows-x86_64.zip
            kin-windows-x86_64.zip.sha256
            checksums-sha256.txt

  # Releases created with GITHUB_TOKEN do not emit a second workflow run.
  # Invoke the reusable anonymous install proof directly after assets are public.
  install_proof:
    name: Public Install Proof
    needs: publish
    uses: ./.github/workflows/install-proof.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  finalize_release:
    name: Promote Proven Release
    needs: [publish, install_proof]
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote stable tag after public proof
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Verify final release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.prerelease')"
          expected=true
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) expected=false ;;
          esac
          if [ "$actual" != "$expected" ]; then
            echo "::error::release prerelease=$actual, expected $expected after proof"
            exit 1
          fi

  publish_npm:
    name: Publish npm Wrapper
    needs: [publish, install_proof, finalize_release]
    # publish uses always() to survive a skipped notarize_linux (the default
    # macOS-notarytool path); mirror that guard here or GitHub transitively skips
    # this job whenever notarize_linux is skipped.
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): npm authenticates this workflow via a short-lived
    # OIDC token instead of a long-lived NPM_TOKEN secret — no token to leak or
    # rotate, and it satisfies the @kinlab org's 2FA-for-publish policy. Requires a
    # Trusted Publisher configured on npm for @kinlab/kin-mcp pointing at
    # firelock-ai/kin + this workflow (release.yml).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify npm package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/kin-mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#v}"
          case "$ref" in
            *-alpha*) tag="alpha" ;;
            *-beta*) tag="beta" ;;
            *-rc*) tag="rc" ;;
            *) tag="latest" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish npm package (Trusted Publishing via OIDC)
        id: npm_pub
        run: |
          PKG=$(node -p "require('./packages/kin-mcp/package.json').name")
          VER=$(node -p "require('./packages/kin-mcp/package.json').version")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published — skipping (idempotent recut)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish ./packages/kin-mcp --access public --tag "${NPM_DIST_TAG}"
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}

      - name: Notify Discord (npm publish)
        if: steps.npm_pub.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.npm_pub.outputs.pkg }}
          VER: ${{ steps.npm_pub.outputs.ver }}
        run: |
          jq -nc --arg c "📦 \`${PKG}@${VER}\` published to **npm**." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  publish_npm_canonical:
    name: Publish npm Canonical Package (@kinlab/kin)
    needs: [publish, install_proof, finalize_release]
    # Runs parallel to publish_npm (independent packages: a kin-mcp registry
    # failure must not block the canonical package, and vice versa). Mirror
    # publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job.
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC), same as publish_npm. Requires a Trusted
    # Publisher configured on npm for @kinlab/kin pointing at firelock-ai/kin +
    # this workflow (release.yml). Until that npm-side configuration (or a
    # one-time manual first publish) exists, this job fails visibly here
    # without affecting the release or the kin-mcp compatibility publish.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify npm package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/kin/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Run launcher tests
        run: npm test --prefix ./packages/kin

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#v}"
          case "$ref" in
            *-alpha*) tag="alpha" ;;
            *-beta*) tag="beta" ;;
            *-rc*) tag="rc" ;;
            *) tag="latest" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish npm package (Trusted Publishing via OIDC)
        id: npm_pub_kin
        run: |
          PKG=$(node -p "require('./packages/kin/package.json').name")
          VER=$(node -p "require('./packages/kin/package.json').version")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published — skipping (idempotent recut)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish ./packages/kin --access public --tag "${NPM_DIST_TAG}"
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}

      - name: Notify Discord (npm publish)
        if: steps.npm_pub_kin.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.npm_pub_kin.outputs.pkg }}
          VER: ${{ steps.npm_pub_kin.outputs.ver }}
        run: |
          jq -nc --arg c "📦 \`${PKG}@${VER}\` published to **npm** (canonical Kin install surface)." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  publish_boundary_contracts:
    name: Publish boundary contracts to KinLab
    needs: [publish, install_proof, finalize_release]
    # Mirror publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job.
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Publish @kin/boundary-contracts to KinLab registry
        id: publish-boundary
        shell: bash
        run: |
          if [ -z "${KINLAB_NPM_TOKEN:-}" ]; then
            echo "KINLAB_NPM_TOKEN is not configured; skipping KinLab registry publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node ./scripts/publish-boundary-contracts.mjs
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ github.ref_name }}
          KINLAB_NPM_TOKEN: ${{ secrets.KINLAB_NPM_TOKEN }}
          KINLAB_NPM_REGISTRY_URL: ${{ vars.KINLAB_NPM_REGISTRY_URL }}
          KINLAB_NPM_DIST_TAG: ${{ contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'rc' || 'latest' }}

      - name: Notify Discord (KinLab registry publish)
        if: steps.publish-boundary.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF: ${{ github.ref_name }}
        run: |
          jq -nc --arg c "📦 \`@kin/boundary-contracts\` ${REF} published to the **KinLab registry**." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  bump_homebrew:
    name: Trigger & verify Homebrew formula bump
    needs: [publish, install_proof, finalize_release]
    # Mirror publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job.
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dispatch update to the homebrew-kin tap
        env:
          TAP_DISPATCH_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
        run: |
          if [ -z "${TAP_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::KIN_CI_BOT_TOKEN is not configured; skipping the best-effort dispatch. The public formula outcome gate below still runs for version tags."
            exit 0
          fi
          # Convenience dispatch: the tap also self-updates on its 6h schedule, so a
          # failure here (e.g. a token without homebrew-kin access) warns rather than
          # failing an already-published release. A 204 only proves GitHub accepted
          # the POST, not that the tap's own workflow ran or bumped the formula — the
          # step below verifies that outcome.
          code=$(curl -sS -o /tmp/tap-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TAP_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/firelock-ai/homebrew-kin/dispatches \
            -d '{"event_type":"kin-release"}' || echo "000")
          if [ "$code" = "204" ]; then
            echo "Dispatched kin-release to firelock-ai/homebrew-kin"
          else
            echo "::warning::Homebrew tap dispatch returned HTTP ${code}; continuing to the mandatory public formula outcome gate."
            cat /tmp/tap-dispatch.out 2>/dev/null || true
          fi

      # The dispatch above only proves the POST was accepted, not that
      # homebrew-kin's own workflow ran and actually bumped the formula (a
      # prior release's dispatch reported success while the tap workflow
      # never fired and the formula stayed stale for hours until a manual
      # rerun). Poll the tap's published formula for the version this release
      # actually cut, mirroring version_tag_image's bounded poll-for-outcome
      # below rather than trusting the dispatch response as release proof.
      - name: Verify the tap formula actually bumped to this version
        # Dispatch is only an accelerator. Every real version-tag release must
        # prove the public tap outcome, including when the token is absent or
        # GitHub rejects the dispatch request.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          bash scripts/verify-homebrew-formula.sh "$GITHUB_REF_NAME"

  # Version-tag the public daemon image so operators can pin a release
  # (`docker pull ghcr.io/firelock-ai/kin:0.2.7`). daemon-image.yml already pushed
  # `ghcr.io/firelock-ai/kin:<commit-sha>` + `:latest` on the main push that this
  # release was cut from; here we add `:<version>` and `:v<version>` as extra tags
  # pointing at that same image — a registry-side manifest copy, no rebuild — so
  # the version tags resolve to the exact image built for the release commit. Kept
  # out of daemon-image.yml on purpose: rebuilding on the tag would produce a
  # second, differently-built image, and "on a version tag" logic belongs with the
  # other release surfaces here.
  version_tag_image:
    name: Version-tag ghcr image
    needs: [publish, install_proof, finalize_release]
    # Mirror publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job, and only tag real version-tag pushes (not a
    # workflow_dispatch on a branch) so `:<version>` never points at an
    # unreleased or non-tag build.
    if: ${{ always() && !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Least privilege: read the repo (to peel the tag to its commit) and push
    # tags to ghcr — not the workflow-level `contents: write`.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Version-tag the release commit's daemon image (no rebuild)
        env:
          IMAGE: ghcr.io/firelock-ai/kin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # daemon-image.yml tags every push to main as `${IMAGE}:<commit-sha>`
          # (github.sha on a branch push is the head commit) plus `:latest`. The
          # release tag was cut on that same commit, so peel the tag to its commit
          # and retag THAT image. Peel with git rather than trusting github.sha,
          # whose value for an annotated tag is the tag object, not the commit the
          # daemon image was keyed on.
          COMMIT="$(git rev-parse HEAD)"
          SRC="${IMAGE}:${COMMIT}"

          # daemon-image.yml (push:main) and this release run were kicked off by the
          # same bump commit, so the commit image is normally already present by the
          # time Publish Release finishes. Poll rather than assume: a hand-pushed tag
          # or a slow/failed daemon-image build then fails loud instead of silently
          # tagging nothing.
          deadline=$(( SECONDS + 1800 ))
          until docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$SRC was not found after 30m — daemon-image.yml did not publish an image for this commit (did it run and succeed?). Refusing to version-tag via a rebuild."
              exit 1
            fi
            echo "Waiting for $SRC (published by daemon-image.yml on the main push)…"
            sleep 20
          done

          # Registry-side manifest copy: `:<version>` and `:v<version>` become new
          # tags pointing at the same image as `:<commit>` and `:latest` — no pull,
          # no push of layers, no rebuild, just extra manifest references to pin.
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            "$SRC"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          {
            echo "Version-tagged the release daemon image (no rebuild):"
            echo ""
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo "- source: \`${SRC}\`"
            if [ -n "${digest}" ]; then echo "- digest: \`${digest}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
