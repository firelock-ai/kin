name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      notarize_on_linux:
        description: >-
          Notarize the macOS binaries from a Linux runner via rcodesign instead
          of running xcrun notarytool on the macOS build runner. Leave unchecked
          to use the native macOS notarytool path (the proven default).
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve a single effective "notarize on Linux" flag for the whole run. The
  # macOS legs still build + codesign natively; only the Apple Notary submission
  # moves to a 1x Linux runner (macOS minutes bill 10x) when this is on.
  #
  # Source of truth, in order:
  #   1. the workflow_dispatch boolean input (for one-off validation runs)
  #   2. the repository variable NOTARIZE_ON_LINUX == 'true' (the persistent
  #      cutover switch — flip it once the Linux leg is proven green)
  # When neither is set, notarization stays on macOS notarytool (the fallback).
  config:
    name: Resolve release config
    runs-on: ubuntu-latest
    outputs:
      notarize_on_linux: ${{ steps.flags.outputs.notarize_on_linux }}
    steps:
      - name: Resolve notarize backend
        id: flags
        env:
          DISPATCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize_on_linux || '' }}
          REPO_VAR: ${{ vars.NOTARIZE_ON_LINUX }}
        run: |
          if [ "$DISPATCH_INPUT" = "true" ] || [ "$REPO_VAR" = "true" ]; then
            echo "notarize_on_linux=true" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: rcodesign on Linux"
          else
            echo "notarize_on_linux=false" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: xcrun notarytool on macOS (default)"
          fi

  build:
    name: Build (${{ matrix.artifact }})
    needs: config
    runs-on: ${{ matrix.os }}
    # Windows is a work-in-progress release target while the vector-free
    # dependency path is hardened. It must not block the macOS/Linux release:
    # the experimental leg is non-blocking so Publish Release + npm still run.
    continue-on-error: ${{ matrix.experimental || false }}
    # macOS signing/notarization secrets are surfaced as env so they can be used
    # in step `if:` guards. The `secrets` context is NOT available in `if:`
    # conditions, so guarding on `env.MACOS_CERTIFICATE != ''` is the supported
    # pattern. When the secrets are unset every signing step is skipped and the
    # pipeline still builds, packages, and publishes the (unsigned) binaries.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # When true, the macOS leg codesigns and uploads the signed-but-unnotarized
      # zip, and the separate notarize_linux job submits it to Apple Notary via
      # rcodesign. When false (default), the macOS leg notarizes inline with
      # xcrun notarytool — the proven fallback path.
      NOTARIZE_ON_LINUX: ${{ needs.config.outputs.notarize_on_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux core binaries (kin, kin-daemon) target musl and link static by
          # default, so a single artifact runs on any Linux distro: musl (Alpine)
          # and glibc (Ubuntu/Debian/RHEL) alike, with no OpenSSL or glibc version
          # coupling. The VFS leg builds against gnu (vfs_target) because an
          # LD_PRELOAD shim is intrinsically libc-specific (see the VFS steps).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            vfs_target: x86_64-unknown-linux-gnu
            artifact: kin-linux-x86_64
            shim_name: libkin_vfs_shim.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            vfs_target: aarch64-unknown-linux-gnu
            artifact: kin-linux-aarch64
            shim_name: libkin_vfs_shim.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kin-macos-x86_64
            shim_name: libkin_vfs_shim.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kin-macos-aarch64
            shim_name: libkin_vfs_shim.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kin-windows-x86_64
            shim_name: kin_vfs_shim.dll
            skip_vector: true
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          # On the Linux legs the core (kin, kin-daemon) targets musl and the VFS
          # leg targets gnu (vfs_target), so both targets must be installed.
          targets: ${{ matrix.target }}${{ matrix.vfs_target && format(' {0}', matrix.vfs_target) || '' }}

      # musl-static C dependencies (ring, oniguruma, sqlite, tree-sitter) need a
      # musl-targeting C compiler; musl-tools provides musl-gcc. Only the Linux
      # musl legs require it.
      - name: Install musl C toolchain (Linux musl)
        if: ${{ contains(matrix.target, '-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Checkout kin-vfs
        uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-vfs
          path: kin-vfs

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kin-vfs/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Checkout kin-db (for Windows vector-free build)
        if: ${{ matrix.skip_vector }}
        uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-db
          path: kin-db-local

      - name: Patch kin-db to disable vector on Windows
        if: ${{ matrix.skip_vector }}
        shell: bash
        run: |
          # 1. Remove vector feature from kin-db defaults
          sed -i 's/^default = \["vector"\]/default = []/' kin-db-local/crates/kin-db/Cargo.toml
          # 2. Remove features = ["vector"] from kin's dep on kin-db
          sed -i 's/, features = \["vector"\]//' Cargo.toml
          # 3. Point kin's dep to the patched local checkout
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'TOML'
          [patch."https://github.com/firelock-ai/kin-db.git"]
          kin-db = { path = "kin-db-local/crates/kin-db" }
          # kin-model is its own repo (no longer vendored under kin-db/crates) —
          # it resolves from the main [patch.kin] git pin like every other
          # platform; only kin-db needs the local vector-disabled override here.
          TOML

      - name: Build kin-cli + kin-daemon (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          FLAGS=""
          if [ "$SKIP_VECTOR" = "true" ]; then
            FLAGS="--no-default-features"
          fi
          # The daemon is the runtime: `kin init` works without it but
          # `kin status`/`kin search`/the MCP server all require kin-daemon on
          # PATH, so a clean public install must ship it alongside `kin`.
          cargo build --release --target "$TARGET" -p kin-cli -p kin-daemon $FLAGS
        env:
          TARGET: ${{ matrix.target }}
          SKIP_VECTOR: ${{ matrix.skip_vector }}

      - name: Build kin-cli + kin-daemon (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target "$TARGET" -p kin-cli -p kin-daemon
        env:
          TARGET: ${{ matrix.target }}

      - name: Build kin-vfs (native)
        if: ${{ !matrix.cross && !matrix.skip_vector }}
        working-directory: kin-vfs
        shell: bash
        run: |
          # The VFS shim is an LD_PRELOAD libc interceptor and is therefore
          # libc-specific: on Linux it builds against gnu (VFS_TARGET) so it can
          # preload into the host distro's glibc programs. macOS/Windows have no
          # vfs_target, so VFS_TARGET falls back to the core target there.
          cargo build --release --target "$VFS_TARGET" -p kin-vfs-cli
          cargo build --release --target "$VFS_TARGET" -p kin-vfs-shim
        env:
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}

      - name: Build kin-vfs (cross)
        if: ${{ matrix.cross }}
        working-directory: kin-vfs
        run: |
          cross build --release --target "$TARGET" -p kin-vfs-cli
          cross build --release --target "$TARGET" -p kin-vfs-shim
        env:
          TARGET: ${{ matrix.target }}

      # --- macOS code signing + notarization -------------------------------
      # Runs only on the macOS legs, and only when signing secrets are present
      # (see the job-level env block). Signing happens BEFORE packaging so the
      # tarball + its published sha256 cover the signed binaries.
      - name: Import code signing certificate (macOS)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Sign macOS binaries
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' }}
        run: |
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            if [ -f "$f" ]; then
              codesign --force --options runtime --timestamp \
                --sign "$MACOS_DEVELOPER_ID" "$f"
              codesign --verify --strict --verbose=2 "$f"
            fi
          done
        env:
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}

      # Zip the signed Mach-O binaries for notarization. Apple Notary accepts a
      # zip of standalone executables/dylibs (the same input notarytool takes);
      # bare binaries cannot be stapled, so the ticket lives on Apple's servers
      # and is validated online by Gatekeeper on first run regardless of which
      # tool submits the zip. Built once here and reused by whichever backend
      # notarizes (macOS notarytool inline, or rcodesign on the Linux job).
      - name: Stage signed binaries for notarization (macOS)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' }}
        run: |
          NOTARIZE_ZIP="${ARTIFACT}-notarize.zip"
          FILES=()
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            [ -f "$f" ] && FILES+=("$f")
          done
          zip -j "$NOTARIZE_ZIP" "${FILES[@]}"
        env:
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}
          ARTIFACT: ${{ matrix.artifact }}

      # Fallback / default backend: notarize inline on the macOS runner. Runs
      # only when the Linux backend is NOT selected, so flipping NOTARIZE_ON_LINUX
      # cleanly swaps backends without ever double-submitting.
      - name: Notarize macOS binaries (notarytool)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' && env.NOTARIZE_ON_LINUX != 'true' }}
        run: |
          xcrun notarytool submit "${ARTIFACT}-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # NOTE: a bare CLI binary (and a .tar.gz) cannot be stapled — `xcrun
          # stapler` only supports .app bundles, .dmg, .pkg, and .xip. The
          # notarization ticket is stored on Apple's servers and validated
          # online by Gatekeeper on first run. If a .dmg/.pkg installer is added
          # later, run `xcrun stapler staple <installer>` here.
        env:
          ARTIFACT: ${{ matrix.artifact }}

      # Linux backend: hand the signed zip to the notarize_linux job, which
      # submits it to Apple Notary via rcodesign on a (10x cheaper) Linux runner.
      # The zip is short-lived job-internal plumbing, not a published artifact.
      - name: Upload signed binaries for Linux notarization
        if: ${{ runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' && env.NOTARIZE_ON_LINUX == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-notarize-zip
          path: ${{ matrix.artifact }}-notarize.zip
          retention-days: 1
          if-no-files-found: error

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$ARTIFACT"
          cp "target/${TARGET}/release/kin" "$ARTIFACT/"
          # kin-daemon is mandatory (no `|| true`): a daemon-less
          # archive lets `kin init` succeed but then `kin status`/`kin search`
          # fail with no daemon on PATH, so a missing daemon must fail the build.
          cp "target/${TARGET}/release/kin-daemon" "$ARTIFACT/"
          # kin-vfs (cli + shim) is built under VFS_TARGET, which on Linux is the
          # gnu triple (the shim is libc-specific) and elsewhere equals TARGET.
          cp "kin-vfs/target/${VFS_TARGET}/release/kin-vfs" "$ARTIFACT/" 2>/dev/null || true
          cp "kin-vfs/target/${VFS_TARGET}/release/${SHIM_NAME}" "$ARTIFACT/" 2>/dev/null || true
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          # Assert the published archive actually contains kin-daemon so
          # a daemon-less build can never be released green.
          if ! tar tzf "${ARTIFACT}.tar.gz" | grep -q "/kin-daemon$"; then
            echo "::error::kin-daemon missing from ${ARTIFACT}.tar.gz — refusing to publish a daemon-less archive"
            exit 1
          fi
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
        env:
          TARGET: ${{ matrix.target }}
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT
          Copy-Item "target/$env:TARGET/release/kin.exe" "$env:ARTIFACT/"
          # kin-daemon is mandatory: fail hard if it's missing rather
          # than ship a daemon-less archive that can `kin init` but nothing else.
          Copy-Item "target/$env:TARGET/release/kin-daemon.exe" "$env:ARTIFACT/" -ErrorAction Stop
          Copy-Item "kin-vfs/target/$env:TARGET/release/kin-vfs.exe" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          Copy-Item "kin-vfs/target/$env:TARGET/release/$env:SHIM_NAME" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$env:ARTIFACT/*" -DestinationPath "$env:ARTIFACT.zip"
          # Assert the produced zip actually contains kin-daemon.exe.
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD/$env:ARTIFACT.zip").Entries.Name
          if ($entries -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.zip — refusing to publish a daemon-less archive"
            exit 1
          }
          Get-FileHash -Algorithm SHA256 "$env:ARTIFACT.zip" | Format-List Hash | Out-File -Encoding utf8 "$env:ARTIFACT.zip.sha256"
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  # Notarize the macOS binaries from a Linux runner via rcodesign (the
  # apple-codesign Rust tool). Runs ONLY when NOTARIZE_ON_LINUX is selected; the
  # build job has already codesigned natively on macOS and uploaded the signed
  # zips. rcodesign calls the same Apple Notary API as notarytool and accepts the
  # same zip of standalone Mach-O binaries, so the resulting ticket (server-side,
  # keyed by code-signature hash) covers the identical binaries already packaged
  # into the published .tar.gz — the published artifacts are unchanged. This job
  # is a gate: if notarization fails, the release fails.
  notarize_linux:
    name: Notarize macOS binaries (Linux / rcodesign)
    needs: [config, build]
    if: ${{ needs.config.outputs.notarize_on_linux == 'true' }}
    runs-on: ubuntu-latest
    env:
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      # Pin rcodesign so a release never depends on a moving upstream binary.
      RCODESIGN_VERSION: "0.29.0"
      RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
    steps:
      - name: Download signed notarization zips
        uses: actions/download-artifact@v8
        with:
          pattern: "*-notarize-zip"
          merge-multiple: true

      - name: Install rcodesign (pinned, checksum-verified)
        run: |
          asset="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${asset}.tar.gz"
          curl -fsSL -o rcodesign.tar.gz "$url"
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          install -m 0755 "${asset}/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Notarize signed binaries via rcodesign
        if: ${{ env.APPLE_API_ISSUER_ID != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_PRIVATE_KEY != '' }}
        run: |
          # Reconstruct the App Store Connect API .p8 and fold it (with the
          # issuer + key id) into the single unified key JSON rcodesign expects.
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc-key"
          mkdir -p "$KEY_DIR"
          P8_PATH="$KEY_DIR/AuthKey.p8"
          KEY_JSON="$KEY_DIR/api-key.json"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$P8_PATH"
          rcodesign encode-app-store-connect-api-key \
            -o "$KEY_JSON" \
            "$APPLE_API_ISSUER_ID" \
            "$APPLE_API_KEY_ID" \
            "$P8_PATH"

          # One signed zip per macOS leg. --wait blocks on Apple Notary;
          # --max-wait-seconds 1800 mirrors the macOS notarytool 30m cap so a
          # stalled Apple queue fails fast (and a re-run picks up the result).
          # Bare binaries are not stapled (the ticket validates online), exactly
          # as the macOS notarytool path does.
          shopt -s nullglob
          zips=(*-notarize.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no signed notarization zips were downloaded — nothing to notarize"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            echo "Submitting $zip to Apple Notary via rcodesign"
            rcodesign notary-submit \
              --api-key-file "$KEY_JSON" \
              --wait \
              --max-wait-seconds 1800 \
              "$zip"
          done

          rm -f "$P8_PATH" "$KEY_JSON"

  publish:
    name: Publish Release
    needs: [build, notarize_linux]
    # notarize_linux is skipped on the default (macOS notarytool) path; publish
    # must still run then, but must NOT run if notarization actually failed or
    # was cancelled. `always() && !failure() && !cancelled()` lets a skipped
    # dependency through while still gating on a real Linux-notarize failure.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node ./scripts/extract-release-notes.mjs \
            --version "$VERSION" \
            --input ./CHANGELOG.md \
            --output ./release-notes.md

      - name: Aggregate per-artifact checksums
        run: |
          # Forward-compat: combine the per-artifact "*.sha256" files into a
          # single checksums-sha256.txt. Installers verify against the
          # per-artifact files, so this is published as a convenience only.
          : > checksums-sha256.txt
          for f in *.tar.gz.sha256 *.zip.sha256; do
            [ -e "$f" ] || continue
            cat "$f" >> checksums-sha256.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            kin-linux-x86_64.tar.gz
            kin-linux-x86_64.tar.gz.sha256
            kin-linux-aarch64.tar.gz
            kin-linux-aarch64.tar.gz.sha256
            kin-macos-x86_64.tar.gz
            kin-macos-x86_64.tar.gz.sha256
            kin-macos-aarch64.tar.gz
            kin-macos-aarch64.tar.gz.sha256
            kin-windows-x86_64.zip
            kin-windows-x86_64.zip.sha256
            checksums-sha256.txt

  publish_npm:
    name: Publish npm Wrapper
    needs: publish
    # publish uses always() to survive a skipped notarize_linux (the default
    # macOS-notarytool path); mirror that guard here or GitHub transitively skips
    # this job whenever notarize_linux is skipped.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): npm authenticates this workflow via a short-lived
    # OIDC token instead of a long-lived NPM_TOKEN secret — no token to leak or
    # rotate, and it satisfies the @kinlab org's 2FA-for-publish policy. Requires a
    # Trusted Publisher configured on npm for @kinlab/kin-mcp pointing at
    # firelock-ai/kin + this workflow (release.yml).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify npm package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/kin-mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#v}"
          case "$ref" in
            *-alpha*) tag="alpha" ;;
            *-beta*) tag="beta" ;;
            *-rc*) tag="rc" ;;
            *) tag="latest" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish npm package (Trusted Publishing via OIDC)
        id: npm_pub
        run: |
          PKG=$(node -p "require('./packages/kin-mcp/package.json').name")
          VER=$(node -p "require('./packages/kin-mcp/package.json').version")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published — skipping (idempotent recut)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish ./packages/kin-mcp --access public --tag "${NPM_DIST_TAG}"
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}

      - name: Notify Discord (npm publish)
        if: steps.npm_pub.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.npm_pub.outputs.pkg }}
          VER: ${{ steps.npm_pub.outputs.ver }}
        run: |
          jq -nc --arg c "📦 \`${PKG}@${VER}\` published to **npm**." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  publish_boundary_contracts:
    name: Publish boundary contracts to KinLab
    needs: publish
    # Mirror publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Publish @kin/boundary-contracts to KinLab registry
        id: publish-boundary
        shell: bash
        run: |
          if [ -z "${KINLAB_NPM_TOKEN:-}" ]; then
            echo "KINLAB_NPM_TOKEN is not configured; skipping KinLab registry publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node ./scripts/publish-boundary-contracts.mjs
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ github.ref_name }}
          KINLAB_NPM_TOKEN: ${{ secrets.KINLAB_NPM_TOKEN }}
          KINLAB_NPM_REGISTRY_URL: ${{ vars.KINLAB_NPM_REGISTRY_URL }}
          KINLAB_NPM_DIST_TAG: ${{ contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'rc' || 'latest' }}

      - name: Notify Discord (KinLab registry publish)
        if: steps.publish-boundary.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF: ${{ github.ref_name }}
        run: |
          jq -nc --arg c "📦 \`@kin/boundary-contracts\` ${REF} published to the **KinLab registry**." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  bump_homebrew:
    name: Trigger Homebrew formula bump
    needs: publish
    # Mirror publish's always() guard so a skipped notarize_linux does not
    # transitively skip this job.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update to the homebrew-kin tap
        env:
          TAP_DISPATCH_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
        run: |
          if [ -z "${TAP_DISPATCH_TOKEN:-}" ]; then
            echo "KIN_CI_BOT_TOKEN not configured; the tap self-updates on its 6h schedule"
            exit 0
          fi
          # Convenience dispatch: the tap also self-updates on its 6h schedule, so a
          # failure here (e.g. a token without homebrew-kin access) warns rather than
          # failing an already-published release.
          code=$(curl -sS -o /tmp/tap-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TAP_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/firelock-ai/homebrew-kin/dispatches \
            -d '{"event_type":"kin-release"}' || echo "000")
          if [ "$code" = "204" ]; then
            echo "Dispatched kin-release to firelock-ai/homebrew-kin"
          else
            echo "::warning::Homebrew tap dispatch returned HTTP ${code}; the tap self-updates on its 6h schedule, not failing the release."
            cat /tmp/tap-dispatch.out 2>/dev/null || true
          fi
