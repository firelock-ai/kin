name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kin-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kin-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kin-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package kin-cli --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/kin ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/kin.exe ${{ matrix.artifact }}

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        run: Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }} | Format-List Hash | Out-File -Encoding utf8 ${{ matrix.artifact }}.sha256
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node ./scripts/extract-release-notes.mjs \
            --version "$VERSION" \
            --input ./CHANGELOG.md \
            --output ./release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
          files: |
            kin-linux-x86_64
            kin-linux-x86_64.sha256
            kin-macos-x86_64
            kin-macos-x86_64.sha256
            kin-macos-aarch64
            kin-macos-aarch64.sha256

  publish_npm:
    name: Publish npm Wrapper
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify npm package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/kin-mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Publish npm package
        run: npm publish ./packages/kin-mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
