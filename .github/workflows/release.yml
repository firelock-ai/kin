name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# External authority boundary: repository ruleset "Protect version release
# tags" limits v* creation/update/deletion to the release captain, while the
# protected `release` environment automatically admits only v* tags.
# Every credential-bearing or public-write job below must keep that environment.
# Both public npm packages trust only firelock-ai/kin + release.yml + environment
# `release`, allow `npm publish` through short-lived OIDC, and disallow
# traditional tokens. Keep both publish jobs on that exact protected identity.

# Serialize every release channel. GitHub may replace an older pending run, so
# every mutation also performs its own SemVer rollback check immediately before
# moving a public tag.
concurrency:
  group: kin-release-promotion
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse a run whose tag another run already released.
  #
  # On 2026-09-02 tag v0.6.4 produced two Release runs, 147 and 148, seven
  # seconds apart. This repository pushed once: release-tag.yml holds a single
  # `POST /git/refs` call, refs/tags/v0.6.4 still reads as a lightweight tag at
  # the sha the mint wrote, and the trigger above is a single `push: tags`
  # entry. The two runs carry different check suites, so GitHub delivered one
  # tag-creation push twice, and no change here can suppress that delivery.
  #
  # The concurrency group above serializes rather than cancels, so a duplicate
  # does not go away on its own: run 148 sat pending for over forty minutes and
  # would then have re-run publish, npm publish, promotion and the completion
  # marker against an already released tag. This job is where the duplicate
  # stops instead.
  #
  # Every other job reaches `config`, and `config` needs this one, so a
  # `duplicate=true` verdict skips the whole release. The jobs guarded by
  # `always()` skip with it, because each also requires a named dependency's
  # result to equal 'success' and a skipped dependency's result is 'skipped'.
  duplicate_guard:
    name: Refuse a duplicate release run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      duplicate: ${{ steps.verdict.outputs.duplicate }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Judge this run against earlier runs for the tag
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/guard-duplicate-release-run.py \
            --repo "$REPO" \
            --tag "$TAG" \
            --run-id "$RUN_ID" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow .github/workflows/release.yml \
            >> "$GITHUB_OUTPUT"

  # Resolve a single effective "notarize on Linux" flag for the whole run. The
  # macOS legs still build + codesign natively; only the Apple Notary submission
  # moves to a 1x Linux runner (macOS minutes bill 10x) when this is on.
  #
  # The repository variable NOTARIZE_ON_LINUX is the cutover switch. Manual
  # dispatch is intentionally disabled: a dispatch can target branch-controlled
  # workflow code, which must never inherit Apple or package-publish secrets.
  # When the variable is not true, notarization stays on native notarytool.
  config:
    name: Resolve release config
    runs-on: ubuntu-latest
    # The root of the job graph, so this pair is what turns one duplicate
    # verdict into a skipped release. A failing guard is deliberately NOT the
    # same as a duplicate: the run goes red on the guard rather than skipping
    # the release quietly, because a silent no-release is the one outcome
    # nobody would be paged for.
    needs: duplicate_guard
    if: needs.duplicate_guard.outputs.duplicate != 'true'
    outputs:
      notarize_on_linux: ${{ steps.flags.outputs.notarize_on_linux }}
      release_channel: ${{ steps.release_order.outputs.release_channel }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require release tag on reviewed default-branch history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::release tag $GITHUB_REF_NAME is not on reviewed $DEFAULT_BRANCH history"
            exit 1
          fi

      - name: Resolve notarize backend
        id: flags
        env:
          REPO_VAR: ${{ vars.NOTARIZE_ON_LINUX }}
        run: |
          if [ "$REPO_VAR" = "true" ]; then
            echo "notarize_on_linux=true" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: rcodesign on Linux"
          else
            echo "notarize_on_linux=false" >> "$GITHUB_OUTPUT"
            echo "Notarization backend: xcrun notarytool on macOS (default)"
          fi

      - name: Refuse release-channel rollback
        id: release_order
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="$(node scripts/release-order.mjs channel "$version")"
          echo "release_channel=$channel" >> "$GITHUB_OUTPUT"

          for package in @kinlab/kin @kinlab/kin-mcp; do
            current="$(node scripts/release-order.mjs npm-channel "$package" "$channel")"
            node scripts/release-order.mjs assert-not-rollback \
              "$version" "$current" "npm ${package} ${channel}"
          done

          if [ "$channel" = "latest" ]; then
            current_tag="$(node scripts/release-order.mjs github-latest "$GITHUB_REPOSITORY")"
            current_version="${current_tag#v}"
            node scripts/release-order.mjs assert-not-rollback \
              "$version" "$current_version" "GitHub Latest"
          fi

  # Publish the daemon image from the same externally-authorized tag workflow
  # as every other release surface. Main pushes and manual dispatches never get
  # package-write authority. The commit tag is an immutable staging identity;
  # version_tag_image promotes that exact digest only after public install proof.
  build_daemon_image:
    name: Build immutable daemon image
    needs: config
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release tag did not resolve to a full commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same mirror-first base image resolution the pull-request build uses. The
      # shipped image is built here, so the registry serving its base layers is
      # part of the release path: mirror first, canonical registry on failure,
      # and the Dockerfile pins both bases by digest so neither door can serve
      # different bytes.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Publish or verify immutable commit image
        id: publish
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          IMAGE: ghcr.io/firelock-ai/kin
        run: |
          set -euo pipefail
          source_image="${IMAGE}:${COMMIT}"

          inspect_digest() {
            local reference="$1"
            local output
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$reference" \
                --format '{{.Manifest.Digest}}' 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$output" = "ERROR: ${reference}: not found" ]; then
                return 44
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                echo "::error::could not establish immutable state for $reference" >&2
                return 1
              fi
              sleep $(( attempt * 2 ))
            done
          }

          if digest="$(inspect_digest "$source_image")"; then
            # A rerun never overwrites the commit identity. Verify the exact
            # existing digest carries this checkout's source and lock metadata.
            bash scripts/verify-container-build-info.sh \
              "${IMAGE}@${digest}" "$COMMIT"
            action="Verified existing"
          else
            inspect_status=$?
            if [ "$inspect_status" -ne 44 ]; then
              exit "$inspect_status"
            fi

            docker buildx build \
              --file Dockerfile \
              --load \
              --platform linux/amd64 \
              --provenance=false \
              --build-arg "KIN_BUILD_GIT_SHA=${COMMIT}" \
              --build-arg KIN_BUILD_DIRTY=false \
              --build-arg "KIN_BUILD_BRANCH=${GITHUB_REF_NAME}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --tag "$source_image" \
              .
            bash scripts/verify-container-build-info.sh "$source_image" "$COMMIT"

            # Release concurrency serializes writers. Recheck immediately before
            # the first write so a surprising pre-existing tag fails closed.
            if existing="$(inspect_digest "$source_image")"; then
              echo "::error::$source_image appeared concurrently at $existing; refusing to overwrite it"
              exit 1
            else
              inspect_status=$?
              if [ "$inspect_status" -ne 44 ]; then
                exit "$inspect_status"
              fi
            fi

            docker push "$source_image"
            digest="$(inspect_digest "$source_image")"
            bash scripts/verify-container-build-info.sh \
              "${IMAGE}@${digest}" "$COMMIT"
            action="Published"
          fi

          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::could not resolve an immutable digest for $source_image"
              exit 1
              ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "${action} immutable release image:"
            echo ""
            echo "- source: \`${source_image}\`"
            echo "- digest: \`${digest}\`"
            echo "- no mutable latest tag was written"
          } >> "$GITHUB_STEP_SUMMARY"

  # Attestation is intentionally separate from the image build. It may only
  # inspect the immutable commit tag emitted above, and cannot rebuild or move
  # it. This keeps OIDC/attestation authority out of the build job while still
  # blocking every public release surface if exact OCI provenance is absent.
  attest_daemon_image:
    name: Attest immutable daemon image
    needs: [config, build_daemon_image]
    if: >-
      ${{
        always() &&
        needs.config.result == 'success' &&
        needs.build_daemon_image.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve peeled release commit
        id: source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.build_daemon_image.outputs.commit }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          if [ "$commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::release tag peels to $commit, image job resolved to $EXPECTED_COMMIT"
            exit 1
          fi
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release tag did not resolve to a full commit id"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve exact immutable daemon digest
        id: subject
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_DIGEST: ${{ needs.build_daemon_image.outputs.digest }}
          IMAGE: ghcr.io/firelock-ai/kin
        run: |
          set -euo pipefail
          reference="${IMAGE}:${COMMIT}"
          digest="$(docker buildx imagetools inspect \
            "$reference" --format '{{.Manifest.Digest}}')"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve an immutable manifest digest for $reference"
            exit 1
          fi
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::$reference moved from release-built $EXPECTED_DIGEST to $digest"
            exit 1
          fi
          bash scripts/verify-container-build-info.sh \
            "${IMAGE}@${digest}" "$COMMIT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest immutable daemon image
        # With no predicate inputs actions/attest emits SLSA provenance. Store
        # the bundle next to the exact digest in GHCR for downstream admission.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/firelock-ai/kin
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true
          # The OCI bundle is required; the optional linked-artifact storage
          # record (and its broader artifact-metadata permission) is not.
          create-storage-record: false

      - name: Verify immutable daemon image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.subject.outputs.digest }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in 1 2 3 4 5; do
            if gh attestation verify \
              "oci://ghcr.io/firelock-ai/kin@${DIGEST}" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle-from-oci \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$COMMIT" \
              --source-digest "$COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners; then
              verified=true
              break
            fi
            sleep $(( attempt * 2 ))
          done
          if [ "$verified" != true ]; then
            echo "::error::could not verify the exact GHCR daemon image attestation"
            exit 1
          fi

  build:
    name: Build (${{ matrix.artifact }})
    needs: config
    runs-on: ${{ matrix.os }}
    # rc-build.yml bounds the identical compile at 90, and this job had no bound
    # at all, so it inherited the 360-minute default while holding
    # `kin-release-promotion` with cancel-in-progress: false. A hung leg could
    # block every release-channel mutation for six hours. The slowest leg ever
    # measured is 40m03s, so 90 leaves better than twice that headroom. This
    # bounds execution rather than queue time, so it is not a runner-label
    # safety net; it is the ceiling on a build that stops making progress.
    timeout-minutes: 90
    environment: release
    # Every advertised platform is release-blocking. A public release must not
    # be created without one of the archives consumed by the installers.
    # Signing credentials are deliberately step-scoped below. The untrusted
    # Cargo build matrix never receives Apple secrets or a write-scoped token.
    # Tagged releases fail closed when any required credential is absent.
    #
    # There is no Cargo cache step, and adding one back is a change to what the
    # shipped bytes are made of rather than a speed tweak. The step that used to
    # sit before "Assert clean release source" cached ~/.cargo and both target
    # directories and never restored once. GitHub scopes a cache entry to the
    # ref that wrote it, this workflow runs only on a v* tag, so every tag wrote
    # into a scope no later tag could read. Measured on v0.5.41: the exact key
    # and the prefix restore-key both missed and the step saved anyway, roughly
    # 1.4 GB per release out of the repository's 10 GB budget, evicting the CI
    # entries that do restore.
    #
    # A cache that did restore would be worse than the dead one. target/ holds
    # linked objects that go straight into the published binary, "Assert clean
    # release source" cannot see them because target/ is gitignored, and
    # "Verify native release build provenance" runs the binary and matches an
    # embedded commit sha, which a poisoned object still reports correctly. So
    # a working restore would put unreviewed bytes in a released artifact for
    # the first time, with no guard able to fail. A release compiles cold.
    env:
      # When true, the macOS leg codesigns and uploads the signed-but-unnotarized
      # zip, and the separate notarize_linux job submits it to Apple Notary via
      # rcodesign. When false (default), the macOS leg notarizes inline with
      # xcrun notarytool, the proven fallback path.
      NOTARIZE_ON_LINUX: ${{ needs.config.outputs.notarize_on_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux core binaries (kin, kin-daemon) target musl and link static by
          # default, so a single artifact runs on any Linux distro: musl (Alpine)
          # and glibc (Ubuntu/Debian/RHEL) alike, with no OpenSSL or glibc version
          # coupling. The VFS leg builds against gnu (vfs_target) because an
          # LD_PRELOAD shim is intrinsically libc-specific (see the VFS steps).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            vfs_target: x86_64-unknown-linux-gnu
            artifact: kin-linux-x86_64
            shim_name: libkin_vfs_shim.so
            cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            vfs_target: aarch64-unknown-linux-gnu
            artifact: kin-linux-aarch64
            shim_name: libkin_vfs_shim.so
            cross: false
          # Use an Intel host so this archive is executed before packaging;
          # building x86_64 on an arm64 runner would leave it unproven.
          #
          # Keep this on the standard Intel pool. A tag freezes this workflow,
          # so a paid or custom label whose budget stops assigning runners can
          # strand an immutable release. The release authority suite pins the
          # standard-runner boundary and falsifies the paid-runner regression.
          #
          # Cross-compiling x86_64 from the faster Apple Silicon host was the
          # other candidate and is refused, on provenance rather than on
          # signing. codesign and notarytool never execute the binary, so both
          # work fine on a cross-built artifact. "Verify native release build
          # provenance" does execute it, and its `case "$RUNNER_ARCH:$TARGET"`
          # declines a cross-architecture artifact and returns before writing
          # kin-build-meta.json, which "Generate artifact provenance manifest"
          # then reads unconditionally. Making that path work means either
          # running the x86_64 binary under Rosetta on the arm64 host, which the
          # macos-15-arm64 runner image does not list among its software, or
          # dropping the execution proof for a shipped archive: the version-line
          # commit match, the dirty refusal, the embedded Cargo.lock provenance,
          # and the vector/embeddings/metal feature assertions all stop running.
          # Staying on Intel keeps RUNNER_ARCH X64, so that guard's X64:x86_64-*
          # arm still matches and nothing else in the job moves.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: kin-macos-x86_64
            shim_name: libkin_vfs_shim.dylib
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kin-macos-aarch64
            shim_name: libkin_vfs_shim.dylib
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kin-windows-x86_64
            shim_name: kin_vfs_shim.dll
            # kin-vfs only. This row used to carry `skip_vector: true`, which
            # gated BOTH the vector feature set and the kin-vfs build, so
            # shipping vectors on Windows by deleting that one key would also
            # have started building an LD_PRELOAD libc interceptor for msvc.
            # The two are unrelated and are now named separately.
            skip_vfs: true
            cross: false

    steps:
      - name: Preserve tracked bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: ./.github/actions/rust-toolchain
        with:
          # On the Linux legs the core (kin, kin-daemon) targets musl and the VFS
          # leg targets gnu (vfs_target), so both targets must be installed.
          targets: ${{ matrix.target }}${{ matrix.vfs_target && format(' {0}', matrix.vfs_target) || '' }}

      # musl-static C dependencies (ring, oniguruma, sqlite, tree-sitter) need a
      # musl-targeting C compiler; musl-tools provides musl-gcc. Only the Linux
      # musl legs require it.
      #
      # Bounded through the shared helper rather than called directly. A bare
      # `apt-get update && apt-get install` has no ceiling below the job
      # timeout: the hosted mirrorlist puts azure.archive.ubuntu.com first and a
      # stall there trickles bytes slowly enough that no per-fetch timeout
      # fires. The helper bounds each call, retries three times, and fails over
      # to archive.ubuntu.com from the second attempt, so a stalled mirror ends
      # the step with its own error line instead of holding a release build.
      - name: Install musl C toolchain (Linux musl)
        if: ${{ contains(matrix.target, '-linux-musl') }}
        run: ./scripts/ci-apt-install.sh musl-tools

      - name: Install cross (ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Checkout kin-vfs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: firelock-ai/kin-vfs
          path: kin-vfs
          # Release inputs must never move under an unchanged Kin tag.
          ref: 4ff5262bb345d2d08846b0e8e09abc9fad639aed
          persist-credentials: false

      - name: Verify canonical release input bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const sha256 = (bytes) =>
            crypto.createHash("sha256").update(bytes).digest("hex");
          for (const [label, root] of [["Kin", process.cwd()], ["kin-vfs", path.join(process.cwd(), "kin-vfs")]]) {
            const tracked = childProcess.execFileSync(
              "git",
              ["cat-file", "blob", "HEAD:Cargo.lock"],
              { cwd: root }
            );
            const working = fs.readFileSync(path.join(root, "Cargo.lock"));
            if (!working.equals(tracked)) {
              throw new Error(
                `${label} Cargo.lock working bytes ${sha256(working)} do not match ` +
                `tracked Git bytes ${sha256(tracked)}; refusing platform-specific release provenance`
              );
            }
            console.log(`Verified canonical ${label} Cargo.lock bytes: ${sha256(tracked)}`);
          }

          const lockPackages = (lockPath) => fs.readFileSync(lockPath, "utf8")
            .split("[[package]]")
            .slice(1)
            .map((block) => ({
              name: block.match(/^name = "([^"]+)"/m)?.[1],
              version: block.match(/^version = "([^"]+)"/m)?.[1],
              source: block.match(/^source = "([^"]+)"/m)?.[1] ?? null,
            }));
          const kinVfsCore = lockPackages(path.join(process.cwd(), "Cargo.lock"))
            .filter((pkg) => pkg.name === "kin-vfs-core" && pkg.source?.startsWith("sparse+"));
          const pinnedVfsCore = lockPackages(path.join(process.cwd(), "kin-vfs", "Cargo.lock"))
            .filter((pkg) => pkg.name === "kin-vfs-core" && pkg.source === null);
          if (kinVfsCore.length !== 1 || pinnedVfsCore.length !== 1) {
            throw new Error(
              `expected one registry Kin kin-vfs-core and one pinned local kin-vfs-core; ` +
              `found ${kinVfsCore.length} and ${pinnedVfsCore.length}`
            );
          }
          if (kinVfsCore[0].version !== pinnedVfsCore[0].version) {
            throw new Error(
              `Kin resolves kin-vfs-core ${kinVfsCore[0].version}, but the pinned release ` +
              `checkout builds ${pinnedVfsCore[0].version}; update the immutable kin-vfs pin`
            );
          }
          console.log(`Verified Kin/kin-vfs release compatibility at kin-vfs-core ${kinVfsCore[0].version}`);
          NODE

      - name: Assert clean release source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release checkout is not clean before compilation"
            exit 1
          fi
          vfs_dirty="$(git -C kin-vfs status --porcelain --untracked-files=all)"
          if [ -n "$vfs_dirty" ]; then
            printf '%s\n' "$vfs_dirty" >&2
            echo "::error::pinned kin-vfs checkout is not clean before compilation"
            exit 1
          fi

      - name: Build kin-cli + kin-daemon (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          # The daemon is the runtime: `kin init` works without it but
          # `kin status`/`kin search`/the MCP server all require kin-daemon on
          # PATH, so a clean public install must ship it alongside `kin`.
          #
          # Every platform now builds the same default feature set. Windows was
          # the only leg that stripped it, and dropping that split is what puts
          # native vector search in the shipped Windows archive.
          cargo build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon
        env:
          TARGET: ${{ matrix.target }}

      - name: Build kin-cli + kin-daemon (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release --target "$TARGET" -p kin-cli -p kin-daemon
        env:
          TARGET: ${{ matrix.target }}

      # KinNotifier.app carries Kin's notification identity. macOS derives a
      # notification's sender name, icon, and grouping from the posting
      # process's bundle, so without this the CLI's notifications are credited
      # to Script Editor. macOS-only: there is no bundle concept elsewhere.
      - name: Build and assemble KinNotifier.app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" -p kin-notifier-macos
          crates/kin-notifier-macos/bundle.sh \
            "target/${TARGET}/release/KinNotifier" \
            "target/${TARGET}/release" \
            "${GITHUB_REF_NAME#v}"
        env:
          TARGET: ${{ matrix.target }}

      # kin and kin-daemon are static musl and carry no glibc floor at all. The
      # VFS pair is the only glibc-linked thing Kin publishes for Linux, and
      # until now its floor was a property of the runner image: Rust std
      # references pidfd_spawnp and pidfd_getpid as weak undefined symbols, the
      # linker binds them to whatever libc the build host exports, and the
      # ubuntu-24.04 images export them at GLIBC_2.39. v0.5.38 shipped a
      # linux-aarch64 kin-vfs the Debian 12 loader refused outright for exactly
      # that reason. Zig ships glibc headers for every version, so building
      # through it pins the floor to a number under review here rather than to
      # whichever image the runner label resolves to this month.
      - name: Install the pinned glibc floor toolchain (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.cross && !matrix.skip_vfs }}
        shell: bash
        env:
          ZIG_VERSION: "0.13.0"
          CARGO_ZIGBUILD_VERSION: "0.19.8"
          # Published by ziglang.org/download/index.json for these exact
          # tarballs. A release input must be immutable, so the download is
          # checked rather than trusted.
          ZIG_SHA256_X86_64: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
          ZIG_SHA256_AARCH64: 041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) zig_arch=x86_64; zig_sha="$ZIG_SHA256_X86_64" ;;
            aarch64) zig_arch=aarch64; zig_sha="$ZIG_SHA256_AARCH64" ;;
            *)
              echo "::error::no pinned zig tarball for Linux $(uname -m); the release cannot pin its glibc floor on this host"
              exit 1
              ;;
          esac
          tarball="$RUNNER_TEMP/zig-${ZIG_VERSION}.tar.xz"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
            --location --silent --show-error --fail \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-${zig_arch}-${ZIG_VERSION}.tar.xz" \
            --output "$tarball"
          echo "${zig_sha}  ${tarball}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build kin-vfs (native)
        if: ${{ !matrix.cross && !matrix.skip_vfs }}
        working-directory: kin-vfs
        shell: bash
        run: |
          set -euo pipefail
          # The VFS shim is an LD_PRELOAD libc interceptor and is therefore
          # libc-specific: on Linux it builds against gnu (VFS_TARGET) so it can
          # preload into the host distro's glibc programs. macOS/Windows have no
          # vfs_target, so VFS_TARGET falls back to the core target there.
          # The mount features are what make the shipped driver able to serve a
          # projection the operating system mounts, rather than only the
          # injected shim. macOS gets nfs because it carries an NFS client in
          # the base system; Linux gets fuse below because it carries libfuse
          # far more widely than a configured NFS client. Neither flag moves the
          # glibc floor or adds a runtime dependency: building the same tree
          # with and without them yields an identical shared-library set and an
          # identical set of referenced GLIBC symbol versions, and fuser links
          # no library because it mounts through the fusermount3 helper.
          # --locked still holds: nfsserve and fuser are already in kin-vfs's
          # tracked lock at the pinned ref.
          if [ "$RUNNER_OS" != "Linux" ]; then
            cargo build --locked --release --target "$VFS_TARGET" -p kin-vfs-cli --features nfs
            cargo build --locked --release --target "$VFS_TARGET" -p kin-vfs-shim
            exit 0
          fi
          # The floor is read out of the guard rather than written here as
          # well. A build targeting one floor while the guard enforces another
          # is worse than no guard, and the two drifting apart is exactly the
          # shape that survives review.
          floor="$(node "$GITHUB_WORKSPACE/scripts/check-glibc-floor.mjs" --print-floor)"
          # zig cc does not search Debian/Ubuntu multiarch directories, and the
          # OpenSSL that kin-vfs-daemon links through reqwest lives in them:
          # the headers under /usr/include/<multiarch> and the link libraries
          # under /usr/lib/<multiarch>. Both Linux legs build natively, so the
          # multiarch triple is the VFS target's architecture.
          multiarch="${VFS_TARGET%%-*}-linux-gnu"
          scoped="$(printf '%s' "$VFS_TARGET" | tr - _)"
          upper="$(printf '%s' "$scoped" | tr '[:lower:]' '[:upper:]')"
          export "CFLAGS_${scoped}=-I/usr/include/${multiarch}"
          export "CARGO_TARGET_${upper}_RUSTFLAGS=-L native=/usr/lib/${multiarch}"
          cargo zigbuild --locked --release --target "${VFS_TARGET}.${floor}" -p kin-vfs-cli --features fuse
          cargo zigbuild --locked --release --target "${VFS_TARGET}.${floor}" -p kin-vfs-shim
        env:
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}

      - name: Build kin-vfs (cross)
        if: ${{ matrix.cross }}
        working-directory: kin-vfs
        run: |
          cross build --locked --release --target "$TARGET" -p kin-vfs-cli
          cross build --locked --release --target "$TARGET" -p kin-vfs-shim
        env:
          TARGET: ${{ matrix.target }}

      - name: Verify native release build provenance
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH:$TARGET" in
            X64:x86_64-*|ARM64:aarch64-*) ;;
            *)
              echo "Skipping execution of cross-architecture artifact $TARGET on $RUNNER_ARCH; the matching macOS leg executes the same source and lock provenance."
              exit 0
              ;;
          esac

          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          kin_bin="target/$TARGET/release/kin$suffix"
          daemon_bin="target/$TARGET/release/kin-daemon$suffix"
          provenance_dir="$RUNNER_TEMP/kin-release-provenance-$TARGET"
          mkdir -p "$provenance_dir"
          "$kin_bin" --version | tee "$provenance_dir/kin-version.txt"
          "$daemon_bin" --version | tee "$provenance_dir/kin-daemon-version.txt"
          "$kin_bin" bench-meta --json > "$provenance_dir/kin-build-meta.json"
          expected_sha="$(git rev-parse HEAD)"

          EXPECTED_SHA="$expected_sha" PROVENANCE_DIR="$provenance_dir" node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const expected = process.env.EXPECTED_SHA;
          const dir = process.env.PROVENANCE_DIR;
          const lines = ["kin-version.txt", "kin-daemon-version.txt"].map((path) =>
            fs.readFileSync(`${dir}/${path}`, "utf8").trim()
          );
          const shas = lines.map((line) => {
            const match = line.match(/\(([0-9a-f]{40})(-dirty)?\s/);
            if (!match) throw new Error(`release version line lacks a full build SHA: ${line}`);
            if (match[2]) throw new Error(`release binary was built dirty: ${line}`);
            return match[1];
          });
          if (shas.some((sha) => sha !== expected) || shas[0] !== shas[1]) {
            throw new Error(`release binary SHAs ${shas.join(", ")} do not match checkout ${expected}`);
          }

          const meta = JSON.parse(fs.readFileSync(`${dir}/kin-build-meta.json`, "utf8"));
          if (process.env.GITHUB_REF_TYPE === "tag") {
            const expectedVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (meta.kin_version !== expectedVersion) {
              throw new Error(`kin package version ${meta.kin_version ?? "missing"} does not match release tag ${expectedVersion}`);
            }
          }
          if (meta.kin_commit !== expected || meta.kin_dirty !== false || meta.kin_source_known !== true) {
            throw new Error("kin bench-meta did not prove a clean, known release source");
          }
          const tagLockSha = crypto.createHash("sha256").update(fs.readFileSync("Cargo.lock")).digest("hex");
          if (meta.dependency_provenance !== tagLockSha) {
            throw new Error(
              `embedded Cargo.lock provenance ${meta.dependency_provenance ?? "missing"} ` +
              `does not match tagged Cargo.lock ${tagLockSha}`
            );
          }
          // Every published archive now carries semantic search. This used to
          // run only for the one leg that stripped the features, which meant no
          // leg ever asserted they were PRESENT; a silent feature regression on
          // any platform would have shipped green. Assert it everywhere.
          //
          // `metal` reports the compiled backend rather than the marker cargo
          // feature (bench_meta.rs `metal_active()` is
          // `cfg!(target_os = "macos")`), so it is expected on macOS and is a
          // defect anywhere else.
          for (const feature of ["vector", "embeddings"]) {
            if (!meta.feature_flags.includes(feature)) {
              throw new Error(`release build for ${process.env.TARGET} did not enable ${feature}`);
            }
          }
          const expectMetal = process.env.TARGET.includes("apple-darwin");
          if (meta.feature_flags.includes("metal") !== expectMetal) {
            throw new Error(
              `release build for ${process.env.TARGET} reported metal=${meta.feature_flags.includes("metal")}, expected ${expectMetal}`
            );
          }
          NODE

      - name: Assert release build did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::release build mutated the source checkout"
            exit 1
          fi
          vfs_dirty="$(git -C kin-vfs status --porcelain --untracked-files=all)"
          if [ -n "$vfs_dirty" ]; then
            printf '%s\n' "$vfs_dirty" >&2
            echo "::error::release build mutated the pinned kin-vfs checkout"
            exit 1
          fi

      # --- macOS code signing + notarization -------------------------------
      # Tag releases fail closed when signing/notarization credentials are not
      # configured.
      - name: Resolve macOS signing credential availability
        id: mac_signing
        if: ${{ runner.os == 'macOS' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_available=true
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_DEVELOPER_ID; do
            if [ -z "${!name:-}" ]; then
              signing_available=false
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$signing_available" != "true" ]; then
            echo "::error::MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, and MACOS_DEVELOPER_ID are required for a tagged macOS release"
            exit 1
          fi

          native_notary_available=true
          if [ "$NOTARIZE_ON_LINUX" != "true" ]; then
            for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                native_notary_available=false
              fi
            done
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$native_notary_available" != "true" ]; then
              echo "::error::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are required for native macOS notarization"
              exit 1
            fi
          fi
          echo "signing_available=$signing_available" >> "$GITHUB_OUTPUT"
          echo "native_notary_available=$native_notary_available" >> "$GITHUB_OUTPUT"

      # Signing happens BEFORE packaging so the tarball + its published
      # sha256 cover the signed binaries.
      - name: Import code signing certificate (macOS)
        if: ${{ runner.os == 'macOS' && steps.mac_signing.outputs.signing_available == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Sign macOS binaries
        if: ${{ runner.os == 'macOS' && steps.mac_signing.outputs.signing_available == 'true' }}
        run: |
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            test -f "$f"
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_DEVELOPER_ID" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          # The bundle signs as a unit: codesign seals Info.plist and Resources
          # alongside the executable, which is what makes the identity
          # tamper-evident rather than just a name in a plist.
          APP="target/${TARGET}/release/KinNotifier.app"
          test -d "$APP"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_DEVELOPER_ID" "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}

      # Zip the signed Mach-O binaries for notarization. Apple Notary accepts a
      # zip of standalone executables/dylibs (the same input notarytool takes);
      # bare binaries cannot be stapled, so the ticket lives on Apple's servers
      # and is validated online by Gatekeeper on first run regardless of which
      # tool submits the zip. Built once here and reused by whichever backend
      # notarizes (macOS notarytool inline, or rcodesign on the Linux job).
      - name: Stage signed binaries for notarization (macOS)
        if: ${{ runner.os == 'macOS' && steps.mac_signing.outputs.signing_available == 'true' && (env.NOTARIZE_ON_LINUX == 'true' || steps.mac_signing.outputs.native_notary_available == 'true') }}
        run: |
          NOTARIZE_ZIP="${ARTIFACT}-notarize.zip"
          FILES=()
          for f in \
            "target/${TARGET}/release/kin" \
            "target/${TARGET}/release/kin-daemon" \
            "kin-vfs/target/${TARGET}/release/kin-vfs" \
            "kin-vfs/target/${TARGET}/release/${SHIM_NAME}"; do
            [ -f "$f" ] && FILES+=("$f")
          done
          zip -j "$NOTARIZE_ZIP" "${FILES[@]}"
          # The .app goes in with its directory structure intact (-j would
          # flatten the bundle into loose files and destroy it). Notary needs
          # the bundle whole in order to issue a staplable ticket for it.
          ( cd "target/${TARGET}/release" && zip -qr "$OLDPWD/$NOTARIZE_ZIP" KinNotifier.app )
        env:
          TARGET: ${{ matrix.target }}
          SHIM_NAME: ${{ matrix.shim_name }}
          ARTIFACT: ${{ matrix.artifact }}

      # Fallback / default backend: notarize inline on the macOS runner. Runs
      # only when the Linux backend is NOT selected, so flipping NOTARIZE_ON_LINUX
      # cleanly swaps backends without ever double-submitting.
      - name: Notarize macOS binaries (notarytool)
        if: ${{ runner.os == 'macOS' && steps.mac_signing.outputs.native_notary_available == 'true' && env.NOTARIZE_ON_LINUX != 'true' }}
        run: |
          xcrun notarytool submit "${ARTIFACT}-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # A bare CLI binary (and a .tar.gz) cannot be stapled: `xcrun stapler`
          # supports only .app bundles, .dmg, .pkg, and .xip. Those binaries
          # therefore rely on Apple's servers being reachable for Gatekeeper's
          # online check. KinNotifier.app IS a bundle, so its ticket is stapled
          # into it below and verifies offline.
          xcrun stapler staple "target/${TARGET}/release/KinNotifier.app"
          xcrun stapler validate "target/${TARGET}/release/KinNotifier.app"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}

      # Linux backend: hand the signed zip to the notarize_linux job, which
      # submits it to Apple Notary via rcodesign on a (10x cheaper) Linux runner.
      # The zip is short-lived job-internal plumbing, not a published artifact.
      - name: Upload signed binaries for Linux notarization
        if: ${{ runner.os == 'macOS' && steps.mac_signing.outputs.signing_available == 'true' && env.NOTARIZE_ON_LINUX == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.artifact }}-notarize-zip
          path: ${{ matrix.artifact }}-notarize.zip
          retention-days: 1
          if-no-files-found: error

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$ARTIFACT"
          cp "target/${TARGET}/release/kin" "$ARTIFACT/"
          # kin-daemon is mandatory (no `|| true`): a daemon-less
          # archive lets `kin init` succeed but then `kin status`/`kin search`
          # fail with no daemon on PATH, so a missing daemon must fail the build.
          cp "target/${TARGET}/release/kin-daemon" "$ARTIFACT/"
          # kin-vfs (cli + shim) is built under VFS_TARGET, which on Linux is the
          # gnu triple (the shim is libc-specific) and elsewhere equals TARGET.
          cp "kin-vfs/target/${VFS_TARGET}/release/kin-vfs" "$ARTIFACT/"
          cp "kin-vfs/target/${VFS_TARGET}/release/${SHIM_NAME}" "$ARTIFACT/"
          # KinNotifier.app is macOS-only and is copied whole: -R preserves the
          # bundle structure and the stapled notarization ticket inside it.
          if [ -d "target/${TARGET}/release/KinNotifier.app" ]; then
            cp -R "target/${TARGET}/release/KinNotifier.app" "$ARTIFACT/"
          fi
          # Words, not just executables. Both arms of the isolated stranger run
          # installed this archive successfully and both scored the packaging
          # below the binaries, because nothing in it says where the three
          # executables go or that the shared library belongs somewhere else.
          node scripts/write-release-archive-docs.mjs "$ARTIFACT" "$TARGET" "${GITHUB_REF_NAME#v}"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          # Take the listing once into a file. Piping it into `grep -q` lets grep
          # exit on its first match, and under `pipefail` the SIGPIPE that raises
          # on `tar` fails the pipeline, which reads exactly like the member being
          # absent. Reading a file cannot invert the guard that way.
          ARCHIVE_LISTING="$RUNNER_TEMP/${ARTIFACT}.listing.txt"
          tar tzf "${ARTIFACT}.tar.gz" > "$ARCHIVE_LISTING"
          # All supported Unix surfaces are mandatory release contents.
          for required in kin kin-daemon kin-vfs "$SHIM_NAME" README.md INSTALL.md checksums-sha256.txt; do
            if ! grep -q "/${required}$" "$ARCHIVE_LISTING"; then
              echo "::error::$required missing from ${ARTIFACT}.tar.gz"
              exit 1
            fi
          done
          # The notifier is mandatory on macOS. Without it the CLI still runs but
          # every notification is credited to Script Editor, which is a silent
          # downgrade rather than a visible failure, so assert it here.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! grep -q "KinNotifier.app/Contents/MacOS/KinNotifier$" "$ARCHIVE_LISTING"; then
              echo "::error::KinNotifier.app missing from ${ARTIFACT}.tar.gz"
              exit 1
            fi
          fi
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
        env:
          TARGET: ${{ matrix.target }}
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      # Read the floor back off the bytes that were just packaged. The build
      # above pins it, and a pin goes quiet the day it stops taking effect,
      # which is how v0.5.38 published a kin-vfs that no Debian 12 could start
      # while every check in this workflow stayed green. This step is the half
      # that cannot pass by accident: it names the highest GLIBC requirement in
      # each shipped dynamic binary and the symbols that set it, and refuses the
      # release above the floor.
      - name: Verify the packaged Linux binaries meet the published glibc floor
        if: ${{ runner.os == 'Linux' && !matrix.skip_vfs }}
        shell: bash
        run: node scripts/check-glibc-floor.mjs "$ARTIFACT/kin-vfs" "$ARTIFACT/$SHIM_NAME"
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT
          Copy-Item "target/$env:TARGET/release/kin.exe" "$env:ARTIFACT/"
          # kin-daemon is mandatory: fail hard if it's missing rather
          # than ship a daemon-less archive that can `kin init` but nothing else.
          Copy-Item "target/$env:TARGET/release/kin-daemon.exe" "$env:ARTIFACT/" -ErrorAction Stop
          Copy-Item "kin-vfs/target/$env:TARGET/release/kin-vfs.exe" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          Copy-Item "kin-vfs/target/$env:TARGET/release/$env:SHIM_NAME" "$env:ARTIFACT/" -ErrorAction SilentlyContinue
          # See the Unix leg: the archive carries its own README, INSTALL and
          # checksum manifest so a stranger is not guessing at layout.
          node scripts/write-release-archive-docs.mjs "$env:ARTIFACT" "$env:TARGET" ($env:GITHUB_REF_NAME -replace '^v', '')
          if ($LASTEXITCODE -ne 0) {
            Write-Error "failed to write the release archive documentation"
            exit 1
          }
          Compress-Archive -Path "$env:ARTIFACT/*" -DestinationPath "$env:ARTIFACT.zip"
          # Assert the produced zip actually contains kin-daemon.exe.
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD/$env:ARTIFACT.zip").Entries.Name
          if ($entries -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.zip, refusing to publish a daemon-less archive"
            exit 1
          }
          foreach ($doc in @("README.md", "INSTALL.md", "checksums-sha256.txt")) {
            if ($entries -notcontains $doc) {
              Write-Error "$doc missing from $env:ARTIFACT.zip"
              exit 1
            }
          }
          # The POSIX installer builds one archive name for every platform it
          # detects, "kin-<os>-<arch>.tar.gz", and it detects windows from the
          # MSYS, MINGW, and CYGWIN uname strings. Piping the documented curl
          # command into a shell on Windows therefore asked for a tarball this
          # leg never produced, and every release to date answered that request
          # with a 404. Publish the same components under that exact name beside
          # the zip. The zip stays the primary archive: the PowerShell
          # installer, the npm launcher, and `kin update` all resolve Windows by
          # that name, and anything already depending on it keeps working.
          tar -czf "$env:ARTIFACT.tar.gz" "$env:ARTIFACT"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "tar failed to package $env:ARTIFACT.tar.gz"
            exit 1
          }
          $members = @(tar -tzf "$env:ARTIFACT.tar.gz")
          if ($LASTEXITCODE -ne 0) {
            Write-Error "tar failed to list $env:ARTIFACT.tar.gz"
            exit 1
          }
          $members = @($members | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
          # The Unix legs wrap their contents in a single "<artifact>/" root and
          # the release shape rules refuse a member carrying a backslash, so
          # assert both here rather than discovering a Windows path separator in
          # the publish job after the archive is already built.
          $prefix = "$env:ARTIFACT/"
          foreach ($member in $members) {
            if ($member.Contains("\")) {
              Write-Error "$env:ARTIFACT.tar.gz member '$member' uses a Windows path separator"
              exit 1
            }
            if (-not $member.StartsWith($prefix)) {
              Write-Error "$env:ARTIFACT.tar.gz member '$member' is not under $prefix"
              exit 1
            }
          }
          $TarNames = @(
            $members |
              Where-Object { -not $_.EndsWith("/") } |
              ForEach-Object { $_.Substring($prefix.Length) } |
              Sort-Object
          )
          $ZipNames = @($entries | Sort-Object)
          if (Compare-Object -ReferenceObject $ZipNames -DifferenceObject $TarNames) {
            Write-Error "$env:ARTIFACT.tar.gz and $env:ARTIFACT.zip do not carry the same components"
            exit 1
          }
          if ($TarNames -notcontains "kin-daemon.exe") {
            Write-Error "kin-daemon.exe missing from $env:ARTIFACT.tar.gz"
            exit 1
          }
          foreach ($ArchivePath in @("$env:ARTIFACT.zip", "$env:ARTIFACT.tar.gz")) {
            $Hash = (Get-FileHash -Algorithm SHA256 $ArchivePath).Hash.ToLowerInvariant()
            "$Hash  $ArchivePath" | Set-Content -Encoding ascii "$ArchivePath.sha256"
          }
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SHIM_NAME: ${{ matrix.shim_name }}

      - name: Generate artifact provenance manifest
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
          VFS_TARGET: ${{ matrix.vfs_target || matrix.target }}
          EXPECTED_VFS_COMMIT: 4ff5262bb345d2d08846b0e8e09abc9fad639aed
        run: |
          set -euo pipefail
          node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const artifact = process.env.ARTIFACT;
          const { readUpdateBuildIdentity } = require("./scripts/read-update-build-identity.cjs");
          const { classifyReleaseArchiveRoot } = require("./scripts/release-archive-shape.cjs");
          const target = process.env.TARGET;
          const root = process.cwd();
          const authorityNames = new Set(
            target.includes("-windows-")
              ? ["kin.exe", "kin-daemon.exe"]
              : ["kin", "kin-daemon"]
          );
          const sha256 = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const git = (cwd, ...args) =>
            childProcess.execFileSync("git", args, { cwd, encoding: "utf8" }).trim();

          const kinCommit = git(root, "rev-parse", "HEAD");
          const vfsRoot = path.join(root, "kin-vfs");
          const vfsCommit = git(vfsRoot, "rev-parse", "HEAD");
          if (vfsCommit !== process.env.EXPECTED_VFS_COMMIT) {
            throw new Error(`kin-vfs checkout ${vfsCommit} does not match pinned ${process.env.EXPECTED_VFS_COMMIT}`);
          }

          const kinLockSha = sha256(path.join(root, "Cargo.lock"));
          const vfsLockSha = sha256(path.join(vfsRoot, "Cargo.lock"));
          const buildMetaPath = path.join(
            process.env.RUNNER_TEMP,
            `kin-release-provenance-${target}`,
            "kin-build-meta.json"
          );
          const buildMeta = JSON.parse(fs.readFileSync(buildMetaPath, "utf8"));
          if (buildMeta.kin_commit !== kinCommit || buildMeta.dependency_provenance !== kinLockSha) {
            throw new Error("embedded build provenance does not match the tagged Kin source and Cargo.lock");
          }

          // Windows publishes two containers of the same components: the zip
          // every Windows resolver already asks for, and the tarball the POSIX
          // installer builds its name from. The zip stays the manifest's
          // primary archive because `kin update` and the public install proof
          // both find the platform record by that exact name; the tarball is
          // inventoried beside it so its bytes are covered by the same
          // provenance rather than published unaccounted for.
          const windowsTarget = target.includes("-windows-");
          const primaryArchive = windowsTarget ? `${artifact}.zip` : `${artifact}.tar.gz`;
          const additionalArchiveNames = windowsTarget ? [`${artifact}.tar.gz`] : [];
          const expectedArchives = [primaryArchive, ...additionalArchiveNames].sort();
          const archives = [`${artifact}.tar.gz`, `${artifact}.zip`]
            .filter((file) => fs.existsSync(file))
            .sort();
          if (JSON.stringify(archives) !== JSON.stringify(expectedArchives)) {
            throw new Error(`expected final archives ${expectedArchives.join(", ")} for ${artifact}, found ${archives.join(", ") || "none"}`);
          }
          const archive = primaryArchive;
          const archiveRecord = (name) => ({
            name,
            sha256: sha256(name),
            size_bytes: fs.statSync(name).size,
          });
          // The content inventory covers the archive's component files and nothing
          // else. An installed updater refuses any inventory name outside its
          // managed component list, so the macOS notification bundle, a sealed
          // directory rather than a component, and the three documentation
          // members are classified and shape-checked here but stay out of the
          // manifest. v0.6.2 refused the v0.6.3 manifest on `checksums-sha256.txt`,
          // the first documentation record in it, and no managed install could
          // update across any release from v0.5.45 on. Their bytes are covered by
          // the archive digest; the bundle's also by its code signature and
          // stapled notarization, the docs' also by the in-archive checksum file.
          const contents = classifyReleaseArchiveRoot(artifact, { target })
            .files
            .map((name) => {
              const file = path.join(artifact, name);
              const record = {
                name,
                sha256: sha256(file),
                size_bytes: fs.statSync(file).size,
              };
              if (authorityNames.has(name)) {
                record.build_identity = readUpdateBuildIdentity(file);
              }
              return record;
            })
            .sort((left, right) => left.name.localeCompare(right.name));
          if (contents.length < 2) {
            throw new Error(`${artifact} does not contain the mandatory kin and kin-daemon binaries`);
          }
          const expectedVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const authorityRecords = contents.filter((record) => authorityNames.has(record.name));
          if (authorityRecords.length !== authorityNames.size) {
            throw new Error(`${artifact} does not contain both static build-identity authorities`);
          }
          const graphVersions = new Set();
          for (const record of authorityRecords) {
            const identity = record.build_identity;
            if (
              identity.version !== expectedVersion ||
              identity.commit !== kinCommit ||
              identity.clean !== true ||
              identity.source_known !== true ||
              identity.dependency_provenance !== kinLockSha
            ) {
              throw new Error(`${record.name} static build identity does not match the tagged release source`);
            }
            graphVersions.add(identity.graph_snapshot_version);
          }
          if (graphVersions.size !== 1) {
            throw new Error(`${artifact} CLI and daemon graph snapshot identities disagree`);
          }

          const manifest = {
            schema_version: 2,
            release_tag: process.env.GITHUB_REF_NAME,
            artifact,
            target,
            vfs_target: process.env.VFS_TARGET,
            kin: {
              commit: kinCommit,
              cargo_lock_sha256: kinLockSha,
              embedded_dependency_provenance: buildMeta.dependency_provenance,
            },
            kin_vfs: {
              commit: vfsCommit,
              dirty: false,
              cargo_lock_sha256: vfsLockSha,
            },
            archive: archiveRecord(archive),
            ...(additionalArchiveNames.length
              ? { additional_archives: additionalArchiveNames.map(archiveRecord) }
              : {}),
            archive_contents: contents,
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            },
          };
          fs.writeFileSync(`${artifact}.provenance.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.provenance.json

  # Notarize the macOS binaries from a Linux runner via rcodesign (the
  # apple-codesign Rust tool). Runs ONLY when NOTARIZE_ON_LINUX is selected; the
  # build job has already codesigned natively on macOS and uploaded the signed
  # zips. rcodesign calls the same Apple Notary API as notarytool and accepts the
  # same zip of standalone Mach-O binaries, so the resulting ticket (server-side,
  # keyed by code-signature hash) covers the identical binaries already packaged
  # into the published .tar.gz, so the published artifacts are unchanged. This job
  # is a gate: if notarization fails, the release fails.
  notarize_linux:
    name: Notarize macOS binaries (Linux / rcodesign)
    needs: [config, build]
    if: ${{ needs.config.outputs.notarize_on_linux == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    env:
      # Pin rcodesign so a release never depends on a moving upstream binary.
      RCODESIGN_VERSION: "0.29.0"
      RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
    steps:
      - name: Require App Store Connect API credentials
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_API_ISSUER_ID APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required when Linux notarization is selected"
              exit 1
            fi
          done

      - name: Download signed notarization zips
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: "*-notarize-zip"
          merge-multiple: true

      - name: Install rcodesign (pinned, checksum-verified)
        run: |
          asset="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${asset}.tar.gz"
          curl -fsSL -o rcodesign.tar.gz "$url"
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar xzf rcodesign.tar.gz
          install -m 0755 "${asset}/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Notarize signed binaries via rcodesign
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # Reconstruct the App Store Connect API .p8 and fold it (with the
          # issuer + key id) into the single unified key JSON rcodesign expects.
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc-key"
          mkdir -p "$KEY_DIR"
          P8_PATH="$KEY_DIR/AuthKey.p8"
          KEY_JSON="$KEY_DIR/api-key.json"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$P8_PATH"
          rcodesign encode-app-store-connect-api-key \
            -o "$KEY_JSON" \
            "$APPLE_API_ISSUER_ID" \
            "$APPLE_API_KEY_ID" \
            "$P8_PATH"

          # One signed zip per macOS leg. --wait blocks on Apple Notary;
          # --max-wait-seconds 1800 mirrors the macOS notarytool 30m cap so a
          # stalled Apple queue fails fast (and a re-run picks up the result).
          # Bare binaries are not stapled (the ticket validates online), exactly
          # as the macOS notarytool path does.
          shopt -s nullglob
          zips=(*-notarize.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no signed notarization zips were downloaded, so there is nothing to notarize"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            echo "Submitting $zip to Apple Notary via rcodesign"
            rcodesign notary-submit \
              --api-key-file "$KEY_JSON" \
              --wait \
              --max-wait-seconds 1800 \
              "$zip"
          done

          rm -f "$P8_PATH" "$KEY_JSON"

  publish:
    name: Publish Release
    needs: [config, build, notarize_linux, attest_daemon_image]
    # A skipped Linux notarization job is admissible only when the reviewed
    # config selected native macOS notarytool. Every other direct authority
    # input must report an exact successful result before the first public
    # GitHub Release write is allowed.
    if: >-
      ${{
        always() &&
        needs.config.result == 'success' &&
        needs.build.result == 'success' &&
        needs.attest_daemon_image.result == 'success' &&
        (
          (
            needs.config.outputs.notarize_on_linux == 'true' &&
            needs.notarize_linux.result == 'success'
          ) ||
          (
            needs.config.outputs.notarize_on_linux == 'false' &&
            needs.notarize_linux.result == 'skipped'
          )
        ) &&
        github.ref_type == 'tag'
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned kin-vfs provenance source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: firelock-ai/kin-vfs
          path: release-inputs/kin-vfs
          ref: 4ff5262bb345d2d08846b0e8e09abc9fad639aed
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          merge-multiple: true

      - name: Generate release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node ./scripts/extract-release-notes.mjs \
            --version "$VERSION" \
            --input ./CHANGELOG.md \
            --output ./release-notes.md

      - name: Aggregate per-artifact checksums
        run: |
          set -euo pipefail
          # Forward-compat: combine the per-artifact "*.sha256" files into a
          # single checksums-sha256.txt. Installers verify against the
          # per-artifact files, so this is published as a convenience only.
          # PowerShell writes the Windows sidecar with CRLF; make the aggregate
          # byte-canonical on the Linux publisher without changing any record.
          : > checksums-sha256.txt
          for f in *.tar.gz.sha256 *.zip.sha256; do
            [ -e "$f" ] || continue
            tr -d '\r' < "$f" >> checksums-sha256.txt
          done
          if LC_ALL=C grep -q $'\r' checksums-sha256.txt; then
            echo "::error::aggregate checksum file still contains carriage returns" >&2
            exit 1
          fi

      - name: Verify complete release asset inventory
        run: |
          set -euo pipefail
          assets=(
            kin-linux-x86_64.tar.gz
            kin-linux-aarch64.tar.gz
            kin-macos-x86_64.tar.gz
            kin-macos-aarch64.tar.gz
            kin-windows-x86_64.zip
            kin-windows-x86_64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum -c "$asset.sha256"
            case "$asset" in
              *.tar.gz) artifact="${asset%.tar.gz}" ;;
              *.zip) artifact="${asset%.zip}" ;;
            esac
            test -s "$artifact.provenance.json"
          done
          test -s checksums-sha256.txt

      # The inventory above asserts the assets this workflow means to publish.
      # This asserts the other direction, which is the one that shipped broken:
      # every asset name a public installer builds for a supported platform has
      # to be among the bytes staged here. It derives those names by running the
      # installers rather than by restating them, so a list that quietly stops
      # matching an installer fails the release instead of a user's install.
      - name: Verify every installer asset name is published
        run: python3 ./scripts/verify-installer-release-assets.py --assets-dir .

      - name: Verify and aggregate release provenance
        env:
          EXPECTED_VFS_COMMIT: 4ff5262bb345d2d08846b0e8e09abc9fad639aed
        run: |
          set -euo pipefail
          node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const { readUpdateBuildIdentity } = require("./scripts/read-update-build-identity.cjs");
          const {
            DOC_FILES,
            assertReleaseArchiveMemberPaths,
            classifyReleaseArchiveRoot,
          } = require("./scripts/release-archive-shape.cjs");

          const root = process.cwd();
          const sha256 = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const git = (cwd, ...args) =>
            childProcess.execFileSync("git", args, { cwd, encoding: "utf8" }).trim();
          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          // Judge an archive's declared member paths before extracting it. A
          // member that escapes the extraction root has already been written
          // somewhere else by the time the extracted tree can be inspected.
          // Every published container goes through here, so a second container
          // of the same components is judged by the same rules as the first.
          const extractArchive = (archiveName, spec) => {
            const listing = archiveName.endsWith(".zip")
              ? childProcess.execFileSync("unzip", ["-Z1", archiveName], { encoding: "utf8" })
              : childProcess.execFileSync("tar", ["-tzf", archiveName], { encoding: "utf8" });
            assertReleaseArchiveMemberPaths(
              listing.split("\n").filter((member) => member !== ""),
              { artifact: spec.artifact, target: spec.target }
            );
            const extractRoot = fs.mkdtempSync(path.join(os.tmpdir(), `${spec.artifact}-`));
            if (archiveName.endsWith(".zip")) {
              childProcess.execFileSync("unzip", ["-q", archiveName, "-d", extractRoot]);
            } else {
              childProcess.execFileSync("tar", ["-xzf", archiveName, "-C", extractRoot]);
            }
            const nested = path.join(extractRoot, spec.artifact);
            return {
              extractRoot,
              contentRoot: fs.existsSync(nested) ? nested : extractRoot,
            };
          };
          const specs = [
            {
              artifact: "kin-linux-x86_64",
              archive: "kin-linux-x86_64.tar.gz",
              target: "x86_64-unknown-linux-musl",
              vfsTarget: "x86_64-unknown-linux-gnu",
              required: ["kin", "kin-daemon", "kin-vfs", "libkin_vfs_shim.so"],
            },
            {
              artifact: "kin-linux-aarch64",
              archive: "kin-linux-aarch64.tar.gz",
              target: "aarch64-unknown-linux-musl",
              vfsTarget: "aarch64-unknown-linux-gnu",
              required: ["kin", "kin-daemon", "kin-vfs", "libkin_vfs_shim.so"],
            },
            {
              artifact: "kin-macos-x86_64",
              archive: "kin-macos-x86_64.tar.gz",
              target: "x86_64-apple-darwin",
              vfsTarget: "x86_64-apple-darwin",
              required: ["kin", "kin-daemon", "kin-vfs", "libkin_vfs_shim.dylib"],
            },
            {
              artifact: "kin-macos-aarch64",
              archive: "kin-macos-aarch64.tar.gz",
              target: "aarch64-apple-darwin",
              vfsTarget: "aarch64-apple-darwin",
              required: ["kin", "kin-daemon", "kin-vfs", "libkin_vfs_shim.dylib"],
            },
            {
              artifact: "kin-windows-x86_64",
              archive: "kin-windows-x86_64.zip",
              // The POSIX installer asks Windows for this tarball by name. It
              // carries the same components as the zip and is verified against
              // the same content records below, so the two containers cannot
              // drift into shipping different bytes under one release.
              additionalArchives: ["kin-windows-x86_64.tar.gz"],
              target: "x86_64-pc-windows-msvc",
              vfsTarget: "x86_64-pc-windows-msvc",
              required: ["kin.exe", "kin-daemon.exe"],
            },
          ];

          const kinCommit = git(root, "rev-parse", "HEAD");
          const kinLockSha = sha256(path.join(root, "Cargo.lock"));
          const vfsRoot = path.join(root, "release-inputs", "kin-vfs");
          const vfsCommit = git(vfsRoot, "rev-parse", "HEAD");
          const vfsLockSha = sha256(path.join(vfsRoot, "Cargo.lock"));
          fail(vfsCommit === process.env.EXPECTED_VFS_COMMIT,
            `kin-vfs checkout ${vfsCommit} does not match pinned ${process.env.EXPECTED_VFS_COMMIT}`);

          const artifacts = specs.map((spec) => {
            const manifestPath = `${spec.artifact}.provenance.json`;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            fail(manifest.schema_version === 2, `${manifestPath} has an unsupported schema`);
            fail(manifest.release_tag === process.env.GITHUB_REF_NAME,
              `${manifestPath} release tag does not match ${process.env.GITHUB_REF_NAME}`);
            fail(manifest.artifact === spec.artifact, `${manifestPath} artifact identity is wrong`);
            fail(manifest.target === spec.target, `${manifestPath} target identity is wrong`);
            fail(manifest.vfs_target === spec.vfsTarget, `${manifestPath} kin-vfs target identity is wrong`);
            fail(manifest.kin?.commit === kinCommit, `${manifestPath} Kin commit does not match the tag`);
            fail(manifest.kin?.cargo_lock_sha256 === kinLockSha,
              `${manifestPath} Kin Cargo.lock hash does not match the tag`);
            fail(manifest.kin?.embedded_dependency_provenance === kinLockSha,
              `${manifestPath} embedded dependency provenance does not match the tagged Cargo.lock`);
            fail(manifest.kin_vfs?.commit === vfsCommit,
              `${manifestPath} kin-vfs commit does not match the pinned checkout`);
            fail(manifest.kin_vfs?.dirty === false,
              `${manifestPath} does not certify a clean kin-vfs checkout`);
            fail(manifest.kin_vfs?.cargo_lock_sha256 === vfsLockSha,
              `${manifestPath} kin-vfs Cargo.lock hash does not match the pinned checkout`);
            fail(manifest.archive?.name === spec.archive, `${manifestPath} archive name is wrong`);
            fail(manifest.archive?.sha256 === sha256(spec.archive),
              `${manifestPath} archive hash does not match the final archive`);
            fail(manifest.archive?.size_bytes === fs.statSync(spec.archive).size,
              `${manifestPath} archive size does not match the final archive`);
            const additionalArchives = manifest.additional_archives ?? [];
            fail(
              JSON.stringify(additionalArchives.map((entry) => entry.name)) ===
                JSON.stringify(spec.additionalArchives ?? []),
              `${manifestPath} does not declare exactly the additional archives ${(spec.additionalArchives ?? []).join(", ") || "(none)"}`);
            for (const entry of additionalArchives) {
              fail(fs.existsSync(entry.name), `${entry.name} is declared but was not published`);
              fail(entry.sha256 === sha256(entry.name),
                `${manifestPath} hash does not match the final ${entry.name}`);
              fail(entry.size_bytes === fs.statSync(entry.name).size,
                `${manifestPath} size does not match the final ${entry.name}`);
            }
            fail(Array.isArray(manifest.archive_contents), `${manifestPath} has no archive content hashes`);
            fail(manifest.workflow?.repository === process.env.GITHUB_REPOSITORY,
              `${manifestPath} repository identity does not match this run`);
            fail(manifest.workflow?.run_id === process.env.GITHUB_RUN_ID,
              `${manifestPath} run ID does not match this run`);
            // Binding the artifact set to this run is what run_id proves, and it
            // is the whole integrity claim available here: artifacts are scoped
            // to a run, so a manifest carrying this run's id was produced by a
            // job of this run. Requiring the ATTEMPT to match as well proved
            // something else entirely, that no partial re-run had happened,
            // which is a liveness condition rather than an integrity one.
            // Re-running failed jobs re-executes only what failed: a build that
            // already succeeded keeps the artifact and manifest it uploaded on
            // its original attempt while this job runs under a later number, so
            // attempt equality refused every release that reached publication
            // through a recovery, and refused it harder on each further retry.
            // A manifest must still name a real attempt of this run, so an
            // artifact cannot claim one that has not happened yet.
            const manifestAttempt = Number(manifest.workflow?.run_attempt);
            const currentAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            fail(
              Number.isInteger(manifestAttempt) &&
                Number.isInteger(currentAttempt) &&
                manifestAttempt >= 1 &&
                manifestAttempt <= currentAttempt,
              `${manifestPath} run attempt ${manifest.workflow?.run_attempt} is not an attempt of this run (current attempt ${process.env.GITHUB_RUN_ATTEMPT})`);

            const { extractRoot, contentRoot } = extractArchive(spec.archive, spec);
            try {
              // Component files carry per-file provenance; the macOS notification
              // bundle is admitted as a sealed directory and is inventoried by the
              // archive digest instead, and so are the documentation members. An
              // installed updater judges the inventory with its own frozen
              // component list and refuses any other name, so a manifest naming
              // a doc file is not a fuller description of the archive, it is a
              // release no managed install can update to: v0.6.2 refused v0.6.3
              // on the first such record. Everything else is refused.
              const classified = classifyReleaseArchiveRoot(contentRoot, {
                target: spec.target,
              });
              const actualNames = classified.files;
              const manifestNames = manifest.archive_contents.map((entry) => entry.name).sort();
              const documented = manifestNames.filter((name) => DOC_FILES.includes(name));
              fail(documented.length === 0,
                `${manifestPath} names documentation the installed updater refuses: ${documented.join(", ")}`);
              fail(JSON.stringify(classified.docs) === JSON.stringify([...DOC_FILES].sort()),
                `${spec.archive} does not carry every documentation member`);
              fail(JSON.stringify(actualNames) === JSON.stringify(manifestNames),
                `${manifestPath} content inventory does not match ${spec.archive}`);
              const records = new Map(manifest.archive_contents.map((entry) => [entry.name, entry]));
              fail(records.size === manifest.archive_contents.length,
                `${manifestPath} contains duplicate content records`);
              const authorityNames = new Set(
                spec.target.includes("-windows-")
                  ? ["kin.exe", "kin-daemon.exe"]
                  : ["kin", "kin-daemon"]
              );
              const expectedVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
              const graphVersions = new Set();
              for (const name of actualNames) {
                const file = path.join(contentRoot, name);
                const record = records.get(name);
                fail(record?.sha256 === sha256(file), `${manifestPath} hash mismatch for ${name}`);
                fail(record?.size_bytes === fs.statSync(file).size, `${manifestPath} size mismatch for ${name}`);
                if (authorityNames.has(name)) {
                  const identity = readUpdateBuildIdentity(file);
                  fail(JSON.stringify(record?.build_identity) === JSON.stringify(identity),
                    `${manifestPath} static build identity mismatch for ${name}`);
                  fail(identity.version === expectedVersion,
                    `${manifestPath} static build version mismatch for ${name}`);
                  fail(identity.commit === kinCommit,
                    `${manifestPath} static build commit mismatch for ${name}`);
                  fail(identity.clean === true && identity.source_known === true,
                    `${manifestPath} static build source is not clean and known for ${name}`);
                  fail(identity.dependency_provenance === kinLockSha,
                    `${manifestPath} static dependency provenance mismatch for ${name}`);
                  graphVersions.add(identity.graph_snapshot_version);
                } else {
                  fail(record?.build_identity === undefined,
                    `${manifestPath} gives non-authority component ${name} a static build identity`);
                }
              }
              for (const required of spec.required) {
                fail(records.has(required), `${spec.archive} is missing required ${required}`);
              }
              fail([...authorityNames].every((name) => records.has(name)),
                `${spec.archive} is missing a static build-identity authority`);
              fail(graphVersions.size === 1,
                `${spec.archive} CLI and daemon graph snapshot identities disagree`);
              // A second container is only honest if it carries the first one's
              // bytes. Compare the extracted components name for name and hash
              // for hash against the records already proven above, so a Windows
              // tarball built from a stale or partial directory fails the
              // release instead of installing something the zip never shipped.
              for (const entry of additionalArchives) {
                const extra = extractArchive(entry.name, spec);
                try {
                  const extraNames = classifyReleaseArchiveRoot(extra.contentRoot, {
                    target: spec.target,
                  }).files;
                  fail(JSON.stringify(extraNames) === JSON.stringify(manifestNames),
                    `${entry.name} does not carry the same components as ${spec.archive}`);
                  for (const name of extraNames) {
                    fail(sha256(path.join(extra.contentRoot, name)) === records.get(name)?.sha256,
                      `${entry.name} ${name} bytes differ from ${spec.archive}`);
                  }
                } finally {
                  fs.rmSync(extra.extractRoot, { recursive: true, force: true });
                }
              }
            } finally {
              fs.rmSync(extractRoot, { recursive: true, force: true });
            }
            return manifest;
          });

          const releaseManifest = {
            schema_version: 2,
            release_tag: process.env.GITHUB_REF_NAME,
            kin: { commit: kinCommit, cargo_lock_sha256: kinLockSha },
            kin_vfs: { commit: vfsCommit, dirty: false, cargo_lock_sha256: vfsLockSha },
            artifacts,
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            },
          };
          fs.writeFileSync("release-provenance.json", `${JSON.stringify(releaseManifest, null, 2)}\n`);
          fs.writeFileSync(
            "release-provenance.json.sha256",
            `${sha256("release-provenance.json")}  release-provenance.json\n`
          );
          NODE
          sha256sum -c release-provenance.json.sha256

      - name: Inspect existing release state without demoting it
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/existing-release.json"
          code="$(curl --disable --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$response" -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "$code" in
            200)
              existing_final="$(jq -r '(.draft == false) and (.prerelease == false)' "$response")"
              if [[ "$GITHUB_REF_NAME" == *-* ]] && [ "$existing_final" = "true" ]; then
                echo "::error::prerelease tag $GITHUB_REF_NAME already exists as a stable GitHub release"
                exit 1
              fi
              ;;
            404)
              existing_final=false
              ;;
            *)
              cat "$response" >&2 || true
              echo "::error::GitHub release lookup returned HTTP $code" >&2
              exit 1
              ;;
          esac
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          echo "existing_final=$existing_final" >> "$GITHUB_OUTPUT"

      - name: Attest final release archives and provenance
        if: ${{ steps.release_state.outputs.existing_final != 'true' }}
        # Fail closed: without a repository attestation, no public prerelease is
        # created and no npm package can be published from these archives.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            kin-linux-x86_64.tar.gz
            kin-linux-aarch64.tar.gz
            kin-macos-x86_64.tar.gz
            kin-macos-aarch64.tar.gz
            kin-windows-x86_64.zip
            kin-windows-x86_64.tar.gz
            release-provenance.json

      - name: Create GitHub Release
        if: ${{ steps.release_state.outputs.existing_final != 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ./release-notes.md
          generate_release_notes: true
          # Every tag starts non-latest so anonymous installation can exercise
          # the public assets without exposing an unproven stable release as
          # /releases/latest. Stable tags are promoted only after install_proof,
          # both automatic OIDC npm publishes, provenance verification, and
          # clean anonymous smoke.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            kin-linux-x86_64.tar.gz
            kin-linux-x86_64.tar.gz.sha256
            kin-linux-aarch64.tar.gz
            kin-linux-aarch64.tar.gz.sha256
            kin-macos-x86_64.tar.gz
            kin-macos-x86_64.tar.gz.sha256
            kin-macos-aarch64.tar.gz
            kin-macos-aarch64.tar.gz.sha256
            kin-windows-x86_64.zip
            kin-windows-x86_64.zip.sha256
            kin-windows-x86_64.tar.gz
            kin-windows-x86_64.tar.gz.sha256
            checksums-sha256.txt
            kin-linux-x86_64.provenance.json
            kin-linux-aarch64.provenance.json
            kin-macos-x86_64.provenance.json
            kin-macos-aarch64.provenance.json
            kin-windows-x86_64.provenance.json
            release-provenance.json
            release-provenance.json.sha256

  # Releases created with GITHUB_TOKEN do not emit a second workflow run.
  # Invoke the reusable anonymous install proof directly after assets are public.
  install_proof:
    name: Public Install Proof
    needs: publish
    # publish intentionally tolerates a skipped optional notarization job. Force
    # this reusable workflow to run after that successful publish instead of
    # inheriting the skipped ancestor, and fail closed on every other outcome.
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    uses: ./.github/workflows/install-proof.yml
    with:
      release_tag: ${{ github.ref_name }}
      expected_vfs_commit: 4ff5262bb345d2d08846b0e8e09abc9fad639aed
    permissions:
      contents: read
      attestations: read

  npm_publish_preflight:
    name: Preflight Both npm Packages
    needs: [publish, install_proof]
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Verify both package states before either write
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix ./packages/kin
          npm test --prefix ./packages/kin-mcp
          for package_dir in ./packages/kin ./packages/kin-mcp; do
            bash scripts/publish-npm-release.sh --preflight \
              "$package_dir" "$GITHUB_REF" "$(git rev-parse HEAD)"
          done

  publish_npm_compatibility:
    name: Publish npm Compatibility Wrapper (@kinlab/kin-mcp)
    needs: [publish, install_proof, npm_publish_preflight]
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        needs.npm_publish_preflight.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Run compatibility wrapper tests
        run: npm test --prefix ./packages/kin-mcp

      - name: Publish final-channel package with Trusted Publishing
        id: npm_publish
        shell: bash
        run: |
          exec bash scripts/publish-npm-release.sh \
            ./packages/kin-mcp "$GITHUB_REF" "$(git rev-parse HEAD)"

      - name: Notify Discord (npm published)
        if: steps.npm_publish.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.npm_publish.outputs.package }}
          VER: ${{ steps.npm_publish.outputs.version }}
          CHANNEL: ${{ steps.npm_publish.outputs.channel }}
          INTEGRITY: ${{ steps.npm_publish.outputs.integrity }}
          SHASUM: ${{ steps.npm_publish.outputs.shasum }}
        run: |
          jq -nc --arg c "📦 \`${PKG}@${VER}\` published automatically through protected npm OIDC on \`${CHANNEL}\`, with expected SRI \`${INTEGRITY}\` and SHA-1 \`${SHASUM}\`. GitHub Latest remains blocked until both npm packages pass anonymous byte, provenance, and install proof." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  publish_npm_canonical:
    name: Publish npm Canonical Package (@kinlab/kin)
    needs: [publish, install_proof, npm_publish_preflight]
    # Both publish jobs are mandatory. A transient failure can make one package
    # public before the other; an idempotent rerun verifies the first and
    # completes the second while GitHub Latest remains blocked.
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        needs.npm_publish_preflight.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Run launcher tests
        run: npm test --prefix ./packages/kin

      - name: Publish final-channel package with Trusted Publishing
        id: npm_publish
        shell: bash
        run: |
          exec bash scripts/publish-npm-release.sh \
            ./packages/kin "$GITHUB_REF" "$(git rev-parse HEAD)"

      - name: Notify Discord (npm published)
        if: steps.npm_publish.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PKG: ${{ steps.npm_publish.outputs.package }}
          VER: ${{ steps.npm_publish.outputs.version }}
          CHANNEL: ${{ steps.npm_publish.outputs.channel }}
          INTEGRITY: ${{ steps.npm_publish.outputs.integrity }}
          SHASUM: ${{ steps.npm_publish.outputs.shasum }}
        run: |
          jq -nc --arg c "📦 \`${PKG}@${VER}\` published automatically through protected npm OIDC on \`${CHANNEL}\`, with expected SRI \`${INTEGRITY}\` and SHA-1 \`${SHASUM}\`. GitHub Latest remains blocked until both npm packages pass anonymous byte, provenance, and install proof." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  verify_npm_published:
    name: Verify Published npm Provenance (${{ matrix.package }})
    needs: [publish_npm_canonical, publish_npm_compatibility, version_tag_image]
    if: >-
      ${{
        always() &&
        needs.publish_npm_canonical.result == 'success' &&
        needs.publish_npm_compatibility.result == 'success' &&
        needs.version_tag_image.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@kinlab/kin"
            package_dir: ./packages/kin
          - package: "@kinlab/kin-mcp"
            package_dir: ./packages/kin-mcp
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: |
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Verify exact public bytes and OIDC provenance
        env:
          PACKAGE: ${{ matrix.package }}
          PACKAGE_DIR: ${{ matrix.package_dir }}
        run: |
          bash scripts/verify-npm-release.sh \
            "$PACKAGE" "${GITHUB_REF_NAME#v}" "$PACKAGE_DIR" \
            "$GITHUB_REF" "$(git rev-parse HEAD)"

  smoke_npm_published:
    name: Anonymous Published npm Smoke (${{ matrix.package }})
    needs: verify_npm_published
    if: >-
      ${{
        always() &&
        needs.verify_npm_published.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@kinlab/kin"
            binary: kin
            surface: canonical
          - package: "@kinlab/kin-mcp"
            binary: kin-mcp
            surface: compatibility
    steps:
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact published version and provision without credentials
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          SURFACE: ${{ matrix.surface }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home"
          : > "$tmp/empty-npmrc"

          env -u NODE_AUTH_TOKEN -u NPM_TOKEN \
            HOME="$tmp/home" \
            NPM_CONFIG_CACHE="$tmp/npm-cache" \
            NPM_CONFIG_USERCONFIG="$tmp/empty-npmrc" \
            npm install --global --prefix "$tmp/prefix" --no-audit --no-fund \
            "${PACKAGE}@${VERSION}"
          launcher="$tmp/prefix/bin/$BINARY"
          test -x "$launcher"

          if [ "$SURFACE" = "canonical" ]; then
            output="$(HOME="$tmp/home" KIN_HOME="$tmp/kin-home" "$launcher" --version)"
            printf '%s\n' "$output"
            case "$output" in
              "kin $VERSION"*) ;;
              *)
                echo "::error::$PACKAGE provisioned a binary that did not report Kin $VERSION"
                exit 1
                ;;
            esac
          else
            kin_bin="$(HOME="$tmp/home" KIN_MCP_CACHE_DIR="$tmp/kin-mcp-cache" "$launcher" --print-bin)"
            daemon_bin="$(HOME="$tmp/home" KIN_MCP_CACHE_DIR="$tmp/kin-mcp-cache" "$launcher" --print-daemon-bin)"
            test -x "$kin_bin"
            test -x "$daemon_bin"
            "$kin_bin" --version
            "$daemon_bin" --version
          fi

  # Update the MCP Registry entry for `ai.kinlab/kin`. The registry is the
  # substrate the other MCP catalogs read, and it validates the npm package the
  # entry points at against live npm, so this runs only after @kinlab/kin-mcp
  # is public at this exact version. Prerelease tags are skipped: the registry
  # treats the newest published version as the current one, and a candidate
  # must not become what a catalog offers.
  #
  # Authority is the DNS door: an Ed25519 key proves control of kinlab.ai
  # through a TXT record. The registry also accepts
  # `./mcp-publisher login http --domain kinlab.ai`, which proves the same
  # namespace from https://kinlab.ai/.well-known/mcp-registry-auth, if that
  # record is ever lost.
  #
  # The whole job is continue-on-error. A registry outage, a lapsed DNS record,
  # or an unset key must never refuse a release that is already public on npm
  # and GitHub, and the registry publishes no uptime or durability guarantee.
  # When the publish does not happen the summary says so plainly, because a
  # green job that published nothing is the failure mode this posture buys.
  publish_mcp_registry:
    name: Publish to the MCP Registry
    needs: publish_npm_compatibility
    if: >-
      ${{
        always() &&
        needs.publish_npm_compatibility.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set the released version in server.json
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          jq -e --arg v "$version" \
            '.version == $v and .packages[0].version == $v' server.json > /dev/null
          # The registry refuses the publish unless package.json's mcpName is
          # exactly server.json's name, and it reports that as a package
          # validation failure rather than as the mismatch it is.
          jq -e --slurpfile pkg packages/kin-mcp/package.json \
            '.name == $pkg[0].mcpName' server.json > /dev/null
          jq -e --slurpfile pkg packages/kin-mcp/package.json \
            '.packages[0].identifier == $pkg[0].name' server.json > /dev/null

      - name: Wait for npm to serve the published version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 12); do
            if [ "$(npm view "@kinlab/kin-mcp@${version}" version 2>/dev/null)" = "$version" ]; then
              echo "npm serves @kinlab/kin-mcp@${version}"
              exit 0
            fi
            [ "$attempt" -eq 12 ] || sleep 10
          done
          echo "::error::npm does not serve @kinlab/kin-mcp@${version} yet; the registry validates against live npm, so nothing was published"
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher
          test -x ./mcp-publisher

      - name: Authenticate to the MCP Registry
        id: registry_login
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_PRIVATE_KEY:-}" ]; then
            echo "::warning::MCP_PRIVATE_KEY is not configured; the MCP Registry entry will not be published"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          ./mcp-publisher login dns --domain kinlab.ai --private-key "$MCP_PRIVATE_KEY"

      - name: Publish the server entry
        id: registry_publish
        if: steps.registry_login.outputs.configured == 'true'
        run: ./mcp-publisher publish

      - name: Read the entry back from the registry
        id: registry_verify
        if: steps.registry_login.outputs.configured == 'true'
        run: |
          set -euo pipefail
          body="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=ai.kinlab")"
          printf '%s\n' "$body" | jq .
          {
            echo "### MCP Registry search for ai.kinlab"
            echo
            echo '```json'
            printf '%s\n' "$body" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$body" \
            | jq -e '[.servers[]? | .server | select(.name == "ai.kinlab/kin")] | length > 0' \
            > /dev/null

      - name: Report the registry outcome
        if: always()
        env:
          CONFIGURED: ${{ steps.registry_login.outputs.configured }}
          PUBLISHED: ${{ steps.registry_publish.outcome }}
          READ_BACK: ${{ steps.registry_verify.outcome }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "${PUBLISHED:-}" = "success" ] && [ "${READ_BACK:-}" = "success" ]; then
            {
              echo "### MCP Registry"
              echo
              echo "\`ai.kinlab/kin\` ${version} is published and reads back from the registry."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### MCP Registry"
            echo
            echo "**The MCP Registry publish did NOT happen for ${GITHUB_REF_NAME}.**"
            echo
            echo "- credential configured: ${CONFIGURED:-no}"
            echo "- publish step: ${PUBLISHED:-did not run}"
            echo "- read back step: ${READ_BACK:-did not run}"
            echo
            echo "The release itself is unaffected. npm, GitHub, the installers, and the images do not depend on this entry, which is why this job cannot refuse a release. Rerun this job, or run mcp-publisher by hand, once the cause is fixed."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize_release:
    name: Promote Proven Release
    needs: [publish, install_proof, version_tag_image, smoke_npm_published]
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        needs.version_tag_image.result == 'success' &&
        needs.smoke_npm_published.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    # Whether this release actually became GitHub Latest, for the jobs whose
    # whole meaning is "this IS Latest". They gate on it rather than on this
    # job's conclusion, because a release held as a prerelease for want of
    # first-contact proof is a SUCCESSFUL run of this job and a release that
    # must not move GHCR's `latest` or be sealed as a completed stable release.
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      stranger_state: ${{ steps.proof.outputs.stranger_state }}
    permissions:
      contents: write
      # Resolving the pull request behind the tagged commit, which is how the
      # proof gate below bridges a squash back to the candidate that was proven.
      pull-requests: read
    steps:
      - name: Checkout release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The same evidence release-tag.yml requires before it writes the tag ref,
      # required again here against the tag actually being promoted. The mint's
      # gate protects the path the mint owns; this one protects every other path
      # into Latest, because a tag reaches Latest through this job no matter how
      # it was minted. On 2026-08-20 v0.5.44 reached Latest with no preflight
      # record and no stranger run, and nothing in the release chain knew the
      # proof loop existed.
      #
      # The tagged commit IS the candidate now: the mint selects the newest main
      # commit the proof loop recorded and tags that exact sha, so the direct key
      # resolves and this job asks about the same object the mint did.
      #
      # RESOLVE_FROM_COMMIT stays beside it, and it is worth being exact about
      # what it still buys, because the obvious answer is wrong. It is NOT that
      # Release Recovery can re-run a tag cut before the rekey: a tag run
      # resolves its workflows AND its scripts from the tag, so recovering such
      # a tag re-runs that tag's own frozen copy of this job and of the gate,
      # and never reaches this line. What it buys is the sentence a refusal
      # carries. The gate tries the direct key first and bridges only when the
      # record is ABSENT; an unreadable record still fails closed. A tag whose
      # record went missing therefore refuses by naming the branch it came from
      # rather than only the file it could not find, and a commit no merged
      # pull request produced resolves to nothing and is refused, which is the
      # intended answer for a hand-pushed tag.
      #
      # The identity check below is what the mint already makes before it
      # writes the tag ref, mirrored here. Without it a bridged answer would
      # promote a tag on evidence about a different commit and a different
      # tree, which is exactly the approximation this rekey removes. With it,
      # a bridged answer can only ever shape a refusal; it can no longer admit
      # one.
      #
      # WHY THIS GATE READS `preflight` AND STILL BLOCKS LATEST.
      #
      # `require: preflight` does not lower this job's bar. It changes what an
      # ABSENT stranger record does: instead of throwing here, it comes back as
      # a reported pending state that the steps below act on. Every other
      # stranger failure -- unreadable, about another build, an incomplete arm,
      # bytes no preflight leg judged -- still throws exactly as before.
      #
      # The distinction the release chain now makes is between a tag and Latest.
      # A tag is an artifact somebody must name to install. Latest is what an
      # installer resolves when a stranger types the install line, so Latest is
      # the claim of first-contact coverage and Latest is where the stranger
      # record is required. A pending release is published, installable, and
      # marked prerelease until its record lands.
      - name: Require proof-loop artifacts for the tagged candidate
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          RESOLVE_FROM_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gate="${GITHUB_WORKSPACE}/scripts/check-release-proof-artifacts.mjs"
          test -s "$gate"
          # The gate's narration goes to stderr so stdout carries exactly the
          # sha it verified and nothing the comparison below could mistake for
          # one, and a refusal is reported as the sentence naming what was
          # missing rather than as a stack trace. The rest of the result goes to
          # a file for the same reason.
          record="$RUNNER_TEMP/release-proof.json"
          proven="$(KIN_RELEASE_GATE="file://${gate}" \
            KIN_RELEASE_REQUIRE=preflight \
            KIN_RELEASE_RECORD="$record" \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              const { main } = await import(process.env.KIN_RELEASE_GATE);
              try {
                const result = await main({
                  log: (line) => process.stderr.write(line + "\n"),
                });
                writeFileSync(process.env.KIN_RELEASE_RECORD, JSON.stringify(result));
                process.stdout.write(result.sha);
              } catch (error) {
                process.stderr.write("::error::" + error.message + "\n");
                process.exit(1);
              }
            ')"
          if ! printf '%s' "$proven" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the release proof gate returned '${proven}', which is not a candidate sha"
            exit 1
          fi
          if [ "$proven" != "$CANDIDATE_SHA" ]; then
            echo "::error::the proof gate verified $proven but this job promotes $CANDIDATE_SHA; refusing to flip a tag to Latest on evidence about a different commit"
            exit 1
          fi
          state="$(STATE_RECORD="$record" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync(process.env.STATE_RECORD, "utf8"));
            const s = r.stranger ?? {};
            const driver = s.driver?.endpoint ?? "unrecorded";
            process.stdout.write([s.state ?? "unknown", driver, (s.arms ?? []).join("+") || "none"].join(" "));
          ')"
          read -r stranger_state stranger_driver stranger_arms <<< "$state"
          case "$stranger_state" in
            complete|pending) ;;
            *) echo "::error::the proof gate reported stranger state '${stranger_state}', which this job does not know how to act on"; exit 1 ;;
          esac
          {
            echo "stranger_state=$stranger_state"
            echo "stranger_driver=$stranger_driver"
            echo "stranger_arms=$stranger_arms"
          } >> "$GITHUB_OUTPUT"
          echo "release proof records verified for $CANDIDATE_SHA, the commit this job promotes"
          if [ "$stranger_state" = pending ]; then
            echo "::warning::first-contact proof is PENDING for ${GITHUB_REF_NAME}; this release stays a prerelease and will not become GitHub Latest until its stranger.env lands"
          else
            echo "::notice::first-contact proof complete on arms ${stranger_arms}, driven on the ${stranger_driver} endpoint"
          fi

      # The release says what it is missing, in the release, where a human
      # reading it will see it. A gap that lives only in a CI annotation is a
      # gap nobody outside this run can see, and a prerelease with no
      # explanation reads as an accident rather than as a decision.
      - name: Record the missing first-contact proof on the release itself
        # Stable tags only. A prerelease TAG is a prerelease because that is
        # what it is, not because proof is missing, and it never becomes Latest
        # whatever its record says, so the notice would be answering a question
        # nobody installing an rc is asking.
        if: >-
          ${{
            steps.proof.outputs.stranger_state == 'pending' &&
            !contains(github.ref_name, '-')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- kin-first-contact-proof -->'
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          # Idempotent: a recovery re-run of this job must not stack the notice.
          if printf '%s' "$body" | grep -qF "$marker"; then
            echo "the release already carries the first-contact notice"
            exit 0
          fi
          # Unquoted heredoc on purpose: the marker has exactly one definition
          # and the notice interpolates it, so the grep above and the text below
          # cannot drift into an idempotency check that never matches. There is
          # no other expansion in this text.
          cat > "$RUNNER_TEMP/release-body.md" <<NOTE
          ${marker}
          > **First-contact proof pending.** This release cleared the machine preflight on its
          > own bytes. It has NOT been through the stranger arms (green, brown, vcs) that
          > measure what a first-time user actually meets. It ships and is promoted anyway,
          > so this notice is how you tell it apart from a release that was measured.

          NOTE
          printf '%s\n' "$body" >> "$RUNNER_TEMP/release-body.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-body.md"

      # First contact is a LABEL, not a gate (founder decision 2026-09-03:
      # "I dont even want that to block. If I run out of limit. Ship anyways.
      # Stranger is nice to have."). Latest used to require the stranger record
      # here, which meant an offline runner or a spent weekly limit could keep a
      # finished, installable release off /releases/latest indefinitely while
      # every machine signal was green. It now says what it is missing, on the
      # release body and in this summary, and promotes. `promoted` is still
      # written explicitly, because a downstream job reading an unset output
      # cannot tell a decision from a step that never ran.
      - name: Promote stable tag after public and npm proof
        id: promote
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STRANGER_STATE: ${{ steps.proof.outputs.stranger_state }}
        run: |
          set -euo pipefail
          if [ "$STRANGER_STATE" != complete ]; then
            echo "::warning::promoting ${GITHUB_REF_NAME} with first-contact proof ${STRANGER_STATE}: nothing has measured what a first-time user meets"
            {
              echo "### Promoted with first contact ${STRANGER_STATE}"
              echo
              echo "\`${GITHUB_REF_NAME}\` becomes GitHub Latest on its machine preflight alone."
              echo "Its stranger record is \`${STRANGER_STATE}\`, so nothing here has been through the"
              echo "green, brown and vcs first-contact arms. The release body carries that notice, and"
              echo "this is the label rather than a hold."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::promoting ${GITHUB_REF_NAME} with first-contact proof complete"
          fi
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          channel="$(node scripts/release-order.mjs channel "$version")"
          for package in @kinlab/kin @kinlab/kin-mcp; do
            npm_version="$(node scripts/release-order.mjs npm-channel "$package" "$channel")"
            if [ "$npm_version" != "$version" ]; then
              echo "::error::npm ${package}@${channel} moved to ${npm_version}; GitHub Latest remains blocked"
              exit 1
            fi
          done
          current_tag="$(node scripts/release-order.mjs github-latest "$GITHUB_REPOSITORY")"
          current_version="${current_tag#v}"
          node scripts/release-order.mjs assert-not-rollback \
            "$version" "$current_version" "GitHub Latest"

          if [ "$current_tag" != "$GITHUB_REF_NAME" ]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi

      - name: Verify final release channel
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.prerelease')"
          expected=true
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            # Read the promote step's own output rather than the tag shape.
            # Every stable tag is promoted now, whatever its first-contact
            # record says, so this reads true on that path; keeping the output
            # as the source means a promotion that silently failed to happen
            # still fails here rather than being assumed from the tag name.
            *) [ "${PROMOTED:-}" = true ] && expected=false ;;
          esac
          if [ "$actual" != "$expected" ]; then
            echo "::error::release prerelease=$actual, expected $expected after proof"
            exit 1
          fi
          if [ "$expected" = "false" ]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [ "$latest" != "$GITHUB_REF_NAME" ]; then
              echo "::error::GitHub Latest resolved to $latest, expected $GITHUB_REF_NAME"
              exit 1
            fi
          fi

  # Move GHCR's mutable convenience tag only after every stable release proof
  # has succeeded and GitHub Latest names this exact tag. The commit and
  # version tags remain the immutable authority; `latest` is a verified alias
  # to that already-attested digest and is never rebuilt here.
  promote_ghcr_latest:
    name: Promote stable ghcr latest
    needs: [config, finalize_release, version_tag_image, build_daemon_image, attest_daemon_image]
    if: >-
      ${{
        always() &&
        needs.config.result == 'success' &&
        needs.finalize_release.result == 'success' &&
        needs.version_tag_image.result == 'success' &&
        needs.build_daemon_image.result == 'success' &&
        needs.attest_daemon_image.result == 'success' &&
        needs.config.outputs.release_channel == 'latest' &&
        needs.finalize_release.outputs.promoted == 'true' &&
        startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-')
      }}
    runs-on: ubuntu-latest
    environment: release
    # Least privilege for one registry-side tag move plus readback of the
    # existing OCI attestation. This job cannot create releases or attestations.
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote the proven stable digest to ghcr latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/firelock-ai/kin
          EXPECTED_COMMIT: ${{ needs.build_daemon_image.outputs.commit }}
          EXPECTED_SOURCE_DIGEST: ${{ needs.build_daemon_image.outputs.digest }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$GITHUB_REF_NAME" \
            | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$GITHUB_REF_NAME is not an exact stable release tag"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::release ref $GITHUB_REF does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          channel="$(node scripts/release-order.mjs channel "$VERSION")"
          if [ "$channel" != "latest" ]; then
            echo "::error::$GITHUB_REF_NAME resolved to release channel $channel, not latest"
            exit 1
          fi

          COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "$COMMIT" != "$checkout_commit" ]; then
            echo "::error::release tag peels to $COMMIT, checkout resolved to $checkout_commit"
            exit 1
          fi
          if [ "$COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::release tag peels to $COMMIT, image job resolved to $EXPECTED_COMMIT"
            exit 1
          fi
          if ! printf '%s\n' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release tag did not resolve to a full commit id"
            exit 1
          fi
          if ! printf '%s\n' "$EXPECTED_SOURCE_DIGEST" \
            | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::image job did not provide an exact sha256 digest"
            exit 1
          fi

          SRC="${IMAGE}:${COMMIT}"
          VERSION_TAG="${IMAGE}:${VERSION}"
          V_VERSION_TAG="${IMAGE}:${GITHUB_REF_NAME}"
          LATEST="${IMAGE}:latest"

          inspect_digest() {
            local reference="$1"
            local output
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$reference" \
                --format '{{.Manifest.Digest}}' 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$output" = "ERROR: ${reference}: not found" ]; then
                return 44
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                echo "::error::could not establish registry state for $reference" >&2
                return 1
              fi
              sleep $(( attempt * 2 ))
            done
          }

          resolve_required_digest() {
            local reference="$1"
            local label="$2"
            local digest
            local status
            if digest="$(inspect_digest "$reference")"; then
              :
            else
              status=$?
              if [ "$status" -eq 44 ]; then
                echo "::error::$label $reference does not exist" >&2
              fi
              return "$status"
            fi
            if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$label $reference did not resolve to an exact sha256 digest" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          wait_for_expected_digest() {
            local reference="$1"
            local expected="$2"
            local label="$3"
            local digest="<missing>"
            local status
            local matching_reads=0
            for attempt in $(seq 1 12); do
              if digest="$(inspect_digest "$reference")"; then
                if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                  echo "::error::$label $reference did not resolve to an exact sha256 digest" >&2
                  return 1
                fi
                if [ "$digest" = "$expected" ]; then
                  matching_reads=$((matching_reads + 1))
                  if [ "$matching_reads" -eq 2 ]; then
                    printf '%s\n' "$digest"
                    return 0
                  fi
                else
                  matching_reads=0
                fi
              else
                status=$?
                if [ "$status" -ne 44 ]; then
                  return "$status"
                fi
                digest="<missing>"
                matching_reads=0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 2
              fi
            done
            echo "::error::$label $reference did not converge to $expected; last observed $digest" >&2
            return 1
          }

          verify_stable_release_authority() {
            local latest_tag
            local prerelease
            latest_tag="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [ "$latest_tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::GitHub Latest moved to $latest_tag; expected $GITHUB_REF_NAME"
              return 1
            fi
            prerelease="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '.prerelease')"
            if [ "$prerelease" != "false" ]; then
              echo "::error::$GITHUB_REF_NAME is prerelease=$prerelease, expected false"
              return 1
            fi
          }

          verify_attestation() {
            local digest="$1"
            local verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify \
                "oci://${IMAGE}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle-from-oci \
                --predicate-type https://slsa.dev/provenance/v1 \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --signer-digest "$COMMIT" \
                --source-digest "$COMMIT" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners; then
                verified=true
                break
              fi
              sleep $(( attempt * 2 ))
            done
            if [ "$verified" != true ]; then
              echo "::error::could not verify the exact daemon image attestation"
              return 1
            fi
          }

          verify_immutable_authority() {
            local phase="$1"
            local actual_source
            local actual_version
            local actual_v_version
            actual_source="$(resolve_required_digest "$SRC" "$phase source")"
            if [ "$actual_source" != "$EXPECTED_SOURCE_DIGEST" ]; then
              echo "::error::$phase $SRC resolved to $actual_source, expected $EXPECTED_SOURCE_DIGEST"
              return 1
            fi
            actual_version="$(resolve_required_digest "$VERSION_TAG" "$phase version tag")"
            actual_v_version="$(resolve_required_digest "$V_VERSION_TAG" "$phase v-version tag")"
            if [ "$actual_version" != "$EXPECTED_SOURCE_DIGEST" ] || \
              [ "$actual_v_version" != "$EXPECTED_SOURCE_DIGEST" ]; then
              echo "::error::$phase version tags do not resolve to $EXPECTED_SOURCE_DIGEST"
              return 1
            fi
            bash scripts/verify-container-build-info.sh \
              "${IMAGE}@${actual_source}" "$COMMIT"
            verify_attestation "$actual_source"
          }

          # Initial fail-closed admission. Finalization must already have made
          # this exact stable tag GitHub Latest, and every immutable image
          # identity must still resolve to the build job's attested digest.
          verify_stable_release_authority
          verify_immutable_authority "initial"

          initial_latest_state=missing
          initial_latest_digest=""
          if initial_latest_digest="$(inspect_digest "$LATEST")"; then
            initial_latest_state=present
            if ! printf '%s\n' "$initial_latest_digest" \
              | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$LATEST did not resolve to an exact sha256 digest"
              exit 1
            fi
          else
            inspect_status=$?
            if [ "$inspect_status" -ne 44 ]; then
              exit "$inspect_status"
            fi
          fi

          action="Verified existing"
          mutation_required=true
          if [ "$initial_latest_digest" = "$EXPECTED_SOURCE_DIGEST" ]; then
            mutation_required=false
          fi

          if [ "$mutation_required" = true ]; then
            # Recheck every authority immediately before the sole mutable write.
            # A concurrent correct promotion is idempotently accepted. Changes
            # observed before the write fail closed; GHCR offers no atomic
            # compare-and-swap, so bounded post-write convergence checks guard
            # the remaining read/write race window.
            verify_stable_release_authority
            verify_immutable_authority "pre-write"

            prewrite_latest_state=missing
            prewrite_latest_digest=""
            if prewrite_latest_digest="$(inspect_digest "$LATEST")"; then
              prewrite_latest_state=present
              if ! printf '%s\n' "$prewrite_latest_digest" \
                | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::pre-write $LATEST did not resolve to an exact sha256 digest"
                exit 1
              fi
            else
              inspect_status=$?
              if [ "$inspect_status" -ne 44 ]; then
                exit "$inspect_status"
              fi
            fi

            if [ "$prewrite_latest_digest" = "$EXPECTED_SOURCE_DIGEST" ]; then
              mutation_required=false
              action="Verified concurrent"
            elif [ "$prewrite_latest_state" != "$initial_latest_state" ] || \
              [ "$prewrite_latest_digest" != "$initial_latest_digest" ]; then
              echo "::error::$LATEST changed from ${initial_latest_state}:${initial_latest_digest:-<missing>} to ${prewrite_latest_state}:${prewrite_latest_digest:-<missing>} during admission"
              exit 1
            fi

            if [ "$mutation_required" = true ]; then
              # Last-moment rollback and source checks bound the remaining race
              # window before the one registry mutation in this job.
              verify_stable_release_authority
              prewrite_source_digest="$(resolve_required_digest "$SRC" "pre-write source recheck")"
              if [ "$prewrite_source_digest" != "$EXPECTED_SOURCE_DIGEST" ]; then
                echo "::error::pre-write source moved to $prewrite_source_digest"
                exit 1
              fi

              final_prewrite_latest_state=missing
              final_prewrite_latest_digest=""
              if final_prewrite_latest_digest="$(inspect_digest "$LATEST")"; then
                final_prewrite_latest_state=present
                if ! printf '%s\n' "$final_prewrite_latest_digest" \
                  | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                  echo "::error::final pre-write $LATEST did not resolve to an exact sha256 digest"
                  exit 1
                fi
              else
                inspect_status=$?
                if [ "$inspect_status" -ne 44 ]; then
                  exit "$inspect_status"
                fi
              fi

              if [ "$final_prewrite_latest_digest" = "$EXPECTED_SOURCE_DIGEST" ]; then
                mutation_required=false
                action="Verified concurrent"
              elif [ "$final_prewrite_latest_state" != "$prewrite_latest_state" ] || \
                [ "$final_prewrite_latest_digest" != "$prewrite_latest_digest" ]; then
                echo "::error::$LATEST changed from ${prewrite_latest_state}:${prewrite_latest_digest:-<missing>} to ${final_prewrite_latest_state}:${final_prewrite_latest_digest:-<missing>} during final admission"
                exit 1
              fi

              if [ "$mutation_required" = true ]; then
                docker buildx imagetools create \
                  --prefer-index=false \
                  --tag "$LATEST" \
                  "${IMAGE}@${EXPECTED_SOURCE_DIGEST}"
                action="Promoted"
              fi
            fi
          fi

          # Post-write verification is mandatory on both the mutation and
          # idempotent rerun paths. Resolve through :latest itself, then verify
          # its embedded build identity and the immutable digest's attestation.
          verify_stable_release_authority
          verify_immutable_authority "post-write"
          actual_latest_digest="$(wait_for_expected_digest \
            "$LATEST" "$EXPECTED_SOURCE_DIGEST" "post-write latest")"
          bash scripts/verify-container-build-info.sh "$LATEST" "$COMMIT"
          verify_attestation "$actual_latest_digest"
          wait_for_expected_digest \
            "$LATEST" "$EXPECTED_SOURCE_DIGEST" "final latest readback" \
            >/dev/null

          {
            echo "${action} stable daemon image alias:"
            echo ""
            echo "- GitHub Latest: \`${GITHUB_REF_NAME}\`"
            echo "- source: \`${SRC}\`"
            echo "- destination: \`${LATEST}\`"
            echo "- digest: \`${EXPECTED_SOURCE_DIGEST}\`"
            echo "- no image was rebuilt"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_boundary_contracts:
    name: Post-release boundary contracts publish
    needs: [publish, install_proof, finalize_release]
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        needs.finalize_release.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    # The public release is already final. This private-registry integration is
    # observable follow-up work, not a gate that can falsely imply rollback.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 20

      - name: Publish @kin/boundary-contracts to KinLab registry
        id: publish-boundary
        shell: bash
        run: |
          if [ -z "${KINLAB_NPM_TOKEN:-}" ]; then
            echo "KINLAB_NPM_TOKEN is not configured; skipping KinLab registry publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node ./scripts/publish-boundary-contracts.mjs
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ github.ref_name }}
          KINLAB_NPM_TOKEN: ${{ secrets.KINLAB_NPM_TOKEN }}
          KINLAB_NPM_REGISTRY_URL: ${{ vars.KINLAB_NPM_REGISTRY_URL }}
          KINLAB_NPM_DIST_TAG: ${{ contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'rc' || 'latest' }}

      - name: Notify Discord (KinLab registry publish)
        if: steps.publish-boundary.outputs.published == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF: ${{ github.ref_name }}
        run: |
          jq -nc --arg c "📦 \`@kin/boundary-contracts\` ${REF} published to the **KinLab registry**." '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  # Promote the immutable commit image built by this release workflow so
  # operators can pin a version (`docker pull ghcr.io/firelock-ai/kin:0.2.7`).
  # No main-push workflow, GCP identity, or mutable latest tag participates.
  version_tag_image:
    name: Version-tag ghcr image
    needs: [publish, install_proof, build_daemon_image, attest_daemon_image]
    # Only tag real version pushes after every direct authority input succeeds.
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.install_proof.result == 'success' &&
        needs.build_daemon_image.result == 'success' &&
        needs.attest_daemon_image.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    environment: release
    # Least privilege: read the repo (to peel the tag to its commit) and push
    # tags to ghcr, not the workflow-level `contents: write`.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Version-tag the release commit's daemon image (no rebuild)
        env:
          IMAGE: ghcr.io/firelock-ai/kin
          EXPECTED_COMMIT: ${{ needs.build_daemon_image.outputs.commit }}
          EXPECTED_SOURCE_DIGEST: ${{ needs.build_daemon_image.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Peel with git rather than trusting github.sha, whose value for an
          # annotated tag is the tag object rather than the target commit.
          COMMIT="$(git rev-parse HEAD)"
          if [ "$COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::release checkout resolved to $COMMIT, image job resolved to $EXPECTED_COMMIT"
            exit 1
          fi
          SRC="${IMAGE}:${COMMIT}"

          source_digest="$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')"
          case "$source_digest" in
            sha256:*) ;;
            *)
              echo "::error::could not resolve an immutable manifest digest for $SRC"
              exit 1
              ;;
          esac
          if [ "$source_digest" != "$EXPECTED_SOURCE_DIGEST" ]; then
            echo "::error::$SRC moved from release-built $EXPECTED_SOURCE_DIGEST to $source_digest"
            exit 1
          fi

          # Version tags are immutable release identities. A rerun may observe
          # an already-correct tag, but it must never overwrite a mismatched
          # digest even when the source commit tag still exists.
          inspect_destination_digest() {
            local destination="$1"
            local output
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$destination" \
                --format '{{.Manifest.Digest}}' 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi

              # This is the exact GHCR/buildx response for an absent manifest.
              # Any auth, transport, rate-limit, or unrecognized registry error
              # remains fatal instead of being treated as permission to write.
              if [ "$output" = "ERROR: ${destination}: not found" ]; then
                return 44
              fi
              if [ "$attempt" -eq 5 ]; then
                printf '%s\n' "$output" >&2
                echo "::error::could not establish immutable state for $destination" >&2
                return 1
              fi
              sleep $(( attempt * 2 ))
            done
          }

          destinations=("${IMAGE}:${VERSION}" "${IMAGE}:${GITHUB_REF_NAME}")
          missing_destinations=()
          for destination in "${destinations[@]}"; do
            if existing_digest="$(inspect_destination_digest "$destination")"; then
              if [ "$existing_digest" != "$source_digest" ]; then
                echo "::error::$destination already points at $existing_digest, expected immutable $source_digest"
                exit 1
              fi
            else
              inspect_status=$?
              if [ "$inspect_status" -ne 44 ]; then
                exit "$inspect_status"
              fi
              missing_destinations+=("$destination")
            fi
          done

          # Registry-side manifest copy: `:<version>` and `:v<version>` become
          # references to the exact commit-image digest. No layers are rebuilt,
          # no already-existing tag is rewritten, and prefer-index=false keeps
          # a single-platform source manifest's digest unchanged.
          if [ "${#missing_destinations[@]}" -gt 0 ]; then
            tag_args=()
            for destination in "${missing_destinations[@]}"; do
              tag_args+=(--tag "$destination")
            done
            docker buildx imagetools create \
              --prefer-index=false \
              "${tag_args[@]}" \
              "${IMAGE}@${source_digest}"
          fi

          for destination in "${destinations[@]}"; do
            actual_digest="$(inspect_destination_digest "$destination")"
            if [ "$actual_digest" != "$source_digest" ]; then
              echo "::error::$destination resolved to $actual_digest after tagging, expected $source_digest"
              exit 1
            fi
          done
          {
            echo "Version-tagged the release daemon image (no rebuild):"
            echo ""
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo "- source: \`${SRC}\`"
            echo "- digest: \`${source_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  seal_release_completion:
    name: Seal completed stable release
    needs:
      - config
      - build_daemon_image
      - finalize_release
      - promote_ghcr_latest
      - publish_boundary_contracts
      - version_tag_image
    if: >-
      ${{
        always() &&
        needs.config.result == 'success' &&
        needs.build_daemon_image.result == 'success' &&
        needs.finalize_release.result == 'success' &&
        needs.promote_ghcr_latest.result == 'success' &&
        needs.publish_boundary_contracts.result == 'success' &&
        needs.version_tag_image.result == 'success' &&
        needs.config.outputs.release_channel == 'latest' &&
        needs.finalize_release.outputs.promoted == 'true' &&
        startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact completed release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate deterministic completion marker
        env:
          GHCR_DIGEST: ${{ needs.build_daemon_image.outputs.digest }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [ "$commit" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" ]
          [[ "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          jq -nS \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$commit" \
            --arg release_workflow_run_id "$GITHUB_RUN_ID" \
            --arg ghcr_digest "$GHCR_DIGEST" \
            '{
              schema_version: 1,
              release_tag: $tag,
              commit: $commit,
              release_workflow_run_id: $release_workflow_run_id,
              signer_workflow: ".github/workflows/release.yml",
              ghcr_digest: $ghcr_digest,
              completed_capstones: [
                "github_stable_latest",
                "install_proof",
                "npm_public_provenance_and_smoke",
                "ghcr_version_and_latest",
                "post_release_boundary_contracts_settled"
              ]
            }' > release-promotion.json
          sha256sum release-promotion.json > release-promotion.json.sha256
          sha256sum -c release-promotion.json.sha256

      - name: Refuse mismatched existing completion assets
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          marker_id="$(jq -r '[.assets[] | select(.name == "release-promotion.json")] | if length > 1 then error("duplicate marker assets") else .[0].id // empty end' <<< "$release")"
          sidecar_id="$(jq -r '[.assets[] | select(.name == "release-promotion.json.sha256")] | if length > 1 then error("duplicate marker sidecars") else .[0].id // empty end' <<< "$release")"
          marker_present=false
          sidecar_present=false
          if [ -n "$marker_id" ]; then
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${marker_id}" \
              > existing-release-promotion.json
            cmp release-promotion.json existing-release-promotion.json
            marker_present=true
          fi
          if [ -n "$sidecar_id" ]; then
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${sidecar_id}" \
              > existing-release-promotion.json.sha256
            cmp release-promotion.json.sha256 existing-release-promotion.json.sha256
            sidecar_present=true
          fi
          {
            echo "marker_present=$marker_present"
            echo "sidecar_present=$sidecar_present"
          } >> "$GITHUB_OUTPUT"

      - name: Attest terminal completion marker
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-promotion.json

      - name: Publish missing completion assets
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_PRESENT: ${{ steps.existing.outputs.marker_present }}
          SIDECAR_PRESENT: ${{ steps.existing.outputs.sidecar_present }}
        run: |
          set -euo pipefail
          assets=()
          [ "$MARKER_PRESENT" = true ] || assets+=(release-promotion.json)
          [ "$SIDECAR_PRESENT" = true ] || assets+=(release-promotion.json.sha256)
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              "${assets[@]}"
          fi

      - name: Verify public terminal completion proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/release-completion-proof"
          mkdir -p "$proof_dir"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern release-promotion.json \
            --pattern release-promotion.json.sha256 \
            --dir "$proof_dir"
          (
            cd "$proof_dir"
            sha256sum -c release-promotion.json.sha256
            cmp release-promotion.json "$GITHUB_WORKSPACE/release-promotion.json"
          )

          verified=false
          for attempt in $(seq 1 18); do
            if gh attestation verify "$proof_dir/release-promotion.json" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json > "$proof_dir/attestation.json"; then
              verified=true
              break
            fi
            [ "$attempt" -eq 18 ] || sleep 10
          done
          [ "$verified" = true ]
          jq -e '
            length > 0 and
            all(.[];
              (.verificationResult.verifiedTimestamps | type == "array" and length > 0)
            )
          ' "$proof_dir/attestation.json" >/dev/null
