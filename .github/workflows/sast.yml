name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Sha-scoped on main for the same reason as ci.yml: `cancel-in-progress: false`
# keeps at most one PENDING run per group and cancels the older one, so two
# quick pushes to main can delete the earlier commit's run outright. This
# workflow publishes `cargo-deny`, a required context that release-tag.yml
# demands with push-event provenance, so a dropped run here makes the commit
# unmintable. The suffix is empty off main, leaving pull-request and
# merge-queue supersession exactly as it was.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Mirror of ci.yml's diff classifier: cargo-deny resolves the full
  # dependency graph, which documentation-only and workflow-only changes
  # cannot alter. Fail closed: any classifier failure or non-pull_request
  # event reports docs_only=false and the gated job runs.
  changes:
    name: Classify diff scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            if [ -n "$changed" ]; then
              docs_only=true
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml) docs_only=false; break ;;
                  *.md | docs/*) ;;
                  .github/workflows/*) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$changed"
            fi
            printf '%s\n' "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16

      - name: Verify kin cargo registry config
        # cargo-deny resolves the full dependency graph via `cargo metadata`.
        # Preserve the tracked config because it carries public Git [patch.kin]
        # pins for kin-* crates that are not all registry-published yet.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # Install the release binary directly instead of running
      # EmbarkStudios/cargo-deny-action, which is a Docker action whose image is
      # built from docker.io on every run. A Docker Hub outage therefore failed
      # this job for reasons unrelated to the dependency graph, and because
      # cargo-deny is a required context the failure permanently refused the
      # release commit it ran against. taiki-e/install-action fetches the same
      # upstream release artifact the action's Dockerfile downloads, verifies it
      # against a checksum pinned in the action at the sha below, and touches no
      # container registry.
      - name: Install cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny
        # Byte-for-byte the argv the replaced action's entrypoint assembled from
        # its input defaults, so the check set is unchanged. A bare `check` with
        # no subset still runs advisories, bans, licenses, and sources, and
        # `--all-features` keeps resolving the full feature graph rather than
        # the narrower one deny.toml's [graph] section would select.
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
