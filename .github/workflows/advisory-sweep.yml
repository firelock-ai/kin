name: Advisory Sweep

# Land the lock bump for a freshly published RustSec advisory before a merge
# group ever sees the advisory.
#
# cargo-deny's advisories check is resolved against the RustSec database it
# fetches at run time, so it is the one required context whose verdict is not a
# function of the merge candidate. An advisory that publishes between a pull
# request's own SAST run and its merge-group run turns the group red, and the
# hosted queue then drops an entry that introduced neither the dependency nor
# the advisory while marking nothing on it. RUSTSEC-2026-0258 (h2 0.4.15) did
# that to kin#893 on 2026-08-18, 87 seconds after admission, during the v0.5.39
# release, and the fix was a lockfile-only bump that had to land first.
#
# Weakening the merge-group check was the obvious alternative and is refused in
# sast.yml, because it is the one gate that reads the merged tree. Closing the
# window instead of the eye is what this workflow is for.
on:
  schedule:
    # Every three hours at :13, which is off the release train (:07,:22,:37,:52),
    # recovery (:03,:18,:33,:48) and mint (:11,:26,:41,:56) minutes, so the
    # sweep never contends with a release cycle for the runner or for the
    # branch it writes.
    - cron: "13 */3 * * *"
  # `repository_dispatch` rather than `workflow_dispatch`, and not by taste. A
  # workflow_dispatch caller selects the ref, and GitHub resolves the workflow
  # FILE from that ref, so any branch could rewrite this file and run it while
  # holding the release App key. No guard written inside the file can close
  # that, because the guard would be on the attacker's branch too. This repo
  # already refuses the combination: test-release-workflow-authority.py fails
  # any workflow that pairs a branch-selectable dispatch trigger with a
  # KIN_*_APP_ID or private key, and it matches that trigger as a literal
  # string, so naming it here would trip the guard this workflow obeys.
  # which is why release-tag.yml takes its manual path the same way. Trigger a
  # sweep by hand with:
  #   gh api repos/firelock-ai/kin/dispatches -f event_type=advisory-sweep
  repository_dispatch:
    types: [advisory-sweep]

permissions:
  contents: read

# Never two sweeps at once. Both would resolve the same advisory and race to
# force-update one branch, and the loser would push a lock built from a tree
# the winner had already moved.
concurrency:
  group: kin-advisory-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The kin-release-bot App credentials are scoped to this environment, and a
    # job only resolves them when it declares it. Same binding release-tag.yml
    # and release-train.yml use, and the same deployment branch policy, which
    # admits main only.
    environment: release-tag
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Guard trigger authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Same reviewed actor set release-tag.yml admits for its manual path.
          ALLOWED_ACTORS: |
            troyjr4103
            kin-release-bot[bot]
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            echo "trusted automatic trigger: $EVENT_NAME"
            exit 0
          fi
          if [ "$EVENT_NAME" != repository_dispatch ]; then
            echo "::error::unsupported trigger '$EVENT_NAME'"
            exit 1
          fi
          if [ "$EVENT_ACTION" != advisory-sweep ]; then
            echo "::error::unsupported repository dispatch action '$EVENT_ACTION'"
            exit 1
          fi
          if [ "$DEFAULT_BRANCH" != main ]; then
            echo "::error::advisory-sweep requires main as the repository default branch (got '$DEFAULT_BRANCH')"
            exit 1
          fi
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::advisory-sweep dispatch must execute from the default branch (got '$REF')"
            exit 1
          fi
          authorized=0
          while IFS= read -r allowed; do
            [ -z "$allowed" ] && continue
            [ "$allowed" = "$ACTOR" ] && authorized=1
          done <<< "$ALLOWED_ACTORS"
          if [ "$authorized" -ne 1 ]; then
            echo "::error::actor '$ACTOR' is not authorized to run the advisory sweep"
            exit 1
          fi
          echo "authorized actor=$ACTOR action=$EVENT_ACTION ref=$REF"

      - name: Mint repository-scoped bump branch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: kin

      - name: Checkout trusted main with bump-branch authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # A second, narrower mint for the alarm alone. The bump-branch token above
      # carries contents and pull-request authority on this repository; the
      # unfixable-advisory issue lives on firelock-ai/kin-infra and needs
      # issues: write there and here and nothing else, so it gets a token that
      # holds exactly that. A mint that fails fails the sweep loudly.
      - name: Mint the alarm token, issues only, this repository and kin-infra
        id: alarm-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            kin-infra
          permission-issues: write

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny@0.20.2

      - name: Read the advisory database against main's lock
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -uo pipefail
          # A nonzero exit here is the ordinary case: it means an advisory hit.
          # The diagnostics are the product, so the status is deliberately not
          # the gate.
          cargo deny --format json --log-level warn --manifest-path ./Cargo.toml \
            --all-features check advisories > "$RUNNER_TEMP/advisories.json" 2>&1 || true
          test -s "$RUNNER_TEMP/advisories.json"

      - name: Plan the bump
        id: plan
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node scripts/advisory-sweep.mjs \
            --deny-json "$RUNNER_TEMP/advisories.json" \
            --lock ./Cargo.lock \
            --dry-run \
            --plan-out "$RUNNER_TEMP/plan.json" \
            > /dev/null
          bumps="$(jq -r '.bumps | length' "$RUNNER_TEMP/plan.json")"
          unfixable="$(jq -r '.unfixable | length' "$RUNNER_TEMP/plan.json")"
          echo "bumps=$bumps" >> "$GITHUB_OUTPUT"
          echo "unfixable=$unfixable" >> "$GITHUB_OUTPUT"
          jq -r '.' "$RUNNER_TEMP/plan.json"

      - name: Apply the bump and prove it resolves
        id: apply
        if: steps.plan.outputs.bumps != '0'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Kept so the verifier can say what moved, rather than the reviewer
          # having to reconstruct it from a diff after the fact.
          cp ./Cargo.lock "$RUNNER_TEMP/Cargo.lock.base"

          # FAST PATH, and still the preferred one. The direct entry rewrite
          # moves two lines per bump and nothing else, which is what makes an
          # unattended pull request reviewable at a glance. The header of
          # scripts/advisory-sweep.mjs carries the 2026-08-18 measurement behind
          # that choice: re-resolving this lock at all dragged eleven unrelated
          # windows-sys reference lines.
          node scripts/advisory-sweep.mjs \
            --deny-json "$RUNNER_TEMP/advisories.json" \
            --lock ./Cargo.lock \
            > /dev/null
          # Both checks are made against the copy taken above rather than
          # against HEAD. They are the same tree in this job, which only ever
          # checks out main, but tying the check to a saved base instead of to
          # HEAD is what lets the whole step be replayed off the job, and it
          # cannot quietly pass on a working tree that already carries a bump.
          assert_lock_only() {
            other="$(git diff --name-only | grep -vx 'Cargo.lock' || true)"
            if [ -n "$other" ]; then
              # tr rather than an unquoted expansion: flattening the newlines
              # by word splitting also globs, so a path with a bracket in it
              # would come out mangled in the one message telling you what went
              # wrong.
              echo "::error::advisory bump touched more than Cargo.lock: $(printf '%s' "$other" | tr '\n' ' ')"
              exit 1
            fi
            if cmp -s "$RUNNER_TEMP/Cargo.lock.base" ./Cargo.lock; then
              # The plan named a bump and the lock did not move, so the plan was
              # built against a lock that is not the one checked out here.
              # Silence would publish an empty branch and an empty pull request.
              echo "::error::advisory bump changed nothing; the plan does not match the checked-out lock"
              exit 1
            fi
          }
          assert_lock_only

          # FALLBACK. A fix whose crate pulls a transitive requirement cannot be
          # expressed as a rewrite of the named entries alone: the result is a
          # lock that does not resolve. RUSTSEC-2026-0285 was exactly that shape
          # (rustls 0.23.40 -> 0.23.45 requires rustls-webpki ^0.103.14, and that
          # one webpki entry is shared with rustls-platform-verifier through a
          # second reqwest), it failed this step on 2026-09-15, and it had to be
          # landed by hand. So when the minimal edit does not resolve, throw it
          # away and let cargo resolve the same bump itself. The result is wider
          # and it is checked harder, below, rather than trusted.
          resolution=direct
          if ! cargo metadata --locked --format-version 1 \
              > /dev/null 2> "$RUNNER_TEMP/metadata.err"; then
            echo "::notice::the direct entry rewrite does not resolve; re-running the bump through cargo"
            sed 's/^/  /' "$RUNNER_TEMP/metadata.err"
            # Restored from the copy taken at the top of this step, not with
            # `git checkout -- Cargo.lock`. Same bytes when HEAD is main, which
            # is the only tree this job checks out, but it does not depend on
            # that being true, and it lets the whole step be replayed on a
            # working tree whose HEAD already carries a bump.
            cp "$RUNNER_TEMP/Cargo.lock.base" ./Cargo.lock
            # `-p <crate>@<from>`, not `-p <crate>`: a lock that already holds
            # two versions of the crate makes the bare spec ambiguous and cargo
            # refuses it. This is the same spec bumpCommand() prints for a human.
            # Crate names cannot contain whitespace, so the unquoted expansion
            # is safe, and mapfile is avoided so this block runs under bash 3.2
            # when somebody replays it on a Mac.
            for crate in $(jq -r '.bumps[].crate' "$RUNNER_TEMP/plan.json"); do
              from="$(jq -r --arg c "$crate" '.bumps[] | select(.crate == $c) | .from' "$RUNNER_TEMP/plan.json")"
              to="$(jq -r --arg c "$crate" '.bumps[] | select(.crate == $c) | .to' "$RUNNER_TEMP/plan.json")"
              cargo update -p "${crate}@${from}" --precise "$to"
            done
            resolution=cargo
            assert_lock_only
            # `--locked` now has to pass on cargo's own output. If it does not,
            # the bump is not landable at all and the sweep must not publish it.
            cargo metadata --locked --format-version 1 > /dev/null
          fi

          # The property check that replaced counting lines. Counting lines only
          # ever held for a fix that needed nothing but the crate the advisory
          # named, and it proved nothing about correctness either way: eight
          # right lines and eight wrong ones count the same. This asserts that
          # every planned bump landed at its planned version AND checksum, and
          # that no package entered or left the tree, and it NAMES every
          # transitive entry cargo moved so a reviewer sees them before
          # auto-merge is armed.
          node scripts/advisory-sweep.mjs \
            --verify-move \
            --plan-in "$RUNNER_TEMP/plan.json" \
            --base-lock "$RUNNER_TEMP/Cargo.lock.base" \
            --lock ./Cargo.lock

          echo "resolution=$resolution" >> "$GITHUB_OUTPUT"

          # And the advisory has to actually be gone, which is the only reason
          # the bump exists. Deliberately the last word of this step.
          cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check advisories

      - name: Publish the bump branch
        id: branch
        if: steps.plan.outputs.bumps != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          branch=automation/advisory-bump
          ids="$(jq -r '[.bumps[].advisories[]] | unique | join(", ")' "$RUNNER_TEMP/plan.json")"
          git config user.name "kin-release-bot[bot]"
          git config user.email "kin-release-bot[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Cargo.lock
          git commit --signoff -m "Bump advisory-affected lock entries for ${ids}"
          # Force, because the branch is automation-owned and single-purpose:
          # each cycle rebuilds it from main so it never accumulates a stale
          # bump that main has already resolved another way.
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Open or update the bump pull request
        id: pr
        if: steps.plan.outputs.bumps != '0'
        env:
          # Opened as the release App rather than GITHUB_TOKEN, for the same two
          # reasons release-train.yml gives: the organization withholds pull
          # request creation from workflow tokens, and only an App-authored pull
          # request emits the events that start its own protected checks.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNNER_TEMP: ${{ runner.temp }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          IDS: ${{ steps.branch.outputs.ids }}
        run: |
          set -euo pipefail
          title="Bump advisory-affected lock entries for ${IDS}"
          node scripts/advisory-sweep.mjs \
            --plan-in "$RUNNER_TEMP/plan.json" \
            --render pr-body > "$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" \
            --json number --jq '.[0].number // ""')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" > /dev/null
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" \
              --json number --jq '.[0].number // ""')"
          else
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" > /dev/null
          fi
          # A number parsed out of a failed create is an error fragment, and a
          # ledger that admits one can never reach a terminal state.
          case "$pr" in
            ''|*[!0-9]*)
              echo "::error::advisory bump pull request could not be resolved to a number"
              exit 1
              ;;
          esac
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Arm protected auto-merge
        if: steps.plan.outputs.bumps != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          # Reported rather than fatal: an unarmed pull request is still an open
          # pull request a human can merge, and a sweep that failed here would
          # discard the bump it just proved.
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$head_sha"; then
            echo "auto-merge armed on #$PR"
          else
            echo "::warning::auto-merge could not be armed on #$PR; it is open and mergeable by hand"
          fi

      - name: Open or update the unfixable-advisory issue
        if: steps.plan.outputs.unfixable != '0'
        env:
          GH_TOKEN: ${{ steps.alarm-token.outputs.token }}
          ALARM_REPO: firelock-ai/kin-infra
          ALARM_LABEL: ${{ github.event.repository.name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Two labels: the kind of alarm, and the repository it is about, since
          # kin-infra collects every repository's alarms. Both are created
          # before the issue that carries them, idempotently, so a missing label
          # can never fail the create.
          gh label create "advisory-sweep" --repo "$ALARM_REPO" \
            --color "B60205" \
            --description "Advisories with no semver-compatible bump, found by the scheduled sweep" \
            --force
          gh label create "$ALARM_LABEL" --repo "$ALARM_REPO" --force \
            --color 5319E7 \
            --description "Alarms raised by ${GITHUB_REPOSITORY}'s workflows"
          node scripts/advisory-sweep.mjs \
            --plan-in "$RUNNER_TEMP/plan.json" \
            --render issue-body > "$RUNNER_TEMP/issue-body.md"
          ids="$(jq -r '[.unfixable[].id] | unique | join(", ")' "$RUNNER_TEMP/plan.json")"
          title="Advisories with no semver-compatible bump: ${ids}"
          issue="$(gh issue list --repo "$ALARM_REPO" --state open \
            --label "advisory-sweep,${ALARM_LABEL}" --json number --jq '.[0].number // ""')"
          if [ -z "$issue" ]; then
            gh issue create --repo "$ALARM_REPO" --title "$title" \
              --label "advisory-sweep" --label "$ALARM_LABEL" \
              --body-file "$RUNNER_TEMP/issue-body.md" > /dev/null
          else
            gh issue edit "$issue" --repo "$ALARM_REPO" --title "$title" \
              --body-file "$RUNNER_TEMP/issue-body.md" > /dev/null
          fi

      # The close path this issue never had. A sweep that resolves every
      # advisory, by bump or by a deny.toml ignore with a reason, is the green
      # run of this workflow, and the issue it leaves open would otherwise sit
      # on kin-infra until somebody noticed.
      - name: Close the unfixable-advisory issue once the sweep finds none
        if: steps.plan.outcome == 'success' && steps.plan.outputs.unfixable == '0'
        env:
          GH_TOKEN: ${{ steps.alarm-token.outputs.token }}
          ALARM_REPO: firelock-ai/kin-infra
          ALARM_LABEL: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$ALARM_REPO" --state open \
            --label "advisory-sweep,${ALARM_LABEL}" --json number --jq '.[0].number // ""')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$ALARM_REPO" \
              --comment "This sweep found no advisory without a semver-compatible bump: ${RUN_URL}."
            echo "closed unfixable-advisory issue #${issue}"
          fi

      - name: Summarize
        if: always()
        env:
          BUMPS: ${{ steps.plan.outputs.bumps }}
          UNFIXABLE: ${{ steps.plan.outputs.unfixable }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "## Advisory sweep"
            echo ""
            echo "- lock entries bumped: ${BUMPS:-unknown}"
            echo "- advisories with no compatible bump: ${UNFIXABLE:-unknown}"
            echo "- pull request: ${PR:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
