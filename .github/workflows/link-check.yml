name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/quickstart.md"
      - "lychee.toml"
      - "scripts/fixtures/public-doc-links/**"
      - ".github/workflows/link-check.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/quickstart.md"
      - "lychee.toml"
      - "scripts/fixtures/public-doc-links/**"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  link-check:
    name: Check public documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            ./README.md
            ./CONTRIBUTING.md
            ./SECURITY.md
            ./docs/quickstart.md
          fail: true
          lycheeVersion: v0.24.2

      # The action installs its pinned lychee into RUNNER_TEMP and publishes it
      # on GITHUB_PATH. Exercise the same binary and config against one fixture
      # per false-green class. Checking that each failing output names its own
      # target prevents a shared config error from satisfying every arm.
      - name: Falsify every public-link policy arm
        shell: bash
        run: |
          set -euo pipefail
          expect_failure() {
            label="$1"
            fixture="$2"
            target="$3"
            set +e
            output="$(lychee --config lychee.toml "$fixture" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [[ "$rc" -eq 0 ]]; then
              echo "::error title=Link falsifier passed::$label returned success"
              exit 1
            fi
            if ! grep -Fq "$target" <<<"$output"; then
              echo "::error title=Wrong link falsified::$label did not report $target"
              exit 1
            fi
          }

          expect_failure \
            "missing Markdown anchor" \
            ./scripts/fixtures/public-doc-links/missing-anchor.md \
            "anchor-that-does-not-exist"
          expect_failure \
            "missing relative file" \
            ./scripts/fixtures/public-doc-links/missing-relative.md \
            "relative-file-that-does-not-exist.md"
          expect_failure \
            "dead public HTTP link" \
            ./scripts/fixtures/public-doc-links/dead-http.md \
            "kin-link-check-http"
          expect_failure \
            "dead URL inside a code block" \
            ./scripts/fixtures/public-doc-links/dead-verbatim.md \
            "kin-link-check-verbatim"
