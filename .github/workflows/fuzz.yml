# Bounded fuzzing of the tree-sitter parsing and language-adapter surface.
#
# The fuzz targets live in `fuzz/` and feed arbitrary bytes into kin-parser's
# source-ingesting entry points:
#   - parse_adapter: every built-in LanguageAdapter's parse + extract path.
#   - parse_shallow: the C2 shallow parse path (parse_shallow_file).
# The invariant under test is that the parser is total on arbitrary input -- it
# returns a value or a handled error and never panics, crashes, or hits UB.
#
# Triggers, and what each one is for:
#   - pull_request: BUILD ONLY, no campaign. The fuzz package is a detached
#     workspace, so nothing in the ordinary `cargo build --workspace` / clippy
#     gate ever compiles these targets; this is the only pre-merge check that
#     they still match the surface they exercise. Compiling is cheap and
#     deterministic, whereas a timed campaign on a PR spends minutes to sample a
#     little entropy and can fail for reasons the PR did not cause.
#   - schedule (weekly) and workflow_dispatch: build plus a bounded campaign,
#     which is where actually looking for crashes belongs.
#
# The pull_request paths deliberately include the dependency-pin surface and not
# just the harness. The build last broke because a kin-model major bump in the
# root manifest desynchronized the versions this package resolved -- a change
# touching neither `crates/kin-parser/**` nor `fuzz/**`, so no PR run fired and
# the breakage sat until the following weekly run. Watching the pins that the
# harness compiles against is what puts that class of drift in front of a PR.
#
# Every campaign has a hard `-max_total_time` wall-clock cap plus a per-input
# `-timeout`, so neither a single pathological input nor the campaign as a whole
# can hang the runner.
#
# `fuzz/Cargo.lock` is tracked, and this job proves the build resolved through
# it. `cargo fuzz build` has no `--locked` flag to pass, so enforcement is split
# in two: `cargo metadata --locked` fails before the build if the committed lock
# would need updating, and a diff check after the build fails if the build
# rewrote it. Together those cover both halves of what `--locked` means, and the
# second half holds no matter what cargo-fuzz does to its argument surface.

name: Fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/kin-parser/**"
      # fuzz/** covers fuzz/Cargo.lock, which is now the resolved version set
      # this job builds against.
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      # Root manifest carries the kin-model / tree-sitter pins kin-parser
      # inherits; .cargo/config.toml carries the registry they resolve through.
      - "Cargo.toml"
      - ".cargo/config.toml"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_adapter
          - parse_shallow
    steps:
      # Actions are pinned by commit sha with the version in a trailing comment,
      # matching the rest of this repo's workflows: a moving tag is the same
      # reproducibility hole as a moving toolchain, and this job exists to
      # remove those.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # kin-parser's transitive kin-model resolves from the Kin sparse registry
      # ([registries.kin]). The fuzz crate is detached from the kin workspace,
      # but Cargo still discovers the tracked .cargo/config.toml by walking up
      # from fuzz/, so the registry is configured exactly as for a normal kin
      # build.
      - name: Verify kin cargo registry config
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml

      # cargo-fuzz requires nightly (libFuzzer + -Zsanitizer), so this job cannot
      # use the repo's pinned stable from rust-toolchain.toml. Pin a dated
      # nightly for the same reason that file pins stable: an unpinned @nightly
      # lets a green build turn red with no change to this repository, and the
      # failure then has to be told apart from a real one. Bump DELIBERATELY.
      # The action is sha-pinned rather than referenced by a branch, because a
      # branch could change under a job whose whole purpose is a fixed toolchain.
      # The sha has to come from the default branch, which is the only revision
      # declaring a `toolchain` input. This action also publishes a branch per
      # toolchain (`1.96.0`, `stable`, and so on) whose action hardcodes that
      # version and accepts only `targets`, `target`, and `components`. Pinning
      # one of those shas here made `toolchain` an unexpected input, so the step
      # installed 1.96.0, and the nightly named below arrived only when rustup
      # resolved it on the first `cargo +nightly-2026-06-17` call. release.yml
      # pins a per-toolchain sha deliberately: it wants stable and passes only
      # `targets`.
      - name: Install nightly toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-06-17

      - name: Cache cargo registry and fuzz build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          # Keyed on the toolchain pin as well as the sources, so bumping the
          # nightly cannot restore objects built by the previous one. The root
          # manifest is in the hash because it carries the dependency pins
          # kin-parser inherits, and the fuzz lock because it is the resolved
          # version set those pins produce.
          key: ${{ runner.os }}-parser-fuzz-nightly-2026-06-17-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'Cargo.toml', 'crates/kin-parser/**') }}
          restore-keys: |
            ${{ runner.os }}-parser-fuzz-nightly-2026-06-17-

      # Version-pinned alongside the toolchain: an unpinned cargo-fuzz is the
      # same reproducibility hole as an unpinned toolchain. `--locked` pins its
      # own dependency versions too. Deliberately still `cargo install` rather
      # than taiki-e/install-action, which does not carry cargo-fuzz and would
      # quietly fall back to cargo-binstall.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      # Half one of `--locked`: the committed lock must already resolve the
      # manifest, so a dependency edit that forgot to re-lock fails here rather
      # than being papered over by a silent re-resolve during the build.
      - name: Verify committed fuzz lock resolves the manifest
        run: |
          cargo +nightly-2026-06-17 metadata --locked --format-version 1 \
            --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Build fuzz target
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly-2026-06-17 fuzz build "$TARGET"

      # Half two: the build must not have rewritten the lock. `cargo fuzz build`
      # takes no `--locked`, so this is what actually holds it to the committed
      # version set, and it keeps holding regardless of cargo-fuzz's flags.
      - name: Assert the fuzz build used the committed lock
        run: git diff --exit-code -- fuzz/Cargo.lock

      # Bounded campaign: 300s/target on the weekly schedule, 60s on dispatch.
      # Skipped on pull_request, where the build step above is the whole gate.
      # `-timeout` caps any single input; `-rss_limit_mb` guards against a runaway
      # allocation aborting the runner. EVENT_NAME / TARGET are mapped through env
      # (not interpolated into the shell) per GitHub Actions injection-hardening
      # guidance.
      - name: Run bounded fuzz campaign
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
        run: |
          DURATION=60
          if [ "$EVENT_NAME" = "schedule" ]; then DURATION=300; fi
          cargo +nightly-2026-06-17 fuzz run "$TARGET" -- \
            -max_total_time="$DURATION" -timeout=25 -rss_limit_mb=2048

      # Both a pin and a major-version bump, v4 to v7, worth saying out loud:
      # this step only runs on a real crash, so no green run exercises it. The
      # sha is the one release.yml already pins and exercises on every release
      # upload, and the three inputs used here (name, path, if-no-files-found)
      # are unchanged across those majors.
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
