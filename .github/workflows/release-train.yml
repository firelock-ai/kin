name: Release Train

# Trusted-default-branch triggers only. repository_dispatch gives operators a
# safe immediate reconcile without branch-selectable workflow code.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  repository_dispatch:
    types: [release-reconcile]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: kin-release-train
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile release PR
    # The queue's own CI run concludes when the landing does, roughly half an
    # hour before the landing push's CI run concludes, so it is the occasion
    # that removes the wait rather than the one that reports it. Both are kept.
    # A merge-group completion that arrives before main carries the commit
    # reconciles a main one commit short, which is not a new class: the branch
    # is coalescing by construction and every later cycle folds the newer drift
    # into the same branch well inside the release PR's own queue time.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      (
        github.event.workflow_run.event == 'merge_group' &&
        startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/main/') &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same main-only Environment protects the raw release App key used by
    # the branch writer. Only the repository-scoped installation token leaves
    # the credential-minting step.
    environment: release-tag
    outputs:
      # This cycle's observation, handed straight to the alarm job rather than
      # read back out of the artifact this run uploads. An artifact is listable
      # only once the upload settles, and a newest observation that arrives late
      # reads exactly like one that never came, which is the reading that keeps
      # the alarm quiet. The artifact stays, because later cycles need this run
      # to be readable from outside it.
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - name: Mint repository-scoped release branch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: kin

      - name: Checkout trusted main with release-branch authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The release labels describe the resolved intent so the board reads
      # correctly. They are never consulted to resolve it: a label can be
      # changed after a merge, and the release intent must not move once its
      # evidence is on protected main.
      - name: Ensure release intent labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "release:automated" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" \
            --description "Automation-owned coalescing release PR" \
            --force
          gh label create "release:patch" \
            --repo "$GITHUB_REPOSITORY" \
            --color "C5DEF5" \
            --description "Describes the immutable patch intent resolved for the next release" \
            --force
          gh label create "release:minor" \
            --repo "$GITHUB_REPOSITORY" \
            --color "FBCA04" \
            --description "Describes the immutable minor intent resolved for the next release" \
            --force
          gh label create "release:major" \
            --repo "$GITHUB_REPOSITORY" \
            --color "B60205" \
            --description "Describes the immutable major intent resolved for the next release" \
            --force

      - name: Resolve releasable drift and SemVer intent
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_POLICY_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The release intent is read from immutable commit messages, and it
          # only reaches them because this repository merges by squash with the
          # pull-request body as the message. Assert that before trusting the
          # resolution rather than discovering a rewritten message later.
          #
          # GitHub returns the merge-policy fields only to a token that holds
          # push-level repository access, and this workflow's GITHUB_TOKEN is
          # deliberately read-scoped. Read the policy through the same
          # repository-scoped App installation token that already writes the
          # release branch, and keep the two failures apart: a response that
          # never carried the fields cannot disprove the policy, so reporting it
          # as a wrong setting sends recovery after a correct repository.
          if [ -z "$MERGE_POLICY_TOKEN" ]; then
            echo "::error::reading repository merge policy requires the release App installation token"
            exit 1
          fi
          merge_policy="$(GH_TOKEN="$MERGE_POLICY_TOKEN" gh api "repos/${REPO}")"
          if ! jq -e 'type == "object"' <<< "$merge_policy" > /dev/null; then
            echo "::error::repository merge policy response was not a JSON object, so the policy was never read"
            exit 1
          fi
          absent="$(jq -r '
            . as $repo
            | [
                "allow_squash_merge",
                "allow_merge_commit",
                "allow_rebase_merge",
                "squash_merge_commit_title",
                "squash_merge_commit_message"
              ]
            | map(. as $field | select(($repo | has($field)) | not))
            | join(", ")
          ' <<< "$merge_policy")"
          if [ -n "$absent" ]; then
            echo "::error::repository merge policy is unreadable, not disproven: ${absent} absent from the API response, which happens when the reading token lacks push-level repository access"
            exit 1
          fi
          violations="$(jq -r '
            [
              (select(.allow_squash_merge == true | not) | "allow_squash_merge"),
              (select(.allow_merge_commit == false | not) | "allow_merge_commit"),
              (select(.allow_rebase_merge == false | not) | "allow_rebase_merge"),
              (select(.squash_merge_commit_title == "PR_TITLE" | not) | "squash_merge_commit_title"),
              (select(.squash_merge_commit_message == "PR_BODY" | not) | "squash_merge_commit_message")
            ]
            | join(", ")
          ' <<< "$merge_policy")"
          if [ -n "$violations" ]; then
            echo "::error::immutable PR-body release intent requires enforced PR_TITLE + PR_BODY squash-only merging; offending repository settings: ${violations}"
            exit 1
          fi
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          main_sha="$(git rev-parse refs/remotes/origin/main)"
          version="$(git show refs/remotes/origin/main:Cargo.toml | python3 -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])
          ')"
          tag="v${version}"
          # The same serialization predicate the tag mint admits against, and
          # the same waiver. Fixing only the mint would leave this side wedged:
          # an abandoned tag that stays highest here stops the version bump PR
          # from ever opening, so the version never moves and the mint has
          # nothing new to tag. Only a reviewed abandonment record skips a tag,
          # read from protected main together with the selector that reads it.
          #
          # The selector's mint-intent argument is empty here on purpose. This
          # step resolves drift and opens a version bump PR; it never creates a
          # tag, and $tag below is the pre-existing base it measures drift from.
          # Handing that base over as mint intent would refuse precisely when a
          # record covers it, and a record always covers it: the mint only
          # creates v$(workspace version), so main's version equals the stuck
          # tag and cannot move until this step opens the bump that a record is
          # written to unblock.
          train_policy="$RUNNER_TEMP/release-train-policy"
          mkdir -p "$train_policy"
          abandoned="$train_policy/abandoned-release-tags.json"
          selector="$train_policy/select-admissible-release-tag.py"
          git show \
            "refs/remotes/origin/main:scripts/abandoned-release-tags.json" \
            > "$abandoned"
          git show \
            "refs/remotes/origin/main:scripts/select-admissible-release-tag.py" \
            > "$selector"
          test -s "$abandoned"
          test -s "$selector"
          candidate_tags="$train_policy/release-tags"
          git for-each-ref \
            --sort=-v:refname \
            --format='%(refname:strip=2) %(if)%(*objectname)%(then)%(*objectname)%(else)%(objectname)%(end)' \
            refs/tags > "$candidate_tags"
          admissible="$train_policy/highest-admissible-tag"
          python3 "$selector" \
            "$abandoned" \
            "$candidate_tags" \
            "" \
            "$admissible"
          highest_tag="$(cat "$admissible")"
          latest_tag="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"

          # Every path out of this step now states the rail's condition in one
          # machine-readable place, because a decision that only reaches a log
          # notice is a decision nobody reads. Standing down is correct and
          # frequent; standing down invisibly is how a held rail once sat for
          # roughly twenty hours with nine merged pull requests behind it while
          # its run history read all-green.
          #
          # The marker records what this run observed. It never decides what to
          # do about it. The alarm job below owns that, so the threshold can be
          # tested without running a rail and this step keeps exactly the exit
          # statuses it had.
          marker="$RUNNER_TEMP/release-hold-marker.json"

          # Reviewed commits waiting behind a base tag. A base that does not
          # resolve leaves the count absent rather than zero, because the alarm
          # reader treats an absent count as an observation it could not make
          # and stays quiet, while a zero would assert that nothing is waiting.
          count_drift() {
            local base="$1" counted=""
            if [ -z "$base" ]; then printf 'null'; return 0; fi
            if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
              printf 'null'
              return 0
            fi
            counted="$(git rev-list --count "${base}..${main_sha}" 2>/dev/null || true)"
            case "$counted" in
              ''|*[!0-9]*) printf 'null' ;;
              *) printf '%s' "$counted" ;;
            esac
          }

          # Name the Release run that owns a blocking tag so the alarm can point
          # at the run instead of leaving a captain to find it. Every read here
          # is allowed to fail: an absent run id is a fact the alarm can state,
          # and an invented one would send recovery somewhere real.
          release_run_for_tag() {
            local blocking="$1" runs="" found=""
            [ -n "$blocking" ] || { printf '%s' 'null null'; return 0; }
            runs="$(gh api \
              "repos/${REPO}/actions/workflows/release.yml/runs?per_page=100" \
              2>/dev/null || true)"
            [ -n "$runs" ] || { printf '%s' 'null null'; return 0; }
            found="$(jq -r --arg tag "$blocking" '
              [
                .workflow_runs[]? |
                select(
                  .head_branch == $tag and
                  .status == "completed" and
                  (
                    .conclusion == "failure" or
                    .conclusion == "timed_out" or
                    .conclusion == "startup_failure"
                  )
                )
              ] | sort_by(.created_at) | last // empty
              | "\"\(.id)\" \"\(.html_url)\""
            ' <<< "$runs" 2>/dev/null || true)"
            case "$found" in
              '"'*) printf '%s' "$found" ;;
              *) printf '%s' 'null null' ;;
            esac
          }

          write_marker() {
            local state="$1" reason="$2" detail="$3"
            local blocking="$4" base="$5" drift_json="$6"
            local failed_id=null failed_url=null
            if [ "$state" = held ]; then
              read -r failed_id failed_url <<< "$(release_run_for_tag "$blocking")" || true
            fi
            jq -n \
              --arg state "$state" \
              --arg reason "$reason" \
              --arg detail "$detail" \
              --arg blocking_tag "$blocking" \
              --arg latest_tag "$latest_tag" \
              --arg base_tag "$base" \
              --arg main_sha "$main_sha" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_url "${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
              --argjson drift "$drift_json" \
              --argjson failed_release_run_id "$failed_id" \
              --argjson failed_release_run_url "$failed_url" \
              '{
                schema: "kin.release-hold.v1",
                state: $state,
                reason: $reason,
                detail: $detail,
                blocking_tag: $blocking_tag,
                latest_tag: $latest_tag,
                base_tag: $base_tag,
                drift: $drift,
                main_sha: $main_sha,
                run_id: $run_id,
                run_url: $run_url,
                failed_release_run_id: $failed_release_run_id,
                failed_release_run_url: $failed_release_run_url,
                observed_at: (now | todateiso8601)
              }' > "$marker"
            {
              echo "marker<<KIN_RELEASE_HOLD_MARKER"
              jq -c . "$marker"
              echo "KIN_RELEASE_HOLD_MARKER"
            } >> "$GITHUB_OUTPUT"
            echo "release hold marker: $(jq -c . "$marker")"
          }

          if [ -z "$highest_tag" ] || [ "$highest_tag" != "$latest_tag" ]; then
            hold_detail="highest tag ${highest_tag:-<none>} is not finalized GitHub Latest ${latest_tag}; release recovery owns this state"
            echo "::notice::${hold_detail}."
            write_marker held tag_not_finalized "$hold_detail" \
              "$highest_tag" "$highest_tag" "$(count_drift "$highest_tag")"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${tag}^{commit}" >/dev/null; then
            hold_detail="${tag} is already staged on main; tag reconciliation owns the next transition"
            echo "::notice::${hold_detail}."
            write_marker held tag_staged "$hold_detail" \
              "$tag" "$highest_tag" "$(count_drift "$highest_tag")"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          drift="$(git rev-list --count "${tag}..${main_sha}")"
          if [ "$drift" -eq 0 ]; then
            echo "::notice::main has no commits beyond ${tag}."
            write_marker held no_drift "main has no commits beyond ${tag}" \
              "" "$tag" 0
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the bump from the immutable `Kin-Release-Intent` trailers on
          # the first-parent range. Pull-request labels and the dispatch payload
          # are deliberately not consulted: both remain editable after a merge,
          # so a later scheduled run could resolve a lower bump than an earlier
          # one and rewrite a prepared minor or major release back to a patch.
          # Commit messages on protected main cannot be edited, so the same
          # range always resolves to the same intent, and the range only grows.
          intent_policy="$RUNNER_TEMP/resolve-release-intent.mjs"
          git show "refs/remotes/origin/main:scripts/resolve-release-intent.mjs" \
            > "$intent_policy"
          bump="$(
            node "$intent_policy" \
              --base-ref "$tag" \
              --head-ref refs/remotes/origin/main \
              | jq -er .intent
          )"
          case "$bump" in
            patch|minor|major) ;;
            *)
              echo "::error::unsupported immutable release intent: $bump"
              exit 1
              ;;
          esac

          {
            echo "needed=true"
            echo "base_tag=$tag"
            echo "base_version=$version"
            echo "bump=$bump"
            echo "main_sha=$main_sha"
            echo "drift=$drift"
          } >> "$GITHUB_OUTPUT"
          echo "release drift: ${drift} first-parent range commit(s), base=${tag}, bump=${bump}"
          # The all-clear is a marker too, and it is the one that closes the
          # alarm. Reporting only holds would leave a resolved rail carrying an
          # open issue until someone noticed, which is the same silence wearing
          # the opposite costume.
          write_marker clear "" \
            "release drift resolved: ${drift} first-parent range commit(s), base=${tag}, bump=${bump}" \
            "" "$tag" "$drift"

      - name: Create or coalesce the release branch
        id: branch
        if: steps.plan.outputs.needed == 'true'
        env:
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          BRANCH: automation/release-next
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "kin-release-bot[bot]"
          git config user.email "kin-release-bot[bot]@users.noreply.github.com"
          policy_dir="$RUNNER_TEMP/release-policy"
          mkdir -p "$policy_dir"
          for policy in \
            scripts/check-release-version.mjs \
            scripts/prepare-release.mjs \
            scripts/release-intent.mjs
          do
            git show "refs/remotes/origin/main:${policy}" \
              > "${policy_dir}/${policy##*/}"
          done

          existing=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            existing=true
            git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            # Every path prepare-release.mjs writes has to be listed here, or
            # the train refuses the branch it just generated. The authority
            # suite cross-checks this against the generator rather than trusting
            # the two to stay in step by hand.
            allowed='^(Cargo\.toml|Cargo\.lock|fuzz/Cargo\.lock|CHANGELOG\.md|crates/kin-cli/Cargo\.toml|packages/(kin-mcp|kin|boundary-contracts)/package\.json)$'
            branch_paths="$(git diff \
              --name-only \
              "refs/remotes/origin/main...refs/remotes/origin/${BRANCH}")"
            unexpected=""
            while IFS= read -r generated; do
              [ -n "$generated" ] || continue
              if [[ ! "$generated" =~ $allowed ]]; then
                unexpected="${unexpected}${generated}"$'\n'
              fi
            done <<< "$branch_paths"
            if [ -n "$unexpected" ]; then
              echo "::error::release branch contains non-generated paths:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            while IFS= read -r generated; do
              [ -n "$generated" ] || continue
              mode="$(git ls-tree "refs/remotes/origin/${BRANCH}" -- "$generated" | awk '{print $1}')"
              if [ "$mode" != 100644 ]; then
                echo "::error::release branch path ${generated} has unsafe mode ${mode:-missing}"
                exit 1
              fi
            done <<< "$branch_paths"
            git checkout -B "$BRANCH" "refs/remotes/origin/${BRANCH}"
            # Only the seven generated files may differ from main. Resolve any
            # conflict in those stale generated bytes toward the existing
            # branch so the merge commit can be formed; the next command then
            # discards every one of those bytes and regenerates them from the
            # newly merged, trusted main policy and source.
            git merge --signoff --no-edit -X ours refs/remotes/origin/main
          else
            git checkout -b "$BRANCH" refs/remotes/origin/main
          fi

          # Regenerate every permitted byte from trusted main. Existing branch
          # contents carry no policy or payload authority; they are only a
          # fast-forward history anchor for an already-open PR.
          git restore --source refs/remotes/origin/main -- \
            Cargo.toml \
            Cargo.lock \
            fuzz/Cargo.lock \
            CHANGELOG.md \
            crates/kin-cli/Cargo.toml \
            packages/kin-mcp/package.json \
            packages/kin/package.json \
            packages/boundary-contracts/package.json

          output="$RUNNER_TEMP/prepare-release.outputs"
          : > "$output"
          GITHUB_OUTPUT="$output" node "$policy_dir/prepare-release.mjs" \
            --base-tag "$BASE_TAG" \
            --bump "$BUMP" \
            --source-ref refs/remotes/origin/main

          version="$(sed -n 's/^version=//p' "$output")"
          tag="$(sed -n 's/^tag=//p' "$output")"
          test -n "$version"
          test -n "$tag"

          node "$policy_dir/release-intent.mjs"

          git add \
            Cargo.toml \
            Cargo.lock \
            fuzz/Cargo.lock \
            CHANGELOG.md \
            crates/kin-cli/Cargo.toml \
            packages/kin-mcp/package.json \
            packages/kin/package.json \
            packages/boundary-contracts/package.json
          if ! git diff --cached --quiet; then
            git commit --signoff -m "Release Kin ${tag}"
          fi
          node "$policy_dir/check-release-version.mjs" \
            --base refs/remotes/origin/main \
            --labels "release:${BUMP}"
          git push origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "branch=$BRANCH"
            echo "existing=$existing"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Open the protected release PR
        id: pr
        if: steps.plan.outputs.needed == 'true'
        env:
          # Open the PR as the release App rather than GITHUB_TOKEN. GitHub
          # refuses `createPullRequest` from an Actions token wherever the
          # organization withholds pull-request creation from workflows, and
          # granting it back would let every workflow in the repository open
          # pull requests. The App identity is also what makes the new pull
          # request emit the events that start its own protected checks. The
          # installation is scoped to this repository and carries contents,
          # issues, and pull-requests write, which covers creating, editing,
          # and labelling the release PR.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TAG: ${{ steps.branch.outputs.tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          pr_data="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$BRANCH" \
            --json number,headRepository,headRepositoryOwner)"
          pr="$(jq -er '
            [
              .[] |
              select(
                .headRepositoryOwner.login == "firelock-ai" and
                .headRepository.nameWithOwner == "firelock-ai/kin"
              )
            ] |
            if length > 1 then
              error("multiple firelock-ai/kin release-train PRs")
            else
              .[0].number // ""
            end
          ' <<< "$pr_data")"
          # The body is not a description of this release, it is the
          # release's permanent commit message: this repository squashes
          # with the pull-request body, and the merge queue mints that
          # message when the entry is admitted. So the train owns one
          # delimited region of it and rewrites nothing else. It used to
          # rewrite the whole body to the line below on every cycle, which
          # discarded the disclosures the release doctrine requires an
          # operator to add, and a cycle landing between that edit and
          # queue admission would have shipped a release whose permanent
          # message carried none of them.
          #
          # The merge is read from protected main for the same reason the
          # proof gate below is: the branch under judgement must not be
          # able to change how its own commit message is assembled.
          merge_body="$RUNNER_TEMP/release-train-body.mjs"
          git show \
            "refs/remotes/origin/main:scripts/release-train-body.mjs" \
            > "$merge_body"
          test -s "$merge_body"
          region="$RUNNER_TEMP/release-train-region.md"
          cat > "$region" <<'RELEASE_TRAIN_REGION'
          Automated, coalescing Kin release PR. It carries the lockstep Cargo/npm version, exact internal path pin, workspace-only lockfile movement, and generated notes for every reviewed first-parent change since the prior stable tag.
          RELEASE_TRAIN_REGION

          created=false
          if [ -z "$pr" ]; then
            initial_body="$RUNNER_TEMP/release-train-initial-body.md"
            node "$merge_body" \
              --region "$region" \
              --out "$initial_body" \
              >/dev/null
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Release Kin ${TAG}" \
              --body-file "$initial_body" \
              >/dev/null
            pr_data="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$BRANCH" \
              --json number,headRepository,headRepositoryOwner)"
            pr="$(jq -er '
              [
                .[] |
                select(
                  .headRepositoryOwner.login == "firelock-ai" and
                  .headRepository.nameWithOwner == "firelock-ai/kin"
                )
              ] |
              if length == 1 then
                .[0].number
              else
                error("created release PR could not be uniquely resolved")
              end
            ' <<< "$pr_data")"
            test -n "$pr"
            created=true
          fi
          # The title is generated every cycle and carries nothing an
          # operator writes, so it stays a plain overwrite.
          gh pr edit "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release Kin ${TAG}"
          # Read the body as JSON rather than as text, so no shell or jq
          # step can add, strip, or re-encode a byte an operator wrote.
          current_body="$RUNNER_TEMP/release-train-current-body.json"
          gh pr view "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            > "$current_body"
          next_body="$RUNNER_TEMP/release-train-next-body.md"
          merge_result="$(node "$merge_body" \
            --region "$region" \
            --current-json "$current_body" \
            --out "$next_body")"
          merge_status="$(jq -er .status <<< "$merge_result")"
          merge_detail="$(jq -er .detail <<< "$merge_result")"
          # Read the flag as text, never as a jq truth value: `jq -e` exits
          # 1 on a false result, so a no-op cycle would abort this step
          # under set -e, and no-op is the common case. Requiring the field
          # to be a boolean keeps the absent-field failure loud.
          merge_changed="$(jq -er '
            if (.changed | type) == "boolean" then
              .changed | tostring
            else
              error("release PR body merge reported no changed flag")
            end
          ' <<< "$merge_result")"
          if [ "$merge_status" = "unmergeable" ]; then
            # Leave the body exactly as it stands. Refusing costs the
            # train its own line; guessing at which region it owns costs
            # the release the disclosures this preservation exists for.
            echo "::error::release PR body left untouched: ${merge_detail}"
          elif [ "$merge_changed" = "true" ]; then
            gh pr edit "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$next_body"
            echo "::notice::release PR body reconciled: ${merge_detail}"
          fi
          jq -n \
            --arg automated "release:automated" \
            --arg bump "release:${BUMP}" \
            '{labels: [$automated, $bump]}' \
            | gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" \
                --input - \
                >/dev/null
          head_sha="$(gh pr view "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          # Wait long enough for GitHub to register the run the App's own pull
          # request already started. The old twelve-second budget expired
          # before a busy Actions backend answered, and the activation commit
          # below then rewrote the head and bought a second full pull-request
          # CI round on a release the merge queue proves anyway. A minute of
          # polling costs nothing against a twenty-minute job timeout, and it
          # is the difference between the release pull request paying one
          # pre-queue pass and paying two.
          needs_activation=true
          for attempt in $(seq 1 15); do
            ci_runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&per_page=30")"
            valid_ci="$(jq -r \
              --arg sha "$head_sha" \
              '[
                .workflow_runs[] |
                select(
                  .head_sha == $sha and
                  .event == "pull_request" and
                  .path == ".github/workflows/ci.yml" and
                  .conclusion != "action_required"
                )
              ] | length' \
              <<< "$ci_runs")"
            if [ "$valid_ci" -gt 0 ]; then
              needs_activation=false
              break
            fi
            [ "$attempt" -eq 15 ] || sleep 4
          done
          {
            echo "number=$pr"
            echo "created=$created"
            echo "needs_activation=$needs_activation"
          } >> "$GITHUB_OUTPUT"

      - name: Activate ordinary PR checks with the release App
        if: steps.pr.outputs.needs_activation == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          # An App-opened pull request starts its own checks, so this step is
          # the fallback for a head that has none: a run GitHub had not yet
          # registered when the poll above gave up, or a head carrying only the
          # approval-required run a GITHUB_TOKEN-created pull request leaves
          # behind. This App-authored synchronize event is the narrow,
          # unattended handoff into the ordinary protected PR checks.
          #
          # It exists to make the required contexts report at all, never to buy
          # a full pre-queue pass. The merge queue is what proves this branch,
          # and the release mint now keys off that queue-proven sha, so a
          # pull-request run whose heavy jobs report skipped satisfies this
          # step exactly as a full one does. Do not widen this into a way of
          # re-running the whole suite before the queue does.
          git commit --allow-empty --signoff \
            -m "Activate protected checks for the automated release PR"
          git push origin "HEAD:refs/heads/${BRANCH}"

      # The version bump carries no release evidence and is not gated on any.
      #
      # It used to be. On 2026-08-20 the train merged its own bump kin#986,
      # tagged v0.5.44 and promoted it to Latest with no preflight record for
      # that candidate and no stranger run on its bytes, so a gate was added
      # here keyed on this pull request's head. That key is what forced the
      # fleet to freeze main: every cycle merges origin/main into this branch
      # and mints a new head, and evidence published for the old head becomes
      # invisible rather than wrong, so a release either froze main for its
      # whole proof window or evidenced a sha nobody was releasing.
      #
      # The refusal did not go away, it moved to the artifact that actually
      # ships. release-tag.yml now selects the newest main commit carrying the
      # staged version for which the proof loop published records, and refuses
      # to create the tag ref without them. That is the stronger placement: a
      # tag run resolves its workflows from the tag and can never be repaired,
      # so refusing before the ref exists beats refusing after. release.yml's
      # finalize_release still refuses to promote a tag with no records, so both
      # decision points keep importing one judge. What this branch's head is at
      # any moment no longer decides anything, which is what lets main move.
      - name: Arm protected auto-merge
        if: steps.plan.outputs.needed == 'true'
        env:
          # Register auto-merge as the release App, not GITHUB_TOKEN. GitHub
          # suppresses most workflow events caused by GITHUB_TOKEN; an
          # App-owned merge must emit the main push that starts CI and the
          # automatic tag/release chain.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh pr merge "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$head_sha"

      - name: Summarize
        if: steps.plan.outputs.needed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          TAG: ${{ steps.branch.outputs.tag }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          DRIFT: ${{ steps.plan.outputs.drift }}
        run: |
          {
            echo "## Release train reconciled"
            echo ""
            echo "- PR: #${PR}"
            echo "- target: ${TAG}"
            echo "- prior stable: ${BASE_TAG}"
            echo "- coalesced commits: ${DRIFT}"
            echo "- merge: armed only after protected checks"
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on every path, including the ones that stood down and the ones
      # that failed. Later cycles read this to learn what this cycle saw, and a
      # cycle that uploaded nothing is read as an observation that could not be
      # made rather than as an all-clear.
      - name: Publish this cycle's hold marker
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-hold-marker
          path: ${{ runner.temp }}/release-hold-marker.json
          if-no-files-found: ignore
          retention-days: 7

  # The train's decision is now readable. This job is what makes it heard.
  #
  # A hold is correct and common, so this deliberately does not ring on one. It
  # rings when the rail has declined to mint for several consecutive cycles
  # while reviewed work piled up behind it, which is the shape that cost roughly
  # twenty hours of rail time and was visible only to a captain who read a run
  # log by hand.
  #
  # A red run here is the alarm working, exactly as a red Release Recovery run
  # is. Do not "fix" this job by making it conclude success while an issue it
  # just opened is still open: the all-green run history is the surface that
  # lied in the first place, and the issue alone would leave it lying.
  hold-alarm:
    name: Report a held rail
    needs: reconcile
    # Runs when the reconcile job ran, whatever it concluded. A failed train run
    # is already loud, and its absent marker reads as unreadable here, which
    # neither opens an alarm nor closes one.
    #
    # It deliberately stands down when reconcile was SKIPPED, and that condition
    # is load-bearing rather than tidiness. The workflow_run trigger fires on
    # every CI completion and the reconcile job's own `if` filters almost all of
    # them out: seventeen of the last twenty runs concluded skipped, against two
    # that reconciled. A bare `always()` would run this job on all of them, which
    # breaks the alarm twice over. Each skipped run would contribute a cycle with
    # no marker, and an unreadable cycle breaks the streak, so the count could
    # never reach four. Worse, a run whose only job was skipped concludes
    # skipped, which is exactly how the gather step below tells a non-cycle from
    # a cycle; adding a job that always runs would conclude those runs success
    # and hide the distinction. The alarm would have read as working and been
    # structurally unable to fire.
    if: always() && needs.reconcile.result != 'skipped'
    permissions:
      # Reading prior cycles' markers, and nothing else, needs actions:read.
      # Nothing in this job writes to a branch, a tag, or a pull request.
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref:` input. Every trigger on this workflow resolves GITHUB_SHA to a
      # commit on the default branch, so the decision policy is read from one
      # immutable snapshot rather than from whatever main becomes mid-run. The
      # checkout is sparse because the only tracked file this job reads is the
      # decision script.
      - name: Checkout the alarm policy from the default-branch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Gather this cycle and the cycles before it
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_MARKER: ${{ needs.reconcile.outputs.marker }}
          THRESHOLD: "4"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-hold-history"
          mkdir -p "$work"
          markers="$work/markers.json"

          # This cycle first, then each earlier cycle that actually ran the
          # reconcile job. A skipped run is not a cycle: the workflow_run trigger
          # skips whenever CI concluded on something other than a successful main
          # push, and counting those as observations would let a quiet stretch of
          # skips stand in for a rail nobody watched.
          current="$work/current.json"
          if [ -n "${CURRENT_MARKER:-}" ] && jq -e . >/dev/null 2>&1 <<< "$CURRENT_MARKER"; then
            printf '%s\n' "$CURRENT_MARKER" > "$current"
          else
            jq -n --arg run "$GITHUB_RUN_ID" '{unreadable: true, run_id: $run}' > "$current"
            echo "::notice::this cycle produced no readable hold marker, so the rail's current state is unknown here."
          fi

          prior_ids="$(gh run list \
            --repo "$REPO" \
            --workflow release-train.yml \
            --limit 40 \
            --json databaseId,conclusion \
            --jq "[.[] | select((.databaseId|tostring) != \"$GITHUB_RUN_ID\") | select(.conclusion != \"skipped\" and .conclusion != \"cancelled\") | .databaseId] | .[0:$((THRESHOLD - 1))] | .[]")"

          collected="$work/collected"
          : > "$collected"
          printf '%s\n' "$(jq -c . "$current")" >> "$collected"
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            download="$work/$run_id"
            mkdir -p "$download"
            # A download that fails and a marker that is absent are the same
            # finding here, and it is not "no drift". The reader treats an
            # unreadable entry as a broken streak rather than as a quiet cycle.
            if gh run download "$run_id" \
                 --repo "$REPO" \
                 --name release-hold-marker \
                 --dir "$download" >/dev/null 2>&1 &&
               [ -s "$download/release-hold-marker.json" ] &&
               jq -e . "$download/release-hold-marker.json" >/dev/null 2>&1; then
              jq -c . "$download/release-hold-marker.json" >> "$collected"
            else
              jq -nc --arg run "$run_id" '{unreadable: true, run_id: $run}' >> "$collected"
            fi
          done <<< "$prior_ids"

          jq -s . "$collected" > "$markers"
          echo "markers=$markers" >> "$GITHUB_OUTPUT"
          echo "observed cycles: $(jq 'length' "$markers")"
          jq -c '.[] | {run_id, state, reason, drift, unreadable}' "$markers"

      - name: Decide whether the rail is quietly held, and say so if it is
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARKERS: ${{ steps.history.outputs.markers }}
          THRESHOLD: "4"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-hold-history"

          # The one title the alarm ever carries. GitHub's title search is fuzzy,
          # so the exact-title filter after it is what keeps this idempotent: a
          # fuzzy hit on a differently titled issue would edit the wrong one.
          title="Release rail is held with releasable drift"
          existing="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "\"$title\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -1)"

          issue_arg=none
          if [ -n "$existing" ]; then
            issue_arg="$work/issue.json"
            jq -n --argjson number "$existing" --arg title "$title" \
              '{number: $number, title: $title}' > "$issue_arg"
          fi

          decision="$work/decision.json"
          node scripts/release-hold-alarm.mjs \
            --markers "$MARKERS" \
            --issue "$issue_arg" \
            --threshold "$THRESHOLD" > "$decision"
          jq -c . "$decision"

          action="$(jq -er .action "$decision")"
          reason="$(jq -er .reason "$decision")"
          case "$action" in
            quiet)
              echo "rail alarm quiet (${reason}): $(jq -r '.detail // ""' "$decision")"
              ;;
            open)
              body="$work/body.md"
              jq -er .body "$decision" > "$body"
              gh issue create --repo "$REPO" --title "$title" --body-file "$body" >/dev/null
              echo "::error::The release rail has held with releasable drift for $(jq -er .consecutive "$decision") consecutive cycles. Opened the tracking issue that names the blocking tag and the two ways out."
              exit 1
              ;;
            update)
              body="$work/body.md"
              jq -er .body "$decision" > "$body"
              number="$(jq -er .issue "$decision")"
              gh issue edit "$number" --repo "$REPO" --body-file "$body" >/dev/null
              echo "::error::The release rail is still held with releasable drift after $(jq -er .consecutive "$decision") consecutive cycles; issue #${number} carries the current state."
              exit 1
              ;;
            close)
              number="$(jq -er .issue "$decision")"
              comment="$work/comment.md"
              jq -er .comment "$decision" > "$comment"
              gh issue comment "$number" --repo "$REPO" --body-file "$comment" >/dev/null
              gh issue close "$number" --repo "$REPO" >/dev/null
              echo "Closed rail-hold issue #${number}: the train is minting again."
              ;;
            *)
              echo "::error::unsupported alarm action: ${action}"
              exit 1
              ;;
          esac
