name: Release Train

# Trusted-default-branch triggers only. repository_dispatch gives operators a
# safe immediate reconcile without branch-selectable workflow code.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  repository_dispatch:
    types: [release-reconcile]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: kin-release-train
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile release PR
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same main-only Environment protects the raw release App key used by
    # the branch writer. Only the repository-scoped installation token leaves
    # the credential-minting step.
    environment: release-tag
    steps:
      - name: Mint repository-scoped release branch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: firelock-ai
          repositories: kin

      - name: Checkout trusted main with release-branch authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The release labels describe the resolved intent so the board reads
      # correctly. They are never consulted to resolve it: a label can be
      # changed after a merge, and the release intent must not move once its
      # evidence is on protected main.
      - name: Ensure release intent labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "release:automated" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" \
            --description "Automation-owned coalescing release PR" \
            --force
          gh label create "release:patch" \
            --repo "$GITHUB_REPOSITORY" \
            --color "C5DEF5" \
            --description "Describes the immutable patch intent resolved for the next release" \
            --force
          gh label create "release:minor" \
            --repo "$GITHUB_REPOSITORY" \
            --color "FBCA04" \
            --description "Describes the immutable minor intent resolved for the next release" \
            --force
          gh label create "release:major" \
            --repo "$GITHUB_REPOSITORY" \
            --color "B60205" \
            --description "Describes the immutable major intent resolved for the next release" \
            --force

      - name: Resolve releasable drift and SemVer intent
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_POLICY_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The release intent is read from immutable commit messages, and it
          # only reaches them because this repository merges by squash with the
          # pull-request body as the message. Assert that before trusting the
          # resolution rather than discovering a rewritten message later.
          #
          # GitHub returns the merge-policy fields only to a token that holds
          # push-level repository access, and this workflow's GITHUB_TOKEN is
          # deliberately read-scoped. Read the policy through the same
          # repository-scoped App installation token that already writes the
          # release branch, and keep the two failures apart: a response that
          # never carried the fields cannot disprove the policy, so reporting it
          # as a wrong setting sends recovery after a correct repository.
          if [ -z "$MERGE_POLICY_TOKEN" ]; then
            echo "::error::reading repository merge policy requires the release App installation token"
            exit 1
          fi
          merge_policy="$(GH_TOKEN="$MERGE_POLICY_TOKEN" gh api "repos/${REPO}")"
          if ! jq -e 'type == "object"' <<< "$merge_policy" > /dev/null; then
            echo "::error::repository merge policy response was not a JSON object, so the policy was never read"
            exit 1
          fi
          absent="$(jq -r '
            . as $repo
            | [
                "allow_squash_merge",
                "allow_merge_commit",
                "allow_rebase_merge",
                "squash_merge_commit_title",
                "squash_merge_commit_message"
              ]
            | map(. as $field | select(($repo | has($field)) | not))
            | join(", ")
          ' <<< "$merge_policy")"
          if [ -n "$absent" ]; then
            echo "::error::repository merge policy is unreadable, not disproven: ${absent} absent from the API response, which happens when the reading token lacks push-level repository access"
            exit 1
          fi
          violations="$(jq -r '
            [
              (select(.allow_squash_merge == true | not) | "allow_squash_merge"),
              (select(.allow_merge_commit == false | not) | "allow_merge_commit"),
              (select(.allow_rebase_merge == false | not) | "allow_rebase_merge"),
              (select(.squash_merge_commit_title == "PR_TITLE" | not) | "squash_merge_commit_title"),
              (select(.squash_merge_commit_message == "PR_BODY" | not) | "squash_merge_commit_message")
            ]
            | join(", ")
          ' <<< "$merge_policy")"
          if [ -n "$violations" ]; then
            echo "::error::immutable PR-body release intent requires enforced PR_TITLE + PR_BODY squash-only merging; offending repository settings: ${violations}"
            exit 1
          fi
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          main_sha="$(git rev-parse refs/remotes/origin/main)"
          version="$(git show refs/remotes/origin/main:Cargo.toml | python3 -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])
          ')"
          tag="v${version}"
          # The same serialization predicate the tag mint admits against, and
          # the same waiver. Fixing only the mint would leave this side wedged:
          # an abandoned tag that stays highest here stops the version bump PR
          # from ever opening, so the version never moves and the mint has
          # nothing new to tag. Only a reviewed abandonment record skips a tag,
          # read from protected main together with the selector that reads it.
          #
          # The selector's mint-intent argument is empty here on purpose. This
          # step resolves drift and opens a version bump PR; it never creates a
          # tag, and $tag below is the pre-existing base it measures drift from.
          # Handing that base over as mint intent would refuse precisely when a
          # record covers it, and a record always covers it: the mint only
          # creates v$(workspace version), so main's version equals the stuck
          # tag and cannot move until this step opens the bump that a record is
          # written to unblock.
          train_policy="$RUNNER_TEMP/release-train-policy"
          mkdir -p "$train_policy"
          abandoned="$train_policy/abandoned-release-tags.json"
          selector="$train_policy/select-admissible-release-tag.py"
          git show \
            "refs/remotes/origin/main:scripts/abandoned-release-tags.json" \
            > "$abandoned"
          git show \
            "refs/remotes/origin/main:scripts/select-admissible-release-tag.py" \
            > "$selector"
          test -s "$abandoned"
          test -s "$selector"
          candidate_tags="$train_policy/release-tags"
          git for-each-ref \
            --sort=-v:refname \
            --format='%(refname:strip=2) %(if)%(*objectname)%(then)%(*objectname)%(else)%(objectname)%(end)' \
            refs/tags > "$candidate_tags"
          admissible="$train_policy/highest-admissible-tag"
          python3 "$selector" \
            "$abandoned" \
            "$candidate_tags" \
            "" \
            "$admissible"
          highest_tag="$(cat "$admissible")"
          latest_tag="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          if [ -z "$highest_tag" ] || [ "$highest_tag" != "$latest_tag" ]; then
            echo "::notice::highest tag ${highest_tag:-<none>} is not finalized GitHub Latest ${latest_tag}; release recovery owns this state."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${tag}^{commit}" >/dev/null; then
            echo "::notice::${tag} is already staged on main; tag reconciliation owns the next transition."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          drift="$(git rev-list --count "${tag}..${main_sha}")"
          if [ "$drift" -eq 0 ]; then
            echo "::notice::main has no commits beyond ${tag}."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the bump from the immutable `Kin-Release-Intent` trailers on
          # the first-parent range. Pull-request labels and the dispatch payload
          # are deliberately not consulted: both remain editable after a merge,
          # so a later scheduled run could resolve a lower bump than an earlier
          # one and rewrite a prepared minor or major release back to a patch.
          # Commit messages on protected main cannot be edited, so the same
          # range always resolves to the same intent, and the range only grows.
          intent_policy="$RUNNER_TEMP/resolve-release-intent.mjs"
          git show "refs/remotes/origin/main:scripts/resolve-release-intent.mjs" \
            > "$intent_policy"
          bump="$(
            node "$intent_policy" \
              --base-ref "$tag" \
              --head-ref refs/remotes/origin/main \
              | jq -er .intent
          )"
          case "$bump" in
            patch|minor|major) ;;
            *)
              echo "::error::unsupported immutable release intent: $bump"
              exit 1
              ;;
          esac

          {
            echo "needed=true"
            echo "base_tag=$tag"
            echo "base_version=$version"
            echo "bump=$bump"
            echo "main_sha=$main_sha"
            echo "drift=$drift"
          } >> "$GITHUB_OUTPUT"
          echo "release drift: ${drift} first-parent range commit(s), base=${tag}, bump=${bump}"

      - name: Create or coalesce the release branch
        id: branch
        if: steps.plan.outputs.needed == 'true'
        env:
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          BRANCH: automation/release-next
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "kin-release-bot[bot]"
          git config user.email "kin-release-bot[bot]@users.noreply.github.com"
          policy_dir="$RUNNER_TEMP/release-policy"
          mkdir -p "$policy_dir"
          for policy in \
            scripts/check-release-version.mjs \
            scripts/prepare-release.mjs \
            scripts/release-intent.mjs
          do
            git show "refs/remotes/origin/main:${policy}" \
              > "${policy_dir}/${policy##*/}"
          done

          existing=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            existing=true
            git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            allowed='^(Cargo\.toml|Cargo\.lock|CHANGELOG\.md|crates/kin-cli/Cargo\.toml|packages/(kin-mcp|kin|boundary-contracts)/package\.json)$'
            branch_paths="$(git diff \
              --name-only \
              "refs/remotes/origin/main...refs/remotes/origin/${BRANCH}")"
            unexpected=""
            while IFS= read -r generated; do
              [ -n "$generated" ] || continue
              if [[ ! "$generated" =~ $allowed ]]; then
                unexpected="${unexpected}${generated}"$'\n'
              fi
            done <<< "$branch_paths"
            if [ -n "$unexpected" ]; then
              echo "::error::release branch contains non-generated paths:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            while IFS= read -r generated; do
              [ -n "$generated" ] || continue
              mode="$(git ls-tree "refs/remotes/origin/${BRANCH}" -- "$generated" | awk '{print $1}')"
              if [ "$mode" != 100644 ]; then
                echo "::error::release branch path ${generated} has unsafe mode ${mode:-missing}"
                exit 1
              fi
            done <<< "$branch_paths"
            git checkout -B "$BRANCH" "refs/remotes/origin/${BRANCH}"
            # Only the seven generated files may differ from main. Resolve any
            # conflict in those stale generated bytes toward the existing
            # branch so the merge commit can be formed; the next command then
            # discards every one of those bytes and regenerates them from the
            # newly merged, trusted main policy and source.
            git merge --signoff --no-edit -X ours refs/remotes/origin/main
          else
            git checkout -b "$BRANCH" refs/remotes/origin/main
          fi

          # Regenerate every permitted byte from trusted main. Existing branch
          # contents carry no policy or payload authority; they are only a
          # fast-forward history anchor for an already-open PR.
          git restore --source refs/remotes/origin/main -- \
            Cargo.toml \
            Cargo.lock \
            fuzz/Cargo.lock \
            CHANGELOG.md \
            crates/kin-cli/Cargo.toml \
            packages/kin-mcp/package.json \
            packages/kin/package.json \
            packages/boundary-contracts/package.json

          output="$RUNNER_TEMP/prepare-release.outputs"
          : > "$output"
          GITHUB_OUTPUT="$output" node "$policy_dir/prepare-release.mjs" \
            --base-tag "$BASE_TAG" \
            --bump "$BUMP" \
            --source-ref refs/remotes/origin/main

          version="$(sed -n 's/^version=//p' "$output")"
          tag="$(sed -n 's/^tag=//p' "$output")"
          test -n "$version"
          test -n "$tag"

          node "$policy_dir/release-intent.mjs"

          git add \
            Cargo.toml \
            Cargo.lock \
            fuzz/Cargo.lock \
            CHANGELOG.md \
            crates/kin-cli/Cargo.toml \
            packages/kin-mcp/package.json \
            packages/kin/package.json \
            packages/boundary-contracts/package.json
          if ! git diff --cached --quiet; then
            git commit --signoff -m "Release Kin ${tag}"
          fi
          node "$policy_dir/check-release-version.mjs" \
            --base refs/remotes/origin/main \
            --labels "release:${BUMP}"
          git push origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "branch=$BRANCH"
            echo "existing=$existing"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Open the protected release PR
        id: pr
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TAG: ${{ steps.branch.outputs.tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          pr_data="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$BRANCH" \
            --json number,headRepository,headRepositoryOwner)"
          pr="$(jq -er '
            [
              .[] |
              select(
                .headRepositoryOwner.login == "firelock-ai" and
                .headRepository.nameWithOwner == "firelock-ai/kin"
              )
            ] |
            if length > 1 then
              error("multiple firelock-ai/kin release-train PRs")
            else
              .[0].number // ""
            end
          ' <<< "$pr_data")"
          created=false
          if [ -z "$pr" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Release Kin ${TAG}" \
              --body "Automated, coalescing Kin release PR. It carries the lockstep Cargo/npm version, exact internal path pin, workspace-only lockfile movement, and generated notes for every reviewed first-parent change since the prior stable tag." \
              >/dev/null
            pr_data="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$BRANCH" \
              --json number,headRepository,headRepositoryOwner)"
            pr="$(jq -er '
              [
                .[] |
                select(
                  .headRepositoryOwner.login == "firelock-ai" and
                  .headRepository.nameWithOwner == "firelock-ai/kin"
                )
              ] |
              if length == 1 then
                .[0].number
              else
                error("created release PR could not be uniquely resolved")
              end
            ' <<< "$pr_data")"
            test -n "$pr"
            created=true
          fi
          gh pr edit "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release Kin ${TAG}" \
            --body "Automated, coalescing Kin release PR. It carries the lockstep Cargo/npm version, exact internal path pin, workspace-only lockfile movement, and generated notes for every reviewed first-parent change since the prior stable tag."
          jq -n \
            --arg automated "release:automated" \
            --arg bump "release:${BUMP}" \
            '{labels: [$automated, $bump]}' \
            | gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" \
                --input - \
                >/dev/null
          head_sha="$(gh pr view "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          needs_activation=true
          for attempt in 1 2 3 4 5 6; do
            ci_runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&per_page=30")"
            valid_ci="$(jq -r \
              --arg sha "$head_sha" \
              '[
                .workflow_runs[] |
                select(
                  .head_sha == $sha and
                  .event == "pull_request" and
                  .path == ".github/workflows/ci.yml" and
                  .conclusion != "action_required"
                )
              ] | length' \
              <<< "$ci_runs")"
            if [ "$valid_ci" -gt 0 ]; then
              needs_activation=false
              break
            fi
            [ "$attempt" -eq 6 ] || sleep 2
          done
          {
            echo "number=$pr"
            echo "created=$created"
            echo "needs_activation=$needs_activation"
          } >> "$GITHUB_OUTPUT"

      - name: Activate ordinary PR checks with the release App
        if: steps.pr.outputs.needs_activation == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN-created PR starts in GitHub's approval-required
          # recursion state. This App-authored synchronize event is the narrow,
          # unattended handoff into the ordinary protected PR checks.
          git commit --allow-empty --signoff \
            -m "Activate protected checks for the automated release PR"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Arm protected auto-merge
        if: steps.plan.outputs.needed == 'true'
        env:
          # Register auto-merge as the release App, not GITHUB_TOKEN. GitHub
          # suppresses most workflow events caused by GITHUB_TOKEN; an
          # App-owned merge must emit the main push that starts CI and the
          # automatic tag/release chain.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh pr merge "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$head_sha"

      - name: Summarize
        if: steps.plan.outputs.needed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          TAG: ${{ steps.branch.outputs.tag }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          DRIFT: ${{ steps.plan.outputs.drift }}
        run: |
          {
            echo "## Release train reconciled"
            echo ""
            echo "- PR: #${PR}"
            echo "- target: ${TAG}"
            echo "- prior stable: ${BASE_TAG}"
            echo "- coalesced commits: ${DRIFT}"
            echo "- merge: armed only after protected checks"
          } >> "$GITHUB_STEP_SUMMARY"
