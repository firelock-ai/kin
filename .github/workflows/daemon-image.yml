name: Daemon Image

# Builds and pushes the kin-daemon container image to the Kin Artifact Registry.
# On every push to main it keeps a fresh SHA-tagged (and :latest) image available
# for the hosted rollout (kinlab deploy.yml consumes KINLAB_KIN_DAEMON_IMAGE);
# workflow_dispatch builds the same image on demand. Auth is keyless via the
# firelock-ai org Workload Identity Federation provider (no service-account keys).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: daemon-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: us-central1-docker.pkg.dev/kin-ecosystem/kin-ecosystem/kin-daemon

jobs:
  build-push:
    name: Build + push kin-daemon image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (keyless WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Log in to GitHub Container Registry (public mirror)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build locally for provenance verification (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          # Single-arch manifest (no attestation index) for predictable GKE pulls.
          provenance: false
          build-args: |
            KIN_BUILD_GIT_SHA=${{ github.sha }}
            KIN_BUILD_DIRTY=false
            KIN_BUILD_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ghcr.io/firelock-ai/kin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image embeds exact source provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verify-container-build-info.sh "${IMAGE}:${EXPECTED_SHA}" "$EXPECTED_SHA"

      - name: Push only the verified image
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${EXPECTED_SHA}"
          docker push "ghcr.io/firelock-ai/kin:${EXPECTED_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "${IMAGE}:${EXPECTED_SHA}" "${IMAGE}:latest"
            docker tag "ghcr.io/firelock-ai/kin:${EXPECTED_SHA}" "ghcr.io/firelock-ai/kin:latest"
            docker push "${IMAGE}:latest"
            docker push "ghcr.io/firelock-ai/kin:latest"
          fi

      - name: Summary
        run: |
          {
            echo "Pushed \`${IMAGE}:${GITHUB_SHA}\`"
            echo "Pushed \`ghcr.io/firelock-ai/kin:${GITHUB_SHA}\` (public)"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "Pushed \`${IMAGE}:latest\`"
              echo "Pushed \`ghcr.io/firelock-ai/kin:latest\` (public)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
