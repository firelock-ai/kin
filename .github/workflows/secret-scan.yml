name: Secret Scan

on:
  push:
    branches: ["**"]
  # `push` alone never produces this context for a fork PR: GitHub does not
  # run a base repository's workflows in response to a push to a fork's own
  # branch, so a fork's head sha could never carry `gitleaks (full history)`
  # and the PR could never satisfy branch protection. `pull_request` runs the
  # workflow file from this repository regardless of where the head branch
  # lives, which is what lets a fork PR produce the check at all. The job's
  # own `if:` below skips this event for a same-repository PR, whose branch
  # push already produced the context through the trigger above.
  pull_request:

# Sha-scoped on main for the same reason as ci.yml: `cancel-in-progress: false`
# keeps at most one PENDING run per group and cancels the older one, so two
# quick pushes to main can delete the earlier commit's run outright. This
# workflow publishes `gitleaks (full history)`, a required context that
# release-tag.yml demands with push-event provenance, so a dropped run here
# makes the commit unmintable. The suffix is empty off main, leaving branch
# and merge-queue supersession exactly as it was.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # See the `on:` comment above. A same-repository PR already gets this
    # context from its branch's own push, so only a fork's pull_request needs
    # this job; every push event still runs unconditionally either way.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # We invoke the gitleaks CLI directly instead of gitleaks/gitleaks-action.
      # The official action requires a (free) GITLEAKS_LICENSE secret for repos
      # owned by a GitHub *organization* (firelock-ai is one) and hard-fails
      # without it. The CLI has no such gate, so this keeps the scan green with
      # no extra secret to provision. The download is version-pinned and
      # checksum-verified for supply-chain safety.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${BASE}/${TARBALL}"
          curl -fsSL -O "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$TARBALL" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `gitleaks git .` scans the full commit history of the checked-out repo
      # (fetch-depth: 0 above). Exits non-zero when any leak is found.
      - name: Scan full git history
        run: |
          gitleaks git \
            --redact=100 \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            .

      - name: Upload gitleaks SARIF report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
