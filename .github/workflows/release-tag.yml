name: Release Tag (bot-mediated)

# Bot-mediated creation of a `vX.Y.Z` release tag. The repository ruleset
# "Protect version release tags" restricts who may create `v*` tags. Instead of
# the release captain holding the founder credential that the ruleset admits,
# this workflow mints a short-lived installation token for the "kin-release-bot"
# GitHub App (allowlisted in that ruleset) and creates the tag ref only after a
# strict, fail-closed set of checks pass. Creating the ref with an App token,
# never the default GITHUB_TOKEN, is what lets the existing tag-triggered
# `release.yml` DAG fire.
#
# Automatic reconciliation uses only trusted default-branch workflow code. It
# finds the exact reviewed commit where an untagged coherent version first
# appeared, waits for release-critical checks and the prior release lane, then
# uses the same App-mediated tag write as the break-glass dispatch path.

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Unlike workflow_dispatch, repository_dispatch always executes the workflow
  # from the last commit on the default branch and only when this file exists
  # there. The typed event preserves break glass without branch-selectable code.
  repository_dispatch:
    types: [release_tag]

# The App installation token carries the only write capability (creating the
# tag ref). The workflow's own GITHUB_TOKEN stays read-only: contents:read for
# checkout and ref reads, checks:read for check-runs, and actions:read to bind
# each required check suite to its exact workflow path, event, and head SHA.
permissions:
  contents: read
  checks: read
  actions: read
  attestations: read

# Never run two tag mints at once, and never cancel one mid-flight.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  mint-release-tag:
    name: Mint release tag
    # Any completed CI run for a main push is an occasion to evaluate a mint,
    # whatever that run concluded in aggregate. The aggregate conclusion is not
    # a release verdict and is deliberately not consulted here: a ci.yml run
    # carries jobs beyond the release-critical ones, so a single non-required
    # red (an advisory Windows or coverage leg) turns the whole run red and
    # would silence this trigger on most main pushes, leaving the schedule as
    # the only automatic path. "Verify required checks are green" below is the
    # authority. It binds each reviewed required context to its exact workflow
    # id, path, push event, branch, and head sha, judges that context's own
    # conclusion, and explicitly refuses to let a producing run's aggregate
    # conclusion veto through it. This trigger therefore decides only when to
    # look, never whether the commit is releasable, which is exactly the
    # division the scheduled path already runs under.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    # The automatic path waits for release-critical checks to settle, so the
    # mint needs more headroom than a break-glass dispatch against an already
    # green commit.
    timeout-minutes: 45
    # The kin-release-bot App credentials are scoped to this environment, which
    # a job only resolves when it declares the environment. Without the binding
    # the job silently falls back to repository-scoped copies of the same secret
    # names, so a key rotation applied to the environment never reaches the mint.
    # The environment's deployment branch policy admits main only, which matches
    # the ref guard below, and keeps App-token minting behind a credential
    # boundary even though every trigger already pins the executed workflow and
    # ref to protected default-branch history.
    environment: release-tag
    steps:
      - name: Guard trigger authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOWED_ACTORS: |
            troyjr4103
            kin-release-bot[bot]
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != repository_dispatch ]; then
            echo "trusted automatic trigger: $EVENT_NAME"
            exit 0
          fi
          if [ "$EVENT_ACTION" != release_tag ]; then
            echo "::error::unsupported repository dispatch action '$EVENT_ACTION'"
            exit 1
          fi
          if [ "$DEFAULT_BRANCH" != main ]; then
            echo "::error::release-tag requires main as the repository default branch (got '$DEFAULT_BRANCH')"
            exit 1
          fi
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::release-tag dispatch must execute from the default branch (got '$REF')"
            exit 1
          fi
          if ! printf '%s' "$EVENT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::repository dispatch workflow sha '$EVENT_SHA' is not exact lowercase hex"
            exit 1
          fi
          authorized=0
          while IFS= read -r allowed; do
            [ -z "$allowed" ] && continue
            [ "$allowed" = "$ACTOR" ] && authorized=1
          done <<< "$ALLOWED_ACTORS"
          if [ "$authorized" -ne 1 ]; then
            echo "::error::actor '$ACTOR' is not authorized to mint release tags"
            exit 1
          fi
          echo "authorized actor=$ACTOR action=$EVENT_ACTION ref=$REF workflow_sha=$EVENT_SHA"

      - name: Checkout trusted release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact coherent release commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_TAG: ${{ github.event.client_payload.tag }}
          RAW_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          automatic=true
          tag=""
          case "$EVENT_NAME" in
            repository_dispatch)
              automatic=false
              tag="$RAW_TAG"
              sha="$(printf '%s' "$RAW_SHA" | tr '[:upper:]' '[:lower:]')"
              ;;
            workflow_run|schedule)
              # Both automatic arms read the same freshly fetched protected
              # main. A trigger decides only when to look, never which commit to
              # release, so the event's own head sha is deliberately not an
              # input here: a rerun of an older CI run carries that run's sha,
              # which resolves the version main carried then rather than the
              # version it carries now. Reading main HEAD costs nothing, since
              # the required-check gate re-derives everything from the resolved
              # commit anyway, and it denies the event path a stale-candidate
              # class the scheduled path structurally cannot reach.
              sha="$(git rev-parse refs/remotes/origin/main)"
              ;;
            *)
              echo "::error::unsupported release-tag event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            if [ "$automatic" != true ]; then
              echo "::error::tag '$tag' must match ^v[0-9]+\.[0-9]+\.[0-9]+\$"
              exit 1
            fi
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha '$sha' must be a 40-character lowercase hex commit SHA"
            exit 1
          fi
          if [ "$automatic" = true ]; then
            current_version="$(git show "$sha:Cargo.toml" | python3 -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])
          ')"
            # Both scheduled reconciliation and workflow_run retries normalize
            # to the first reviewed main commit carrying this version. A later
            # green commit must never be swept into an already-prepared release.
            candidate="$sha"
            while IFS= read -r commit; do
              version="$(git show "$commit:Cargo.toml" | python3 -c '
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])
          ')"
              [ "$version" = "$current_version" ] || break
              candidate="$commit"
            done < <(git log --first-parent --format=%H "$sha" -- Cargo.toml)
            sha="$candidate"
          fi

          # Admit the selected commit against the freshly fetched protected-main
          # authority before checking it out. In particular, a break-glass
          # repository_dispatch payload cannot select branch-controlled code and
          # then poison PATH or the runner command files before this decision.
          authority_main="$(git rev-parse refs/remotes/origin/main)"
          [[ "$authority_main" =~ ^[0-9a-f]{40}$ ]]
          resolved_commit="$(git rev-parse "${sha}^{commit}")"
          if [ "$resolved_commit" != "$sha" ]; then
            echo "::error::release sha $sha does not name an exact commit"
            exit 1
          fi
          if [ "$automatic" = true ]; then
            if ! git merge-base --is-ancestor "$sha" "$authority_main"; then
              echo "::error::automatic release sha $sha is not on reviewed main history"
              exit 1
            fi
          elif [ "$sha" != "$authority_main" ]; then
            echo "::error::break-glass release sha $sha is not current origin/main HEAD ($authority_main)"
            exit 1
          fi

          # Execute the release policy copied from the pinned, reviewed current
          # main commit, not from the payload-selected checkout. Capture Node
          # before checkout and give the policy inert runner state files so it
          # cannot influence later privileged steps through GITHUB_ENV/PATH/STATE.
          node_bin="$(command -v node)"
          if [[ "$node_bin" != /* ]]; then
            echo "::error::could not resolve Node to an absolute trusted runner path"
            exit 1
          fi
          policy="$RUNNER_TEMP/release-intent-policy.mjs"
          git show "${authority_main}:scripts/release-intent.mjs" > "$policy"
          test -s "$policy"

          git checkout --detach "$sha"
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "::error::release checkout did not resolve to admitted sha $sha"
            exit 1
          fi
          intent="$RUNNER_TEMP/release-intent.outputs"
          intent_env="$RUNNER_TEMP/release-intent.github-env"
          intent_path="$RUNNER_TEMP/release-intent.github-path"
          intent_state="$RUNNER_TEMP/release-intent.github-state"
          : > "$intent"
          : > "$intent_env"
          : > "$intent_path"
          : > "$intent_state"
          GITHUB_OUTPUT="$intent" \
          GITHUB_ENV="$intent_env" \
          GITHUB_PATH="$intent_path" \
          GITHUB_STATE="$intent_state" \
            "$node_bin" "$policy"
          if [ -s "$intent_env" ] || [ -s "$intent_path" ] || [ -s "$intent_state" ]; then
            echo "::error::release-intent attempted to mutate runner state"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$sha" ] ||
             [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::release-intent mutated the admitted source checkout"
            exit 1
          fi
          resolved_tag="$(sed -n 's/^tag=//p' "$intent")"
          should_tag="$(sed -n 's/^should_tag=//p' "$intent")"
          test -n "$resolved_tag"
          test -n "$should_tag"

          if [ "$automatic" = true ]; then
            tag="$resolved_tag"
            if [ "$should_tag" != true ]; then
              echo "::notice::${tag} already exists; release tag reconciliation is a no-op."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [ "$resolved_tag" != "$tag" ]; then
              echo "::error::requested tag $tag does not match coherent intent $resolved_tag"
              exit 1
            fi
            if [ "$should_tag" != true ]; then
              echo "::error::requested tag $tag already exists"
              exit 1
            fi
          fi

          {
            echo "needed=true"
            echo "automatic=$automatic"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "resolved coherent release tag=$tag sha=$sha automatic=$automatic"

      - name: Re-verify checked-out SHA is on reviewed origin/main history
        if: steps.resolve.outputs.needed == 'true'
        env:
          AUTOMATIC: ${{ steps.resolve.outputs.automatic }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          echo "checked-out=$head_sha main=$main_sha requested=$SHA"
          if [ "$head_sha" != "$SHA" ]; then
            echo "::error::checked-out HEAD ($head_sha) != requested sha ($SHA)"
            exit 1
          fi
          if [ "$AUTOMATIC" = true ]; then
            if ! git merge-base --is-ancestor "$head_sha" "$main_sha"; then
              echo "::error::automatic release sha $SHA is not on reviewed main history"
              exit 1
            fi
          elif [ "$head_sha" != "$main_sha" ]; then
            echo "::error::break-glass release sha $SHA is not current origin/main HEAD ($main_sha)"
            exit 1
          fi
          echo "sha confirmed on reviewed origin/main history"

      - name: Verify tag version matches workspace version
        if: steps.resolve.outputs.needed == 'true'
        # The version of record is [workspace.package].version in the root
        # Cargo.toml at the requested SHA. The tag must be exactly that, v-prefixed.
        run: |
          set -euo pipefail
          ws_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["workspace"]["package"]["version"])
          PY
          )"
          expected="v${ws_version}"
          echo "workspace.package.version=$ws_version expected_tag=$expected requested_tag=$TAG"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag $TAG does not match workspace version tag $expected at $SHA"
            exit 1
          fi
          echo "tag matches workspace version"

      - name: Admit the serialized release lane
        id: prior
        if: steps.resolve.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTOMATIC: ${{ steps.resolve.outputs.automatic }}
        run: |
          set -euo pipefail
          # Declining to mint is a real outcome that exits the job green on
          # purpose, which is what made a blocked release indistinguishable
          # from a minted one on the board. A decline therefore has to be
          # legible without reading logs: a warning annotation, a step summary
          # section, and a named reason the escalation step can quote.
          decline() { # <reason> <sentence>
            printf '::warning::release mint declined (%s): %s\n' "$1" "$2"
            {
              echo "### Release mint declined"
              echo
              echo "Reason: \`$1\`"
              echo
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "ready=false"
              echo "decline_reason=$1"
            } >> "$GITHUB_OUTPUT"
          }
          runs="$(gh api "repos/${REPO}/actions/workflows/release.yml/runs?per_page=100")"
          active="$(jq '[.workflow_runs[] | select(
            .status == "requested" or .status == "queued" or .status == "in_progress" or
            .status == "waiting" or .status == "pending"
          )] | length' <<< "$runs")"
          if [ "$active" -ne 0 ]; then
            if [ "$AUTOMATIC" = true ]; then
              decline release-in-flight "${active} Release run(s) are active; a scheduled reconcile will retry."
              exit 0
            fi
            echo "::error::${active} Release run(s) are active"
            exit 1
          fi

          latest="$(gh api "repos/${REPO}/releases/latest")"
          latest_tag="$(jq -er .tag_name <<< "$latest")"
          # Serialization is owed to a release that can still finish. A tag
          # whose artifacts can never be built cannot, and on its own it holds
          # this lane closed against every successor, including the one that
          # repairs the defect. A reviewed abandonment record is the only
          # waiver, so a tag that is merely failing so far still blocks. Both
          # the record and the selector come from protected main rather than the
          # checked-out release commit, which predates the abandonment it has to
          # honour and would otherwise re-deadlock the lane it unblocks.
          lane_policy="$RUNNER_TEMP/release-lane-policy"
          mkdir -p "$lane_policy"
          abandoned="$lane_policy/abandoned-release-tags.json"
          selector="$lane_policy/select-admissible-release-tag.py"
          if ! git show \
            "refs/remotes/origin/main:scripts/abandoned-release-tags.json" \
            > "$abandoned"; then
            echo "::error::protected main carries no abandoned release-tag record"
            exit 1
          fi
          if ! git show \
            "refs/remotes/origin/main:scripts/select-admissible-release-tag.py" \
            > "$selector"; then
            echo "::error::protected main carries no release-lane tag selector"
            exit 1
          fi
          test -s "$abandoned"
          test -s "$selector"
          candidate_tags="$lane_policy/release-tags"
          git for-each-ref \
            --sort=-v:refname \
            --format='%(refname:strip=2) %(if)%(*objectname)%(then)%(*objectname)%(else)%(objectname)%(end)' \
            refs/tags > "$candidate_tags"
          admissible="$lane_policy/highest-admissible-tag"
          python3 "$selector" \
            "$abandoned" \
            "$candidate_tags" \
            "$TAG" \
            "$admissible"
          highest_tag="$(cat "$admissible")"
          if [ -z "$highest_tag" ] || [ "$highest_tag" != "$latest_tag" ]; then
            if [ "$AUTOMATIC" = true ]; then
              decline unfinalized-latest "highest tag ${highest_tag:-<none>} is not finalized GitHub Latest ${latest_tag}; release recovery will reconcile it."
              exit 0
            fi
            echo "::error::highest tag ${highest_tag:-<none>} is not finalized GitHub Latest ${latest_tag}"
            exit 1
          fi
          ref="$(gh api "repos/${REPO}/git/ref/tags/${latest_tag}")"
          object_type="$(jq -r .object.type <<< "$ref")"
          latest_sha="$(jq -r .object.sha <<< "$ref")"
          for _ in 1 2 3 4; do
            [ "$object_type" = tag ] || break
            tag_object="$(gh api "repos/${REPO}/git/tags/${latest_sha}")"
            object_type="$(jq -r .object.type <<< "$tag_object")"
            latest_sha="$(jq -r .object.sha <<< "$tag_object")"
          done
          [ "$object_type" = commit ]
          successful="$(jq -r \
            --arg tag "$latest_tag" \
            --arg sha "$latest_sha" \
            '[.workflow_runs[] | select(
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == $tag and
              .head_sha == $sha and
              .path == ".github/workflows/release.yml"
            )] | sort_by(.created_at) | last | .id // empty' \
            <<< "$runs")"
          if [ -z "$successful" ]; then
            matching_count="$(jq \
              --arg tag "$latest_tag" \
              --arg sha "$latest_sha" \
              '[.workflow_runs[] | select(
                .event == "push" and
                .head_branch == $tag and
                .head_sha == $sha and
                .path == ".github/workflows/release.yml"
              )] | length' \
              <<< "$runs")"
            if [ "$matching_count" -ne 0 ]; then
              if [ "$AUTOMATIC" = true ]; then
                decline unrecovered-latest "latest stable ${latest_tag}@${latest_sha} has preserved Release attempts but none succeeded; recovery owns this state."
                exit 0
              fi
              echo "::error::latest stable ${latest_tag}@${latest_sha} has preserved Release attempts but none succeeded"
              exit 1
            fi

            # Actions logs are operational records, not durable release
            # authority. Prefer the terminal marker produced only after every
            # stable release capstone. Releases predating that marker must prove
            # their exact npm and GHCR final surfaces in addition to aggregate
            # provenance; this is intentionally a legacy-only fallback.
            proof_dir="$RUNNER_TEMP/prior-release-proof"
            mkdir -p "$proof_dir"
            marker_count="$(jq '[.assets[] | select(.name == "release-promotion.json")] | length' <<< "$latest")"
            sidecar_count="$(jq '[.assets[] | select(.name == "release-promotion.json.sha256")] | length' <<< "$latest")"
            if [ "$marker_count" -gt 1 ] || [ "$sidecar_count" -gt 1 ]; then
              echo "::error::prior stable has duplicate terminal completion assets"
              exit 1
            fi

            if [ "$marker_count" -eq 1 ] || [ "$sidecar_count" -eq 1 ]; then
              if [ "$marker_count" -ne 1 ] || [ "$sidecar_count" -ne 1 ]; then
                echo "::error::prior stable has a partial terminal completion marker"
                exit 1
              fi
              gh release download "$latest_tag" \
                --repo "$REPO" \
                --pattern release-promotion.json \
                --pattern release-promotion.json.sha256 \
                --dir "$proof_dir"
              (
                cd "$proof_dir"
                sha256sum -c release-promotion.json.sha256
                jq -e \
                  --arg tag "$latest_tag" \
                  --arg sha "$latest_sha" \
                  '
                    .schema_version == 1 and
                    .release_tag == $tag and
                    .commit == $sha and
                    (.release_workflow_run_id | test("^[1-9][0-9]*$")) and
                    .signer_workflow == ".github/workflows/release.yml" and
                    (.ghcr_digest | test("^sha256:[0-9a-f]{64}$")) and
                    (
                      .completed_capstones == [
                        "github_stable_latest",
                        "install_proof",
                        "npm_public_provenance_and_smoke",
                        "ghcr_version_and_latest",
                        "post_release_boundary_contracts_settled"
                      ]
                    )
                  ' release-promotion.json >/dev/null
                marker_run_id="$(jq -er .release_workflow_run_id release-promotion.json)"
                [[ "$marker_run_id" =~ ^[1-9][0-9]*$ ]]
                gh attestation verify release-promotion.json \
                  --repo "$REPO" \
                  --signer-workflow "${REPO}/.github/workflows/release.yml" \
                  --signer-digest "$latest_sha" \
                  --source-ref "refs/tags/${latest_tag}" \
                  --source-digest "$latest_sha" \
                  --deny-self-hosted-runners \
                  --format json > attestation.json
                run_uri="https://github.com/${REPO}/actions/runs/${marker_run_id}/attempts/"
                jq -e \
                  --arg run_uri "$run_uri" \
                  '
                    length > 0 and
                    all(.[];
                      (
                        .verificationResult.signature.certificate.runInvocationURI ==
                        .verificationResult.statement.predicate.runDetails.metadata.invocationId
                      ) and
                      (.verificationResult.signature.certificate.runInvocationURI | startswith($run_uri)) and
                      (
                        .verificationResult.signature.certificate.runInvocationURI |
                        ltrimstr($run_uri) |
                        test("^[1-9][0-9]*$")
                      )
                    )
                  ' attestation.json >/dev/null
              )
              echo "prior stable authority recovered from terminal completion marker: ${latest_tag}@${latest_sha}"
            else
              if [ "$latest_tag" != v0.3.6 ]; then
                echo "::error::markerless logless fallback is retired after the explicit v0.3.6 migration boundary"
                exit 1
              fi
              gh release download "$latest_tag" \
                --repo "$REPO" \
                --pattern release-provenance.json \
                --pattern release-provenance.json.sha256 \
                --dir "$proof_dir"
              (
                cd "$proof_dir"
                sha256sum -c release-provenance.json.sha256
                jq -e \
                  --arg tag "$latest_tag" \
                  --arg sha "$latest_sha" \
                  '
                    .schema_version == 2 and
                    .release_tag == $tag and
                    .kin.commit == $sha and
                    (.artifacts | type == "array" and length == 5) and
                    all(.artifacts[];
                      .release_tag == $tag and
                      .kin.commit == $sha and
                      (.archive.sha256 | test("^[0-9a-f]{64}$"))
                    )
                  ' release-provenance.json >/dev/null
                gh attestation verify release-provenance.json \
                  --repo "$REPO" \
                  --signer-workflow "${REPO}/.github/workflows/release.yml" \
                  --signer-digest "$latest_sha" \
                  --source-ref "refs/tags/${latest_tag}" \
                  --source-digest "$latest_sha" \
                  --deny-self-hosted-runners \
                  --format json > attestation.json
              )

              version="${latest_tag#v}"
              for package in kin kin-mcp; do
                npm_version="$(curl -fsSL \
                  --retry 5 \
                  --retry-all-errors \
                  --retry-delay 2 \
                  "https://registry.npmjs.org/@kinlab%2F${package}/latest" \
                  | jq -er .version)"
                if [ "$npm_version" != "$version" ]; then
                  echo "::error::legacy prior stable npm @kinlab/${package}@latest is ${npm_version}, expected ${version}"
                  exit 1
                fi
              done

              registry_token="$(curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 2 \
                'https://ghcr.io/token?scope=repository%3Afirelock-ai%2Fkin%3Apull' \
                | jq -er .token)"
              manifest_digest() {
                local image_tag="$1"
                local headers
                headers="$(curl -fsSI \
                  --retry 5 \
                  --retry-all-errors \
                  --retry-delay 2 \
                  -H "Authorization: Bearer ${registry_token}" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/firelock-ai/kin/manifests/${image_tag}" \
                  | tr -d '\r')"
                awk -F': ' \
                  'tolower($1) == "docker-content-digest" {print $2}' \
                  <<< "$headers"
              }
              ghcr_latest="$(manifest_digest latest)"
              ghcr_version="$(manifest_digest "$version")"
              ghcr_tag="$(manifest_digest "$latest_tag")"
              [[ "$ghcr_latest" =~ ^sha256:[0-9a-f]{64}$ ]]
              [ "$ghcr_latest" = "$ghcr_version" ]
              [ "$ghcr_latest" = "$ghcr_tag" ]
              gh attestation verify \
                "oci://ghcr.io/firelock-ai/kin@${ghcr_latest}" \
                --repo "$REPO" \
                --bundle-from-oci \
                --predicate-type https://slsa.dev/provenance/v1 \
                --signer-workflow "${REPO}/.github/workflows/release.yml" \
                --signer-digest "$latest_sha" \
                --source-ref "refs/tags/${latest_tag}" \
                --source-digest "$latest_sha" \
                --deny-self-hosted-runners \
                --format json > "$proof_dir/ghcr-attestation.json"
              jq -e '
                length > 0 and
                all(.[];
                  (.verificationResult.verifiedTimestamps | type == "array" and length > 0)
                )
              ' "$proof_dir/ghcr-attestation.json" >/dev/null
              echo "prior stable authority recovered from legacy public capstones: ${latest_tag}@${latest_sha} ghcr=${ghcr_latest}"
            fi

            jq -e '
              length > 0 and
              all(.[];
                (.verificationResult.verifiedTimestamps | type == "array" and length > 0)
              )
            ' "$proof_dir/attestation.json" >/dev/null
          else
            echo "prior stable authority: ${latest_tag}@${latest_sha} run=${successful}"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Escalate a persistent mint decline
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'false'
        # One decline is ordinary: a release still in flight blocks its
        # successor by design, and the next reconcile clears it. A decline that
        # keeps repeating is a stuck release lane, and because a decline exits
        # green it looked exactly like a healthy mint on the board while a
        # release sat blocked.
        #
        # This step runs only on the decline path, so its own conclusion on a
        # prior run is the decline marker. Reading that is what makes the
        # outcome machine-visible without parsing logs, and it counts an
        # already-escalated decline too, so a lane that stays blocked stays red
        # instead of alarming once every few runs.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          DECLINE_REASON: ${{ steps.prior.outputs.decline_reason }}
          DECLINE_LIMIT: "4"
          DECLINE_SCAN_LIMIT: "100"
        run: |
          set -euo pipefail
          # Diagnostics go to their own file rather than into the captured
          # value. Folding stderr into the success path would let any warning
          # gh writes be parsed as a run id, and the counter would then be
          # quietly wrong rather than loudly wrong.
          read_error="$(mktemp)"
          if ! runs="$(gh api \
            "repos/${REPO}/actions/workflows/release-tag.yml/runs?per_page=${DECLINE_SCAN_LIMIT}&status=completed" \
            -q '.workflow_runs[]
                | select(.id != (env.CURRENT_RUN_ID | tonumber))
                | .id' 2>"$read_error")"; then
            echo "::notice::could not read prior mint runs, so this decline is not escalated: $(cat "$read_error")"
            exit 0
          fi
          consecutive=1
          scanned=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$scanned" -lt "$DECLINE_SCAN_LIMIT" ] || break
            scanned=$((scanned + 1))
            if ! state="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" \
              -q '[.jobs[]
                   | select(.name == "Mint release tag")
                   | {
                       job: .conclusion,
                       marker: ([.steps[]?
                         | select(.name == "Escalate a persistent mint decline")
                         | .conclusion] | first // "")
                     }] | first // {job: "", marker: ""}' \
              2>"$read_error")"; then
              echo "::notice::stopped counting at run ${run_id}: $(cat "$read_error")"
              break
            fi
            if ! job_conclusion="$(jq -er '.job | strings' <<< "$state")" ||
               ! marker="$(jq -er '.marker | strings' <<< "$state")"; then
              echo "::notice::stopped counting at run ${run_id}: unreadable mint job state"
              break
            fi
            # `workflow_run` starts this workflow for every completed CI run.
            # Its job-level guard skips the whole mint job for unrelated CI
            # events, and those controller invocations are not mint outcomes at
            # all. Ignore them. A mint job that did run but skipped this step is
            # different: it reached a non-decline outcome and resets the streak.
            if [ "$job_conclusion" = skipped ]; then
              continue
            fi
            case "$marker" in
              success|failure)
                consecutive=$((consecutive + 1))
                [ "$consecutive" -lt "$DECLINE_LIMIT" ] || break
                ;;
              *) break ;;
            esac
          done <<< "$runs"
          if [ "$consecutive" -ge "$DECLINE_LIMIT" ]; then
            {
              echo "### Release mint blocked"
              echo
              echo "Declined ${consecutive} times in a row, most recently for \`${DECLINE_REASON}\`."
              echo
              echo "The mint is not failing on its own account and would keep reporting"
              echo "success. Something is holding the release lane closed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::release lane declined ${consecutive} times in a row (${DECLINE_REASON}); it is blocked, not idle"
            exit 1
          fi
          echo "::notice::release mint declined (${DECLINE_REASON}); ${consecutive} in a row, escalating at ${DECLINE_LIMIT}"

      - name: Verify required checks are green
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'true'
        # Fail closed on the commit's check-runs. REQUIRED_CHECKS is the
        # presence-required release-critical set, so a sha missing any of these is
        # refused even if nothing failed. Every required check must conclude
        # success except DCO, which is allowed to report skipped because that
        # pull-request-only job is inapplicable on a merged main HEAD. This
        # reviewed set is the complete veto authority. Red or unfinished checks
        # outside it are announced, but they neither refuse nor delay the mint;
        # add any context that must block a release to this reviewed list. The
        # active main ruleset should carry the same contexts, but this reviewed
        # source declaration remains the mint's authority rather than mutable
        # live configuration.
        #
        # Evidence is resolved through workflow provenance, not through the
        # context name. A merge-queue landing publishes the same context names
        # twice on one sha, once from the queue's merge_group build and again
        # from the push build of the commit that landed, and only the push build
        # runs the legs the queue deliberately skips. Selecting by name alone
        # would read those two as ambiguous authority, or would accept the
        # queue's skipped Windows leg as the release proof. Each required context
        # is therefore matched against its exact workflow id, path, push event,
        # and head sha, and must be unique within that provenance, so a rerun of
        # the push build remains ambiguous authority.
        #
        # The automatic triggers can reach a commit whose release-critical checks
        # are still running, so absent and unfinished evidence is retried. Every
        # other verdict is terminal on the first pass.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_EVENT: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
          GITHUB_ACTIONS_APP_ID: "15368"
          GITHUB_ACTIONS_APP_SLUG: github-actions
          REQUIRED_CHECKS: |
            Check & Test (ubuntu-latest)
            Check & Test (macos-latest)
            Falsify guards
            Feature permutation tests (ubuntu-latest)
            Feature permutation tests (macos-latest)
            DCO Sign-off
            cargo-deny
            gitleaks (full history)
            Windows installer + vector release build
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$CURRENT_RUN_ID" \
            -q '{
              id: .id,
              workflow_id: .workflow_id,
              path: .path,
              event: .event,
              head_branch: .head_branch,
              head_sha: .head_sha,
              status: .status,
              conclusion: .conclusion,
              check_suite_id: .check_suite_id
            }' \
            > current_run.json || { echo "::error::failed to fetch current release-tag run"; exit 1; }
          for attempt in $(seq 1 60); do
            # `filter=all` is deliberate: a rerun that claims one required name
            # is ambiguous authority, not evidence to collapse by recency.
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" --paginate \
              -q '.check_runs[] | {
                name: .name,
                status: .status,
                conclusion: .conclusion,
                id: .id,
                app_id: (.app.id // 0),
                app_slug: (.app.slug // ""),
                check_suite_id: .check_suite.id,
                head_sha: .head_sha
              }' \
              > check_runs.ndjson || { echo "::error::failed to fetch check-runs for $SHA"; exit 1; }
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --paginate \
              -q '.workflow_runs[] | {
                id: .id,
                workflow_id: .workflow_id,
                path: .path,
                event: .event,
                head_branch: .head_branch,
                head_sha: .head_sha,
                status: .status,
                conclusion: .conclusion,
                check_suite_id: .check_suite_id
              }' \
              > workflow_runs.ndjson || { echo "::error::failed to fetch workflow runs for $SHA"; exit 1; }
            set +e
            python3 - <<'PY'
          import json, os, sys

          def read_ndjson(path):
              records = []
              with open(path) as handle:
                  for line in handle:
                      line = line.strip()
                      if line:
                          records.append(json.loads(line))
              return records

          check_runs = read_ndjson("check_runs.ndjson")
          workflow_runs = read_ndjson("workflow_runs.ndjson")
          with open("current_run.json") as handle:
              current_run = json.load(handle)

          runs_by_name = {}
          for run in check_runs:
              runs_by_name.setdefault(run["name"], []).append(run)

          workflows_by_suite = {}
          for run in workflow_runs:
              workflows_by_suite.setdefault(run["check_suite_id"], []).append(run)

          required = [
              check.strip()
              for check in os.environ["REQUIRED_CHECKS"].splitlines()
              if check.strip()
          ]
          # Workflow id, path, event, and branch. The branch is load-bearing: a
          # merge-queue landing produces a push run of the same workflow at the
          # same sha from the queue's own ref as well as from main, and only the
          # run on main is release evidence.
          release_branch = "main"
          expected_provenance = {
              "Check & Test (ubuntu-latest)": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              "Check & Test (macos-latest)": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              "Falsify guards": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              "Feature permutation tests (ubuntu-latest)": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              "Feature permutation tests (macos-latest)": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              # Uppercase `Sign-off` is the skipped-on-push CI job. The
              # pull_request_target DCO workflow emits lowercase `sign-off`
              # and is deliberately not release evidence.
              "DCO Sign-off": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
              "cargo-deny": (
                  251549972,
                  ".github/workflows/sast.yml",
                  "push",
                  release_branch,
              ),
              "gitleaks (full history)": (
                  293452372,
                  ".github/workflows/secret-scan.yml",
                  "push",
                  release_branch,
              ),
              "Windows installer + vector release build": (
                  245803170,
                  ".github/workflows/ci.yml",
                  "push",
                  release_branch,
              ),
          }
          expected_sha = os.environ["SHA"]
          trigger_sha = os.environ["TRIGGER_SHA"]
          # A required context name is not authority on its own. Only the
          # GitHub Actions App may write one, pinned by numeric id as well as
          # slug so a renamed or impersonating App cannot inherit the name.
          expected_app = (
              int(os.environ["GITHUB_ACTIONS_APP_ID"]),
              os.environ["GITHUB_ACTIONS_APP_SLUG"],
          )
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          current_run_event = os.environ["CURRENT_RUN_EVENT"]
          # Every trigger this workflow declares. The mint has no
          # workflow_dispatch path: a human release goes through the
          # release_tag repository_dispatch, which the trigger guard pins to
          # the release captain or the App.
          release_tag_events = {"schedule", "workflow_run", "repository_dispatch"}
          release_tag_workflow = (318521292, ".github/workflows/release-tag.yml")
          skippable_required = {"DCO Sign-off"}
          non_failing_optional = {"success", "skipped", "neutral"}
          errors = []
          pending = []
          # Everything the gate declines to treat as a veto. Reported once, on
          # the pass that admits the release, so a mint is never quiet about
          # what it chose to look past.
          degraded_producers = []
          downgraded = []
          discounted = []
          unwaited = []

          if required != list(expected_provenance):
              errors.append("required check order does not match its provenance contract")
          if not check_runs:
              pending.append("no check-runs found on sha")

          current_suite_id = current_run.get("check_suite_id")
          current_identity = (
              current_run.get("id"),
              current_run.get("workflow_id"),
              current_run.get("path"),
              current_run.get("head_branch"),
              current_run.get("head_sha"),
          )
          expected_current_identity = (
              current_run_id,
              release_tag_workflow[0],
              release_tag_workflow[1],
              release_branch,
              trigger_sha,
          )
          if current_identity != expected_current_identity:
              errors.append(
                  "current release-tag workflow provenance mismatch: "
                  f"expected={expected_current_identity} actual={current_identity}"
              )
          if current_run.get("event") not in release_tag_events:
              errors.append(
                  "current release-tag workflow was not started by a declared "
                  f"trigger: event={current_run.get('event')}"
              )
          release_tag_suite_ids = set()
          if not isinstance(current_suite_id, int):
              errors.append("current release-tag workflow has no check suite id")
          else:
              release_tag_suite_ids.add(current_suite_id)
          for workflow in workflow_runs:
              # A prior mint attempt against this exact release sha. The head
              # sha is already pinned by the query, and the release sha need not
              # equal the sha any single attempt was triggered from, so identity
              # here is the workflow itself under a declared trigger.
              if (
                  workflow.get("workflow_id"),
                  workflow.get("path"),
              ) != release_tag_workflow:
                  continue
              if workflow.get("event") not in release_tag_events:
                  errors.append(
                      "release-tag workflow run has an undeclared trigger: "
                      f"{workflow.get('id')} event={workflow.get('event')}"
                  )
                  continue
              suite_id = workflow.get("check_suite_id")
              if isinstance(suite_id, int):
                  release_tag_suite_ids.add(suite_id)
              else:
                  errors.append(
                      "release-tag workflow run has no check suite id: "
                      f"{workflow.get('id')}"
                  )

          for name in required:
              expected_workflow_id, expected_path, expected_event, expected_branch = (
                  expected_provenance[name]
              )
              expected_identity = (
                  expected_workflow_id,
                  expected_path,
                  expected_event,
                  expected_branch,
                  expected_sha,
              )
              named_runs = runs_by_name.get(name, [])
              for run in named_runs:
                  actual_app = (run.get("app_id"), run.get("app_slug"))
                  if actual_app != expected_app:
                      errors.append(
                          f"required check name claimed by another app: {name} "
                          f"(app={actual_app})"
                      )

              matching_runs = []
              off_release_branch = 0
              for run in named_runs:
                  matching_workflows = workflows_by_suite.get(
                      run.get("check_suite_id"), []
                  )
                  if len(matching_workflows) != 1:
                      errors.append(
                          f"required check has ambiguous workflow provenance: {name} "
                          f"(suite={run.get('check_suite_id')}, "
                          f"workflow-runs={len(matching_workflows)})"
                      )
                      continue
                  workflow = matching_workflows[0]
                  identity = (
                      workflow.get("workflow_id"),
                      workflow.get("path"),
                      workflow.get("event"),
                      workflow.get("head_branch"),
                      workflow.get("head_sha"),
                  )
                  if identity == expected_identity:
                      matching_runs.append((run, workflow))
                  elif workflow.get("head_branch") == expected_branch:
                      # Produced on the release branch itself, but not by the
                      # reviewed producer. A second writer of a required context
                      # name is an authority conflict, never a fallback.
                      errors.append(
                          f"required check workflow provenance mismatch: {name} "
                          f"expected={expected_identity} actual={identity}"
                      )
                  else:
                      # Produced on another branch, which is what a merge-queue
                      # build does at this sha before the landing push. Not this
                      # release's evidence, and not an anomaly either.
                      off_release_branch += 1

              if not matching_runs:
                  pending.append(
                      f"missing required check: {name} "
                      f"(expected provenance {expected_identity}, "
                      f"{len(named_runs)} same-named check-runs, "
                      f"{off_release_branch} produced off the release branch)"
                  )
                  continue
              if len(matching_runs) != 1:
                  errors.append(
                      f"ambiguous required check: {name} "
                      f"({len(matching_runs)} check-runs under one provenance)"
                  )
                  continue

              run, workflow = matching_runs[0]
              allowed_conclusions = (
                  {"success", "skipped"}
                  if name in skippable_required
                  else {"success"}
              )
              if run.get("head_sha") != expected_sha:
                  errors.append(
                      f"required check has wrong head sha: {name} "
                      f"(head={run.get('head_sha')})"
                  )
              if run["status"] != "completed":
                  pending.append(
                      f"required check not completed: {name} "
                      f"(status={run['status']})"
                  )
              elif run["conclusion"] not in allowed_conclusions:
                  errors.append(
                      f"required check not green: {name} "
                      f"(conclusion={run['conclusion']})"
                  )
              if workflow.get("status") != "completed":
                  # A required job can already be immutable green while an
                  # advisory sibling keeps their shared workflow in progress.
                  # Waiting on that aggregate would restore an advisory veto
                  # through status instead of conclusion. Record it loudly and
                  # judge the required context itself above.
                  degraded_producers.append(
                      (
                          workflow.get("path"),
                          workflow.get("id"),
                          f"is still {workflow.get('status')}",
                      )
                  )
              elif workflow.get("conclusion") != "success":
                  # The producing run carries jobs beyond the release-critical
                  # ones, so its aggregate conclusion is not a release verdict.
                  # A red coverage or npm-launcher job turns the whole ci.yml
                  # run red and would otherwise veto through every required
                  # context that run produces, which is the same defect the
                  # sweep below stopped committing per check-run. This
                  # context's own conclusion is judged directly above; record
                  # the producer so admitting over it is never silent.
                  degraded_producers.append(
                      (
                          workflow.get("path"),
                          workflow.get("id"),
                          f"concluded {workflow.get('conclusion')}",
                      )
                  )

          # A check-run is this release's evidence only when its producing
          # workflow run is the landing push on the release branch. The merge
          # queue builds the same workflows at this exact sha on its own ref,
          # and for a solo queue entry the speculative sha IS the landing sha,
          # so a queue job the queue never waited for concludes after the merge
          # on the commit being released, having gated nothing. Gate 1 already
          # discounts those for required contexts. The sweep discounts them the
          # same way instead of letting one poison the mint.
          evidence_workflows = set()
          for workflow in workflow_runs:
              if (
                  workflow.get("event") == "push"
                  and workflow.get("head_branch") == release_branch
              ):
                  evidence_workflows.add(
                      (workflow.get("workflow_id"), workflow.get("path"))
                  )
          required_names = set(required)

          for run in check_runs:
              name = run["name"]
              # Exclude only this exact workflow identity's tag-mint attempts,
              # including a prior refusal on the same SHA.
              if (
                  name == "Mint release tag"
                  and run.get("check_suite_id") in release_tag_suite_ids
              ):
                  continue
              producers = workflows_by_suite.get(run.get("check_suite_id"), [])
              producer = producers[0] if len(producers) == 1 else None
              if name == "Mint release tag":
                  # The mint's own job name from a producer that is not the
                  # reviewed release-tag workflow. Never release evidence and
                  # never merely advisory: a second writer of this name is an
                  # authority conflict whatever it concluded.
                  errors.append(
                      f"release-tag job name claimed by another producer: {name} "
                      f"(suite={run.get('check_suite_id')}, "
                      f"conclusion={run.get('conclusion')})"
                  )
                  continue
              if producer is None:
                  origin = (
                      "no unique workflow run for suite "
                      f"{run.get('check_suite_id')}"
                  )
              else:
                  origin = (
                      f"{producer.get('path')} run {producer.get('id')} "
                      f"({producer.get('event')} on {producer.get('head_branch')})"
                  )
              is_evidence = (
                  producer is not None
                  and producer.get("event") == "push"
                  and producer.get("head_branch") == release_branch
              )
              if not is_evidence:
                  discounted.append(
                      {
                          "name": name,
                          "origin": origin,
                          "twin": producer is not None
                          and (
                              producer.get("workflow_id"),
                              producer.get("path"),
                          )
                          in evidence_workflows,
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                      }
                  )
                  continue
              if name in required_names:
                  # Already judged in full above against its exact provenance.
                  # Judging it again by name here is what let a queue-side
                  # namesake decide a release.
                  continue
              if run["status"] != "completed":
                  # Its verdict cannot veto this release, so waiting for one
                  # would only give a hung advisory job a second way to burn
                  # the mint once the retry budget runs out.
                  unwaited.append(f"{name} (status={run['status']})")
              elif run["conclusion"] not in non_failing_optional:
                  downgraded.append(
                      f"{name} (conclusion={run['conclusion']}, from {origin})"
                  )

          if errors:
              print("::error::refusing because check verification failed:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          if pending:
              print("release-critical checks are not complete yet:")
              for item in pending:
                  print(f"  - {item}")
              sys.exit(2)

          # The release is admissible. Everything the gate declined to treat as
          # a veto is announced here, on the one pass that admits it, so a
          # release is never quietly minted from a commit carrying a red that
          # nobody was told about. Announcing on the retry passes instead would
          # repeat every line up to sixty times and train the reader to skip it.
          announcements = []
          for path, run_id, state in sorted(set(degraded_producers)):
              announcements.append(
                  f"admitting over a producing run that {state}: "
                  f"{path} run {run_id}; every required context "
                  "it produces is green"
              )
          for item in downgraded:
              announcements.append(
                  f"admitting over a red check no required context covers: {item}"
              )
          for entry in discounted:
              if (
                  entry["status"] == "completed"
                  and entry["conclusion"] not in non_failing_optional
              ):
                  announcements.append(
                      "discounting a red check that is not this release's "
                      f"evidence: {entry['name']} "
                      f"(conclusion={entry['conclusion']}, from {entry['origin']}); "
                      + (
                          "the landing push build on the release branch is the "
                          "evidence"
                          if entry["twin"]
                          else "it has no build on the release branch at this sha"
                      )
                  )
          for line in announcements:
              print(f"::warning::{line}")
          not_waited = []
          for item in unwaited:
              not_waited.append(
                  f"not waiting for a check no required context covers: {item}"
              )
              print(f"::notice::{not_waited[-1]}")

          verdict = (
              f"verified {len(required)} required checks against their workflow "
              f"provenance; {len(check_runs)} check-runs on the sha, "
              f"{len(discounted)} not this release's evidence, "
              f"{len(downgraded)} red and covered by no required context, "
              f"{len(unwaited)} unfinished and not waited for"
          )
          print(verdict)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as handle:
                  handle.write("### Release check verification\n\n")
                  handle.write(f"{verdict}\n")
                  # Every class the gate declined to act on reaches the summary,
                  # including the unfinished ones. A downgrade that only shows
                  # up as an annotation is half a disclosure.
                  for line in announcements + not_waited:
                      handle.write(f"\n- {line}\n")
          PY
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::release-critical checks did not settle within 30 minutes"
              exit 1
            fi
            sleep 30
          done

      - name: Verify tag does not already exist
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists, refusing to overwrite it"
            exit 1
          fi
          echo "tag $TAG does not exist yet"

      - name: Mint kin-release-bot installation token
        id: app-token
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          # kin-release-bot is installed org-wide, so scope every minted token to
          # the kin repository alone. owner + repositories narrows the installation
          # token to just these repos; setting owner without repositories would
          # instead widen it to every repo the org-wide install can reach.
          owner: firelock-ai
          repositories: kin

      - name: Create release tag ref
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'true'
        # Created with the App token (not GITHUB_TOKEN) so the ruleset admits it
        # AND so the tag push triggers release.yml.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          AUTOMATIC: ${{ steps.resolve.outputs.automatic }}
        run: |
          set -euo pipefail
          # Close the break-glass dispatch head-pin window immediately before
          # only write. Automatic reconciliation intentionally admits the
          # earliest coherent reviewed ancestor; break glass remains
          # exact-current-main.
          git fetch --no-tags origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$AUTOMATIC" = true ]; then
            if ! git merge-base --is-ancestor "$SHA" "$current_main"; then
              echo "::error::automatic release sha $SHA left reviewed main history before tag creation"
              exit 1
            fi
          elif [ "$SHA" != "$current_main" ]; then
            echo "::error::break-glass release sha $SHA is no longer current origin/main HEAD ($current_main)"
            exit 1
          fi
          echo "creating refs/tags/$TAG -> $SHA via kin-release-bot"
          gh api "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA" >/dev/null
          echo "created refs/tags/$TAG"

      - name: Verify tag ref and summarize
        if: >-
          steps.resolve.outputs.needed == 'true' &&
          steps.prior.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The ref was just created, and the API is read-after-write eventually
          # consistent, so the first read can 404 on a tag that exists. A bare
          # read here concludes the whole mint FAILURE after it already
          # succeeded, which is worse than a slow answer: release recovery reads
          # a failed run as a release needing repair and goes to work on a
          # healthy one. Absence is only believed after the reads are exhausted.
          #
          # A ref that reads back pointing somewhere else is not retried. There
          # is no prior value for a newly created ref to be stale from, so a
          # different sha means something else created it, which is terminal.
          got=""
          why=""
          for attempt in 1 2 3 4 5; do
            if got="$(gh api "repos/$REPO/git/ref/tags/$TAG" -q '.object.sha' 2>"$RUNNER_TEMP/readback.err")" \
              && [ -n "$got" ]; then
              break
            fi
            got=""
            why="$(tr -d '\r' < "$RUNNER_TEMP/readback.err" | tail -n 1)"
            if [ "$attempt" -lt 5 ]; then
              echo "tag ref not readable yet (attempt ${attempt}/5): ${why:-empty response}; retrying"
              sleep "$(( attempt * 3 ))"
            fi
          done
          if [ -z "$got" ]; then
            # Say what the API said rather than asserting the tag is gone. A
            # persistent auth or rate-limit failure reads the same as a missing
            # ref from here, and sending an operator after a deleted tag that
            # exists is its own outage.
            echo "::error::post-verify failed: tag $TAG never read back across 5 reads over ~30s; last reason: ${why:-empty response}"
            exit 1
          fi
          echo "created ref points at: $got (expected $SHA)"
          if [ "$got" != "$SHA" ]; then
            echo "::error::post-verify failed: tag $TAG points at $got, not $SHA"
            exit 1
          fi
          {
            echo "## Release tag minted"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tag | \`$TAG\` |"
            echo "| sha | \`$SHA\` |"
            echo "| actor | \`$ACTOR\` |"
            echo "| repo | \`$REPO\` |"
            echo ""
            echo "Tag ref created with the kin-release-bot installation token, which triggers the fail-closed \`release.yml\` DAG."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release tag $TAG minted and verified at $SHA"
