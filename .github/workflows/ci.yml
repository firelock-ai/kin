name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  repository_dispatch:
    types: [dependency-updated]

permissions:
  contents: read

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` still supersedes an older
# push exactly as before. On main it gives each commit its own group. That
# matters because `cancel-in-progress: false` does not mean "never cancel":
# GitHub holds at most one PENDING run per group and cancels the older one, so
# consecutive pushes to main both serialised behind each other and deleted each
# other. Four main-branch pushes in a 24h sample were cancelled having started
# zero jobs, and release-tag.yml requires push-event provenance for every
# required check, which left those four landed commits permanently unmintable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the enforcing gate for ALL steps (clippy, build, test).
  # The ArtifactId migration has landed, so the `ArtifactId::from_path` /
  # `from_file_id` deprecation is now enforced: graph-assigned IDs resolve via the
  # `artifact_index`, and the few genuinely snapshot-less call sites carry local
  # `#[allow(deprecated)]` justifications. (clippy::* lints stay on the clippy
  # command: plain rustc rejects the `clippy` tool namespace.)
  RUSTFLAGS: "-D warnings"

jobs:
  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while IFS= read -r commit; do
            body="$(git log -1 --format=%B "$commit")"
            if ! grep -Eq '^Signed-off-by: .+ <[^>]+>$' <<<"$body"; then
              echo "::error title=Missing DCO sign-off::Commit $commit is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list "${base}..${head}")
          exit "$missing"

  # scripts/check-release-version.mjs has carried the right refusal since
  # before the release train existed, and nothing ever ran it on a pull
  # request. Its one real invocation is inside the train's own branch-writer
  # step, which runs once against a tree that step just regenerated and never
  # again on the head that merges, so a release pull request could lose its
  # version bump afterwards and every check would stay green. The mint then
  # reads a workspace version whose tag already exists, calls that nothing to
  # release, and exits 0 on a fifteen-minute cron with no tag and no alarm.
  #
  # Scope is release pull requests, not all of them. The gate refuses a
  # release-affecting diff that does not move the version, and demanding that
  # of every pull request is a policy change wearing a bug fix's clothes. The
  # branch condition is the half that cannot be dodged, because a ruleset owns
  # that ref; the label is there so a hand-cut release is covered too.
  release-version:
    name: Release version gate
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'automation/release-next' ||
      contains(github.event.pull_request.labels.*.name, 'release:automated'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads Cargo.toml out of the base commit. A shallow
          # pull-request checkout does not carry it, and `git show` would fail
          # in a way that reads like a broken gate rather than a missing fetch.
          fetch-depth: 0

      # Base and labels arrive as environment variables, never interpolated
      # into the command line: a pull-request label is attacker-controlled text
      # and `--labels ${{ ... }}` would put it in an argv the shell expands.
      - name: Check the workspace version moved with the release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-release-version.mjs

  npm-launchers:
    name: npm launcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test @kinlab/kin (canonical launcher)
        run: npm test --prefix ./packages/kin && npm run lint --prefix ./packages/kin

      - name: Test @kinlab/kin-mcp (compatibility wrapper)
        run: npm test --prefix ./packages/kin-mcp && npm run lint --prefix ./packages/kin-mcp

      - name: Test release ordering and npm provenance policy
        run: |
          python3 ./scripts/test-release-workflow-authority.py
          bash ./scripts/test-publish-dev-container.sh
          bash ./scripts/kin-dev-image.test.sh
          python3 ./scripts/test-kin-registry-release-receiver.py
          python3 ./scripts/test-kin-registry-wave-landing.py
          python3 ./scripts/test_install_optional_vfs.py
          python3 ./scripts/test_installer_parity.py
          # Every install surface builds a release asset name; the release
          # publishes a fixed list of them. Nothing compared the two lists, and
          # a Windows disagreement 404'd through every release to date. The
          # falsifier runs beside the guard because a guard nobody has seen fail
          # is not evidence that it can.
          python3 ./scripts/verify-installer-release-assets.py
          python3 ./scripts/falsify-installer-release-assets.py
          # Resolving the archive name is only half an install. Once it lands,
          # the installer names the binaries inside it, and those names carry a
          # platform suffix the installer did not account for, so a complete
          # Windows archive aborted the install after the download had already
          # been fetched and verified.
          python3 ./scripts/verify-installer-archive-binaries.py
          python3 ./scripts/falsify-installer-archive-binaries.py
          python3 ./scripts/test-npm-automatic-release.py
          python3 ./scripts/test-verify-npm-release.py
          node --test \
            ./scripts/check-glibc-floor.test.mjs \
            ./scripts/check-release-version.test.mjs \
            ./scripts/release-intent.test.mjs \
            ./scripts/extract-release-notes.test.mjs \
            ./scripts/prepare-release.test.mjs \
            ./scripts/read-update-build-identity.test.cjs \
            ./scripts/release-archive-shape.test.cjs \
            ./scripts/write-release-archive-docs.test.mjs \
            ./scripts/release-order.test.mjs \
            ./scripts/release-hold-alarm.test.mjs \
            ./scripts/release-train-body.test.mjs \
            ./scripts/advisory-sweep.test.mjs \
            ./scripts/verify-capability-proof.test.mjs \
            ./scripts/verify-npm-attestation.test.mjs
          node --check ./scripts/check-glibc-floor.mjs
          node --check ./scripts/read-update-build-identity.cjs
          node --check ./scripts/check-release-version.mjs
          node --check ./scripts/prepare-release.mjs
          node --check ./scripts/release-order.mjs
          node --check ./scripts/release-hold-alarm.mjs
          node --check ./scripts/release-train-body.mjs
          node --check ./scripts/advisory-sweep.mjs
          node --check ./scripts/verify-capability-proof.mjs
          node --check ./scripts/verify-npm-attestation.mjs
          bash -n ./scripts/publish-npm-release.sh
          bash -n ./scripts/publish-dev-container.sh
          bash -n ./scripts/kin-dev-image
          bash -n ./scripts/test-publish-dev-container.sh
          bash -n ./scripts/kin-dev-image.test.sh
          bash -n ./scripts/verify-npm-release.sh
          bash -n ./scripts/assert-windows-init-contract.sh
          bash -n ./scripts/windows-authority-legs.sh
          bash -n ./scripts/test-windows-authority-legs.sh
          bash -n ./scripts/release-policy-gate.sh
          bash -n ./scripts/test-release-policy-gate.sh
          bash -n ./scripts/verify-base-image-pins.sh
          # install.sh is the public installer users pipe straight into a shell,
          # and the one with no pull-request syntax check. Its only `sh -n` runs
          # in publish-release-installers.yml, which triggers on `workflow_run`
          # after Release completes, so it cannot fail until a tag exists and a
          # tag cannot be un-cut. `#!/usr/bin/env sh` is why this is `sh -n` and
          # not the `bash -n` used for the bash-only scripts above.
          #
          # install.ps1 needs no line here. scripts/test-install-checksum.ps1
          # parses it on every pull request in windows-authority-tests, under
          # both PowerShell 7 and Windows PowerShell 5.1, and that job is held
          # unconditional by the release-authority test.
          sh -n ./scripts/install.sh

  windows-authority-tests:
    name: Windows authority tests
    if: ${{ github.event_name != 'pull_request' }}
    # Split out of the installer job: the debug test compile and the release
    # build share no artifacts (separate target profiles), so serialising them
    # only added wall clock. They run concurrently now.
    #
    # This job and the two Windows authority jobs below stay on the merge queue
    # and on every commit that reaches main. Together they are the merge group's
    # only proof of the native Windows admission contract, so taking them off
    # the queue to reclaim runner minutes would trade a reviewable pre-landing
    # signal for a required context that first fails on main. The authority test
    # enforces that, and it now admits exactly one job-level condition, the
    # pull-request filter below, and refuses any other.
    #
    # They came off pull requests with the rest of the heavy set. The longest of
    # the three measured 11.7 minutes, which no admission gate can carry against
    # a ten-minute open-to-merge bar, and they gate nothing on a pull request
    # anyway: `merge_pr_ready` in the umbrella refuses while ANY check is still
    # pending, required or not, so an advisory leg sets the lane's clock exactly
    # as a required one does. The proof itself did not move. It runs in the
    # queue, which is what the release mint reads.
    #
    # The legs were split three ways by compilation unit because one job could
    # not finish inside any cap worth setting. Across 119 sampled runs, 32 of
    # the 106 allowed to finish were destroyed by the 60-minute limit, and on
    # pull requests that was half of them. The 70 survivors averaged 52.6
    # minutes and reached 59.7, so the sample is censored by the cap itself and
    # the real mean is near 57. This job keeps the admission contract, both npm
    # surfaces, and the library legs that build no test binary; the CLI and
    # runtime jobs below take the rest. Each compiles one kind of artifact, so
    # none waits on another's build.
    #
    # The binary build, the admission assertion, and the npm first-run proof run
    # ahead of the library legs rather than after them. They used to be the last
    # three steps, which is exactly where every cap-out landed, so an admission
    # regression could not be reported until fifty minutes of unrelated tests
    # had passed first.
    runs-on: windows-latest
    # This is a backstop, not the budget. The step budgets below are the real
    # caps, and they sum to less than this on purpose. A step that overruns its
    # budget FAILS, and a failed step names itself on the check. A job that hits
    # its own cap is CANCELLED, and a cancellation on a check no ruleset
    # requires says nothing at all: every sampled cap-out carried green
    # substantive steps and was found by reading run durations rather than by
    # anything going red. Keeping the sum under this number is what makes the
    # loud failure arrive first whichever step is the slow one, and the
    # authority test holds that arithmetic.
    timeout-minutes: 80
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Test installer warning and checksum contract (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install-checksum.ps1

      - name: Test installer warning and checksum contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-install-checksum.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test both public npm surfaces on native Windows
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix ./packages/kin
          npm run lint --prefix ./packages/kin
          npm test --prefix ./packages/kin-mcp
          npm run lint --prefix ./packages/kin-mcp
          node --check ./scripts/prove-windows-npm-first-run.mjs

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc

      # Restore on every event, save only from main. A cache entry written from
      # a pull request ref is readable by later runs on that SAME ref and by
      # nothing else, so the old configuration warmed pushes 2..N of one pull
      # request while spending the shared repository cache budget and evicting
      # main's entry, which is why no reusable cargo cache existed on
      # refs/heads/main at all. Saving only from main trades that intra-branch
      # warm start for one entry every pull request restores from push 1.
      # The tradeoff is real and measured: see the trusted-ref note in
      # scripts/test-release-workflow-authority.py.
      #
      # `cache-on-failure` is what stops a bad run from compounding into the
      # next one. The save is a post step and rust-cache gates it on
      # `success() || env.CACHE_ON_FAILURE == 'true'`, so at the default every
      # run that does not end green discards everything it compiled. That is not
      # theoretical: all four sampled red runs and every one of the 32 sampled
      # cap-outs skipped the save, which is why a slow afternoon left each
      # following run colder than the one before it. Setting this makes the
      # condition unconditional, so the artifacts survive a red run or a
      # cancelled one.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744. `rust-cache` hashes EVERY toolchain `rustup toolchain
          # list` reports, not the one this repository pins, so two jobs in one
          # run that drew runner images with different preinstalled Rust
          # produce different keys and cannot share an entry. Measured on run
          # 32961965498: `check` saw 1.96.0/1.97.1 and hit
          # `v0-rust-check-Linux-x64-8374e8ea-433e5115`, while
          # `feature-tests` saw 1.96.0/1.98.0 sixty-five seconds later, asked
          # `...-6ea01539-...` and logged `No cache found.` Same prefix, same
          # lockfile hash, nothing in this repository chose either image.
          #
          # What this drops, stated rather than assumed. The hash covers the
          # toolchain versions AND every CARGO, CC, CFLAGS, CXX, CMAKE and RUST
          # environment variable. Toolchain sensitivity survives, because
          # `rust-toolchain.toml` and `.github/actions/rust-toolchain/action.yml`
          # are both in the key's lockfiles half, which the job log's
          # "Lockfiles considered" list shows. Environment sensitivity does not,
          # and that only matters where a key is SHARED between jobs, which is
          # `check`, `check-macos` and `feature-tests`. They declare an
          # identical cargo env today and
          # `assert_shared_cache_key_jobs_declare_one_environment` in
          # scripts/test-release-workflow-authority.py is what keeps them that
          # way, because a divergence would otherwise be a silent cache
          # collision rather than a failure.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The three steps below are the pull-request half of the Windows admission
      # contract. The installer leg asserts the same behavior against the
      # release binary, but it runs only on the landing push, so on its own it
      # can report an admission change no earlier than a required check
      # failing on a release commit. This leg builds without default features
      # and the installer leg builds with them, so the shared script asserts
      # the same refusals against both feature sets of the command.
      - name: Build the Windows binaries the admission and npm assertions drive
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-pc-windows-msvc \
            -p kin-cli -p kin-daemon --no-default-features \
            --bin kin --bin kin-daemon

      - name: Assert the Windows admission contract
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash ./scripts/assert-windows-init-contract.sh \
            "$GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/debug/kin.exe" \
            "$RUNNER_TEMP/kin-windows-admission"

      - name: Prove both npm surfaces from built Windows binaries
        shell: bash
        timeout-minutes: 10
        env:
          KIN_NPM_PROOF_KIN_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/debug/kin.exe
          KIN_NPM_PROOF_DAEMON_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/debug/kin-daemon.exe
        run: |
          set -euo pipefail
          node ./scripts/prove-windows-npm-first-run.mjs

      # Library legs only: every invocation here compiles a `--lib` test binary
      # or nothing at all. The kin-cli unit legs and the integration-test
      # binaries live in the two jobs below because they are the expensive
      # compilation units, and keeping them here is what made one job unable to
      # finish inside any cap worth setting.
      - name: Compile and run native Windows core authority tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_nonempty_target "kin-registry library" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-registry --lib
          run_required_filter "kin-core registry authority" "registry::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          # Publishing repository config is the transaction `kin init` stops at
          # if it is wrong, and the Windows arm shares no code with the Unix one
          # below the namespace validation. These cases are the contract both
          # arms answer to, so they run here rather than being compiled here.
          run_required_filter "kin-core capability-owned config replacement" \
            "config::capability_owned_config_replacement_tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          # What the retained directory handle excludes is a property of
          # Windows' sharing rules, not of Kin's code, so it can only be
          # settled here. The module doc states the exclusion; these cases are
          # what entitle it to.
          run_required_filter "retained config capability exclusion" \
            "config::windows::capability_exclusion_tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          run_nonempty_target "kin-git library" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-git --lib
          # Stays in this job rather than moving to the CLI one: the npm proof
          # above asserts that the compatibility wrapper finds its sibling
          # daemon, and this is the unit case for the discovery it depends on.
          # Separating them would let one job claim a runtime behavior whose
          # only unit proof lives in a job that can go red on its own.
          run_required_exact "MCP Windows sibling daemon discovery" \
            "daemon_delegate::tests::windows_daemon_discovery_finds_platform_sibling_without_path" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-mcp --no-default-features --lib
          # Admission itself, in process. `kin init` is the transaction the
          # contract script drives end to end, but that script reports one line
          # naming a path that two different components can report. These cases
          # stage, publish, seal, and promote a repository through the same code
          # the binary does, so a refusal names a test and a line instead of a
          # path. Until this existed, `init.rs` had no native Windows coverage
          # at all, which is why a refusal in it could only be seen by a
          # thirty-minute job that then could not say which call refused.
          run_required_filter "kin-core repository initialization" \
            "init::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          # The capture lease is the only thing that stops one init's reap from
          # deleting a sibling init's capture directory, and every clause of it
          # is a Windows sharing rule rather than Kin's code: that a locked file
          # can be renamed at all, that the lock follows it, and that a second
          # opener is then refused. None of that is observable from a Unix run,
          # and until this leg existed no Windows run touched the module.
          run_required_filter "kin-core Git capture lease" \
            "init_staging::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          run_required_filter "managed-install spawn fence" \
            "managed_spawn_fence" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon-spawn --lib
          # The one clause of the spawn contract only Windows can answer. Unix
          # gets handle release from CLOEXEC, so this case passes there whether
          # or not the code that provides it on Windows exists, and a host run
          # of it is not evidence about Windows. Same compilation unit as the
          # fence leg above, so it costs a run rather than a build.
          run_required_exact "detached spawn releases the caller's stdio" \
            "tests::a_detached_spawn_does_not_hold_the_callers_stdout_open" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon-spawn --lib
          run_required_filter "daemon shutdown identity" "shutdown" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --lib

  windows-authority-cli-tests:
    name: Windows authority CLI tests
    if: ${{ github.event_name != 'pull_request' }}
    # Every leg here is `-p kin-cli --no-default-features --lib`, which is one
    # compilation unit and the single most expensive one in the Windows set.
    # Splitting on that boundary is why the three jobs do not duplicate each
    # other's compile: this one builds the CLI unit-test binary, the job above
    # builds the library ones, and the job below builds the integration ones.
    #
    # Full uninstall owns native Windows process handles, directory identity,
    # and deferred self-deletion. Compiling these paths on a non-Windows host
    # cannot prove their runtime contract, so they stay on a permanent native
    # Windows leg.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Compile and run native Windows CLI authority tests
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_required_filter "kin-cli Windows modules" "windows" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "full managed uninstall safety" \
            "commands::setup::tests::full_uninstall" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "editor extension detection" \
            "commands::health::tests::editor_detection" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native full managed uninstall lifecycle" \
            "commands::setup::tests::native_full_uninstall_runtime_executes_retirement_and_user_path_cleanup" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native managed-daemon ownership scan" \
            "commands::daemon::tests::native_managed_daemon_scan_canonicalizes_and_rejects_traversal" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native install authority contention and crash recovery" \
            "commands::update::tests::native_install_authority_contends_across_aliases_and_recovers_after_crash" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native managed-daemon spawn admission" \
            "commands::update::tests::managed_daemon_spawn_lease_blocks_uninstall_authority_until_readiness" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "bounded CLI test subprocesses" \
            "commands::test_subprocess::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "bounded daemon probe subprocesses" \
            "daemon_client::probe_process::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib

  windows-authority-runtime-tests:
    name: Windows authority runtime tests
    if: ${{ github.event_name != 'pull_request' }}
    # The integration-test binaries: real daemons, real process trees, real
    # containment. These are the legs that spend their time running rather than
    # compiling, which is why they belong away from the unit legs instead of
    # queued behind them.
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `daemon_status_and_stop_lifecycle` drives a real daemon, and the harness
      # takes it from the `kin-daemon` beside the `kin` binary the test was
      # built with. Every other `kin-daemon` invocation in this job compiles a
      # test binary, which writes no `kin-daemon.exe`, so nothing else puts one
      # in the msvc directory before the test reads it. The harness covers a
      # missing daemon by rebuilding one, which lands beside the test only when
      # it carries the same `--target`, so a leg that omits this build depends
      # on that rebuild rather than on its own inputs. The feature set matches
      # the binary build in the admission job, so both produce one artifact.
      - name: Build the sibling Windows daemon the authority tests drive
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --bin kin-daemon

      - name: Compile and run native Windows runtime authority tests
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_required_target "daemon status and stop lifecycle" \
            "daemon_status_and_stop_lifecycle" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test daemon_stop
          run_required_target "spawned-child Windows authority ordering" \
            "spawned_child_observes_case_insensitive_authority_order" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test windows_authority_order
          run_required_target "isolated runtime process-tree containment" \
            "dropping_isolated_runtime_terminates_a_late_descendant" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test daemon_runtime_containment
          run_required_exact "direct daemon-child containment" \
            "dropping_a_direct_daemon_child_terminates_its_containment" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          run_required_exact "late daemon-descendant containment" \
            "dropping_containment_terminates_a_late_descendant" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          run_required_filter "daemon isolation support" "common::daemon_isolation" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          compile_required_target "durable merge resolution containment compile" \
            "concurrent_resolutions_from_one_view_leave_one_winner" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test repository_merge_resolution
          run_required_target "editor setup guidance" \
            "full_setup_output_recommends_install_only_when_the_editor_extension_is_missing" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test setup_editor_guidance

  windows-installer:
    # Renamed from "Windows installer + vector-free release build" when native
    # vector search shipped on Windows. The name is not decoration: release-tag.yml
    # resolves this exact string out of REQUIRED_CHECKS to decide whether Windows
    # evidence exists for a release sha, so a name still claiming "vector-free"
    # would be the mint's own authority asserting the opposite of what it built.
    name: Windows installer + vector release build
    needs: changes
    # Deliberately off the pull-request path. This leg cold-builds the whole
    # dependency graph in the release profile for x86_64-pc-windows-msvc and
    # measured 20 to 25 minutes per round, longer than any other job, so it set
    # the floor for every land-and-iterate cycle. Keeping it off pull requests
    # is what protects that cycle; keeping it off the merge queue protected
    # nothing and cost the release its evidence. release-tag.yml now keys the
    # mint off the merge-group-proven sha, and the queue's build is only a
    # sufficient proof if it runs every leg the mint then trusts, so this job
    # runs on the queue as well as on the landing push. On a pull request it
    # still reports skipped, which satisfies the required context the same way
    # the documentation-only path already relies on.
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Test exact archive checksum selection (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install-checksum.ps1

      - name: Test exact archive checksum selection (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-install-checksum.ps1

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ runner.temp }}/sccache
          # Cache key renamed with the feature set. The vectorless key indexed a
          # dependency graph with no ndarray, tokenizers, hnsw or onig in it, so
          # restoring from it would warm almost nothing and would report a hit
          # while doing so.
          key: windows-vector-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-vector-cargo-

      # Windows ships native vector search, so this asserts the feature graph in
      # both directions rather than only forbidding features. `vector` and
      # `embeddings` must be reachable, or the leg would silently certify a
      # degraded build; `metal` and `accelerate` must not be, because those are
      # macOS-only backends whose activation lives in a
      # `cfg(target_os = "macos")` dependency block and must never unify in here.
      #
      # `grep -c` rather than `grep -q`: under `pipefail` a `-q` match closes the
      # pipe early and the SIGPIPE fails the step, which reads exactly like the
      # feature being absent. Reading a file cannot invert the guard that way.
      - name: Assert the Windows feature graph
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon -e features -i kin-db \
            | tee "$RUNNER_TEMP/kin-db-feature-tree.txt"
          for required in vector embeddings; do
            if [ "$(grep -Ec "kin-db feature \"${required}\"" \
              "$RUNNER_TEMP/kin-db-feature-tree.txt")" -eq 0 ]; then
              echo "::error::Windows release build is missing kin-db feature ${required}"
              exit 1
            fi
          done
          for forbidden in metal accelerate; do
            if [ "$(grep -Ec "kin-db feature \"${forbidden}\"" \
              "$RUNNER_TEMP/kin-db-feature-tree.txt")" -ne 0 ]; then
              echo "::error::Windows build pulled the macOS-only kin-db feature ${forbidden}"
              exit 1
            fi
          done

      - name: Build Windows release binaries with vector features
        shell: bash
        env:
          # Compile cache keyed per crate, so a Cargo.lock change warm-starts
          # from compiled dependencies instead of a cold tree. The cache lives
          # OUTSIDE the workspace: an untracked directory inside it reads as a
          # dirty checkout, and the provenance step then correctly refuses to
          # certify the build (which is exactly how the first attempt failed).
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc \
            -p kin-cli -p kin-daemon
          sccache --show-stats

      - name: Verify Windows build provenance and feature set
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/x86_64-pc-windows-msvc/release"
          "$bin_dir/kin.exe" --version
          "$bin_dir/kin-daemon.exe" --version
          "$bin_dir/kin.exe" bench-meta --json > "$RUNNER_TEMP/kin-build-meta.json"
          "$bin_dir/kin.exe" registry authority --json > "$RUNNER_TEMP/kin-registry-authority.json"
          if "$bin_dir/kin.exe" registry authority --fix > /dev/null 2>&1; then
            echo "::error::Windows registry authority --fix must fail as unsupported"
            exit 1
          fi
          EXPECTED_SHA="$(git rev-parse HEAD)" node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const meta = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/kin-build-meta.json`, "utf8"));
          const authority = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/kin-registry-authority.json`, "utf8"));
          if (authority.checks?.length !== 1 || authority.checks[0]?.state !== "unsupported") {
            throw new Error("Windows registry authority must report exactly one unsupported capability check");
          }
          if (meta.kin_commit !== process.env.EXPECTED_SHA || meta.kin_dirty !== false || meta.kin_source_known !== true) {
            throw new Error("Windows release build did not prove a clean, known checkout");
          }
          const trackedLock = childProcess.execFileSync(
            "git",
            ["cat-file", "blob", "HEAD:Cargo.lock"]
          );
          const workingLock = fs.readFileSync("Cargo.lock");
          if (!workingLock.equals(trackedLock)) {
            throw new Error("Windows Cargo.lock working bytes do not match the tracked Git blob");
          }
          const expectedLock = crypto.createHash("sha256").update(trackedLock).digest("hex");
          if (meta.dependency_provenance !== expectedLock) {
            throw new Error(
              `Windows embedded Cargo.lock provenance ${meta.dependency_provenance ?? "missing"} ` +
              `does not match tracked Git bytes ${expectedLock}`
            );
          }
          // The shipped binary must report the features it was built with, not
          // merely resolve them in the dependency graph. `metal` tracks the
          // compiled backend rather than the marker cargo feature
          // (bench_meta.rs `metal_active()` is `cfg!(target_os = "macos")`), so
          // a correct Windows build reports vector and embeddings and no metal.
          for (const feature of ["vector", "embeddings"]) {
            if (!meta.feature_flags.includes(feature)) {
              throw new Error(`Windows release build did not enable ${feature}`);
            }
          }
          if (meta.feature_flags.includes("metal")) {
            throw new Error("Windows release build reported the macOS-only metal backend");
          }
          NODE

      # Both admission boundaries still refuse on Windows, and the shared
      # script is the only statement of what they refuse. The pull-request
      # authority job runs the same assertions against a debug binary, so an
      # admission change that moves the refusal turns a pull request red
      # instead of first turning a release commit red here. Daemon reopen
      # assertions live in the Linux daemon smoke until the Windows ports land.
      - name: Assert the Windows admission contract
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/assert-windows-init-contract.sh \
            "$GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/release/kin.exe" \
            "$RUNNER_TEMP/kin-windows-admission"

  # Classify the PR diff so documentation-only and workflow-only changes can
  # satisfy the heavy required checks without a toolchain or registry
  # dependency. Fail closed: any classifier failure or non-pull_request event
  # reports docs_only=false and every gated job runs. ci.yml itself never
  # qualifies for its own fast path.
  changes:
    name: Classify diff scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        # This step gates release-critical jobs. Pin its process startup and run
        # Git with an empty environment rather than inheriting mutable authority.
        shell: /usr/bin/bash --noprofile --norc -p -e -u -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
          BASH_ENV: ""
          ENV: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: /dev/null
          LD_PRELOAD: ""
          WORKSPACE: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # env -i drops inherited GIT_DIR/GIT_WORK_TREE/GIT_INDEX_FILE,
            # GIT_CONFIG_*, object/replace, executable, and diff authority.
            changed="$(
              /usr/bin/env -i \
                HOME=/dev/null \
                PATH=/usr/bin:/bin \
                LC_ALL=C \
                GIT_CONFIG_NOSYSTEM=1 \
                GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_GLOBAL=/dev/null \
                GIT_CONFIG_COUNT=0 \
                GIT_ATTR_NOSYSTEM=1 \
                GIT_PAGER=cat \
                GIT_TERMINAL_PROMPT=0 \
                /usr/bin/git \
                  --no-pager \
                  --no-replace-objects \
                  --no-lazy-fetch \
                  --no-optional-locks \
                  --literal-pathspecs \
                  --git-dir="$WORKSPACE/.git" \
                  --work-tree="$WORKSPACE" \
                  -c core.attributesFile=/dev/null \
                  -c core.fsmonitor=false \
                  -c diff.external= \
                  -c diff.renames=false \
                  -c diff.ignoreSubmodules=none \
                  diff \
                  --no-ext-diff \
                  --no-textconv \
                  --no-renames \
                  --ignore-submodules=none \
                  --submodule=short \
                  --name-only \
                  "$BASE_SHA...$HEAD_SHA" \
                  --
            )"
            if [ -n "$changed" ]; then
              docs_only=true
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml) docs_only=false; break ;;
                  *.md | docs/*) ;;
                  .github/workflows/*) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$changed"
            fi
            printf '%s\n' "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # ─── The admission core ─────────────────────────────────────────────────────
  #
  # Two jobs, both running on every event, and between them the whole of what
  # blocks a pull request from landing. FIR-2815, on the founder's ruling that a
  # serialized all-green-admission queue is the wrong shape for a ten-minute
  # open-to-merge bar.
  #
  # The measurement that decided the split, over the 2026-08-23 to 2026-08-26
  # window: a landing spent a measured 31.9 minutes of pull-request CI and a
  # measured 32.5 minutes in the queue, and in 16 of 17 landings the tree the
  # queue built was NOT the tree the pull request tested, because main moved
  # under it while its checks ran. So the pull-request suite was proving a base
  # that had already been replaced by the time it went green. That is the half
  # whose result nothing downstream depends on, and it is the half that moved.
  #
  # What these two catch, measured over the same window: 31 of 64 distinct
  # pull-request failures, 48 percent, were formatting, clippy or a policy
  # script. The other 52 percent now arrive as a red main tip instead. That is
  # the trade, it is deliberate, and it is safe for one reason: release-tag.yml
  # refuses to mint a sha lacking either its proof records or its nine green
  # required checks, per sha and failing closed, so an unproven main tip cannot
  # be tagged. It can only be inconvenient.
  #
  # Neither job may be skipped on any event. A required context nobody reports
  # blocks a merge forever with every visible check green, which is a silent
  # hang rather than a failure, so the sharded test job publishes its required
  # name from an aggregate that always runs and names which case it passed on.
  # The three display names below carry no colon on purpose. A YAML scalar
  # containing ": " has to be quoted, and the job-name census in
  # scripts/test-release-workflow-authority.py reads the exact scalar text, so a
  # quoted name would be registered with its quotes and would no longer be the
  # string GitHub publishes or the string a ruleset has to name.
  fast-gate-lint:
    name: Fast gate lint and policy
    # The heavy-runner switch, and the one place its value is chosen.
    # `vars.KIN_HEAVY_RUNNER` names the runner every compile-heavy job in this
    # workflow uses. When it is unset or empty this resolves to `ubuntu-latest`,
    # so the workflow is always runnable without it, and flipping the whole set
    # between runners is a variable edit rather than a workflow change.
    #
    # That indirection is the availability half, and it was bought the hard way:
    # on 2026-08-30 the `kin-16core` pool stopped assigning runners at 14:54:39Z
    # and every job pinned to it queued with no runner and no error, including
    # main's Product Acceptance, which is the only grader kin has. A hardcoded
    # label has no way back from that; this has one.
    #
    # Read the runner a run actually resolved from the jobs API `labels` field,
    # never from this line.
    runs-on: ${{ vars.KIN_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # FIR-2744. This job shares `check`'s cargo cache key, and with
    # `add-rust-environment-hash-key` off nothing else would notice the two
    # declaring different cargo profiles, so they must declare the same one or
    # they are sharing a cache built under settings neither agreed to. Added on
    # rebase: this job arrived on main after the change was written.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify registry dependency-wave admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-kin-registry-wave-head.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --workspace "$GITHUB_WORKSPACE" \
            --attestation-wait-seconds 300

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy

      # `save-if: false` and a shared key, for the same reason `feature-tests`
      # carries them: this job must never write the entry `check` owns. `check`
      # still runs on every main commit, so the entry keeps being written by the
      # branch that is allowed to write it. Read the cache line in THIS step's
      # log rather than the caches API listing, which is not an inventory.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744. These two jobs share `check`'s cache key, which is exactly
          # the case this setting exists for: without it `rust-cache` hashes
          # every toolchain the runner happens to carry, so two jobs in one run
          # that drew different images ask for different keys and share nothing.
          # Added on rebase, because both jobs arrived on main after this change
          # was written and its own guard refuses any cache step that omits it.
          add-rust-environment-hash-key: false
          shared-key: check
          save-if: false

      - name: Check formatting
        run: cargo fmt -- --check

      # The quarantine's clock. `.config/nextest.toml` buys a flaky test two
      # retries so it stops ejecting queue entries; this is what stops that
      # becoming a place to park a real bug. It reads source and resolves no
      # dependencies, and it lives here rather than in `check` because a script
      # step in `check` is a gate `bin/kin-precheck` in the umbrella enumerates
      # and must classify by name, and wiring one there without the matching
      # umbrella entry makes precheck refuse with no tally, on this tree and on
      # every lane still on an older base. Promoting it is this step moving one
      # job and one name joining precheck's LOCAL list.
      - name: Check the flake quarantine
        run: python3 scripts/check-quarantine.py

      # Here rather than in `check`, for the reason the step above records: a
      # script step in `check` is a gate `bin/kin-precheck` enumerates and must
      # classify by name, and one wired there without the matching umbrella
      # entry makes precheck refuse with no tally. Both were in `check` and
      # precheck reported them UNCLASSIFIED, which costs every lane its local
      # verdict. This job carries the required "Fast gate lint and policy"
      # context, so the guard is no weaker here; promoting it back is one job
      # move and one name joining precheck's LOCAL list.
      - name: Check Docker daemon production features
        run: bash scripts/check-docker-daemon-features.sh

      - name: Falsify Docker daemon production feature guard
        run: bash scripts/check-docker-daemon-features.test.sh

      # ADDED here rather than moved out of `check`, deliberately, for two
      # reasons. `check` carries `github.event_name != 'pull_request'`, so the
      # thinned six-context pull-request gate never runs it and main failed its
      # own kin-vfs compatibility guard with no pull-request check ever showing
      # it (FIR-2887); this job runs on a pull request, so the answer now
      # arrives while a commit can still change it. And `bin/kin-precheck`
      # enumerates the gate list out of `check` by name and refuses with no
      # tally when a script it expects is missing there, so moving the step
      # would have dropped it from every lane's local gate at the same time. The
      # cost of running it in both places is one API read on a push.
      - name: Verify Kin/kin-vfs compatibility at the pinned release input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-kin-vfs-compat.mjs

      # Byte-identical to the `check` job's clippy step, deliberately. The two
      # run on different events now and there is no event on which neither runs,
      # so the workspace is linted exactly once per event rather than twice.
      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          allows="$(grep -Ev '^(#|$)' .github/clippy-allowed-lints.txt | tr '\n' ' ')"
          words="$(printf '%s\n' "$allows" | wc -w | tr -d ' ')"
          if [ "$words" -lt 2 ]; then
            echo "::error title=Empty clippy debt list::.github/clippy-allowed-lints.txt carries no allows"
            echo "Clippy would run with the RUSTFLAGS -D warnings group and nothing" >&2
            echo "overriding it, so every entry on the debt list would go red at once." >&2
            exit 1
          fi
          echo "clippy debt allow-list: $((words / 2)) lints"
          # The allow list is a word list, and splitting it is the point.
          # shellcheck disable=SC2086
          cargo clippy --all-targets --all-features -- $allows

      # Nine of the window's 64 failures were release ordering and npm
      # provenance policy and eight more were this gate, so a fifth of what a
      # pull request used to learn in thirty minutes is learned here in under
      # one. The wrapper routes its own failures by event: hard for anything
      # reaching release machinery, for the release pull request, for a push and
      # for a diff it cannot read, and a warning annotation otherwise.
      - name: Boundary contract tests
        # packages/boundary-contracts holds the wire contracts both sides of a
        # boundary read, and until now no workflow ran its suite: the tests
        # existed and no required context could report them, which is a guard
        # that cannot fail. The hosted transfer seam is asserted there against
        # the Rust authority and the TypeScript declarations at once, so the
        # suite has to run where a pull request can go red.
        #
        # The exit code is the verdict. The pass count is only a floor, so a
        # suite that silently graded nothing cannot report the same green a
        # clean run reports; it moves only when tests are REMOVED.
        working-directory: packages/boundary-contracts
        run: |
          node --check src/index.js
          node --check test/contracts.test.js
          if out=$(node --test 2>&1); then status=0; else status=$?; fi
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "boundary-contracts suite failed with status $status" >&2
            exit 1
          fi
          passed=$(printf '%s\n' "$out" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')
          if [ -z "$passed" ] || [ "$passed" -lt 7 ]; then
            echo "boundary-contracts reported '$passed' passing tests, below the 7 it carries" >&2
            exit 1
          fi
          echo "boundary-contracts: $passed tests passed"

      - name: Validate automatic release policy
        env:
          GH_TOKEN: ${{ github.token }}
          KIN_POLICY_EVENT: ${{ github.event_name }}
          KIN_POLICY_HEAD_REF: ${{ github.head_ref }}
          KIN_POLICY_REPOSITORY: ${{ github.repository }}
          KIN_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          KIN_POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          bash scripts/release-policy-gate.sh <<'RELEASE_POLICY'
          python3 scripts/test-release-workflow-authority.py
          node --test \
            scripts/check-glibc-floor.test.mjs \
            scripts/check-kin-vfs-compat.test.mjs \
            scripts/check-rc-build-drift.test.mjs \
            scripts/check-release-proof-artifacts.test.mjs \
            scripts/release-train-body.test.mjs \
            scripts/check-release-version.test.mjs \
            scripts/release-intent.test.mjs \
            scripts/extract-release-notes.test.mjs \
            scripts/prepare-release.test.mjs \
            scripts/release-archive-shape.test.cjs \
            scripts/write-release-archive-docs.test.mjs
          node --check scripts/check-release-version.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/release-intent.mjs
          RELEASE_POLICY

  # The build-and-test half of admission, sharded three ways over the packages
  # the diff can have broken.
  #
  # Three shards each pay their own build, about ten runner minutes of
  # duplicated compile. Building once and passing an artifact is cheaper in
  # runner minutes and MORE expensive in wall clock, and the founder's ruling on
  # 2026-08-26 was spend over the coverage trade, so the clock wins.
  #
  # The scope is the changed packages plus their reverse-dependency closure, and
  # it widens to the whole workspace on anything it is unsure of. A selector
  # that narrows too far exits 0 having graded nothing, which reads exactly like
  # a clean pass, so the listing is asserted non-empty before the run: nextest
  # over a filter matching nothing prints the summary a clean pass prints.
  fast-gate-tests:
    name: Fast gate test shard
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # The heavy-runner switch; see `fast-gate-lint` for what it resolves to.
    runs-on: ${{ vars.KIN_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      # A shard that dies must not take its siblings with it, for the reason
      # `check` sets this: one red shard cancelling the others makes the
      # aggregate report one cause where there may be three.
      fail-fast: false
      matrix:
      # Three, and five was tried and measured back out. Do not raise this
      # count expecting the gate to get faster; the numbers are below and they
      # say the shard count is not the lever.
      #
      # Five ran on main for three consecutive pushes. Slowest shard went from
      # a 12-run mean of 10.14 min to 9.78, which is 3.5 percent and exactly
      # one before-side standard deviation, and the required context stayed
      # over ten minutes on two of the three. What settles it is narrower than
      # the mean: the SLOWEST partition's test time did not move at all, 386 s
      # mean at three shards against 392 s at five.
      #
      # The reason is a floor that does not divide. Per shard: 34 s of job
      # setup, 166 s of `cargo nextest list`, which compiles the whole
      # selection, and 235 s inside the `Test` step itself, measured as the
      # 470 s that two extra shards added to the run's total test time while
      # the selection stayed constant. That is 435 s, 7.25 min, at any count.
      # On top of it the slowest partition holds something indivisible worth
      # about 390 s, so no count brings that partition below roughly 9.8 min.
      #
      # This list and the `--partition count:.../3` denominator below are one
      # fact in two places. The guard checks them against each other, because
      # a matrix SHORTER than the denominator runs that fraction of the
      # selection and still reports success.
        shard: [1, 2, 3]
    steps:
      # The scope read diffs a base against a head, so it needs both.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Verify kin cargo registry config
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744. These two jobs share `check`'s cache key, which is exactly
          # the case this setting exists for: without it `rust-cache` hashes
          # every toolchain the runner happens to carry, so two jobs in one run
          # that drew different images ask for different keys and share nothing.
          # Added on rebase, because both jobs arrived on main after this change
          # was written and its own guard refuses any cache step that omits it.
          add-rust-environment-hash-key: false
          shared-key: check
          save-if: false

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # An event with no readable base produces no changed paths, and the
      # selector widens on that rather than guessing, which is the same answer a
      # failed diff gets. Those two must not be told apart.
      - name: Choose the packages this diff can have broken
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Wrapped for FIR-2950: the kin registry intermittently resets one
          # connection during the TLS handshake, which killed three shards
          # tonight before any test ran. The wrapper retries ONLY that error
          # and leaves stdout untouched, so this redirect still gets clean JSON.
          scripts/retry-on-registry-reset.sh \
            cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          : > "$RUNNER_TEMP/changed.txt"
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" -- > "$RUNNER_TEMP/changed.txt" || {
              echo "::warning::could not diff $BASE_SHA...$HEAD_SHA; testing the whole workspace"
              : > "$RUNNER_TEMP/changed.txt"
            }
          fi
          python3 scripts/changed-crate-scope.py "$RUNNER_TEMP/metadata.json" \
            < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/scope.args"
          if [ ! -s "$RUNNER_TEMP/scope.args" ]; then
            echo "::error title=Empty test scope::the selector printed no arguments"
            echo "An empty selection would run the whole suite or none of it, and" >&2
            echo "cargo cannot tell you which. Refusing rather than guessing." >&2
            exit 1
          fi
          echo "scope: $(tr '\n' ' ' < "$RUNNER_TEMP/scope.args")"

      # A filter that matches nothing grades nothing and exits 0, printing the
      # same summary a clean pass prints. Assert the listing before the run.
      - name: Assert the selection lists tests before running any
        run: |
          set -euo pipefail
          readarray -t SCOPE < "$RUNNER_TEMP/scope.args"
          # Wrapped for FIR-2950. All three specimens died here: nextest shells
          # out to `cargo metadata`, which fetches the sparse index, and the
          # reset arrives before a single test runs.
          scripts/retry-on-registry-reset.sh \
            cargo nextest list --locked "${SCOPE[@]}" --message-format json \
            > "$RUNNER_TEMP/listing.json"
          python3 - "$RUNNER_TEMP/listing.json" <<'LISTING'
          import json, sys
          listing = json.load(open(sys.argv[1], encoding="utf-8"))
          suites = listing.get("rust-suites", {})
          total = sum(len(suite.get("testcases", {})) for suite in suites.values())
          print(f"{total} test(s) across {len(suites)} binaries in the selection")
          if total == 0:
              print("::error title=Empty test selection::the scope lists zero tests")
              raise SystemExit(1)
          LISTING

      - name: Test
        run: |
          set -euo pipefail
          readarray -t SCOPE < "$RUNNER_TEMP/scope.args"
          cargo nextest run --locked "${SCOPE[@]}" --partition count:${{ matrix.shard }}/3

      # The reporting verdict. The run above graded a quarantined flake as
      # passing, which is what keeps it off the critical path; this reads the
      # same execution's JUnit record for what `--flaky-result fail` would have
      # said, so a retry stays visible instead of going quiet.
      - name: Report quarantined flakes
        run: python3 scripts/check-quarantine.py --report-junit target/nextest/default/junit.xml

  # The required context, and the only job that publishes it. It always runs, on
  # every event, because a required context that is never reported is a silent
  # hang. It names which case it passed on rather than passing quietly, and it
  # admits `success` from the shards and nothing else: a skipped or cancelled
  # shard left part of the selection unrun, and a required context that goes
  # green on that is worse than no context at all.
  fast-gate-tests-aggregate:
    name: Fast gate build and tests
    needs: [changes, fast-gate-tests]
    if: ${{ !cancelled() }}
    # Deliberately a literal `ubuntu-latest` rather than the heavy-runner switch,
    # for the reason `check-aggregate` is not on one either. This job compiles
    # nothing and decides in a two-second shell `if`, but it sits directly on the
    # required context's critical path, so a larger runner's provisioning wait
    # would raise the one number this gate is measured on. Measured same-run,
    # that wait was 4 to 99 seconds against `ubuntu-latest`'s 4 to 20.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every fast-gate shard to have succeeded
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS: ${{ needs.fast-gate-tests.result }}
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "documentation-only diff: no package changed, so there is nothing to build"
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error title=fast gate shards did not pass::the sharded fast-gate legs reported '$SHARDS'"
            echo "Every shard of the selection has to report success for this" >&2
            echo "context to be evidence that the selection ran. 'skipped' and" >&2
            echo "'cancelled' mean a shard did not run at all." >&2
            exit 1
          fi
          echo "every fast-gate shard succeeded"

  # A skipped matrix job never expands, so the required per-platform contexts
  # would go missing instead of reporting skipped, and a required context nobody
  # reports is a silent hang rather than a failure. This stub carries the same
  # display name and matrix as the real job and produces the exact required
  # context names instantly. Its condition and the real jobs' are mutually
  # exclusive, so no two of them ever publish one expanded name on one event.
  #
  # It used to cover documentation-only diffs alone. It now covers every pull
  # request, because the ubuntu and macOS suites moved off the pull-request path
  # entirely: what admits a change is the fast gate below, and the full suite
  # runs on the merge queue and on every commit that reaches main, where it is
  # graded per commit and nothing cancels it. `release-tag.yml` still refuses to
  # mint a sha whose nine required checks are not green, so the proof did not
  # move, only the moment it is paid for.
  check-pr-fast-path:
    name: Check & Test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Report the pull-request fast path
        run: |
          echo "Check & Test runs in the merge queue and on every main commit."
          echo "Admission is the fast gate; see .github/workflows/ci.yml."

  # The ubuntu half of Check & Test, sharded, and the job every source-reading
  # gate in this repository runs in. The macOS half moved to `check-macos` +
  # `check-macos-aggregate` below; this one carries the ubuntu-latest evidence
  # and now splits its test step the same way, because `Test` was 14.98 min of
  # a 21.8-minute job and was the last unpartitioned suite in the workflow.
  #
  # Within that set, shard 1 runs everything and shard 2 runs its own build and
  # its own partition. The gates on shard 1 read source and cannot answer
  # differently on a second runner, so running them twice would pay twice for
  # one answer; the build is the one thing a partition genuinely needs of its
  # own. Everything a partition consumes stays on both legs: the toolchain, the
  # registry check, the cache, the build, nextest, and the language servers the
  # enrichment proof needs, since which shard that test lands in is decided by
  # the partitioner rather than by anything written here.
  #
  # The job id stays `check`. Two things read it and neither reads a display
  # name: `bin/kin-precheck` in the umbrella enumerates this job's gate list out
  # of this file by that id, and `rust-cache` composes its key from the job id
  # when no shared key is given, so `feature-tests` reaches this job's warm
  # dependency graph by asking for `check`. Renaming it would break the lane
  # inner loop and silently cost the ubuntu permutations their cache, which is
  # the same defect the macOS leg of that job carried until FIR-2722.
  #
  # This job publishes no required context. `check-aggregate` below does, and it
  # fails unless every shard here succeeded. The `runner.os == 'Linux'`
  # conditions further down are always true and are kept rather than deleted:
  # they document which steps are Linux-only by intent.
  check:
    name: Check & Test ubuntu shard
    needs: changes
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    # The heavy-runner switch; see `fast-gate-lint` for what it resolves to.
    runs-on: ${{ vars.KIN_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    # The all-features clippy/build/test sequence can otherwise retain more
    # than a hosted runner's available disk in incremental objects and debug
    # symbols. Keep validation semantics identical while bounding the target
    # directory so tests still have space for their temporary fixtures.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      # A shard that dies must not take its sibling with it. With fail-fast on,
      # one red shard cancels the other, the aggregate reads `cancelled` for a
      # partition that was passing, and the run reports one cause where there
      # may be two.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      # The README states how many languages Kin parses in its
      # "Language | Extensions" table, and kin-parser's AdapterRegistry::new()
      # decides it. Nothing else holds the two together, so an adapter added or
      # removed without the table edited to match publishes a stale number.
      # This job is the one that sees every adapter change: a diff touching
      # crates/ is never classified documentation-only, so it never takes the
      # inert fast path.
      - name: Check the README language count against the adapter registry
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail

          readme="README.md"
          registry="crates/kin-parser/src/languages/mod.rs"

          # The adapter registry is the real count. It is the set the README
          # itself points at, and unlike the tree-sitter Cargo dependencies it
          # cannot be inflated by a grammar-adjacent crate that is no adapter.
          derived="$(awk '
            /adapters: vec!\[/           { inblock = 1; next }
            inblock && /^[[:space:]]*\]/ { inblock = 0; next }
            inblock && /Box::new\(/      { n++ }
            END                          { print n + 0 }
          ' "$registry")"

          if [ "$derived" -lt 1 ]; then
            echo "::error::language count: no adapters found in $registry"
            echo "The AdapterRegistry::new() 'adapters: vec![...]' block moved or changed" >&2
            echo "shape, so the real language count can no longer be derived and the" >&2
            echo "README number is now unchecked. Teach this step in" >&2
            echo ".github/workflows/ci.yml to read the registry's new form." >&2
            exit 1
          fi

          documented="$(awk '
            /^\|[[:space:]]*Language[[:space:]]*\|[[:space:]]*Extensions[[:space:]]*\|/ {
              found = 1; intable = 1; next
            }
            intable && /^\|[[:space:]]*-+[[:space:]]*\|/ { next }
            intable && /^\|/                             { n++; next }
            intable                                      { intable = 0 }
            END { if (found) print n + 0; else print "MISSING" }
          ' "$readme")"

          if [ "$documented" = "MISSING" ]; then
            echo "::error::language count: the '| Language | Extensions |' table is gone from $readme"
            echo "That table is where $readme states how many languages Kin parses, and" >&2
            echo "this step reads it to keep the number honest. It was reworded, moved, or" >&2
            echo "removed, so the count is now unchecked. Point this step in" >&2
            echo ".github/workflows/ci.yml at wherever the README now states the count." >&2
            exit 1
          fi

          if [ "$documented" -ne "$derived" ]; then
            echo "::error::language count: $readme says $documented, the adapter registry says $derived"
            echo "  $readme, the 'Language | Extensions' table: $documented languages" >&2
            echo "  $registry, AdapterRegistry::new(): $derived adapters" >&2
            echo "Whichever is wrong, fix it so both state the same number." >&2
            exit 1
          fi

          # A prose count is optional, because the table above is the anchor
          # that always runs. When a sentence does claim a number it has to
          # agree with the registry too.
          prose_stale=0
          while IFS= read -r phrase; do
            [ -n "$phrase" ] || continue
            stated="$(printf '%s' "$phrase" | tr -dc '0-9')"
            if [ "$stated" -ne "$derived" ]; then
              echo "::error::language count: $readme prose says $stated, the adapter registry says $derived"
              echo "  $readme says: \"$phrase\"" >&2
              echo "  $registry, AdapterRegistry::new(): $derived adapters" >&2
              prose_stale=1
            fi
          done <<EOF
          $(grep -Eio '(covering|covers|support|supports|supporting|spanning|across)[[:space:]]+[0-9]+([[:space:]]+[a-z]+)?[[:space:]]+languages?' "$readme" || true)
          EOF

          if [ "$prose_stale" -ne 0 ]; then
            echo "Whichever is wrong, fix it so both state the same number." >&2
            exit 1
          fi

          echo "README and the adapter registry agree on $derived languages."

      - name: Install runtime guard tools
        if: matrix.shard == 1
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                # apt is bounded so a stalled mirror fails in minutes; if it
                # still fails, the pinned release tarball is the second path,
                # verified by checksum, so one stalled channel cannot hold
                # the job to its timeout.
                if ! scripts/ci-apt-install.sh ripgrep; then
                  echo "apt failed; installing ripgrep from the pinned release tarball" >&2
                  if [ "$(uname -m)" != "x86_64" ]; then
                    echo "::error::no pinned ripgrep tarball for $(uname -m)"
                    exit 1
                  fi
                  RG_VERSION=15.2.0
                  RG_SHA256=33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
                  RG_DIR="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
                  tmp="$(mktemp -d)"
                  curl -fsSL --retry 3 --max-time 120 -o "$tmp/rg.tgz" \
                    "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_DIR}.tar.gz"
                  echo "${RG_SHA256}  $tmp/rg.tgz" | sha256sum --check --strict
                  tar -xzf "$tmp/rg.tgz" -C "$tmp"
                  sudo install -m 0755 "$tmp/${RG_DIR}/rg" /usr/local/bin/rg
                fi
                ;;
              macOS)
                brew install ripgrep
                ;;
              *)
                echo "::error::unsupported runner OS for ripgrep install: $RUNNER_OS"
                exit 1
                ;;
            esac
          fi
          command -v rg

      - name: Validate installer checksum fixtures
        if: matrix.shard == 1
        run: python3 scripts/test-install-checksum.py

      # A gate whose assertion lost its call site still exits 0, so passing the
      # suites this polices proves nothing until this step confirms every check
      # in them is still reachable and still runs on pull requests. Ordering is
      # not what makes that true and is not claimed: this step precedes the
      # other two within this job, but test-release-workflow-authority.py also
      # runs in the npm-launchers job, which shares no dependency with this one,
      # so the two are unordered. Either way a red gate reds the pull request.
      # scripts/test-release-workflow-authority.py asserts this step exists, so
      # the pair cannot be half-removed.
      - name: Validate that every release gate assertion still runs
        if: matrix.shard == 1
        run: python3 scripts/test-assertion-reachability.py

      - name: Validate mandatory Homebrew release outcome gate
        if: matrix.shard == 1
        run: python3 scripts/test-homebrew-release-gate.py

      # Every validator below polices a repo-global invariant, so a break in one
      # is a property of the tree rather than of the change under test and the
      # identical failure lands on every open pull request and every queue entry
      # at once. On 2026-08-19 a kin-vfs pin that had drifted between
      # release.yml and rc-build.yml failed this step 70 times and ejected 32
      # queue entries; four of the seven pull requests it ejected touched
      # nothing release-related and could neither have caused the drift nor
      # fixed it. The gate runs the same validators and routes their failure:
      # hard for anything reaching release machinery, for the release pull
      # request, for a push, and for a diff it cannot read, and a warning
      # annotation otherwise. The invocations stay here rather than moving into
      # the gate because the assertion-reachability gate reads this file to
      # prove each suite still runs on pull requests.
      - name: Validate automatic release policy
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
          KIN_POLICY_EVENT: ${{ github.event_name }}
          KIN_POLICY_HEAD_REF: ${{ github.head_ref }}
          KIN_POLICY_REPOSITORY: ${{ github.repository }}
          KIN_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          KIN_POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          bash scripts/release-policy-gate.sh <<'RELEASE_POLICY'
          python3 scripts/test-release-workflow-authority.py
          node --test \
            scripts/check-glibc-floor.test.mjs \
            scripts/check-kin-vfs-compat.test.mjs \
            scripts/check-rc-build-drift.test.mjs \
            scripts/check-release-proof-artifacts.test.mjs \
            scripts/release-train-body.test.mjs \
            scripts/check-release-version.test.mjs \
            scripts/release-intent.test.mjs \
            scripts/extract-release-notes.test.mjs \
            scripts/prepare-release.test.mjs \
            scripts/release-archive-shape.test.cjs \
            scripts/write-release-archive-docs.test.mjs
          node --check scripts/check-release-version.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/release-intent.mjs
          RELEASE_POLICY

      # rc-build.yml builds release-candidate archives from a copy of
      # release.yml's build job, so the archive stranger and the preflight Linux
      # leg can run before a tag exists. A copy nothing checks keeps reporting
      # success while the original moves, and release.yml is the one workflow
      # whose mistakes a later commit cannot repair.
      - name: Check the RC build mirrors the release build
        if: runner.os == 'Linux' && matrix.shard == 1
        run: node scripts/check-rc-build-drift.mjs

      # release.yml refuses a release whose Kin lock resolves a different
      # kin-vfs-core than the pinned kin-vfs checkout builds, and that
      # comparison ran nowhere else: a pull request moving the Kin lock passed
      # every required context and failed only after the tag existed, where the
      # tag has already resolved its own workflows. Run the same comparison
      # here, against the pin read out of release.yml, so the answer arrives
      # while a commit can still change it.
      - name: Verify Kin/kin-vfs compatibility at the pinned release input
        if: runner.os == 'Linux' && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-kin-vfs-compat.mjs

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - name: Verify kin cargo registry config
        # kin-* crates resolve from the Kin sparse registry ([registries.kin]).
        # The temporary git [patch.kin] pins were dropped once all kin-* crates
        # were published to the registry; CI asserts they stay gone.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # Same trusted-ref scoping as the Windows authority job: restore always,
      # save only from main. This is the pull-request critical path, so a warm
      # dependency graph here is what a round actually costs.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: matrix.shard == 1
        run: cargo fmt -- --check

      # Two guards, two jobs. The Python checker walks every crate and carries
      # the owned, dated, existence-validated allowlist. The shell guard is a
      # dependency-free check on the ten core answer modules and is the one the
      # kin-cli unit test drives. Both run, and the third step falsifies them,
      # because a guard that has never been shown to fail proves nothing.
      - name: Check Zero File-Search Invariant
        if: matrix.shard == 1
        run: python3 scripts/verify-zero-file-search.py

      - name: Check Zero File-Search Invariant (answer modules)
        if: matrix.shard == 1
        run: bash scripts/zero_file_search_guard.sh

      # Deep history is a PROJECTION re-authored at ingest, not a stored fact:
      # a merge change's entity/relation deltas are discarded and recomputed by
      # the replay algorithm. Editing that algorithm changes what Kin reports
      # about the past, and HYDRATION_SEMANTICS_VERSION is the declared dial for
      # it. Nothing coupled the two, so the dial sat unchanged across the
      # releases that rewrote replay. This pins the replay surface by digest, so
      # an edit cannot ship without an explicit, reviewed manifest update.
      - name: Check Hydration Replay Semantics
        if: matrix.shard == 1
        run: python3 scripts/verify-hydration-semantics.py

      - name: Falsify Hydration Replay Semantics guard
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          poisoned="$(mktemp -d)"
          trap 'rm -rf "$poisoned"' EXIT
          cp -a crates scripts "$poisoned/"
          # The REAL guard and manifest run against the poisoned copy: the
          # manifest is policy, so letting the copy supply it would falsify
          # nothing.
          python3 scripts/falsify-hydration-semantics.py "$poisoned"

      # Two gates that ROUTE a failure rather than merely reporting one: the
      # release-policy gate decides whether a repo-global break belongs to the
      # change under test, and the Windows leg helpers decide whether a leg's
      # test selection was real. Each is driven in both directions here, the arm
      # it must accept and the arm it must refuse, because a routing gate that
      # only ever passes is indistinguishable from one that has stopped
      # deciding. Both run after the toolchain step because the leg helpers
      # resolve a compilation unit through cargo.
      - name: Falsify the release policy and Windows leg gates
        if: runner.os == 'Linux' && matrix.shard == 1
        run: |
          bash scripts/test-release-policy-gate.sh
          bash scripts/test-windows-authority-legs.sh

      # The debt allow-list lives in .github/clippy-allowed-lints.txt, with its
      # own provenance note. Two jobs run clippy now, one per platform, and only
      # the macOS one lints macOS-gated code; two inline copies of a 45-entry
      # list would drift, and the drift would be invisible until the platform
      # whose copy lost an allow went red for a lint nobody meant to enforce.
      - name: Clippy
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          allows="$(grep -Ev '^(#|$)' .github/clippy-allowed-lints.txt | tr '\n' ' ')"
          words="$(printf '%s\n' "$allows" | wc -w | tr -d ' ')"
          if [ "$words" -lt 2 ]; then
            echo "::error title=Empty clippy debt list::.github/clippy-allowed-lints.txt carries no allows"
            echo "Clippy would run with the RUSTFLAGS -D warnings group and nothing" >&2
            echo "overriding it, so every entry on the debt list would go red at once." >&2
            exit 1
          fi
          echo "clippy debt allow-list: $((words / 2)) lints"
          # The allow list is a word list, and splitting it is the point.
          # shellcheck disable=SC2086
          cargo clippy --all-targets --all-features -- $allows

      - name: Check Runtime Boundaries
        if: matrix.shard == 1
        run: bash scripts/check_runtime_boundaries.sh

      - name: Check Private Repo Coupling
        if: matrix.shard == 1
        run: bash scripts/check_private_repo_coupling.sh

      # The guard above is invoked from the repository root here and nowhere
      # else, which is the one working directory that hid a broken exclusion.
      # These tests run it from a foreign directory in both directions.
      - name: Test Private Repo Coupling Guard
        if: matrix.shard == 1
        run: python3 scripts/test-private-repo-coupling.py

      # The committed Cargo.lock plus .cargo/config.toml pins kin-* dependencies
      # to public source until every crate is registry-published.
      - name: Build
        run: cargo build --all-targets --locked

      # Kin's Linux release binaries link against musl so a single archive runs
      # on every distribution, and nothing else in CI compiles for that target.
      # A `target_env` cfg is invisible to a glibc build, so a dependency that
      # resolves a glibc-only libc entry point compiles clean through every
      # required context, reaches a tag, and then fails in the release run,
      # where the only remedy is another version cut. This compiles the exact
      # packages the release builds, for the target it builds them for, so that
      # break is a red pull request instead of a burned tag.
      #
      # One deliberate bound: it checks rather than builds, so it proves
      # compilation and name resolution and not linking.
      - name: Check the Linux release target (musl)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          # ring, oniguruma, sqlite, and tree-sitter compile C against musl, so
          # this needs the same musl-gcc the release legs install.
          scripts/ci-apt-install.sh musl-tools
          cargo check --locked --target x86_64-unknown-linux-musl \
            -p kin-cli -p kin-daemon

      # The second Linux release target. The step above proves any break that
      # selects on the C environment, because that selection is identical on
      # both architectures. It cannot prove a break that selects on the
      # architecture, and until this step existed that class first compiled
      # inside the release run, after the tag exists, which is the shape that
      # burned a cut.
      #
      # The Rust half is exact: rustc type-checks the release package set for
      # the real target triple, which is where the defect class lives. A
      # dependency resolving a libc entry point that libc declares for some
      # architectures and not others fails here rather than after the tag.
      #
      # The C half is bounded and stays bounded on purpose. Ubuntu ships no
      # aarch64 musl C toolchain, so the C sources that dependency build
      # scripts compile are built by the aarch64 glibc cross compiler: right
      # architecture, wrong C library headers. That is enough for the build
      # scripts to produce objects and let the Rust check run, and it is not a
      # proof that those C sources compile against musl headers. The release
      # leg proves that natively on ubuntu-24.04-arm, where musl-tools does
      # supply an aarch64 musl-gcc, which is why nothing here is a cross build.
      - name: Check the aarch64 Linux release target (musl)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-musl
          # Self-contained rather than relying on the step above having
          # refreshed the index. This is a required context, so an implicit
          # ordering dependency between two steps is a way for a reorder to
          # turn a stale index into a red Check & Test.
          scripts/ci-apt-install.sh gcc-aarch64-linux-gnu
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc \
          AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar \
            cargo check --locked --target aarch64-unknown-linux-musl \
              -p kin-cli -p kin-daemon

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Without a language server on PATH the reference-enrichment proof in
      # crates/kin-daemon/tests/lsp_reference_enrichment.rs skips, so this step
      # is what makes it run. It warns and exits 0 on a registry failure rather
      # than failing the gate, and the skip is annotated on the run summary and
      # printed per test, so it is never silent.
      - name: Install language servers for the enrichment proof
        if: runner.os == 'Linux'
        run: bash scripts/ci-install-language-servers.sh

      # `--partition count:N/M` splits the suite by test, deterministically,
      # so the two shards together run exactly the set one unpartitioned run
      # ran. `check-aggregate` below is what makes "together" enforceable: a
      # shard that never reported cannot leave its partition silently unrun.
      - name: Test
        run: cargo nextest run --locked --partition count:${{ matrix.shard }}/2

      - name: Doc tests
        if: matrix.shard == 1
        # nextest does not run doctests; keep them covered explicitly.
        run: cargo test --doc --locked

  # The required context for ubuntu. Its display name plus its one matrix value
  # compose to `Check & Test (ubuntu-latest)`, byte for byte what ruleset
  # 19746451, release-tag.yml's REQUIRED_CHECKS and expected_provenance tables,
  # scripts/test-release-workflow-authority.py and docs/release-bot.md all name.
  # Nothing about that string changes; only the job producing it does.
  #
  # The matrix is not decoration, for the same reason `check-macos-aggregate`
  # carries one: a skipped matrix job never expands, so on a documentation-only
  # diff this publishes the bare `Check & Test` name and leaves
  # `check-pr-fast-path` as the sole producer of the expanded one. Without the
  # matrix, a skipped aggregate would publish `Check & Test (ubuntu-latest)` as
  # `skipped` beside the stub's success, and two check runs under one required
  # name is the ambiguity the release mint refuses on.
  check-aggregate:
    name: Check & Test
    needs: [changes, check]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      # `needs.<job>.result` for a matrix job is the roll-up of every leg, so
      # this is `success` only when both shards succeeded. Requiring exactly
      # `success` is what makes a SKIPPED or CANCELLED shard fail this check
      # rather than pass it: a shard that never ran left half the ubuntu suite
      # unexecuted, and a required context that goes green on that is worse than
      # no context at all.
      - name: Require every ubuntu shard to have succeeded
        env:
          SHARDS: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          if [ "$SHARDS" != "success" ]; then
            echo "::error title=ubuntu shards did not pass::the sharded ubuntu Check & Test legs reported '$SHARDS'"
            echo "Every partition of the ubuntu suite has to report success for this" >&2
            echo "context to be evidence that the suite ran. 'skipped' and 'cancelled'" >&2
            echo "mean a partition did not run at all." >&2
            exit 1
          fi
          echo "every ubuntu Check & Test shard succeeded"

  # The macOS half of Check & Test, sharded.
  #
  # `Check & Test (macos-latest)` was the last required check to report on 83%
  # of merge_group runs and 73% of pull-request runs, at ~21.9 min. Of that,
  # 14.2 min is the `Test` step alone: 6454 tests in 801.6s, against 7.5 min for
  # the identical suite on ubuntu-latest, because macos-latest is a three-core
  # arm64 runner and nextest ran the suite as a single partition. Splitting the
  # partition is the whole point of this job.
  #
  # What this job carries is what macOS can answer differently from ubuntu:
  # clippy over macOS-gated code, the build, the tests, and the doctests. The
  # steps it does not carry are the source-reading gates whose result cannot
  # depend on the runner at all, from the README language count through the
  # zero-file-search and hydration guards. `Check & Test (ubuntu-latest)` is a
  # required context and runs every one of them, so none is lost; running them a
  # second time bought nothing but macOS minutes at ten times the billing rate.
  #
  # Within that set, shard 1 runs everything and shard 2 runs its own build and
  # its own partition. Nothing before `Test` can differ between the shards, so
  # repeating it would only pay twice for one answer, and the build is the one
  # thing a partition genuinely needs of its own.
  #
  # This job publishes no required context. `check-macos-aggregate` below does,
  # and it fails unless every shard here succeeded.
  check-macos:
    name: Check & Test macOS shard
    needs: changes
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      # A shard that dies must not take its sibling with it. With fail-fast on,
      # one red shard cancels the other, the aggregate reads `cancelled` for a
      # partition that was passing, and the run reports one cause where there
      # may be two.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - name: Verify kin cargo registry config
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # Same trusted-ref scoping as every other cached job: restore always, save
      # only from main. Both shards restore the same main entry, so the second
      # one is not paying for the first one's warmth.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # See .github/clippy-allowed-lints.txt. This is the only clippy pass over
      # macOS-gated code, which is why it stays on the macOS side rather than
      # being left to the ubuntu leg.
      - name: Clippy
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          allows="$(grep -Ev '^(#|$)' .github/clippy-allowed-lints.txt | tr '\n' ' ')"
          words="$(printf '%s\n' "$allows" | wc -w | tr -d ' ')"
          if [ "$words" -lt 2 ]; then
            echo "::error title=Empty clippy debt list::.github/clippy-allowed-lints.txt carries no allows"
            echo "Clippy would run with the RUSTFLAGS -D warnings group and nothing" >&2
            echo "overriding it, so every entry on the debt list would go red at once." >&2
            exit 1
          fi
          echo "clippy debt allow-list: $((words / 2)) lints"
          # The allow list is a word list, and splitting it is the point.
          # shellcheck disable=SC2086
          cargo clippy --all-targets --all-features -- $allows

      - name: Build
        run: cargo build --all-targets --locked

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # `--partition count:N/M` splits the suite by test, deterministically, so
      # the two shards together run exactly the set one unpartitioned run ran.
      # The aggregate below is what makes "together" enforceable: a shard that
      # never reported cannot leave its partition silently unrun.
      - name: Test
        run: cargo nextest run --locked --partition count:${{ matrix.shard }}/2

      # nextest does not run doctests, so partitioning cannot cover them and one
      # shard has to. They are a 0.9 min step and splitting them would cost more
      # in a second cold `cargo test --doc` than it could save.
      - name: Doc tests
        if: matrix.shard == 1
        run: cargo test --doc --locked

  # The required context for macOS. Its display name plus its one matrix value
  # compose to `Check & Test (macos-latest)`, byte for byte what ruleset
  # 19746451, release-tag.yml's REQUIRED_CHECKS and expected_provenance tables,
  # scripts/test-release-workflow-authority.py, and docs/release-bot.md all name.
  # Nothing about that string changes; only the job producing it does.
  #
  # The matrix is not decoration. A skipped matrix job never expands, so on a
  # documentation-only diff this publishes the bare `Check & Test` name and
  # leaves `check-pr-fast-path` as the sole producer of the expanded one, exactly
  # as the real and stub `check` jobs already behave. Without the matrix, a
  # skipped aggregate would publish `Check & Test (macos-latest)` as `skipped`
  # beside the stub's success, and two check runs under one required name is the
  # ambiguity the release mint refuses on.
  #
  # It runs on ubuntu-latest deliberately: it compiles nothing and spends
  # seconds, and macOS bills at ten times the rate. The matrix value names the
  # platform this context speaks for, not the platform it runs on.
  check-macos-aggregate:
    name: Check & Test
    needs: [changes, check-macos]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      # `needs.<job>.result` for a matrix job is the roll-up of every leg, so
      # this is `success` only when both shards succeeded. Requiring exactly
      # `success` is what makes a SKIPPED or CANCELLED shard fail this check
      # rather than pass it: a shard that never ran left half the macOS suite
      # unexecuted, and a required context that goes green on that is worse than
      # no context at all.
      - name: Require every macOS shard to have succeeded
        env:
          SHARDS: ${{ needs.check-macos.result }}
        run: |
          set -euo pipefail
          if [ "$SHARDS" != "success" ]; then
            echo "::error title=macOS shards did not pass::the sharded macOS Check & Test legs reported '$SHARDS'"
            echo "Every partition of the macOS suite has to report success for this" >&2
            echo "context to be evidence that the suite ran. 'skipped' and 'cancelled'" >&2
            echo "mean a partition did not run at all." >&2
            exit 1
          fi
          echo "every macOS Check & Test shard succeeded"

  # Two sets of steps used to run inside Check & Test and gate nothing that
  # needed them to be there. Both sat on the merge queue's critical path: five
  # merge_group runs sampled on 2026-08-18 spent 9.9 min of the average ubuntu
  # leg falsifying the Zero File-Search guards, and 15.7 min of the average
  # macOS leg on the three feature permutations. Neither set consumes anything
  # Check & Test builds. The falsification harness runs no cargo at all, and
  # each feature permutation resolves its own feature set, so it recompiles the
  # workspace crates whether it runs here or there. Running them beside Check &
  # Test rather than behind it changes when they run and nothing about what
  # they assert.
  falsify-guards:
    name: Falsify guards
    needs: changes
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The harness and both guards it drives locate a function body textually,
      # by the indentation of its declaration and the matching closing brace.
      # scripts/falsify-zero-file-search.py and scripts/zero_file_search_guard.sh
      # each record `cargo fmt --check` running in the same CI job as the reason
      # that location is reliable, so this job carries that obligation with the
      # harness rather than inheriting it from a job it no longer shares. An
      # unformatted tree could otherwise move a probe site, leave the harness
      # nothing to probe, and let it report success having proved nothing.
      # It needs no cache and no registry index: `cargo fmt -- --check` resolves
      # no dependencies and runs against an empty CARGO_HOME.
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      # A test that resolves a home through a real call site without
      # `#[serial]` passes on a quiet laptop, lands green, and ejects a
      # merge-queue entry weeks later from inside a `merge_group` run that marks
      # no pull request. Two of the four ejections in the 2026-08-26 window were
      # one such test, and the pull requests it removed showed every check green.
      # FIR-2714 removed that instance; this is what stops the next.
      #
      # It runs here rather than in `check` because it is a source read that
      # resolves no dependencies, which is this job's whole admission rule, and
      # because a script step in `check` is a gate `bin/kin-precheck` in the
      # umbrella enumerates and must classify by name. Wiring it there without
      # the matching umbrella entry makes precheck refuse with no tally, on this
      # tree and on every lane still on an older base, which is measured rather
      # than assumed: 16 of 17 gates passed and the run printed no tally.
      # Promoting it later is this step moving one job and one name joining
      # precheck's LOCAL list, which is FIR-2720's remaining half.
      #
      # The guard carries its own blanker, recogniser and discovery controls, so
      # a scan that has stopped being able to say yes fails here instead of
      # reporting a clean tree.
      - name: Check home-reading test isolation
        run: python3 scripts/check-home-reader-tests.py

      - name: Falsify Zero File-Search guards
        # Both guards still run on both platforms in Check & Test. Only this
        # meta-proof, that the guards are not vacuous, is single-legged.
        # Falsifiability is a property of the guards' logic, and neither the
        # Python checker nor the shell guard branches on platform: they carry no
        # `sys.platform` / `os.name` / `darwin` / `linux` test and no GNU-only
        # shell construct. The harness is self-contained, poisoning a
        # `mktemp -d` copy of `crates` and `scripts` rather than the checkout.
        run: |
          set -euo pipefail
          poisoned="$(mktemp -d)"
          trap 'rm -rf "$poisoned"' EXIT
          cp -a crates scripts "$poisoned/"

          fail_expected() {
            local label="$1" want="$2"; shift 2
            local out rc=0
            out="$("$@" 2>&1)" || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "::error::falsification failed. $label passed when it should have failed"; echo "$out"; exit 1
            fi
            if ! grep -qF "$want" <<<"$out"; then
              echo "::error::falsification failed. $label failed but never named '$want'"
              echo "$out"; exit 1
            fi
            echo "  ok: $label"
          }

          # [1/3] Every answer module, poisoned at several sites including
          # end-of-file, against both guards. This step used to plant one probe
          # in one module, at the top of a file it had truncated to three lines.
          # That proved the guards worked at that spot and nowhere else, and it
          # passed for as long as a comment-tracking desync left the last third
          # of the largest answer module unscanned.
          #
          # The harness also probes the two ways an EXEMPTION can lose scope
          # rather than a pattern losing a site: a brace inside a literal or a
          # comment planted in an allowlisted function body, which a raw brace
          # counter reads as an unclosed body and silently excuses to end of
          # file, and a counted pin paid for by a rename in test code the guard
          # never reads. Both are the same failure as [2/3] reached through the
          # exemption mechanism instead of a stale pin.
          echo "[1/3] every answer module, every probe site, both guards"
          python3 scripts/falsify-zero-file-search.py "$poisoned"

          # [2/3] A broken pin must not hide the scan. Allowlist validation used
          # to exit before the walk, so a stale pin reported itself and nothing
          # else; two stale pins once masked ten real violations in a newly
          # covered crate, which made a red allowlist useless as a measure of
          # remaining work. Break one pin's count deliberately and require the
          # run to report the violations that pin was masking AS WELL AS the pin
          # error. Runs before [3/3], which mutates the allowlist irreversibly.
          echo "[2/3] a broken pin must not hide the scan"
          python3 - "$poisoned/scripts/zero-file-search-allowlist.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          target = "crates/kin-daemon/src/repository_branch.rs"
          for entry in data["allowlist"]:
              if entry["file"] == target:
                  entry["allow_match"] = [{"expr": ".metadata()", "count": 999}]
                  break
          else:
              raise SystemExit(f"::error::falsification setup: no pin on {target}")
          json.dump(data, open(path, "w"))
          PY
          out=""; rc=0
          out="$(python3 "$poisoned/scripts/verify-zero-file-search.py" "$poisoned" 2>&1)" || rc=$?
          for want in \
            "[VIOLATION] crates/kin-daemon/src/repository_branch.rs" \
            "want 999" \
            "Scanned "; do
            if ! grep -qF "$want" <<<"$out"; then
              echo "::error::falsification failed: a broken pin hid the scan (missing '$want')"
              echo "$out"; exit 1
            fi
          done
          if [[ $rc -eq 0 ]]; then
            echo "::error::falsification failed: a broken pin did not fail the guard"
            echo "$out"; exit 1
          fi
          echo "  ok: broken pin reported its masked violations and still failed"
          # Restore the real policy; [3/3] starts from an unbroken allowlist.
          cp scripts/zero-file-search-allowlist.json "$poisoned/scripts/"

          echo "[3/3] allowlist entry naming a path that no longer exists"
          python3 - "$poisoned/scripts/zero-file-search-allowlist.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["allowlist"].append({
              "file": "crates/kin-core/src/text_refs.rs",
              "reason": "resurrected stale exemption",
              "owner": "ci-falsification",
              "expiration": "2026-12-31",
          })
          json.dump(data, open(path, "w"))
          PY
          fail_expected "python guard" "text_refs.rs" python3 "$poisoned/scripts/verify-zero-file-search.py" "$poisoned"

          echo "Zero File-Search guards are falsifiable: every probe was caught."

      # Both release version guards existed before this step did and neither
      # could fail: the version gate ran on no pull request, and the mint read
      # a version whose tag already existed and called that nothing to release.
      # A suite written for guards of that shape is worth exactly as much as
      # the run that watched it go red, so the falsifier poisons a copy of each
      # gate and requires the suite to name the test that caught it. Half its
      # probes break the refusal and half break the pass, because a gate that
      # refused every quiet cycle would be switched off within a day.
      - name: Falsify the release version guards
        run: python3 ./scripts/falsify-release-version-guards.py
  # A skipped matrix job never expands, so its per-leg context names do not
  # appear at all rather than appearing skipped. `check-pr-fast-path` exists for
  # exactly that reason and this is its counterpart: once the branch ruleset
  # requires `Feature permutation tests (ubuntu-latest)` and its macOS leg, a
  # documentation-only diff would otherwise wait forever for two contexts that
  # were never going to be created. Both legs run here on one ubuntu runner
  # because the point is the name, not the work.
  #
  # Read this before trusting a green `Feature permutation tests` on a pull
  # request. On a pull request this job runs NO tests: it exists only to publish
  # the two context names, and every step below it in `feature-tests` is skipped.
  # The permutations execute on push to `main` and nowhere earlier, because this
  # repository lands through direct merges rather than a merge queue, so there is
  # no pre-merge event that runs them. The trade is deliberate: the permutations
  # carry a 60 minute timeout and a per-pull-request gate is held to minutes, so
  # they are kept off the pull-request path on purpose.
  #
  # The consequence is real and is the reason this is written down. A break that
  # appears only under a non-default feature permutation reaches `main` first and
  # is caught by the push run afterwards, not by the pull request that introduced
  # it. Anything that must refuse a change BEFORE it lands belongs in the fast
  # gate instead, where the required contexts are.
  feature-tests-pr-fast-path:
    name: Feature permutation tests
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Report the pull-request fast path
        run: |
          echo "This job runs no tests. The feature permutations run on push to"
          echo "main, after the merge, and not on this pull request."
          echo "Admission before the merge is the fast gate."

  feature-tests:
    name: Feature permutation tests
    needs: changes
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Same bounds as Check & Test: the feature permutations compile the same
    # workspace and would otherwise retain more than a hosted runner's
    # available disk in incremental objects and debug symbols.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Verify kin cargo registry config
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # These permutations start from the warm third-party dependency graph
      # Check & Test's own cache already writes, instead of compiling it from
      # nothing. Only the workspace crates rebuild for the changed feature set,
      # which is what they cost inside Check & Test too. `save-if: false`
      # because this job must never write that entry: it resolves a different
      # feature set, and a save from here would hand Check & Test a target
      # directory missing the artifacts its steps expect.
      #
      # Check & Test is two jobs, so one shared key cannot serve both legs of
      # this matrix. `rust-cache` composes its key from the JOB ID when no
      # shared key is given, so ubuntu's entry is written under `check` and
      # macOS's under `check-macos`, and the expression below is which of the
      # two this leg is entitled to read. Asking `check` on Darwin, which is
      # what this step did until FIR-2722, requested
      # `v0-rust-check-Darwin-arm64-*`, a key nothing in this workflow has ever
      # written, so the macOS leg logged `No cache found.` on every run and
      # compiled the dependency graph from nothing. The comment that used to
      # sit here predicted exactly that and nobody read the line it named.
      #
      # Read the cache line in THIS step's log, on both legs, never the caches
      # API listing, which is not an inventory and omitted every macOS entry
      # while a job log showed a full match on one of them.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          shared-key: ${{ matrix.os == 'macos-latest' && 'check-macos' || 'check' }}
          save-if: false

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Keep the former gcs-only gate even though production now adds Firestore.
      # It proves hosted bytes compiled without the durable dependency still
      # fail closed instead of silently selecting the in-memory backend.
      - name: Test gcs feature
        run: cargo nextest run -p kin-daemon --features gcs --locked

      - name: Test hosted gcs spine cursor hold
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test -p kin-daemon --features gcs --locked
          state::tests::hosted_spine_refuses_persistence_without_cursor_cas
          -- --exact --nocapture --test-threads=1

      # kin-spine gates its Firestore REST write-shape, envelope and migration
      # seal tests behind its own `firestore` feature. The workspace test legs
      # build kin-daemon with default features, so nothing enables it there, and
      # the `-p kin-daemon --features gcs,firestore` leg below compiles kin-spine
      # with the feature on but runs only kin-daemon's test binaries. Without
      # this step those tests are written, compiled on no leg that runs them,
      # and can never fail.
      - name: Test kin-spine durable publication paths
        run: cargo nextest run -p kin-spine --features firestore --locked

      # The actual daemon container enables both non-default hosted features.
      # Default and all-features checks do not execute this exact deployed
      # configuration, so keep a complete package pass for the production bytes.
      - name: Test hosted production features
        run: cargo nextest run -p kin-daemon --features gcs,firestore --locked

      - name: Test hosted production durable spine selection
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test -p kin-daemon --features gcs,firestore --locked
          state::tests::hosted_production_feature_pair_selects_durable_backend
          -- --exact --nocapture --test-threads=1

      # Nothing else on these legs resolves kin-cli without its default
      # features, so a break that appears only with `vector` and `embeddings`
      # off compiles clean here and reaches main behind a green required
      # context. The Windows authority job covers that configuration for the
      # msvc target through filtered subsets of the library, so the cases
      # asserting the featureless path execute in this step and nowhere else.
      # `RUSTFLAGS: -D warnings` is set at workflow level, so the unused-import
      # shape this class first took fails the step rather than warning.
      #
      # The whole package runs rather than the library alone. The regressions
      # this is here to catch are library unit tests, but the featureless
      # configuration is a build configuration before it is a test one: 30 of
      # the 33 integration targets compile without default features nowhere
      # else, and scoping to `--lib` would stop compiling exactly the targets
      # where a test that assumes a feature can next appear.
      #
      # `cargo test` rather than the `cargo nextest run` the steps above use.
      # It is the authority when the two runners disagree, and it covers the
      # package's doctests in the same pass instead of needing a second step.
      - name: Test featureless kin-cli
        run: cargo test -p kin-cli --no-default-features --lib --tests --locked

      # kin-daemon owns feature-dependent status sampling and response tests of
      # its own. A featureless package check compiles those routes but does not
      # execute assertions that can accidentally encode the vector-enabled
      # answer. Run the complete daemon package under the same release feature
      # set; doctests need no companion step because the crate disables them.
      - name: Test featureless kin-daemon
        run: cargo test -p kin-daemon --no-default-features --lib --tests --locked

  # Security audit moved to sast.yml (cargo-deny: advisories + licenses + bans + sources)

  coverage:
    name: Code Coverage
    # Not the critical path (the Windows jobs are longer), so gating this off
    # PRs costs no wall clock and reclaims ~23 min of billed compute per PR.
    # Coverage still runs on every push to main, so it still gates what lands.
    #
    # Off the merge queue for a stronger reason than cost. This is not a
    # required context, so the queue never waits for it: across seven sampled
    # landings the merge completed a median 34s after the last required check
    # while this job was still running, finishing up to 7.1 min PAST the merge.
    # A merge_group check-run that concludes after the merge lands on the exact
    # sha release-tag.yml sweeps, where a non-required failure is terminal even
    # though nothing gated on it. A job that never starts cannot conclude.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    # The heavy-runner switch; see `fast-gate-lint` for what it resolves to.
    runs-on: ${{ vars.KIN_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Verify kin cargo registry config
        # Same tracked config the check job verifies.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      - name: Cache cargo registry
        # Registry only, deliberately: tarpaulin's instrumented builds use their
        # own flags, so a cached target never fingerprint-matches. Measured on
        # main: a 4.62 GB target cache HIT left coverage at 24.2 min vs 23.5
        # cold. That is zero benefit, and its size (47% of the repo's 10 GB budget)
        # evicted the Windows release-build cache that does pay for itself.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tarpaulin-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: |
          if ! timeout 30m cargo tarpaulin --out xml --out stdout; then
            echo "::warning::Tarpaulin is currently non-blocking in CI for the public alpha."
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: firelock-ai/kin
          fail_ci_if_error: false

  # The public install proof is what caught v0.5.38, and it caught it on the
  # tag, after the version was cut and the archives were built and published,
  # because nothing before the tag ran it. These three jobs run that same
  # reusable proof against the binaries this pull request builds, so the break
  # is a red pull request instead of a burned tag.
  install-proof-pr-build:
    name: Install Proof (PR) Build
    needs: changes
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request' }}
    # The heavy-runner switch; see `fast-gate-lint` for what it resolves to.
    runs-on: ${{ vars.KIN_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release builds the Linux core against musl and links it static, so
      # one archive runs on every distribution. Building the same target here is
      # what makes these bytes the release's bytes rather than a near-miss whose
      # libc coupling the proof would never see.
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install the musl C toolchain
        run: scripts/ci-apt-install.sh musl-tools

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # FIR-2744, and see the note on the first cache step in this file.
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The build stamps its own source identity, and `kin bench-meta` reports
      # it to the proof, which refuses a dirty build. Assert the tree here so
      # that refusal names the cause instead of surfacing as an opaque
      # capability failure three jobs later.
      - name: Assert a clean source tree before compiling
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty" >&2
            echo "::error::install-proof build tree is not clean before compilation"
            exit 1
          fi

      - name: Build the release binaries this pull request would ship
        run: |
          cargo build --locked --release \
            --target x86_64-unknown-linux-musl -p kin-cli -p kin-daemon

      # Assembled exactly as the release assembles it, down to the archive name,
      # the single top-level directory, and the shasum-format sidecar, so the
      # installer takes its ordinary path over these bytes. kin-vfs and its shim
      # are absent on purpose: they are built from a separate repository at a
      # commit the release pins, and a pull request produces no such bytes.
      # The shape helper the release publishes with is what judges the result.
      - name: Package the release archive layout
        run: |
          set -euo pipefail
          artifact=kin-linux-x86_64
          stage="$RUNNER_TEMP/install-proof-pr"
          release=target/x86_64-unknown-linux-musl/release
          mkdir -p "$stage/$artifact"
          cp "$release/kin" "$release/kin-daemon" "$stage/$artifact/"
          tar czf "$stage/$artifact.tar.gz" -C "$stage" "$artifact"
          ( cd "$stage" && shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256" )
          ARCHIVE="$stage/$artifact.tar.gz" ARTIFACT="$artifact" node -e '
            const { execFileSync } = require("node:child_process");
            const { assertReleaseArchiveMemberPaths } = require("./scripts/release-archive-shape.cjs");
            const listing = execFileSync("tar", ["-tzf", process.env.ARCHIVE], { encoding: "utf8" })
              .split("\n")
              .filter((line) => line !== "");
            assertReleaseArchiveMemberPaths(listing, {
              artifact: process.env.ARTIFACT,
              target: "x86_64-unknown-linux-musl",
            });
          '
          # The proof binds installed bytes to a public release tag, its commit,
          # and the Cargo.lock at that commit. A pull request has no tag, so it
          # states the same three facts about itself and the proof binds to
          # those instead: the version the binaries stamp, the commit they were
          # compiled at, and the digest of the lockfile they were compiled with.
          "$stage/$artifact/kin" --version | awk '{print $2}' > "$stage/expected-version.txt"
          git rev-parse HEAD > "$stage/expected-commit.txt"
          sha256sum Cargo.lock | cut -d' ' -f1 > "$stage/expected-lock-sha.txt"
          # The proof runs with no checkout, so the installer it must exercise
          # travels with the archive.
          cp scripts/install.sh "$stage/install.sh"
          cat "$stage/expected-version.txt" "$stage/expected-commit.txt" \
            "$stage/expected-lock-sha.txt" "$stage/$artifact.tar.gz.sha256"

      - name: Upload the pull request release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-proof-pr-binaries
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/install-proof-pr/kin-linux-x86_64.tar.gz
            ${{ runner.temp }}/install-proof-pr/kin-linux-x86_64.tar.gz.sha256
            ${{ runner.temp }}/install-proof-pr/expected-version.txt
            ${{ runner.temp }}/install-proof-pr/expected-commit.txt
            ${{ runner.temp }}/install-proof-pr/expected-lock-sha.txt
            ${{ runner.temp }}/install-proof-pr/install.sh

  install-proof-pr:
    name: Install Proof (PR)
    needs: [changes, install-proof-pr-build]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.docs_only != 'true'
      && github.event_name != 'pull_request'
      && needs.install-proof-pr-build.result == 'success' }}
    uses: ./.github/workflows/install-proof.yml
    with:
      release_tag: ""
      expected_vfs_commit: ""
      local_artifact: install-proof-pr-binaries
    permissions:
      contents: read
      attestations: read

  # A reusable-workflow call publishes its checks as `<caller> / <leg>`, and a
  # caller that skips publishes no such check at all, so those names cannot be
  # the required context: a documentation-only pull request would wait forever
  # on a check nothing will ever report. This job always reports, under one
  # stable name, and is the context to require.
  install-proof-pr-gate:
    name: Install Proof (PR) Gate
    needs: [changes, install-proof-pr-build, install-proof-pr]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the pull request install proof
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          BUILD_RESULT: ${{ needs.install-proof-pr-build.result }}
          PROOF_RESULT: ${{ needs.install-proof-pr.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "the install proof runs in the merge queue and on every main commit;"
            echo "admission is the fast gate, and release-tag.yml still refuses a sha"
            echo "whose required checks are not green"
            exit 0
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "documentation-only diff: no binaries changed, so the install proof has nothing to install"
            exit 0
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::install proof binaries did not build ($BUILD_RESULT); the pull request install proof never ran"
            exit 1
          fi
          if [ "$PROOF_RESULT" != "success" ]; then
            echo "::error::the install proof failed against this pull request's binaries ($PROOF_RESULT); the same proof gates every release tag"
            exit 1
          fi
          echo "install proof passed against this pull request's binaries"
