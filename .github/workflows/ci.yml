name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  repository_dispatch:
    types: [dependency-updated]

permissions:
  contents: read

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` still supersedes an older
# push exactly as before. On main it gives each commit its own group. That
# matters because `cancel-in-progress: false` does not mean "never cancel":
# GitHub holds at most one PENDING run per group and cancels the older one, so
# consecutive pushes to main both serialised behind each other and deleted each
# other. Four main-branch pushes in a 24h sample were cancelled having started
# zero jobs, and release-tag.yml requires push-event provenance for every
# required check, which left those four landed commits permanently unmintable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the enforcing gate for ALL steps (clippy, build, test).
  # The ArtifactId migration has landed, so the `ArtifactId::from_path` /
  # `from_file_id` deprecation is now enforced: graph-assigned IDs resolve via the
  # `artifact_index`, and the few genuinely snapshot-less call sites carry local
  # `#[allow(deprecated)]` justifications. (clippy::* lints stay on the clippy
  # command: plain rustc rejects the `clippy` tool namespace.)
  RUSTFLAGS: "-D warnings"

jobs:
  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while IFS= read -r commit; do
            body="$(git log -1 --format=%B "$commit")"
            if ! grep -Eq '^Signed-off-by: .+ <[^>]+>$' <<<"$body"; then
              echo "::error title=Missing DCO sign-off::Commit $commit is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list "${base}..${head}")
          exit "$missing"

  npm-launchers:
    name: npm launcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test @kinlab/kin (canonical launcher)
        run: npm test --prefix ./packages/kin && npm run lint --prefix ./packages/kin

      - name: Test @kinlab/kin-mcp (compatibility wrapper)
        run: npm test --prefix ./packages/kin-mcp && npm run lint --prefix ./packages/kin-mcp

      - name: Test release ordering and npm provenance policy
        run: |
          python3 ./scripts/test-release-workflow-authority.py
          python3 ./scripts/test_install_optional_vfs.py
          python3 ./scripts/test_installer_parity.py
          # Every install surface builds a release asset name; the release
          # publishes a fixed list of them. Nothing compared the two lists, and
          # a Windows disagreement 404'd through every release to date. The
          # falsifier runs beside the guard because a guard nobody has seen fail
          # is not evidence that it can.
          python3 ./scripts/verify-installer-release-assets.py
          python3 ./scripts/falsify-installer-release-assets.py
          # Resolving the archive name is only half an install. Once it lands,
          # the installer names the binaries inside it, and those names carry a
          # platform suffix the installer did not account for, so a complete
          # Windows archive aborted the install after the download had already
          # been fetched and verified.
          python3 ./scripts/verify-installer-archive-binaries.py
          python3 ./scripts/falsify-installer-archive-binaries.py
          python3 ./scripts/test-npm-automatic-release.py
          python3 ./scripts/test-verify-npm-release.py
          node --test \
            ./scripts/check-release-version.test.mjs \
            ./scripts/extract-release-notes.test.mjs \
            ./scripts/prepare-release.test.mjs \
            ./scripts/read-update-build-identity.test.cjs \
            ./scripts/release-archive-shape.test.cjs \
            ./scripts/release-order.test.mjs \
            ./scripts/release-hold-alarm.test.mjs \
            ./scripts/verify-npm-attestation.test.mjs
          node --check ./scripts/read-update-build-identity.cjs
          node --check ./scripts/check-release-version.mjs
          node --check ./scripts/prepare-release.mjs
          node --check ./scripts/release-order.mjs
          node --check ./scripts/release-hold-alarm.mjs
          node --check ./scripts/verify-npm-attestation.mjs
          bash -n ./scripts/publish-npm-release.sh
          bash -n ./scripts/verify-npm-release.sh
          bash -n ./scripts/assert-windows-init-contract.sh
          bash -n ./scripts/windows-authority-legs.sh
          bash -n ./scripts/verify-base-image-pins.sh
          # install.sh is the public installer users pipe straight into a shell,
          # and the one with no pull-request syntax check. Its only `sh -n` runs
          # in publish-release-installers.yml, which triggers on `workflow_run`
          # after Release completes, so it cannot fail until a tag exists and a
          # tag cannot be un-cut. `#!/usr/bin/env sh` is why this is `sh -n` and
          # not the `bash -n` used for the bash-only scripts above.
          #
          # install.ps1 needs no line here. scripts/test-install-checksum.ps1
          # parses it on every pull request in windows-authority-tests, under
          # both PowerShell 7 and Windows PowerShell 5.1, and that job is held
          # unconditional by the release-authority test.
          sh -n ./scripts/install.sh

  windows-authority-tests:
    name: Windows authority tests
    # Split out of the installer job: the debug test compile and the release
    # build share no artifacts (separate target profiles), so serialising them
    # only added wall clock. They run concurrently now.
    #
    # This job and the two Windows authority jobs below stay on every event on
    # purpose, and the authority test enforces that none of them carries a
    # job-level `if:`. Together they are the merge group's only proof of the
    # native Windows admission contract, so taking them off the queue to reclaim
    # runner minutes would trade a reviewable pre-landing signal for a required
    # context that first fails on main.
    #
    # The legs were split three ways by compilation unit because one job could
    # not finish inside any cap worth setting. Across 119 sampled runs, 32 of
    # the 106 allowed to finish were destroyed by the 60-minute limit, and on
    # pull requests that was half of them. The 70 survivors averaged 52.6
    # minutes and reached 59.7, so the sample is censored by the cap itself and
    # the real mean is near 57. This job keeps the admission contract, both npm
    # surfaces, and the library legs that build no test binary; the CLI and
    # runtime jobs below take the rest. Each compiles one kind of artifact, so
    # none waits on another's build.
    #
    # The binary build, the admission assertion, and the npm first-run proof run
    # ahead of the library legs rather than after them. They used to be the last
    # three steps, which is exactly where every cap-out landed, so an admission
    # regression could not be reported until fifty minutes of unrelated tests
    # had passed first.
    runs-on: windows-latest
    # This is a backstop, not the budget. The step budgets below are the real
    # caps, and they sum to less than this on purpose. A step that overruns its
    # budget FAILS, and a failed step names itself on the check. A job that hits
    # its own cap is CANCELLED, and a cancellation on a check no ruleset
    # requires says nothing at all: every sampled cap-out carried green
    # substantive steps and was found by reading run durations rather than by
    # anything going red. Keeping the sum under this number is what makes the
    # loud failure arrive first whichever step is the slow one, and the
    # authority test holds that arithmetic.
    timeout-minutes: 80
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Test installer warning and checksum contract (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install-checksum.ps1

      - name: Test installer warning and checksum contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-install-checksum.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test both public npm surfaces on native Windows
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix ./packages/kin
          npm run lint --prefix ./packages/kin
          npm test --prefix ./packages/kin-mcp
          npm run lint --prefix ./packages/kin-mcp
          node --check ./scripts/prove-windows-npm-first-run.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      # Restore on every event, save only from main. A cache entry written from
      # a pull request ref is readable by later runs on that SAME ref and by
      # nothing else, so the old configuration warmed pushes 2..N of one pull
      # request while spending the shared repository cache budget and evicting
      # main's entry, which is why no reusable cargo cache existed on
      # refs/heads/main at all. Saving only from main trades that intra-branch
      # warm start for one entry every pull request restores from push 1.
      # The tradeoff is real and measured: see the trusted-ref note in
      # scripts/test-release-workflow-authority.py.
      #
      # `cache-on-failure` is what stops a bad run from compounding into the
      # next one. The save is a post step and rust-cache gates it on
      # `success() || env.CACHE_ON_FAILURE == 'true'`, so at the default every
      # run that does not end green discards everything it compiled. That is not
      # theoretical: all four sampled red runs and every one of the 32 sampled
      # cap-outs skipped the save, which is why a slow afternoon left each
      # following run colder than the one before it. Setting this makes the
      # condition unconditional, so the artifacts survive a red run or a
      # cancelled one.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The three steps below are the pull-request half of the Windows admission
      # contract. The installer leg asserts the same behavior against the
      # release binary, but it runs only on the landing push, so on its own it
      # can report an admission change no earlier than a required check
      # failing on a release commit. This leg builds without default features
      # and the installer leg builds with them, so the shared script asserts
      # the same refusals against both feature sets of the command.
      - name: Build the Windows binaries the admission and npm assertions drive
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-pc-windows-msvc \
            -p kin-cli -p kin-daemon --no-default-features \
            --bin kin --bin kin-daemon

      - name: Assert the Windows admission contract
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash ./scripts/assert-windows-init-contract.sh \
            "$GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/debug/kin.exe" \
            "$RUNNER_TEMP/kin-windows-admission"

      - name: Prove both npm surfaces from built Windows binaries
        shell: bash
        timeout-minutes: 10
        env:
          KIN_NPM_PROOF_KIN_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/debug/kin.exe
          KIN_NPM_PROOF_DAEMON_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/debug/kin-daemon.exe
        run: |
          set -euo pipefail
          node ./scripts/prove-windows-npm-first-run.mjs

      # Library legs only: every invocation here compiles a `--lib` test binary
      # or nothing at all. The kin-cli unit legs and the integration-test
      # binaries live in the two jobs below because they are the expensive
      # compilation units, and keeping them here is what made one job unable to
      # finish inside any cap worth setting.
      - name: Compile and run native Windows core authority tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_nonempty_target "kin-registry library" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-registry --lib
          run_required_filter "kin-core registry authority" "registry::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          # Publishing repository config is the transaction `kin init` stops at
          # if it is wrong, and the Windows arm shares no code with the Unix one
          # below the namespace validation. These cases are the contract both
          # arms answer to, so they run here rather than being compiled here.
          run_required_filter "kin-core capability-owned config replacement" \
            "config::capability_owned_config_replacement_tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          # What the retained directory handle excludes is a property of
          # Windows' sharing rules, not of Kin's code, so it can only be
          # settled here. The module doc states the exclusion; these cases are
          # what entitle it to.
          run_required_filter "retained config capability exclusion" \
            "config::windows::capability_exclusion_tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          run_nonempty_target "kin-git library" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-git --lib
          # Stays in this job rather than moving to the CLI one: the npm proof
          # above asserts that the compatibility wrapper finds its sibling
          # daemon, and this is the unit case for the discovery it depends on.
          # Separating them would let one job claim a runtime behavior whose
          # only unit proof lives in a job that can go red on its own.
          run_required_exact "MCP Windows sibling daemon discovery" \
            "daemon_delegate::tests::windows_daemon_discovery_finds_platform_sibling_without_path" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-mcp --no-default-features --lib
          # Admission itself, in process. `kin init` is the transaction the
          # contract script drives end to end, but that script reports one line
          # naming a path that two different components can report. These cases
          # stage, publish, seal, and promote a repository through the same code
          # the binary does, so a refusal names a test and a line instead of a
          # path. Until this existed, `init.rs` had no native Windows coverage
          # at all, which is why a refusal in it could only be seen by a
          # thirty-minute job that then could not say which call refused.
          run_required_filter "kin-core repository initialization" \
            "init::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-core --lib
          run_required_filter "managed-install spawn fence" \
            "managed_spawn_fence" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon-spawn --lib
          # The one clause of the spawn contract only Windows can answer. Unix
          # gets handle release from CLOEXEC, so this case passes there whether
          # or not the code that provides it on Windows exists, and a host run
          # of it is not evidence about Windows. Same compilation unit as the
          # fence leg above, so it costs a run rather than a build.
          run_required_exact "detached spawn releases the caller's stdio" \
            "tests::a_detached_spawn_does_not_hold_the_callers_stdout_open" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon-spawn --lib
          run_required_filter "daemon shutdown identity" "shutdown" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --lib

  windows-authority-cli-tests:
    name: Windows authority CLI tests
    # Every leg here is `-p kin-cli --no-default-features --lib`, which is one
    # compilation unit and the single most expensive one in the Windows set.
    # Splitting on that boundary is why the three jobs do not duplicate each
    # other's compile: this one builds the CLI unit-test binary, the job above
    # builds the library ones, and the job below builds the integration ones.
    #
    # Full uninstall owns native Windows process handles, directory identity,
    # and deferred self-deletion. Compiling these paths on a non-Windows host
    # cannot prove their runtime contract, so they stay on a permanent native
    # Windows leg.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Compile and run native Windows CLI authority tests
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_required_filter "kin-cli Windows modules" "windows" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "full managed uninstall safety" \
            "commands::setup::tests::full_uninstall" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native full managed uninstall lifecycle" \
            "commands::setup::tests::native_full_uninstall_runtime_executes_retirement_and_user_path_cleanup" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native managed-daemon ownership scan" \
            "commands::daemon::tests::native_managed_daemon_scan_canonicalizes_and_rejects_traversal" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native install authority contention and crash recovery" \
            "commands::update::tests::native_install_authority_contends_across_aliases_and_recovers_after_crash" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_exact "native managed-daemon spawn admission" \
            "commands::update::tests::managed_daemon_spawn_lease_blocks_uninstall_authority_until_readiness" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "bounded CLI test subprocesses" \
            "commands::test_subprocess::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib
          run_required_filter "bounded daemon probe subprocesses" \
            "daemon_client::probe_process::tests" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --lib

  windows-authority-runtime-tests:
    name: Windows authority runtime tests
    # The integration-test binaries: real daemons, real process trees, real
    # containment. These are the legs that spend their time running rather than
    # compiling, which is why they belong away from the unit legs instead of
    # queued behind them.
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `daemon_status_and_stop_lifecycle` drives a real daemon, and the harness
      # takes it from the `kin-daemon` beside the `kin` binary the test was
      # built with. Every other `kin-daemon` invocation in this job compiles a
      # test binary, which writes no `kin-daemon.exe`, so nothing else puts one
      # in the msvc directory before the test reads it. The harness covers a
      # missing daemon by rebuilding one, which lands beside the test only when
      # it carries the same `--target`, so a leg that omits this build depends
      # on that rebuild rather than on its own inputs. The feature set matches
      # the binary build in the admission job, so both produce one artifact.
      - name: Build the sibling Windows daemon the authority tests drive
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --bin kin-daemon

      - name: Compile and run native Windows runtime authority tests
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          source ./scripts/windows-authority-legs.sh

          run_required_target "daemon status and stop lifecycle" \
            "daemon_status_and_stop_lifecycle" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test daemon_stop
          run_required_target "spawned-child Windows authority ordering" \
            "spawned_child_observes_case_insensitive_authority_order" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test windows_authority_order
          run_required_target "isolated runtime process-tree containment" \
            "dropping_isolated_runtime_terminates_a_late_descendant" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test daemon_runtime_containment
          run_required_exact "direct daemon-child containment" \
            "dropping_a_direct_daemon_child_terminates_its_containment" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          run_required_exact "late daemon-descendant containment" \
            "dropping_containment_terminates_a_late_descendant" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          run_required_filter "daemon isolation support" "common::daemon_isolation" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon --no-default-features --test port_handshake
          compile_required_target "durable merge resolution containment compile" \
            "concurrent_resolutions_from_one_view_leave_one_winner" \
            --locked --target x86_64-pc-windows-msvc \
            -p kin-cli --no-default-features --test repository_merge_resolution

  windows-installer:
    # Renamed from "Windows installer + vector-free release build" when native
    # vector search shipped on Windows. The name is not decoration: release-tag.yml
    # resolves this exact string out of REQUIRED_CHECKS to decide whether Windows
    # evidence exists for a release sha, so a name still claiming "vector-free"
    # would be the mint's own authority asserting the opposite of what it built.
    name: Windows installer + vector release build
    needs: changes
    # Deliberately off the pull-request path. This leg cold-builds the whole
    # dependency graph in the release profile for x86_64-pc-windows-msvc and
    # measured 20 to 25 minutes per round, longer than any other job, so it set
    # the floor for every land-and-iterate cycle. It now runs on each push to
    # main, which is exactly the commit release proof reads: release-tag.yml
    # names this check in REQUIRED_CHECKS and refuses to mint a tag unless it is
    # present and green on the release sha. On a pull request the job reports
    # skipped, which satisfies the required context the same way the
    # documentation-only path already relies on.
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && github.event_name != 'merge_group'
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve tracked bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Test exact archive checksum selection (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install-checksum.ps1

      - name: Test exact archive checksum selection (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-install-checksum.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ runner.temp }}/sccache
          # Cache key renamed with the feature set. The vectorless key indexed a
          # dependency graph with no ndarray, tokenizers, hnsw or onig in it, so
          # restoring from it would warm almost nothing and would report a hit
          # while doing so.
          key: windows-vector-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-vector-cargo-

      # Windows ships native vector search, so this asserts the feature graph in
      # both directions rather than only forbidding features. `vector` and
      # `embeddings` must be reachable, or the leg would silently certify a
      # degraded build; `metal` and `accelerate` must not be, because those are
      # macOS-only backends whose activation lives in a
      # `cfg(target_os = "macos")` dependency block and must never unify in here.
      #
      # `grep -c` rather than `grep -q`: under `pipefail` a `-q` match closes the
      # pipe early and the SIGPIPE fails the step, which reads exactly like the
      # feature being absent. Reading a file cannot invert the guard that way.
      - name: Assert the Windows feature graph
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --target x86_64-pc-windows-msvc \
            -p kin-daemon -e features -i kin-db \
            | tee "$RUNNER_TEMP/kin-db-feature-tree.txt"
          for required in vector embeddings; do
            if [ "$(grep -Ec "kin-db feature \"${required}\"" \
              "$RUNNER_TEMP/kin-db-feature-tree.txt")" -eq 0 ]; then
              echo "::error::Windows release build is missing kin-db feature ${required}"
              exit 1
            fi
          done
          for forbidden in metal accelerate; do
            if [ "$(grep -Ec "kin-db feature \"${forbidden}\"" \
              "$RUNNER_TEMP/kin-db-feature-tree.txt")" -ne 0 ]; then
              echo "::error::Windows build pulled the macOS-only kin-db feature ${forbidden}"
              exit 1
            fi
          done

      - name: Build Windows release binaries with vector features
        shell: bash
        env:
          # Compile cache keyed per crate, so a Cargo.lock change warm-starts
          # from compiled dependencies instead of a cold tree. The cache lives
          # OUTSIDE the workspace: an untracked directory inside it reads as a
          # dirty checkout, and the provenance step then correctly refuses to
          # certify the build (which is exactly how the first attempt failed).
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc \
            -p kin-cli -p kin-daemon
          sccache --show-stats

      - name: Verify Windows build provenance and feature set
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/x86_64-pc-windows-msvc/release"
          "$bin_dir/kin.exe" --version
          "$bin_dir/kin-daemon.exe" --version
          "$bin_dir/kin.exe" bench-meta --json > "$RUNNER_TEMP/kin-build-meta.json"
          "$bin_dir/kin.exe" registry authority --json > "$RUNNER_TEMP/kin-registry-authority.json"
          if "$bin_dir/kin.exe" registry authority --fix > /dev/null 2>&1; then
            echo "::error::Windows registry authority --fix must fail as unsupported"
            exit 1
          fi
          EXPECTED_SHA="$(git rev-parse HEAD)" node <<'NODE'
          const childProcess = require("child_process");
          const crypto = require("crypto");
          const fs = require("fs");
          const meta = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/kin-build-meta.json`, "utf8"));
          const authority = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/kin-registry-authority.json`, "utf8"));
          if (authority.checks?.length !== 1 || authority.checks[0]?.state !== "unsupported") {
            throw new Error("Windows registry authority must report exactly one unsupported capability check");
          }
          if (meta.kin_commit !== process.env.EXPECTED_SHA || meta.kin_dirty !== false || meta.kin_source_known !== true) {
            throw new Error("Windows release build did not prove a clean, known checkout");
          }
          const trackedLock = childProcess.execFileSync(
            "git",
            ["cat-file", "blob", "HEAD:Cargo.lock"]
          );
          const workingLock = fs.readFileSync("Cargo.lock");
          if (!workingLock.equals(trackedLock)) {
            throw new Error("Windows Cargo.lock working bytes do not match the tracked Git blob");
          }
          const expectedLock = crypto.createHash("sha256").update(trackedLock).digest("hex");
          if (meta.dependency_provenance !== expectedLock) {
            throw new Error(
              `Windows embedded Cargo.lock provenance ${meta.dependency_provenance ?? "missing"} ` +
              `does not match tracked Git bytes ${expectedLock}`
            );
          }
          // The shipped binary must report the features it was built with, not
          // merely resolve them in the dependency graph. `metal` tracks the
          // compiled backend rather than the marker cargo feature
          // (bench_meta.rs `metal_active()` is `cfg!(target_os = "macos")`), so
          // a correct Windows build reports vector and embeddings and no metal.
          for (const feature of ["vector", "embeddings"]) {
            if (!meta.feature_flags.includes(feature)) {
              throw new Error(`Windows release build did not enable ${feature}`);
            }
          }
          if (meta.feature_flags.includes("metal")) {
            throw new Error("Windows release build reported the macOS-only metal backend");
          }
          NODE

      # Both admission boundaries still refuse on Windows, and the shared
      # script is the only statement of what they refuse. The pull-request
      # authority job runs the same assertions against a debug binary, so an
      # admission change that moves the refusal turns a pull request red
      # instead of first turning a release commit red here. Daemon reopen
      # assertions live in the Linux daemon smoke until the Windows ports land.
      - name: Assert the Windows admission contract
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/assert-windows-init-contract.sh \
            "$GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/release/kin.exe" \
            "$RUNNER_TEMP/kin-windows-admission"

  # Classify the PR diff so documentation-only and workflow-only changes can
  # satisfy the heavy required checks without a toolchain or registry
  # dependency. Fail closed: any classifier failure or non-pull_request event
  # reports docs_only=false and every gated job runs. ci.yml itself never
  # qualifies for its own fast path.
  changes:
    name: Classify diff scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        # This step gates release-critical jobs. Pin its process startup and run
        # Git with an empty environment rather than inheriting mutable authority.
        shell: /usr/bin/bash --noprofile --norc -p -e -u -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
          BASH_ENV: ""
          ENV: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: /dev/null
          LD_PRELOAD: ""
          WORKSPACE: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # env -i drops inherited GIT_DIR/GIT_WORK_TREE/GIT_INDEX_FILE,
            # GIT_CONFIG_*, object/replace, executable, and diff authority.
            changed="$(
              /usr/bin/env -i \
                HOME=/dev/null \
                PATH=/usr/bin:/bin \
                LC_ALL=C \
                GIT_CONFIG_NOSYSTEM=1 \
                GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_GLOBAL=/dev/null \
                GIT_CONFIG_COUNT=0 \
                GIT_ATTR_NOSYSTEM=1 \
                GIT_PAGER=cat \
                GIT_TERMINAL_PROMPT=0 \
                /usr/bin/git \
                  --no-pager \
                  --no-replace-objects \
                  --no-lazy-fetch \
                  --no-optional-locks \
                  --literal-pathspecs \
                  --git-dir="$WORKSPACE/.git" \
                  --work-tree="$WORKSPACE" \
                  -c core.attributesFile=/dev/null \
                  -c core.fsmonitor=false \
                  -c diff.external= \
                  -c diff.renames=false \
                  -c diff.ignoreSubmodules=none \
                  diff \
                  --no-ext-diff \
                  --no-textconv \
                  --no-renames \
                  --ignore-submodules=none \
                  --submodule=short \
                  --name-only \
                  "$BASE_SHA...$HEAD_SHA" \
                  --
            )"
            if [ -n "$changed" ]; then
              docs_only=true
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml) docs_only=false; break ;;
                  *.md | docs/*) ;;
                  .github/workflows/*) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$changed"
            fi
            printf '%s\n' "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # A skipped matrix job never expands, so the required per-platform contexts
  # would go missing instead of reporting skipped. This stub carries the same
  # display name and matrix as the real job and succeeds instantly on
  # documentation-only diffs, producing the exact required context names. The
  # two jobs' conditions are mutually exclusive.
  check-docs-only:
    name: Check & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Report the documentation-only fast path
        run: echo "documentation-only diff; build and test validation not applicable"

  check:
    name: Check & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The all-features clippy/build/test sequence can otherwise retain more
    # than a hosted runner's available disk in incremental objects and debug
    # symbols. Keep validation semantics identical while bounding the target
    # directory so tests still have space for their temporary fixtures.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The README states how many languages Kin parses in its
      # "Language | Extensions" table, and kin-parser's AdapterRegistry::new()
      # decides it. Nothing else holds the two together, so an adapter added or
      # removed without the table edited to match publishes a stale number.
      # This job is the one that sees every adapter change: a diff touching
      # crates/ is never classified documentation-only, so it never takes the
      # inert fast path.
      - name: Check the README language count against the adapter registry
        shell: bash
        run: |
          set -euo pipefail

          readme="README.md"
          registry="crates/kin-parser/src/languages/mod.rs"

          # The adapter registry is the real count. It is the set the README
          # itself points at, and unlike the tree-sitter Cargo dependencies it
          # cannot be inflated by a grammar-adjacent crate that is no adapter.
          derived="$(awk '
            /adapters: vec!\[/           { inblock = 1; next }
            inblock && /^[[:space:]]*\]/ { inblock = 0; next }
            inblock && /Box::new\(/      { n++ }
            END                          { print n + 0 }
          ' "$registry")"

          if [ "$derived" -lt 1 ]; then
            echo "::error::language count: no adapters found in $registry"
            echo "The AdapterRegistry::new() 'adapters: vec![...]' block moved or changed" >&2
            echo "shape, so the real language count can no longer be derived and the" >&2
            echo "README number is now unchecked. Teach this step in" >&2
            echo ".github/workflows/ci.yml to read the registry's new form." >&2
            exit 1
          fi

          documented="$(awk '
            /^\|[[:space:]]*Language[[:space:]]*\|[[:space:]]*Extensions[[:space:]]*\|/ {
              found = 1; intable = 1; next
            }
            intable && /^\|[[:space:]]*-+[[:space:]]*\|/ { next }
            intable && /^\|/                             { n++; next }
            intable                                      { intable = 0 }
            END { if (found) print n + 0; else print "MISSING" }
          ' "$readme")"

          if [ "$documented" = "MISSING" ]; then
            echo "::error::language count: the '| Language | Extensions |' table is gone from $readme"
            echo "That table is where $readme states how many languages Kin parses, and" >&2
            echo "this step reads it to keep the number honest. It was reworded, moved, or" >&2
            echo "removed, so the count is now unchecked. Point this step in" >&2
            echo ".github/workflows/ci.yml at wherever the README now states the count." >&2
            exit 1
          fi

          if [ "$documented" -ne "$derived" ]; then
            echo "::error::language count: $readme says $documented, the adapter registry says $derived"
            echo "  $readme, the 'Language | Extensions' table: $documented languages" >&2
            echo "  $registry, AdapterRegistry::new(): $derived adapters" >&2
            echo "Whichever is wrong, fix it so both state the same number." >&2
            exit 1
          fi

          # A prose count is optional, because the table above is the anchor
          # that always runs. When a sentence does claim a number it has to
          # agree with the registry too.
          prose_stale=0
          while IFS= read -r phrase; do
            [ -n "$phrase" ] || continue
            stated="$(printf '%s' "$phrase" | tr -dc '0-9')"
            if [ "$stated" -ne "$derived" ]; then
              echo "::error::language count: $readme prose says $stated, the adapter registry says $derived"
              echo "  $readme says: \"$phrase\"" >&2
              echo "  $registry, AdapterRegistry::new(): $derived adapters" >&2
              prose_stale=1
            fi
          done <<EOF
          $(grep -Eio '(covering|covers|support|supports|supporting|spanning|across)[[:space:]]+[0-9]+([[:space:]]+[a-z]+)?[[:space:]]+languages?' "$readme" || true)
          EOF

          if [ "$prose_stale" -ne 0 ]; then
            echo "Whichever is wrong, fix it so both state the same number." >&2
            exit 1
          fi

          echo "README and the adapter registry agree on $derived languages."

      - name: Install runtime guard tools
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get update
                sudo apt-get install --yes ripgrep
                ;;
              macOS)
                brew install ripgrep
                ;;
              *)
                echo "::error::unsupported runner OS for ripgrep install: $RUNNER_OS"
                exit 1
                ;;
            esac
          fi
          command -v rg

      - name: Validate installer checksum fixtures
        run: python3 scripts/test-install-checksum.py

      # A gate whose assertion lost its call site still exits 0, so passing the
      # suites this polices proves nothing until this step confirms every check
      # in them is still reachable and still runs on pull requests. Ordering is
      # not what makes that true and is not claimed: this step precedes the
      # other two within this job, but test-release-workflow-authority.py also
      # runs in the npm-launchers job, which shares no dependency with this one,
      # so the two are unordered. Either way a red gate reds the pull request.
      # scripts/test-release-workflow-authority.py asserts this step exists, so
      # the pair cannot be half-removed.
      - name: Validate that every release gate assertion still runs
        run: python3 scripts/test-assertion-reachability.py

      - name: Validate mandatory Homebrew release outcome gate
        run: python3 scripts/test-homebrew-release-gate.py

      - name: Validate automatic release policy
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test-release-workflow-authority.py
          node --test \
            scripts/check-kin-vfs-compat.test.mjs \
            scripts/check-release-version.test.mjs \
            scripts/extract-release-notes.test.mjs \
            scripts/prepare-release.test.mjs \
            scripts/release-archive-shape.test.cjs
          node --check scripts/check-release-version.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/release-intent.mjs

      # release.yml refuses a release whose Kin lock resolves a different
      # kin-vfs-core than the pinned kin-vfs checkout builds, and that
      # comparison ran nowhere else: a pull request moving the Kin lock passed
      # every required context and failed only after the tag existed, where the
      # tag has already resolved its own workflows. Run the same comparison
      # here, against the pin read out of release.yml, so the answer arrives
      # while a commit can still change it.
      - name: Verify Kin/kin-vfs compatibility at the pinned release input
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-kin-vfs-compat.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16
        with:
          components: clippy, rustfmt

      - name: Verify kin cargo registry config
        # kin-* crates resolve from the Kin sparse registry ([registries.kin]).
        # The temporary git [patch.kin] pins were dropped once all kin-* crates
        # were published to the registry; CI asserts they stay gone.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      # Same trusted-ref scoping as the Windows authority job: restore always,
      # save only from main. This is the pull-request critical path, so a warm
      # dependency graph here is what a round actually costs.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt -- --check

      # Two guards, two jobs. The Python checker walks every crate and carries
      # the owned, dated, existence-validated allowlist. The shell guard is a
      # dependency-free check on the ten core answer modules and is the one the
      # kin-cli unit test drives. Both run, and the third step falsifies them,
      # because a guard that has never been shown to fail proves nothing.
      - name: Check Zero File-Search Invariant
        run: python3 scripts/verify-zero-file-search.py

      - name: Check Zero File-Search Invariant (answer modules)
        run: bash scripts/zero_file_search_guard.sh

      - name: Falsify Zero File-Search guards
        # Both guards above still run on both platforms. Only this meta-proof,
        # that the guards are not vacuous, is single-legged. Falsifiability is
        # a property of the guards' logic, and neither the Python checker nor
        # the shell guard branches on platform: they carry no `sys.platform` /
        # `os.name` / `darwin` / `linux` test and no GNU-only shell construct.
        # The harness is self-contained, poisoning a `mktemp -d` copy of
        # `crates` and `scripts` rather than the checkout, so skipping it
        # leaves no state for later steps and does not reorder them. It costs
        # 5.9 min of the macOS leg, which is the merge queue's critical path.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          poisoned="$(mktemp -d)"
          trap 'rm -rf "$poisoned"' EXIT
          cp -a crates scripts "$poisoned/"

          fail_expected() {
            local label="$1" want="$2"; shift 2
            local out rc=0
            out="$("$@" 2>&1)" || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "::error::falsification failed. $label passed when it should have failed"; echo "$out"; exit 1
            fi
            if ! grep -qF "$want" <<<"$out"; then
              echo "::error::falsification failed. $label failed but never named '$want'"
              echo "$out"; exit 1
            fi
            echo "  ok: $label"
          }

          # [1/3] Every answer module, poisoned at several sites including
          # end-of-file, against both guards. This step used to plant one probe
          # in one module, at the top of a file it had truncated to three lines.
          # That proved the guards worked at that spot and nowhere else, and it
          # passed for as long as a comment-tracking desync left the last third
          # of the largest answer module unscanned.
          #
          # The harness also probes the two ways an EXEMPTION can lose scope
          # rather than a pattern losing a site: a brace inside a literal or a
          # comment planted in an allowlisted function body, which a raw brace
          # counter reads as an unclosed body and silently excuses to end of
          # file, and a counted pin paid for by a rename in test code the guard
          # never reads. Both are the same failure as [2/3] reached through the
          # exemption mechanism instead of a stale pin.
          echo "[1/3] every answer module, every probe site, both guards"
          python3 scripts/falsify-zero-file-search.py "$poisoned"

          # [2/3] A broken pin must not hide the scan. Allowlist validation used
          # to exit before the walk, so a stale pin reported itself and nothing
          # else; two stale pins once masked ten real violations in a newly
          # covered crate, which made a red allowlist useless as a measure of
          # remaining work. Break one pin's count deliberately and require the
          # run to report the violations that pin was masking AS WELL AS the pin
          # error. Runs before [3/3], which mutates the allowlist irreversibly.
          echo "[2/3] a broken pin must not hide the scan"
          python3 - "$poisoned/scripts/zero-file-search-allowlist.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          target = "crates/kin-daemon/src/repository_branch.rs"
          for entry in data["allowlist"]:
              if entry["file"] == target:
                  entry["allow_match"] = [{"expr": ".metadata()", "count": 999}]
                  break
          else:
              raise SystemExit(f"::error::falsification setup: no pin on {target}")
          json.dump(data, open(path, "w"))
          PY
          out=""; rc=0
          out="$(python3 "$poisoned/scripts/verify-zero-file-search.py" "$poisoned" 2>&1)" || rc=$?
          for want in \
            "[VIOLATION] crates/kin-daemon/src/repository_branch.rs" \
            "want 999" \
            "Scanned "; do
            if ! grep -qF "$want" <<<"$out"; then
              echo "::error::falsification failed: a broken pin hid the scan (missing '$want')"
              echo "$out"; exit 1
            fi
          done
          if [[ $rc -eq 0 ]]; then
            echo "::error::falsification failed: a broken pin did not fail the guard"
            echo "$out"; exit 1
          fi
          echo "  ok: broken pin reported its masked violations and still failed"
          # Restore the real policy; [3/3] starts from an unbroken allowlist.
          cp scripts/zero-file-search-allowlist.json "$poisoned/scripts/"

          echo "[3/3] allowlist entry naming a path that no longer exists"
          python3 - "$poisoned/scripts/zero-file-search-allowlist.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["allowlist"].append({
              "file": "crates/kin-core/src/text_refs.rs",
              "reason": "resurrected stale exemption",
              "owner": "ci-falsification",
              "expiration": "2026-12-31",
          })
          json.dump(data, open(path, "w"))
          PY
          fail_expected "python guard" "text_refs.rs" python3 "$poisoned/scripts/verify-zero-file-search.py" "$poisoned"

          echo "Zero File-Search guards are falsifiable: every probe was caught."

      # Deep history is a PROJECTION re-authored at ingest, not a stored fact:
      # a merge change's entity/relation deltas are discarded and recomputed by
      # the replay algorithm. Editing that algorithm changes what Kin reports
      # about the past, and HYDRATION_SEMANTICS_VERSION is the declared dial for
      # it. Nothing coupled the two, so the dial sat unchanged across the
      # releases that rewrote replay. This pins the replay surface by digest, so
      # an edit cannot ship without an explicit, reviewed manifest update.
      - name: Check Hydration Replay Semantics
        run: python3 scripts/verify-hydration-semantics.py

      - name: Falsify Hydration Replay Semantics guard
        run: |
          set -euo pipefail
          poisoned="$(mktemp -d)"
          trap 'rm -rf "$poisoned"' EXIT
          cp -a crates scripts "$poisoned/"
          # The REAL guard and manifest run against the poisoned copy: the
          # manifest is policy, so letting the copy supply it would falsify
          # nothing.
          python3 scripts/falsify-hydration-semantics.py "$poisoned"

      # TEMPORARY debt allow-list; burn entries down and delete each allow once its
      # lint is clean. No additions without lead sign-off.
      # Enumerated from `cargo clippy --all-targets --all-features` on main against
      # the CI toolchain (rustc/clippy 1.96.0, dtolnay rust-toolchain@stable):
      # 45 distinct clippy lints (the 1.96 bump from 1.94 added collapsible_match,
      # manual_checked_ops, useless_conversion). The `--` keeps these allows AFTER the
      # RUSTFLAGS=-Dwarnings group so each specific lint overrides it. (The ArtifactId
      # deprecation is now enforced. Its `-A deprecated` rustc allow was removed once the
      # graph-assigned ArtifactId migration landed.)
      - name: Clippy
        run: >
          cargo clippy --all-targets --all-features --
          -A clippy::await_holding_lock
          -A clippy::bool_assert_comparison
          -A clippy::clone_on_copy
          -A clippy::collapsible_if
          -A clippy::collapsible_match
          -A clippy::derivable_impls
          -A clippy::doc_lazy_continuation
          -A clippy::doc_overindented_list_items
          -A clippy::field_reassign_with_default
          -A clippy::filter_map_bool_then
          -A clippy::for_kv_map
          -A clippy::format_in_format_args
          -A clippy::if_same_then_else
          -A clippy::int_plus_one
          -A clippy::io_other_error
          -A clippy::items_after_test_module
          -A clippy::large_enum_variant
          -A clippy::len_zero
          -A clippy::manual_checked_ops
          -A clippy::manual_contains
          -A clippy::manual_is_multiple_of
          -A clippy::manual_map
          -A clippy::manual_pattern_char_comparison
          -A clippy::manual_strip
          -A clippy::map_entry
          -A clippy::match_single_binding
          -A clippy::missing_const_for_thread_local
          -A clippy::needless_borrow
          -A clippy::needless_option_as_deref
          -A clippy::needless_question_mark
          -A clippy::needless_return
          -A clippy::new_without_default
          -A clippy::only_used_in_recursion
          -A clippy::ptr_arg
          -A clippy::redundant_closure
          -A clippy::redundant_field_names
          -A clippy::regex_creation_in_loops
          -A clippy::result_large_err
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A clippy::unnecessary_cast
          -A clippy::unnecessary_map_or
          -A clippy::unnecessary_sort_by
          -A clippy::unnecessary_unwrap
          -A clippy::useless_conversion

      - name: Check Runtime Boundaries
        run: bash scripts/check_runtime_boundaries.sh

      - name: Check Private Repo Coupling
        run: bash scripts/check_private_repo_coupling.sh

      # The guard above is invoked from the repository root here and nowhere
      # else, which is the one working directory that hid a broken exclusion.
      # These tests run it from a foreign directory in both directions.
      - name: Test Private Repo Coupling Guard
        run: python3 scripts/test-private-repo-coupling.py

      # The committed Cargo.lock plus .cargo/config.toml pins kin-* dependencies
      # to public source until every crate is registry-published.
      - name: Build
        run: cargo build --all-targets --locked

      # Kin's Linux release binaries link against musl so a single archive runs
      # on every distribution, and nothing else in CI compiles for that target.
      # A `target_env` cfg is invisible to a glibc build, so a dependency that
      # resolves a glibc-only libc entry point compiles clean through every
      # required context, reaches a tag, and then fails in the release run,
      # where the only remedy is another version cut. This compiles the exact
      # packages the release builds, for the target it builds them for, so that
      # break is a red pull request instead of a burned tag.
      #
      # One deliberate bound: it checks rather than builds, so it proves
      # compilation and name resolution and not linking.
      - name: Check the Linux release target (musl)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          # ring, oniguruma, sqlite, and tree-sitter compile C against musl, so
          # this needs the same musl-gcc the release legs install.
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo check --locked --target x86_64-unknown-linux-musl \
            -p kin-cli -p kin-daemon

      # The second Linux release target. The step above proves any break that
      # selects on the C environment, because that selection is identical on
      # both architectures. It cannot prove a break that selects on the
      # architecture, and until this step existed that class first compiled
      # inside the release run, after the tag exists, which is the shape that
      # burned a cut.
      #
      # The Rust half is exact: rustc type-checks the release package set for
      # the real target triple, which is where the defect class lives. A
      # dependency resolving a libc entry point that libc declares for some
      # architectures and not others fails here rather than after the tag.
      #
      # The C half is bounded and stays bounded on purpose. Ubuntu ships no
      # aarch64 musl C toolchain, so the C sources that dependency build
      # scripts compile are built by the aarch64 glibc cross compiler: right
      # architecture, wrong C library headers. That is enough for the build
      # scripts to produce objects and let the Rust check run, and it is not a
      # proof that those C sources compile against musl headers. The release
      # leg proves that natively on ubuntu-24.04-arm, where musl-tools does
      # supply an aarch64 musl-gcc, which is why nothing here is a cross build.
      - name: Check the aarch64 Linux release target (musl)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-musl
          # Self-contained rather than relying on the step above having
          # refreshed the index. This is a required context, so an implicit
          # ordering dependency between two steps is a way for a reorder to
          # turn a stale index into a red Check & Test.
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc \
          AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar \
            cargo check --locked --target aarch64-unknown-linux-musl \
              -p kin-cli -p kin-daemon

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --locked

      - name: Doc tests
        # nextest does not run doctests; keep them covered explicitly.
        run: cargo test --doc --locked

      # `gcs` is a non-default feature, so the passes above never execute the
      # hosted-storage code it gates, and Clippy's `--all-features` pass only
      # type-checks it. Without this step a behavioral regression in the
      # GCS-mode startup admission path compiles clean and reaches main with a
      # green required context. The whole package runs rather than just the
      # binary target: the feature gates only `bin/kin-daemon.rs` today, and
      # scoping to that target would silently stop covering a gate added to the
      # library later. No companion doctest pass belongs here because
      # kin-daemon declares `doctest = false`.
      - name: Test gcs feature
        run: cargo nextest run -p kin-daemon --features gcs --locked

      # Nothing else on these legs resolves kin-cli without its default
      # features, so a break that appears only with `vector` and `embeddings`
      # off compiles clean here and reaches main behind a green required
      # context. The Windows authority job covers that configuration for the
      # msvc target through filtered subsets of the library, so the cases
      # asserting the featureless path execute in this step and nowhere else.
      # `RUSTFLAGS: -D warnings` is set at workflow level, so the unused-import
      # shape this class first took fails the step rather than warning.
      #
      # The whole package runs rather than the library alone. The regressions
      # this is here to catch are library unit tests, but the featureless
      # configuration is a build configuration before it is a test one: 30 of
      # the 33 integration targets compile without default features nowhere
      # else, and scoping to `--lib` would stop compiling exactly the targets
      # where a test that assumes a feature can next appear.
      #
      # `cargo test` rather than the `cargo nextest run` the steps above use.
      # It is the authority when the two runners disagree, and it covers the
      # package's doctests in the same pass instead of needing a second step.
      - name: Test featureless kin-cli
        run: cargo test -p kin-cli --no-default-features --lib --tests --locked

      # kin-daemon owns feature-dependent status sampling and response tests of
      # its own. A featureless package check compiles those routes but does not
      # execute assertions that can accidentally encode the vector-enabled
      # answer. Run the complete daemon package under the same release feature
      # set; doctests need no companion step because the crate disables them.
      - name: Test featureless kin-daemon
        run: cargo test -p kin-daemon --no-default-features --lib --tests --locked

  # Security audit moved to sast.yml (cargo-deny: advisories + licenses + bans + sources)

  coverage:
    name: Code Coverage
    # Not the critical path (the Windows jobs are longer), so gating this off
    # PRs costs no wall clock and reclaims ~23 min of billed compute per PR.
    # Coverage still runs on every push to main, so it still gates what lands.
    #
    # Off the merge queue for a stronger reason than cost. This is not a
    # required context, so the queue never waits for it: across seven sampled
    # landings the merge completed a median 34s after the last required check
    # while this job was still running, finishing up to 7.1 min PAST the merge.
    # A merge_group check-run that concludes after the merge lands on the exact
    # sha release-tag.yml sweeps, where a non-required failure is terminal even
    # though nothing gated on it. A job that never starts cannot conclude.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # branch 1.96.0, 2026-07-16

      - name: Verify kin cargo registry config
        # Same tracked config the check job verifies.
        run: |
          test -f .cargo/config.toml
          grep -q '^\[registries\.kin\]' .cargo/config.toml
          if grep -q '^\[patch\.kin\]' .cargo/config.toml; then echo "::error::[patch.kin] git pins must be removed. kin-* resolve from the Kin registry"; exit 1; fi

      - name: Cache cargo registry
        # Registry only, deliberately: tarpaulin's instrumented builds use their
        # own flags, so a cached target never fingerprint-matches. Measured on
        # main: a 4.62 GB target cache HIT left coverage at 24.2 min vs 23.5
        # cold. That is zero benefit, and its size (47% of the repo's 10 GB budget)
        # evicted the Windows release-build cache that does pay for itself.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tarpaulin-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: |
          if ! timeout 30m cargo tarpaulin --out xml --out stdout; then
            echo "::warning::Tarpaulin is currently non-blocking in CI for the public alpha."
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: firelock-ai/kin
          fail_ci_if_error: false
