name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [dependency-updated]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        uses: christophebedard/dco-check@v1.2.0

  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Configure kin cargo registry
        # .cargo/config.toml is gitignored (it carries local-dev [patch] paths),
        # so CI writes only the registry alias the committed Cargo.toml needs to
        # resolve the published kin-* crates (kin-model, kin-db, kin-lsp, …) from
        # the kinlab.ai sparse registry. Mirrors release.yml / Dockerfile and the
        # kin-bench CI(Linux) workflow.
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'TOML'
          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          TOML

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Check Runtime Boundaries
        run: bash scripts/check_runtime_boundaries.sh

      - name: Check Private Repo Coupling
        run: bash scripts/check_private_repo_coupling.sh

      # NOTE: --locked is intentionally omitted. The committed Cargo.lock is
      # generated against the local-dev [patch] redirects (path crates, no
      # registry checksums); a fresh registry-only resolve must be allowed to
      # update the lock in-CI, exactly as the kin-bench CI(Linux) job does. If
      # a committed registry-flavoured Cargo.lock lands later, restore --locked.
      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

  # Security audit moved to sast.yml (cargo-deny: advisories + licenses + bans + sources)

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure kin cargo registry
        # Same registry alias the check job writes; tarpaulin resolves the
        # published kin-* crates from the kinlab.ai sparse registry too.
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'TOML'
          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          TOML

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tarpaulin-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: |
          if ! cargo tarpaulin --out xml --out stdout; then
            echo "::warning::Tarpaulin is currently non-blocking in CI for the public alpha."
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: firelock-ai/kin
          fail_ci_if_error: false
