name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-image:
    name: Docker Image Build (no push)
    # Off the pull-request path as of FIR-2815. This job gates nothing on a pull
    # request and never did, but `merge_pr_ready` in the umbrella refuses while
    # ANY check is still pending, required or not, so an advisory leg sets the
    # lane's clock exactly as a required one does. Moving only the required legs
    # would have left the pull-request clock at this job's measured 20.1 minutes
    # and read like the idea did not work. The `push: branches: [main]` trigger
    # above is untouched, so every commit that reaches main still runs it.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Resolve the Dockerfile's digest-pinned base images through a mirror
      # first. This job publishes a check-run against every commit that reaches
      # main, and release-tag.yml's second sweep refuses a release commit
      # carrying any non-green check-run, required or not, so minutes of
      # registry unavailability refuse a release permanently. BuildKit tries
      # each mirror in order and falls back to the canonical registry, so the
      # two are independent front doors rather than a redirect: verified
      # locally by building the pinned bases with a deliberately unreachable
      # mirror host, which still completed against docker.io.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Build-only gate: this job NEVER pushes an image. It proves the
      # multi-stage Dockerfile still builds end to end, with kin-* dependencies
      # resolved from the Kin sparse registry, then a release build of the
      # `kin` and `kin-daemon` binaries into a slim runtime image. Layer cache
      # is persisted across runs via the GitHub Actions cache backend so the
      # heavy release compile stays affordable on repeat runs.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          # Load the built image into the local Docker daemon so the smoke step
          # below can `docker run` it. Single-platform, so `load` is supported.
          load: true
          tags: kin:ci
          build-args: |
            KIN_BUILD_GIT_SHA=${{ github.sha }}
            KIN_BUILD_DIRTY=false
            KIN_BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          # Export layers only from main. A pull request's Actions cache scope
          # is private to that pull request, so exporting mode=max from every
          # round wrote layers only that same branch could reread, while
          # spending the shared repository cache budget. Pull requests still
          # import main's layers, and skipping the export also removes the
          # mode=max upload from every pull-request round.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Verify container build provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verify-container-build-info.sh kin:ci "$EXPECTED_SHA"

      # Container-level smoke on the freshly built image. Proves the entrypoint
      # boots the daemon in local mode with NO /workspace volume, the case that
      # previously crash-looped on a bare `mkdir /workspace`. It also proves that
      # GCS mode prepares the same workspace path, and that an unwritable
      # workspace fails loudly instead of dying on mkdir. Creds-free and bounded
      # well under 2 min.
      - name: Entrypoint smoke (local boot + SIGTERM, gcs prep, unwritable fail)
        run: |
          set -uo pipefail
          IMAGE=kin:ci

          dump() { echo "---- docker logs $1 ----"; docker logs "$1" 2>&1 || true; }

          # The non-root runtime must own a private home before Kin can create
          # its fail-closed registry authority files there. Keep this explicit
          # so a base-image/useradd change cannot silently regress first boot.
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test "$HOME" = /home/kin
            test -d "$HOME"
            test "$(stat -c %a "$HOME")" = 700
            test "$(stat -c %u "$HOME")" = "$(id -u)"
          '

          echo "::group::Local mode (no /workspace mount, default workspace)"
          docker rm -f kin-local >/dev/null 2>&1 || true
          docker run -d --name kin-local "$IMAGE" >/dev/null
          # The daemon binds and logs "daemon API server listening" before the
          # slower graph/model startup, so it is the deterministic offline signal
          # that it reached serving state, independent of reconcile/embed timing.
          listening=0
          for _ in $(seq 1 40); do
            if docker logs kin-local 2>&1 | grep -q "daemon API server listening"; then listening=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' kin-local 2>/dev/null)" != "true" ]; then break; fi
            sleep 1
          done
          if [ "$listening" -ne 1 ]; then echo "::error::kin-daemon never reached its listening line in local mode"; dump kin-local; exit 1; fi
          # The entrypoint's prep line rides a different stream buffer than the
          # daemon's tracing, so it can flush after the listening line. Poll it
          # with the same deadline instead of asserting on a single read.
          prep=0
          for _ in $(seq 1 15); do
            if docker logs kin-local 2>&1 | grep -q "Starting kin-daemon (storage=local"; then prep=1; break; fi
            sleep 1
          done
          if [ "$prep" -ne 1 ]; then echo "::error::entrypoint did not report local storage prep"; dump kin-local; exit 1; fi
          # Best-effort readiness probe (an empty repo may still be initializing);
          # logged for signal only. The listening line is the hard gate.
          if docker exec kin-local sh -c 'curl -fsS http://127.0.0.1:4219/readiness' >/dev/null 2>&1; then
            echo "readiness: 200 (ready)"
          else
            echo "readiness: not yet 200 (empty-repo init timing; listening already asserted)"
          fi
          # SIGTERM must shut the daemon down cleanly (exit 0), not get SIGKILLed.
          docker stop -t 15 kin-local >/dev/null
          code="$(docker inspect -f '{{.State.ExitCode}}' kin-local)"
          if [ "$code" != "0" ]; then echo "::error::kin-daemon did not exit cleanly on SIGTERM (exit=$code)"; dump kin-local; exit 1; fi
          echo "local mode: reached listening + clean SIGTERM (exit 0)"
          docker rm -f kin-local >/dev/null 2>&1 || true
          echo "::endgroup::"

          echo "::group::GCS mode (same workspace prep path, creds-free)"
          # No bucket/creds in CI, so the daemon exits right after workspace prep;
          # assert the unified prep ran on the same /tmp/kin-workspace and reached
          # daemon exec without the unwritable fatal, which is to say that prep
          # is mode-agnostic.
          docker rm -f kin-gcs >/dev/null 2>&1 || true
          docker run -d --name kin-gcs -e KIN_STORAGE=gcs "$IMAGE" >/dev/null
          gcs_prep=0
          for _ in $(seq 1 30); do
            if docker logs kin-gcs 2>&1 | grep -q "Starting kin-daemon (storage=gcs"; then gcs_prep=1; break; fi
            # The expected missing-bucket exit is fast enough to beat Docker's
            # log-driver flush. Keep polling the bounded log authority even
            # after the container stops instead of taking one racy final read.
            sleep 1
          done
          if [ "$gcs_prep" -ne 1 ]; then echo "::error::gcs mode did not reach daemon exec after workspace prep"; dump kin-gcs; docker rm -f kin-gcs >/dev/null 2>&1 || true; exit 1; fi
          if docker logs kin-gcs 2>&1 | grep -q "FATAL: workspace"; then echo "::error::gcs mode hit the unwritable-workspace fatal on the default path"; dump kin-gcs; docker rm -f kin-gcs >/dev/null 2>&1 || true; exit 1; fi
          docker rm -f kin-gcs >/dev/null 2>&1 || true
          echo "gcs mode: workspace prepared and reached daemon exec"
          echo "::endgroup::"

          echo "::group::Unwritable workspace (loud fatal, no bare mkdir death)"
          # KIN_WORKSPACE_DIR=/workspace is an unwritable image-root path with no
          # mount: the entrypoint must print an actionable fatal and exit 1.
          # Expected-failure capture: suspend errexit so the nonzero exit lands
          # in code_bad instead of aborting the step at the assignment.
          set +e
          out_bad="$(docker run --rm -e KIN_WORKSPACE_DIR=/workspace "$IMAGE" 2>&1)"
          code_bad=$?
          set -e
          echo "$out_bad"
          if [ "$code_bad" -ne 1 ]; then echo "::error::unwritable workspace should exit 1 (got $code_bad)"; exit 1; fi
          if ! printf '%s\n' "$out_bad" | grep -q "FATAL: workspace '/workspace' is not writable"; then echo "::error::missing actionable fatal naming the dir"; exit 1; fi
          if ! printf '%s\n' "$out_bad" | grep -q "KIN_WORKSPACE_DIR"; then echo "::error::fatal should name the KIN_WORKSPACE_DIR remedy"; exit 1; fi
          if printf '%s\n' "$out_bad" | grep -qi "Permission denied"; then echo "::error::leaked a bare mkdir permission-denied death"; exit 1; fi
          echo "unwritable workspace: loud fatal + exit 1, no bare mkdir death"
          echo "::endgroup::"

      # The smoke above boots with nothing mounted under .kin, so it models the
      # kin-daemon pod and never the kin-registry pod, which mounts its
      # published-crates disk at <repo>/.kin/packages. That gap is where a
      # regression that emptied the disk on every start survived. This proves the
      # entrypoint leaves a mounted volume alone and refuses rather than deleting
      # through it, and that it still re-initializes when nothing is at risk.
      - name: Entrypoint contract with a volume mounted inside .kin
        run: bash scripts/test-entrypoint-workspace-mount.sh kin:ci

      # Every probe above runs inside the container's own network namespace, so
      # none of them can see whether the port compose publishes actually reaches
      # the daemon. This one curls the published mapping from the runner, with
      # the unset-bind-host arm first as a negative control.
      - name: Published port reachable from outside the container namespace
        run: bash scripts/test-compose-published-port.sh kin:ci

      # FIR-2668's acceptance, against a real fake-gcs-server. The image this
      # job just built carries `--features gcs`, so the emulator round trip runs
      # against the same bytes an operator would run and needs no Rust toolchain
      # here. It also runs the ticket's own falsification: with the emulator
      # stopped the daemon must exit loud rather than reach for real Google
      # Cloud Storage, which is the arm that stops the happy path from passing
      # for a lever that is being ignored.
      - name: GCS emulator endpoint acceptance
        run: bash scripts/test-gcs-emulator-endpoint.sh kin:ci
