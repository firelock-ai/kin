#
# cargo-deny configuration for the kin workspace.
# Checks: advisories, licenses, bans, sources.
# Run locally: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Advisory database (replaces standalone cargo-audit) ---
[advisories]
# cargo-deny defaults `unsound` to "workspace", which surfaces unsound advisories
# only for crates the workspace declares directly. Every third-party crate kin
# ships is transitive, so the default left this required context structurally
# unable to fail on an unsound advisory. Two sat in the shipped graph while the
# check reported success: RUSTSEC-2026-0253, a use-after-free in lru 0.16.4
# reached through kin-vfs-core, and RUSTSEC-2026-0186, an unchecked pointer
# offset in memmap2 0.9.10 reached through gix. Both are fixed in the lock beside
# this line. "all" is what lets the check fail; do not weaken it back without
# replacing the coverage.
unsound = "all"
# Ignore specific advisories that cannot be resolved yet.
# Each entry must have a reason explaining why it is safe to ignore.
ignore = [
    # Unmaintained-only advisories (NOT vulnerabilities) with no safe upgrade
    # available, all transitive. Verified locally with cargo-deny 0.19.8 against
    # the registry-resolved graph. Each is a maintenance notice, not a runtime
    # exposure; revisit when an upstream drops the dep.
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained — transitive via kin-infer/tokenizers; no fix, no vuln" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained — transitive; no safe upgrade; no vuln" },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained — transitive; no safe upgrade; no vuln" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained — transitive build-time macro dep; no safe upgrade; no vuln" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained — transitive via the TLS stack; no safe upgrade; no vuln" },
    # Real vulnerabilities with NO upstream fix path today (patched only in a
    # semver range no dependent admits). Permitted ONLY with a documented
    # no-exposure justification and an explicit removal trigger — never for
    # vulns with an available fix (see NOTE below).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic attribute-duplication DoS — patched only in >=0.41 while object_store caps quick-xml ^0.40 at every release; the XML parsed is GCS API responses over TLS behind the off-by-default gcs feature, no attacker-supplied XML in the default configuration; remove when object_store admits quick-xml >=0.41" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml unbounded namespace allocation DoS — same transitive object_store cap and exposure as RUSTSEC-2026-0194; remove when object_store admits quick-xml >=0.41" },
    # NOTE: RUSTSEC-2026-0098 / -0099 / -0104 (rustls-webpki 0.103.10 name-constraint
    # + CRL-panic VULNERABILITIES) are intentionally NOT ignored. They have a fix:
    # `cargo update -p rustls-webpki` (>=0.103.13). That is a Cargo.lock change and
    # belongs to the lockfile-regen owner — do not paper over real vulns here.
]

# --- License policy ---
[licenses]
# Kin is Apache-2.0. All transitive dependencies must use compatible licenses.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    # ureq 3.x bundles a webpki-roots-style trust store under this permissive
    # data license (pulled via kin-remote → kin-cli). Permissive; OK for an
    # Apache-2.0 distribution. Verified as the only license outside the base set.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# --- Crate bans ---
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# --- Source provenance ---
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["firelock-ai"]
