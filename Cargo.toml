[workspace]
resolver = "2"
members = [
    "crates/kin-blobs",
    "crates/kin-core",
    "crates/kin-parser",
    "crates/kin-index",
    "crates/kin-projection",
    "crates/kin-reconcile",
    "crates/kin-git",
    "crates/kin-context",
    "crates/kin-semantic-contracts",
    "crates/kin-search",
    "crates/kin-remote",
    "crates/kin-review",
    "crates/kin-migrate",
    "crates/kin-runtime",
    "crates/kin-cli",
    "crates/kin-daemon",
    "crates/kin-mcp",
    "crates/kin-spine",
    "crates/kin-registry",
    "crates/kin-pipelines",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Troy Fortin <troy@firelock.ai>"]
repository = "https://github.com/firelock-ai/kin"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing & signatures
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "7"

# Tree-sitter
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-hcl = "1.1"

# Git interop
gix = { version = "0.80", default-features = false, features = ["max-performance-safe"] }

# HTTP / MCP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
socket2 = "0.6"

# Interactive CLI
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"

# Archive generation
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# File locking
fs2 = "0.4"

# Testing
tempfile = "3"
pretty_assertions = "1"
serial_test = "3"

# Internal crates
kin-model = { git = "https://github.com/firelock-ai/kin-db.git", rev = "2c4d0093a736b1b01a152e136a85158229cb8a01", package = "kin-model" }
kin-blobs = { path = "crates/kin-blobs" }
kin-core = { path = "crates/kin-core" }
kin-parser = { path = "crates/kin-parser" }
kin-index = { path = "crates/kin-index" }
kin-projection = { path = "crates/kin-projection" }
kin-reconcile = { path = "crates/kin-reconcile" }
kin-git = { path = "crates/kin-git" }
kin-context = { path = "crates/kin-context" }
kin-semantic-contracts = { path = "crates/kin-semantic-contracts" }
kin-search = { path = "crates/kin-search" }
kin-remote = { path = "crates/kin-remote" }
kin-review = { path = "crates/kin-review" }
kin-migrate = { path = "crates/kin-migrate" }
kin-runtime = { path = "crates/kin-runtime" }
kin-cli = { path = "crates/kin-cli" }
kin-daemon = { path = "crates/kin-daemon" }
kin-mcp = { path = "crates/kin-mcp" }
kin-spine = { path = "crates/kin-spine" }
kin-registry = { path = "crates/kin-registry" }
kin-pipelines = { path = "crates/kin-pipelines" }
kin-db = { git = "https://github.com/firelock-ai/kin-db.git", rev = "2c4d0093a736b1b01a152e136a85158229cb8a01", package = "kin-db", default-features = false, features = ["vector"] }
kin-vfs-core = { git = "https://github.com/firelock-ai/kin-vfs.git", rev = "e9e2c172b3b27b76cc700f009e70d9e70834e682", package = "kin-vfs-core" }
