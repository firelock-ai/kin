[workspace]
resolver = "2"
members = [
    "crates/kin-core",
    "crates/kin-parser",
    "crates/kin-index",
    "crates/kin-projection",
    "crates/kin-reconcile",
    "crates/kin-git",
    "crates/kin-context",
    "crates/kin-semantic-contracts",
    "crates/kin-ranking",
    "crates/kin-remote",
    "crates/kin-review",
    "crates/kin-migrate",
    "crates/kin-runtime",
    "crates/kin-buildinfo",
    "crates/kin-notify",
    "crates/kin-notifier-macos",
    "crates/kin-cli",
    "crates/kin-daemon-spawn",
    "crates/kin-daemon",
    "crates/kin-mcp",
    "crates/kin-spine",
    "crates/kin-registry",
    "tests/integration",
]

[workspace.package]
version = "0.5.31"
edition = "2021"
license = "Apache-2.0"
authors = ["Troy Fortin <troy@firelock.ai>"]
repository = "https://github.com/firelock-ai/kin"

[workspace.dependencies]
parking_lot = "0.12"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
semver = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing & signatures
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "8"

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-hcl = "1.1"

# Git interop
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "sha1"] }
gix-ignore = "0.21"
bstr = "1"

# HTTP / MCP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.6"

# Interactive CLI
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.16"

# Archive generation
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Parallelism
rayon = "1"

# File locking
fs2 = "0.4"
rustix = { version = "1", features = ["fs"] }

# Testing
tempfile = "3"
pretty_assertions = "1"
serial_test = "3"

# Internal crates
kin-model = { version = "=0.7.8", registry = "kin" }
kin-blobs = { version = "=0.1.5", registry = "kin" }
kin-core = { path = "crates/kin-core" }
kin-parser = { path = "crates/kin-parser" }
kin-index = { path = "crates/kin-index" }
kin-projection = { path = "crates/kin-projection" }
kin-reconcile = { path = "crates/kin-reconcile" }
kin-git = { path = "crates/kin-git" }
kin-context = { path = "crates/kin-context" }
kin-semantic-contracts = { path = "crates/kin-semantic-contracts" }
kin-ranking = { path = "crates/kin-ranking" }
kin-remote = { path = "crates/kin-remote" }
kin-review = { path = "crates/kin-review" }
kin-migrate = { path = "crates/kin-migrate" }
kin-runtime = { path = "crates/kin-runtime" }
kin-buildinfo = { path = "crates/kin-buildinfo" }
kin-notify = { path = "crates/kin-notify" }
kin-cli = { path = "crates/kin-cli", default-features = false }
kin-daemon = { path = "crates/kin-daemon" }
kin-daemon-spawn = { path = "crates/kin-daemon-spawn" }
kin-mcp = { path = "crates/kin-mcp" }
kin-spine = { path = "crates/kin-spine" }
kin-registry = { path = "crates/kin-registry" }
kin-lsp = { version = "0.6.5", registry = "kin" }
# Cross-platform base: NO "metal" here. `[workspace.dependencies]` entries cannot be
# `[target.'cfg(...)']`-gated, so listing "metal" here forces the macOS-only kin-infer/metal
# backend on every target (incl. Linux, where it cannot compile). Metal is re-enabled
# additively on macOS via a `[target.'cfg(target_os = "macos")'.dependencies]` block in the
# binary/runtime crates (kin-cli, kin-daemon). Feature unification makes that additive.
kin-db = { version = "=0.7.23", registry = "kin", default-features = false }
kin-vfs-core = { version = "=0.4.2", registry = "kin" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
