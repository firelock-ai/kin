version: "3.8"

services:
  # Public open-core compose only. KinLab/private control-plane services are
  # intentionally orchestrated outside this repo.
  kin-daemon:
    build:
      context: ../kin
      dockerfile: Dockerfile
    ports:
      - "4219:4219"
    volumes:
      - workspace-data:/workspace
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4219/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  workspace-data:
