<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Kin terminal demo</title>
  <desc id="desc">Terminal rendering showing kin status, kin context, and kin trace output on the kin repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016" />
      <stop offset="100%" stop-color="#101824" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <style>
      .ui { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .title { fill: #e5edf5; font-size: 18px; font-weight: 700; }
      .chrome { fill: #94a3b8; font-size: 13px; }
      .body { fill: #d7e0ea; font-size: 20px; }
      .muted { fill: #8ea2b6; }
      .prompt { fill: #8ddf89; }
      .accent { fill: #ffbf66; }
      .good { fill: #7dd3fc; }
      .path { fill: #c4b5fd; }
      .line { fill: #d7e0ea; }
    </style>
  </defs>

  <rect width="1280" height="860" fill="#f6f0e4" />
  <rect x="60" y="48" width="1160" height="764" rx="24" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="60" y="48" width="1160" height="58" rx="24" fill="#121b26" />
  <rect x="60" y="82" width="1160" height="1" fill="#1f2a37" />
  <circle cx="94" cy="77" r="8" fill="#ef4444" />
  <circle cx="122" cy="77" r="8" fill="#f59e0b" />
  <circle cx="150" cy="77" r="8" fill="#10b981" />
  <rect x="905" y="68" width="262" height="18" rx="9" fill="#0f1722" />
  <rect x="905" y="68" width="96" height="18" rx="9" fill="url(#glow)" opacity="0.16" />
  <text x="184" y="83" class="ui title">kin demo - semantic navigation on a real repo</text>
  <text x="929" y="82" class="ui chrome">README terminal rendering</text>

  <text x="96" y="148" class="ui body">
    <tspan class="prompt">$</tspan><tspan class="line"> kin status</tspan>
    <tspan x="96" dy="34" class="line">On branch: main</tspan>
    <tspan x="96" dy="34" class="line">Head: 158682aecf48f25adcdd41ec308c77b2b8e69f41...</tspan>
    <tspan x="96" dy="34" class="good">Entities: 2506</tspan>

    <tspan x="96" dy="56" class="prompt">$</tspan><tspan class="line"> kin context parse_codex_output</tspan>
    <tspan x="96" dy="34" class="line">Context pack for 'parse_codex_output' (Function):</tspan>
    <tspan x="96" dy="34" class="muted">  Budget: 106/8000 tokens</tspan>
    <tspan x="96" dy="34" class="muted">  Focal: 1 entries   Dependencies: 1 entries   Transitive: 2 entries</tspan>
    <tspan x="96" dy="34" class="accent">--- Context Pack ---</tspan>
    <tspan x="96" dy="34" class="line">// parse_codex_output (Function, rust)</tspan>
    <tspan x="96" dy="34" class="line">fn parse_codex_output(</tspan>
    <tspan x="96" dy="34" class="line">pub async fn push() - kin stash push</tspan>
    <tspan x="96" dy="34" class="line">discover_layout_from_cwd() - Result&lt;kin_core::KinLayout&gt;</tspan>
    <tspan x="96" dy="34" class="line">push_with_layout(layout: &amp;kin_core::KinLayout) - Result&lt;()&gt;</tspan>

    <tspan x="96" dy="56" class="prompt">$</tspan><tspan class="line"> kin trace build_prompt_with_guidance --compact</tspan>
    <tspan x="96" dy="34" class="line">build_prompt_with_guidance (Function) @ </tspan><tspan class="path">crates/kin-bench/src/live/runner.rs</tspan>
    <tspan x="96" dy="34" class="line">pub fn build_prompt_with_guidance(arm_name: &amp;str, task_prompt: &amp;str, _arm_dir: &amp;Path) -&gt; String {</tspan>
    <tspan x="96" dy="34" class="line">    match arm_name {</tspan>
    <tspan x="96" dy="34" class="line">        "kin-pilot-native" =&gt; task_prompt.to_string(),</tspan>
    <tspan x="96" dy="34" class="line">        "kin-native" =&gt; { ... }</tspan>
    <tspan x="96" dy="34" class="line">        "kin-native-cli" =&gt; { ... }</tspan>
    <tspan x="96" dy="34" class="line">    }</tspan>
    <tspan x="96" dy="34" class="accent">--- Deps ---</tspan>
    <tspan x="96" dy="34" class="line">  status @ crates/kin-cli/src/commands/mod.rs:37</tspan>
    <tspan x="96" dy="34" class="line">  open_graph @ crates/kin-cli/src/commands/branch.rs:3</tspan>
    <tspan x="96" dy="34" class="line">  SessionId::new @ crates/kin-model/src/ids.rs:274</tspan>
  </text>
</svg>
