[package]
name = "kin-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git forge migration pipeline for Kin (GitHub, GitLab, Bitbucket)"
repository.workspace = true

[dependencies]
kin-model = { workspace = true }
kin-db = { workspace = true }
kin-blobs = { workspace = true }
kin-core = { workspace = true }
kin-git = { workspace = true }
kin-parser = { workspace = true }
kin-index = { workspace = true }
kin-projection = { workspace = true }
kin-infer = { version = ">=0.2.1", registry = "kin", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sysinfo = "0.39"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
# The descendant-reap acceptance test is cross-platform even though production
# process-group enumeration uses sysinfo only on Unix.
sysinfo = "0.39"
