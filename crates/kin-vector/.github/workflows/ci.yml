name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      # windows-latest left this matrix for `windows-nightly.yml`. It was not a
      # required status context on either protection surface, classic branch
      # protection or the rulesets, so it gated nothing here while running on
      # the pull request, the merge-queue build, and the push to main. The
      # coverage is unchanged and moved to a daily schedule with a failure
      # alarm; only the three-times-per-landing cost is gone.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # Runs from a required context on purpose. The nightly Windows workflow
      # only carries the coverage this matrix gave up if it keeps running the
      # same steps, and two files holding one step list drift the first time
      # somebody edits either of them. The same step is present in the nightly,
      # where it skips, which is what keeps the two lists identical.
      - name: Check the nightly Windows job still runs these steps
        if: runner.os == 'Linux'
        run: ./scripts/check-windows-nightly-parity.sh
