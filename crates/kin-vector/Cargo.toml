[package]
name = "kin-vector"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Troy Fortin <troy@firelock.ai>"]
description = "Pure-Rust HNSW approximate nearest-neighbor search — no C++ FFI, no platform-specific build scripts"
repository = "https://github.com/firelock-ai/kin-vector"

[lib]
doctest = false

[features]
default = ["simd"]
# SIMD distance kernel (aarch64 NEON). Compiled in by default, but gated OFF at
# runtime: the scalar reduction is the default result path and is bit-identical to
# the frozen benchmark on every target. Enable the NEON kernel with
# `KIN_VECTOR_SIMD=1` once its ~2-ulp delta from scalar is measured and approved
# (the delta can transpose effectively-equidistant neighbors). With this feature
# disabled the crate compiles to the scalar reduction only, byte-for-byte
# unchanged. The bound is characterized in the `simd` tests. See `cosine_distance`.
simd = []

[dependencies]
fs2 = "0.4"
hashbrown = { version = "0.15", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1"

[dev-dependencies]
tempfile = "3"
