[package]
name = "kin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Kin semantic VCS"
repository.workspace = true

[features]
default = ["vector", "embeddings", "metal"]
vector = ["kin-db/vector"]
embeddings = ["kin-db/embeddings"]
# `metal` is a macOS GPU-acceleration *marker* feature, kept in `default` so that
# cfg!(feature = "metal") (read by src/commands/bench_meta.rs to report `metal_enabled`)
# stays true on the bench platform. It intentionally does NOT pull `kin-db/metal` —
# Cargo features cannot be target-gated, so doing so would force the macOS-only
# kin-infer/metal backend on Linux too. The real `kin-db/metal` activation is in the
# `[target.'cfg(target_os = "macos")'.dependencies]` block below (additive via unification).
metal = ["embeddings"]

[[bin]]
name = "kin"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
kin-model = { workspace = true }
kin-core = { workspace = true }
kin-daemon-spawn = { workspace = true }
kin-blobs = { workspace = true }
kin-parser = { workspace = true }
kin-index = { workspace = true }
kin-projection = { workspace = true }
kin-reconcile = { workspace = true }
kin-git = { workspace = true }
kin-context = { workspace = true }
kin-semantic-contracts = { workspace = true }
kin-notify = { workspace = true }
kin-review = { workspace = true }
kin-migrate = { workspace = true }
kin-runtime = { workspace = true }
kin-buildinfo = { workspace = true }
kin-mcp = { workspace = true }
kin-db = { workspace = true }
kin-infer = { version = ">=0.2.1", registry = "kin", default-features = false }
kin-ranking = { workspace = true }
kin-lsp = { workspace = true }
kin-remote = { workspace = true }
kin-vfs-core = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
open = "5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
age = "0.11"
base64 = "0.23"
directories = "5"
keyring = { version = "3", features = ["apple-native"] }
rpassword = "7"
serde = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
chrono = { workspace = true }
filetime = { workspace = true }
kin-agent = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
hex = { workspace = true }
sha2.workspace = true
ed25519-dalek = { workspace = true }
url = "2"
which = "8"
dialoguer = { workspace = true }
console = { workspace = true }
flate2 = "1"
fs2 = { workspace = true }
regex = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
rayon = { workspace = true }
rustc-hash = "2.1"
sysinfo = "0.39"
toml = { workspace = true }
toml_edit = "0.25"
tempfile = { workspace = true }
unicode-normalization = "0.1"
unicode-ident = "1"
kin-spine = { version = "0.5.46", path = "../kin-spine" }

[dev-dependencies]
kin-core = { workspace = true, features = ["test-support"] }
kin-git = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# macOS-only: re-enable the Metal embedding backend (kin-db/metal -> kin-infer/metal).
# Feature unification is additive, so on macOS kin-db is built with metal; on Linux this
# block is absent and metal is never requested, keeping the Linux build green.
[target.'cfg(target_os = "macos")'.dependencies]
kin-db = { workspace = true, features = ["metal", "accelerate"] }
kin-infer = { version = ">=0.2.1", registry = "kin", features = ["metal"] }
