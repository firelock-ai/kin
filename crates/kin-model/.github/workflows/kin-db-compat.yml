# Downstream schema-compatibility gate.
#
# kin-model's own suite cannot observe the failure that matters here. kin-db
# persists these types through a compact MessagePack encoding that writes a
# struct as an array, so a field is addressed by position. A field inserted
# anywhere but the end shifts every following value into the wrong slot, which
# is green in kin-model (its round-trips encode and decode with the same
# layout) and corrupts every existing kin-db store. That is the 0.6.2/0.6.3
# class, and it can only be caught by building the actual consumer against the
# proposed types.
#
# So: check out kin-db, point its kin-model dependency at this PR head, and run
# kin-db's suite. Which kin-db is main, unless the PR body names a branch for
# the one case main cannot compile against yet; see the resolve step below.
#
# Both repos are public and the kin registry index is anonymously readable, so
# kin-db's other registry dependencies resolve with no credentials and this
# workflow needs no secrets.

name: kin-db Compatibility

on:
  pull_request:
    # `edited` because the ref is read from the PR body, and a body edited
    # after the PR opened would otherwise never be re-read: the check would
    # keep reporting a verdict from the body as it was at open.
    # `pr-text-hygiene.yml` in this repo carries the same trigger for the same
    # reason.
    types: [opened, reopened, synchronize, edited]
    branches: [main]
    paths:
      # Any type change at all, rather than an enumerated list of the files
      # that happen to hold persisted types today. A list would have to be
      # updated by the same change that adds a new persisted type, which is
      # precisely the change that must not be trusted to remember.
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/kin-db-compat.yml"
      # The resolver decides WHICH kin-db grades a PR, so a change to it has to
      # be graded by the gate it steers. Omitting this would let the one file
      # that picks the consumer change without the consumer ever being built.
      - ".github/scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kin-db:
    name: kin-db suite against this kin-model
    runs-on: ubuntu-latest
    steps:
      - name: Check out kin-model at the PR head
        uses: actions/checkout@v6
        with:
          path: kin-model

      # Which kin-db grades this PR. `main` for almost every change, and the
      # branch a PR body names for the one kind that main cannot compile
      # against yet: a field ADDED to a type kin-db builds by exhaustive struct
      # literal. kin-db main cannot take such a field until the kin-model
      # version carrying it is published, and this gate would not let that
      # version land, so neither side could go first. The resolver's own
      # docstring carries the full reasoning and the refusal rules, and
      # `tests/kin_db_compat_ref.rs` pins its behaviour.
      - name: Resolve which kin-db grades this PR
        id: compat_ref
        env:
          # Through the environment rather than inline, so a PR body cannot
          # become shell.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          ref="$(printf '%s' "$PR_BODY" \
            | python3 kin-model/.github/scripts/resolve-kin-db-compat-ref.py)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "resolved kin-db ref: $ref"

      - name: Check out kin-db
        uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-db
          # `refs/heads/` explicitly, so the value is resolved as a BRANCH by
          # the checkout action rather than left to its own classification.
          # actions/checkout reads a bare 40 or 64 character hex ref as a
          # commit, and honours refs/pull/<n>/head; the resolver refuses both,
          # and this makes the intent unambiguous on the other side too.
          ref: refs/heads/${{ steps.compat_ref.outputs.ref }}
          path: kin-db

      # A reader of this check has to be able to see WHICH kin-db graded the
      # PR. Without this the gate reads identically whether it built main or a
      # coordinated branch, and "the consumer still builds" means two different
      # things in those two cases.
      - name: Report which kin-db graded this PR
        working-directory: kin-db
        env:
          RESOLVED_REF: ${{ steps.compat_ref.outputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'graded against firelock-ai/kin-db ref=%s sha=%s\n' "$RESOLVED_REF" "$sha"
          {
            echo "### Downstream consumer graded"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| repository | \`firelock-ai/kin-db\` |"
            echo "| ref | \`$RESOLVED_REF\` |"
            echo "| sha | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: ./kin-model/.github/actions/rust-toolchain

      - name: Restore cargo registry and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kin-db/target
          key: ${{ runner.os }}-kindbcompat-${{ hashFiles('kin-db/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-kindbcompat-

      # kin-db pins kin-model exactly (`=0.7.0`), and a release-affecting
      # kin-model PR must bump its version, so the PR head version essentially
      # never satisfies that pin. A `[patch]` entry cannot help: a patch still
      # has to satisfy the original requirement. Replacing the dependency with
      # a path dependency drops the version requirement entirely and leaves
      # every other kin-db dependency resolving from the registry.
      - name: Point kin-db at this kin-model
        env:
          KIN_MODEL_PATH: ${{ github.workspace }}/kin-model
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path("kin-db")
          target = os.environ["KIN_MODEL_PATH"]
          pattern = re.compile(r'^\s*kin-model\s*=.*$', re.MULTILINE)
          replacement = f'kin-model = {{ path = "{target}" }}'

          rewritten = []
          for manifest in sorted(root.rglob("Cargo.toml")):
              # `.kin/` holds a snapshot of the repo, not a build input.
              if ".kin" in manifest.parts or "target" in manifest.parts:
                  continue
              text = manifest.read_text()
              patched, count = pattern.subn(replacement, text)
              if count:
                  manifest.write_text(patched)
                  rewritten.append(f"{manifest} ({count})")

          # A rewrite that silently matches nothing would turn this whole gate
          # into a run of kin-db against the PUBLISHED kin-model, which always
          # passes and proves nothing about the PR.
          if not rewritten:
              raise SystemExit(
                  "no kin-model dependency found in any kin-db manifest; the gate "
                  "would have tested the published kin-model instead of this PR"
              )
          print("rewritten:", ", ".join(rewritten))
          PY

      # The rewrite above edits text; this proves cargo actually resolved to it.
      # Without this, a manifest refactor that moved the dependency into a
      # workspace table would leave the gate green against the wrong source.
      - name: Verify kin-db resolved this kin-model
        working-directory: kin-db
        env:
          KIN_MODEL_PATH: ${{ github.workspace }}/kin-model
        run: |
          cargo metadata --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          expected = pathlib.Path(os.environ["KIN_MODEL_PATH"]).resolve()
          data = json.loads(pathlib.Path("metadata.json").read_text())
          packages = [p for p in data["packages"] if p["name"] == "kin-model"]
          if not packages:
              raise SystemExit("kin-db does not depend on kin-model at all")
          for package in packages:
              # A path dependency has a null source; a registry one names it.
              if package["source"] is not None:
                  raise SystemExit(
                      f"kin-model resolved from {package['source']}, not this PR"
                  )
              resolved = pathlib.Path(package["manifest_path"]).resolve().parent
              if resolved != expected:
                  raise SystemExit(f"kin-model resolved to {resolved}, expected {expected}")
              print(f"kin-model {package['version']} resolved from {resolved}")
          PY
          rm -f metadata.json

      # Deliberately without kin-db's `RUSTFLAGS: -Dwarnings`. This gate answers
      # one question, whether kin-db still builds and passes against these
      # types, and denying warnings would also fail it for lint drift on kin-db
      # main that no kin-model author can fix. kin-db's own CI keeps that gate.
      - name: Build kin-db
        working-directory: kin-db
        run: cargo build --all-targets

      # kin-db's CI test invocation, with its skip list. The skips are the
      # tests that need HF network access or carry a known-stale fixture; they
      # are unrelated to serialization, so mirroring the list keeps this gate
      # failing only for real compatibility breaks.
      #
      # The separate 100K hydration smoke from kin-db's CI is not mirrored: it
      # is an `--ignored` wall-clock guard, and the snapshot round-trips inside
      # the standard suite already exercise the encode/decode path this gate
      # exists to protect.
      - name: Run the kin-db suite
        working-directory: kin-db
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          cargo test --
          --skip process_embedding_queue_without_embeddings_is_noop
          --skip default_dimensions_match_default_model
          --skip test_vector_index_dimension_mismatch_auto_recovery
          --skip many_vectors_search_quality

      # Actions caches are scoped to the ref that saved them, so only main's
      # cache is readable from every other ref. This workflow has no
      # merge_group trigger and never runs on push, so every save used to
      # write into a pull-request ref's own private scope. Save only from
      # main; nothing currently seeds that scope (this workflow never runs
      # there either, since it triggers on pull_request only), so this key
      # goes cold rather than polluting the cache budget. This check is not a
      # required context on kin-model, so that is a slower non-gating job,
      # not a landing risk.
      - name: Save cargo registry and build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kin-db/target
          key: ${{ runner.os }}-kindbcompat-${{ hashFiles('kin-db/Cargo.lock') }}
