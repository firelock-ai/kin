# Acceleration backend COMPILE matrix — separately gated from the M0 release.
#
# Purpose: prove every acceleration backend still COMPILES (Metal on macOS,
# Apple-Accelerate CPU/BLAS on macOS, pure-Rust default everywhere, CUDA on
# Linux) on each push/PR. This is the acceleration backend guard rail.
#
# It is deliberately decoupled from `release.yml` and `registry-publish.yml`:
#
#   * BUILD ONLY. It runs `cargo build` / `cargo clippy --lib` for each feature
#     and NEVER `cargo test`/examples, so no GPU/Metal/CUDA kernel is ever
#     executed in CI. Compilation needs no device; execution would.
#   * It does NOT gate publishing and is NOT a dependency of the release or
#     registry-publish jobs, so an acceleration backend can never sneak into the
#     default release artifact. The PUBLISHED crate is built with `default = []`
#     (pure Rust); `metal`/`accelerate`/`cuda` are opt-in features a consumer
#     turns on explicitly, so they are never bundled into the default artifact.
#
# If you need to release an acceleration backend, that is a deliberate, separate
# decision — not a side effect of the default publish lane.

name: Acceleration Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  macos_backends:
    name: macOS backends (compile only)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # pure-Rust default, Apple-Accelerate CPU/BLAS, Metal GPU — all compiled,
        # none executed.
        feature: ["", "accelerate", "metal"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Build (feature='${{ matrix.feature }}', no kernel execution)
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          if [ -z "$FEATURE" ]; then
            cargo build
          else
            cargo build --features "$FEATURE"
          fi

      - name: Clippy lib (feature='${{ matrix.feature }}')
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          if [ -z "$FEATURE" ]; then
            cargo clippy --lib -- -D warnings
          else
            cargo clippy --lib --features "$FEATURE" -- -D warnings
          fi

  linux_backends:
    name: Linux backends (compile only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pure-Rust default and CUDA. The CUDA backend is a driver-API FFI lib;
        # building the rlib needs no CUDA toolkit and never links/executes it.
        feature: ["", "cuda"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Build (feature='${{ matrix.feature }}', no kernel execution)
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          if [ -z "$FEATURE" ]; then
            cargo build
          else
            cargo build --features "$FEATURE"
          fi

      - name: Clippy lib (feature='${{ matrix.feature }}')
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          if [ -z "$FEATURE" ]; then
            cargo clippy --lib -- -D warnings
          else
            cargo clippy --lib --features "$FEATURE" -- -D warnings
          fi
