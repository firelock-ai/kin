[package]
name = "kin-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Exact Git migration and projection boundary for Kin"
repository.workspace = true

[features]
test-support = ["dep:libc", "dep:sysinfo", "dep:which"]

[dependencies]
kin-model = { workspace = true }
kin-blobs = { workspace = true }
gix = { workspace = true, features = ["blob-diff", "sha256"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rayon = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
rustix = { workspace = true }
tempfile = { workspace = true }
which = { version = "8", optional = true }

[target.'cfg(unix)'.dependencies]
cap-std = "=4.0.2"
libc = { version = "0.2", optional = true }
sysinfo = { version = "0.39", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
libc = "0.2"
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.39"
which = "8"
