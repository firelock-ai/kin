[package]
name = "kin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared runtime, config, and initialization for Kin"
repository.workspace = true

[lib]
doctest = false

[features]
# Test-only fixtures other workspace crates consume from their dev-dependencies.
# Never enabled by a product dependency edge.
test-support = []

[dependencies]
which = "8"
kin-model = { workspace = true }
kin-db = { workspace = true }
kin-blobs = { workspace = true }
kin-git = { workspace = true }
kin-index = { path = "../kin-index" }
kin-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
gix = { workspace = true }
directories = "5"
fs2 = { workspace = true }
unicode-normalization = "=0.1.25"
tempfile = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
cap-std = "=4.0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
cap-fs-ext = "=4.0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
# Stable access to the `BY_HANDLE_FILE_INFORMATION` identity pair; the `std`
# accessors for it remain unstable (`windows_by_handle`).
winapi-util = "0.1"

[dev-dependencies]
kin-git = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
kin-daemon-spawn = { workspace = true }
