[package]
name = "kin-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background daemon service for Kin"

[lib]
doctest = false

[features]
default = ["vector", "embeddings", "metal"]
vector = ["kin-db/vector"]
embeddings = ["kin-db/embeddings"]
metal = ["embeddings", "kin-db/metal"]
gcs = ["kin-db/gcs"]
firestore = ["kin-spine/firestore"]

[dependencies]
kin-model = { workspace = true }
kin-core = { workspace = true }
kin-db = { workspace = true }
kin-blobs = { workspace = true }
kin-index = { workspace = true }
kin-projection = { workspace = true }
kin-parser = { workspace = true }
kin-reconcile = { workspace = true }
kin-spine = { workspace = true }
kin-registry = { workspace = true }
kin-lsp = { workspace = true }
kin-cli = { workspace = true }
kin-mcp = { workspace = true }
gix = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
async-stream = "0.3"
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
reqwest = { workspace = true }
which = "7"
fs2 = { workspace = true }
sysinfo = "0.38"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
kin-git = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
tower = { version = "0.5", features = ["util"] }
