[package]
name = "kin-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LSP client for graph enrichment via language servers"

[dependencies]
kin-model = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
tracing = "0.1"
thiserror = "2"
which = "7"
