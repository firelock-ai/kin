name: Cache Seed

# An Actions cache entry is readable from the ref that wrote it and from the
# default branch, and from nowhere else. A pull request run and a merge-queue
# run cannot see each other's entries, so `refs/heads/main` is the only scope
# every build can restore from. CI used to write that scope as a side effect of
# running on push to main. That run was removed as a duplicate test pass, which
# left nothing writing it, and once the last main entry ages out at seven days
# every pull request and every queue build compiles the dependency graph cold.
#
# This workflow exists only to create the bounded source cache that every CI
# ref restores. It is not a gate: it warms Cargo's registry and git sources and
# does nothing else. No formatting, no lint, no tests. The cache key is an
# explicit epoch rather than a dependency hash, so changing dependencies does
# not create another multi-gigabyte generation. Bump the epoch deliberately
# when persisting a refreshed source set is worth replacing the existing one.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One seed per commit is pointless when several land together, and the newest
# tree is the one worth caching, so a newer push supersedes an older seed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  seed:
    name: Seed the default-branch cargo cache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both platforms `ci.yml` gates on. Each writes its own `runner.os` key,
      # so seeding one would leave the other cold.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Paths, key and restore-keys are copied verbatim from `ci.yml` and are
      # enforced by scripts/check-actions-cache-policy.sh. Only this main-only
      # workflow may save, so PR and merge-queue refs never mint private copies.
      - name: Restore cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      # Fetch must succeed before the explicit save. Build output is not cached,
      # so compiling here would consume runner time without warming CI.
      - name: Fetch Cargo dependencies
        run: cargo fetch

      - name: Save cargo sources on main
        if: github.ref == 'refs/heads/main' && steps.cargo-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
