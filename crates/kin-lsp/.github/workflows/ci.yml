name: CI

# There is deliberately no `push:` trigger on main. The hosted merge queue
# builds and tests the exact commit it then lands, so a push run on main
# repeats a suite that already passed on that sha and gates nothing: it is not
# a required context and no landing waits for it.
#
# Two situations need the push leg back, and only those: a workflow newly wired
# into the queue, which has no merge_group run of its own yet, and any period
# where main can take a commit the queue did not build. Both were checked here
# against the run history before this trigger was dropped, over every main
# commit in the fourteen days to 2026-08-19.
on:
  pull_request:
    branches: [main]
  merge_group:

# The sha suffix is empty off main, so every pull request and merge-queue ref
# keeps one group per ref and `cancel-in-progress` supersedes an older push
# exactly as it did before. On main each commit gets its own group, because
# `cancel-in-progress: false` does not mean "never cancel": GitHub keeps at
# most one PENDING run per group and cancels the older one. Two landings in
# quick succession therefore delete the earlier commit's run before it starts
# a job, and a run that started no jobs leaves the commit with its checks
# absent rather than failed. The hosted merge queue lands PRs back to back, so
# that window is the ordinary case here, not a rare one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      # Toolchain channel is pinned by rust-toolchain.toml (1.96.0); the action
      # honours that file. Bump both together, never via @stable drift.
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      # Restore the one small source cache owned by the default-branch seed.
      # Build outputs are deliberately excluded: target/ made each immutable
      # PR, merge-queue and main cache 1.7-2.5 GiB per runner OS.
      - name: Restore cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      # This step is intentionally unconditional. The policy script binds its
      # own location and exact command, while the exact OS matrix above means a
      # policy check runs on every CI ref even if one platform later fails.
      - name: Check Actions cache policy
        run: |
          ./scripts/check-actions-cache-policy.sh
          ./scripts/test-actions-cache-policy.sh

      - name: Check formatting
        run: cargo fmt -- --check

      # Enforcing gate: warnings fail the build. Keep it that way — silence a
      # lint with a scoped, justified in-source #[allow], not a blanket -A here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test
