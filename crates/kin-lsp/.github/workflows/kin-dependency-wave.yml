name: Kin Dependency Wave

on:
  repository_dispatch:
    types: [kin-registry-release]
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

jobs:
  dependency-wave:
    permissions:
      contents: write
      pull-requests: write
    uses: firelock-ai/kin-actions/.github/workflows/cargo-dependency-wave.yml@v0.1.21
    with:
      manifests: Cargo.toml
      test-command: cargo test
      auto-merge: true
    secrets:
      KIN_CI_BOT_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
