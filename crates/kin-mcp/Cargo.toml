[package]
name = "kin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Kin: assistant-neutral integration"
repository.workspace = true

[dependencies]
kin-core = { workspace = true }
kin-daemon-spawn = { workspace = true }
kin-git = { workspace = true }
kin-model = { workspace = true }
kin-db = { workspace = true }
kin-blobs = { workspace = true }
kin-parser = { workspace = true }
kin-context = { workspace = true }
kin-review = { workspace = true }
kin-runtime = { workspace = true }
kin-ranking = { workspace = true }
kin-spine = { workspace = true }
base64 = "0.23"
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
kin-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
# Paused time, so the daemon-patience ladder can be asserted against its real
# 60 s and 300 s budgets instead of a scaled-down stand-in that would prove
# something other than what ships.
tokio = { workspace = true, features = ["full", "test-util"] }
