[package]
name = "kin-spine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Federation spine: cross-repo metadata index and query routing"
repository.workspace = true

[lib]
doctest = false

[features]
default = []
firestore = ["reqwest"]
# Exposes the in-memory durable spine store so another crate can drive the real
# FirestoreSpineBackend over a fake transport. Without it a consumer wanting
# that has to write a second implementation of the CAS semantics, and two fakes
# drift in exactly the direction that keeps both suites green.
test-support = []

[dependencies]
kin-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
hashbrown = { version = "0.15", features = ["serde"] }
parking_lot = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Optional: Firestore REST API support
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
